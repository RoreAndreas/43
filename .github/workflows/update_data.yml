name: Update market data

on:
  schedule:
    - cron: '*/10 * * * *'  # Toutes les 10 minutes (UTC)
  workflow_dispatch:      # Permet de lancer manuellement depuis GitHub

# Autorise le robot (GITHUB_TOKEN) à écrire dans le dépôt (nécessaire pour git push)
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BRVM scraper
        run: python BRVM/brvm_scraper.py
        continue-on-error: true

      - name: Run Richbourse scraper
        run: python RICHBOURSE/richbourse_scraper.py
        continue-on-error: true

      - name: Run SikaP scraper
        run: python SIKAPRO/sikapro_scraper.py
        continue-on-error: true
        env:
          SIKAPRO_LOGIN: ${{ secrets.SIKAPRO_LOGIN }}
          SIKAPRO_PASSWORD: ${{ secrets.SIKAPRO_PASSWORD }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BRVM/*.json RICHBOURSE/*.json SIKAPRO/*.json
          # Ne rien faire s'il n'y a aucun changement de données
          if git diff --staged --quiet; then
            echo "Aucune donnée modifiée, rien à committer."
            exit 0
          fi
          git commit -m "🔄 Update market data (automated)"
          # Récupère d'éventuels commits arrivés entre-temps avant de pousser (évite les conflits)
          git pull --rebase origin main
          git push

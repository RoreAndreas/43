<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wacc43 — Coût moyen pondéré du capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f7;
    --surface: #ffffff;
    --line: #e4e4e7;
    --ink: #18181b;
    --ink-2: #27272a;
    --ink-3: #3f3f46;
    --ink-4: #52525b;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --tile: #fafafa;
    --field: #f4f4f5;
    --accent: #6d4bb0;
    --accent-soft: #e8e0f4;
    --accent-tint: #faf8fd;
    --accent-chip: #d8cff0;
    --green: #0f6f5c;
    --green-soft: #c9e0d9;
    --green-tint: #f2f8f6;
    --green-line: #cfe1dc;
    --green-ink: #123f36;
    --green-bar: #7ab3a6;
    --green-track: #e2efeb;
    --blue: #1d4ed8;
    --blue-soft: #d5def8;
    --blue-tint: #f2f5fd;
    --blue-ink: #152c66;
    --warn: #a63a2e;
    --warn-soft: #efd3ce;
    --warn-tint: #fdf5f4;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- En-tête ---------- */
  .top {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1060px;
    margin: 0 auto;
    padding: 22px 32px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .brand-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .eyebrow {
    font: 400 10.5px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand h1 {
    margin: 0;
    font: 600 21px/1.25 var(--sans);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand-aside { display: flex; align-items: center; gap: 12px; }
  .dl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink-3);
    cursor: pointer;
    transition: border-color 240ms ease, color 240ms ease;
  }
  .dl:hover { border-color: var(--ink-3); color: var(--ink); }
  .dl:disabled { color: var(--muted-2); cursor: default; }
  .dl:disabled:hover { border-color: var(--line); color: var(--muted-2); }
  .fiscal {
    font: 400 11.5px/1.4 var(--mono);
    color: var(--muted);
  }
  .tabs { display: flex; gap: 26px; }
  .tabs button {
    font: 400 13px/1 var(--sans);
    color: var(--muted);
    padding: 0 0 13px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: color 240ms ease, border-color 240ms ease;
  }
  .tabs button.is-active {
    font-weight: 500;
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  /* ---------- Onglet Paramètres ---------- */
  .params {
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px 120px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 26px;
    align-items: start;
  }
  .params-main { display: grid; gap: 20px; }
  .card-block {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    display: grid;
    gap: 18px;
  }
  .card-block h2 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
    font: 400 10.5px/1 var(--mono);
    color: var(--ink-3);
  }
  .chip.is-accent {
    border-color: var(--accent-chip);
    background: var(--accent-tint);
    color: var(--accent);
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px 22px;
  }
  .field { display: grid; gap: 7px; }
  .field-label {
    font: 400 11.5px/1.4 var(--sans);
    color: var(--ink-4);
  }
  .field-hint {
    font: 400 10.5px/1.4 var(--sans);
    color: var(--muted-2);
  }
  .select-wrap { position: relative; display: grid; }
  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    padding: 11px 34px 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    font: 400 13.5px/1.2 var(--sans);
    color: var(--ink);
    cursor: pointer;
  }
  .select-wrap svg {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 10px 9px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
  }
  .stepper-value {
    font: 500 14px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .stepper-btns { display: flex; gap: 4px; }
  .stepper button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-3);
    font: 400 14px/1 var(--mono);
    cursor: pointer;
  }
  .stepper button:hover { background: var(--field); }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .tile {
    background: var(--tile);
    padding: 13px 15px;
    display: grid;
    gap: 5px;
  }
  .tile-label {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tile-value {
    font: 500 16px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .note {
    font: 400 11px/1.6 var(--sans);
    color: var(--muted-2);
    text-wrap: pretty;
  }

  /* ---------- Places de cotation du périmètre ---------- */
  /* Une seule ligne qui défile, jamais deux qui s'empilent : le cadre garderait
     une hauteur différente selon l'industrie choisie, et la carte sauterait à
     chaque changement de secteur.
     La barre de défilement native est masquée ; c'est le rail au-dessous qui
     sert de commande, visible et manipulable même sans molette. */
  .places-bloc { display: grid; gap: 9px; margin-top: -4px; }
  .places {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .places::-webkit-scrollbar { display: none; }
  .places:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .place {
    flex: none;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
    font: 400 10.5px/1.5 var(--mono);
    letter-spacing: 0.11em;
    color: var(--muted);
    transition: color 160ms ease, border-color 160ms ease;
  }
  .places:hover .place { color: var(--ink-4); border-color: var(--muted-2); }
  .places-head { display: flex; justify-content: flex-end; }
  .place.is-cliquable { cursor: pointer; }
  .place.is-cliquable:hover { color: var(--ink-3); border-color: var(--muted-2); }
  .place.is-cliquable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .place.is-actif, .places:hover .place.is-actif {
    color: var(--accent);
    border-color: var(--accent-chip);
    background: var(--accent-tint);
  }

  /* Le rail est un vrai input range : utilisable au clavier et annoncé par les
     lecteurs d'écran, ce qu'une barre dessinée à la main n'aurait pas été.
     `--_p` est la position, posée par le script à chaque mouvement. */
  .places-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }
  .places-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .places-slider::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(to right,
      var(--accent) 0%, var(--accent) var(--_p, 0%),
      var(--line) var(--_p, 0%), var(--line) 100%);
  }
  .places-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -5px;
    border: 3px solid var(--surface);
    border-radius: 999px;
    background: var(--accent);
  }
  .places-slider::-moz-range-track { height: 8px; border-radius: 999px; background: var(--line); }
  .places-slider::-moz-range-progress { height: 8px; border-radius: 999px; background: var(--accent); }
  .places-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 3px solid var(--surface);
    border-radius: 999px;
    background: var(--accent);
  }

  /* ---------- Carte ---------- */
  .carte-bloc {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }
  .carte {
    width: 100%;
    height: auto;
    display: block;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .carte-fond {
    fill: #e8e8ea;
    stroke: #d6d6da;
    /* Le tracé est dessiné dans un cadre de 360 unités affiché sur ~700 px :
       une épaisseur en unités du cadre serait deux fois trop épaisse. */
    stroke-width: 0.3;
  }
  .pin {
    cursor: pointer;
    transition: r 120ms ease, opacity 120ms ease;
  }
  .pin.is-off { opacity: 0.18; }
  .pin.is-on {
    stroke: var(--surface);
    stroke-width: 1.1;
    paint-order: stroke;
  }
  .pin:hover { r: 3.2; }
  .carte-globe { max-width: 320px; margin: 0 auto; }
  .globe-mer { fill: #eef1f5; stroke: var(--line); stroke-width: 0.6; }

  /* Zones : union des pays qui les composent, frontières réelles. */
  .zone {
    cursor: pointer;
    fill-opacity: 0.68;
    stroke: #ffffff;
    stroke-width: 0.25;
    stroke-linejoin: round;
    transition: fill-opacity 120ms ease;
  }
  .zone:hover { fill-opacity: 0.92; }
  .zone.is-on { fill-opacity: 1; }

  /* Zone sans société pour l'industrie retenue : tracée en neutre, jamais mise
     en avant. Elle reste cliquable — restreindre le cadrage à une zone vide est
     un choix légitime, et le résumé écrit alors « aucune société » — mais rien
     n'y est mis en surbrillance puisqu'il n'y a rien à y montrer. */
  /* L'attribut `fill` porté par le tracé est une simple présentation : toute
     règle de feuille de style l'emporte, aucun `!important` n'est nécessaire. */
  .zone.is-vide {
    fill: #dcdce0;
    fill-opacity: 0.6;
  }
  .zone.is-vide:hover { fill-opacity: 0.78; }

  /* Deux colonnes : la carte reste à gauche, les choix passent à droite. Sans
     légende sous le tracé, la carte prend la place qu'elle mérite. */
  .geo {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .geo-choix { display: grid; gap: 16px; align-content: start; }
  @media (max-width: 860px) {
    .geo { grid-template-columns: 1fr; }
  }

  /* Pays du continent absents du jeu de données : tracés en neutre pour que le
     continent reste entier plutôt que troué. */
  .carte-hors {
    fill: #e4e4e7;
    stroke: #ffffff;
    stroke-width: 0.25;
    stroke-linejoin: round;
  }

  /* ---------- Aside résultat ---------- */
  .result {
    position: sticky;
    top: 24px;
    display: grid;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
  }
  .result h2 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-hero { display: grid; gap: 6px; }
  .result-hero-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-hero-value {
    font: 500 34px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--green);
  }
  .result-rows {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .result-row {
    background: var(--tile);
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 400 12px/1.4 var(--sans);
    color: var(--ink-4);
  }
  .result-row span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .result-row.is-blue span:last-child { color: var(--blue); }
  .structure { display: grid; gap: 7px; }
  .structure-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 400 11px/1 var(--mono);
    color: var(--muted);
  }
  .bar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: #ececef;
  }
  .bar .eq { background: var(--green); }
  .bar .dt { background: var(--green-bar); }
  .cta {
    padding: 11px 14px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font: 400 11.5px/1 var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .cta:hover { background: var(--ink-2); }

  /* ---------- Onglet CMPC ---------- */
  .wacc {
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px 120px;
    display: grid;
    grid-template-columns: 430px minmax(0, 1fr);
    gap: 52px;
    align-items: start;
  }
  .stack { display: grid; gap: 9px; }
  .comp {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    overflow: hidden;
    transition: background-color 340ms cubic-bezier(.4, 0, .2, 1),
                color 340ms cubic-bezier(.4, 0, .2, 1),
                border-color 340ms cubic-bezier(.4, 0, .2, 1);
  }
  .comp.is-final { margin-top: 9px; }
  .comp-head {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 20px;
    padding: 18px 20px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .comp.is-final .comp-head { padding: 22px 20px; }
  .comp-title { font: 500 14.5px/1.35 var(--sans); color: inherit; }
  .comp.is-final .comp-title { font-weight: 600; }
  .comp-value {
    font: 500 24px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: inherit;
  }
  .comp.is-final .comp-value { font-size: 32px; letter-spacing: -0.02em; }
  /* Cartes de sociétés : une liste de valeurs cotées se parcourt, elle ne se
     lit pas comme le résultat d'un calcul. Titres et montants y sont donc plus
     sobres que dans la cascade du CMPC. */
  /* Filet accentué sur les sociétés qui alimentent la médiane. En ombre interne
     plutôt qu'en bordure : une bordure décalerait le contenu de trois pixels et
     désalignerait les cartes marquées de toutes les autres. */
  .comp.is-retenue { box-shadow: inset 3px 0 0 var(--accent); }
  .comp.is-retenue.is-open { box-shadow: inset 3px 0 0 rgba(255, 255, 255, .55); }
  .soc-legende {
    margin: 0 0 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    font: 400 11.5px/1.6 var(--sans);
    color: var(--muted);
    text-wrap: pretty;
  }
  .soc-legende.is-ailleurs { color: var(--ink-4); }
  .soc-filet {
    flex: none;
    width: 3px;
    height: 12px;
    border-radius: 2px;
    background: var(--accent);
    transform: translateY(1px);
  }

  #stackSoc .comp-head { padding: 13px 16px; }
  #stackSoc .comp-title { font-size: 12.5px; }
  #stackSoc .comp-value { font-size: 16px; }

  .comp.tone-green { border-color: var(--green-soft); color: var(--green); }
  .comp.tone-blue { border-color: var(--blue-soft); color: var(--blue); }
  .comp.is-open { background: var(--accent); border-color: var(--accent); color: #fff; }
  .comp.tone-green.is-open { background: var(--green); border-color: var(--green); color: #fff; }
  .comp.tone-blue.is-open { background: var(--blue); border-color: var(--blue); color: #fff; }
  .comp-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 380ms cubic-bezier(.4, 0, .2, 1);
  }
  .comp.is-open .comp-wrap { grid-template-rows: 1fr; }
  .comp-clip { overflow: hidden; }
  .comp-body {
    opacity: 0;
    transition: opacity 300ms ease 40ms;
    padding: 0 20px 18px;
  }
  .comp.is-final .comp-body { padding: 0 20px 20px; }
  .comp.is-open .comp-body { opacity: 1; }
  .sub-rows {
    display: grid;
    border-top: 1px solid rgba(255, 255, 255, .2);
    padding-top: 4px;
  }
  .sub-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .14);
    font: 400 12.5px/1.45 var(--sans);
    color: rgba(255, 255, 255, .8);
  }
  .sub-row:last-child { border-bottom: 0; }
  .sub-row.is-strong { font-weight: 500; color: #fff; }
  .sub-row span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  /* ---------- Panneau de détail ---------- */
  .frame-col { position: relative; height: 620px; }
  .frame-arrow {
    position: absolute;
    left: -7px;
    width: 13px;
    height: 13px;
    background: var(--surface);
    border-left: 1px solid var(--accent-soft);
    border-bottom: 1px solid var(--accent-soft);
    transform: rotate(45deg);
    opacity: 0;
    transition: top 420ms cubic-bezier(.4, 0, .2, 1), opacity 300ms ease, border-color 340ms ease;
  }
  /* Le cadre reste visible même sans sélection : il porte alors un message
     d'attente. Seule la flèche apparaît quand une carte est dépliée. */
  .frame {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    transition: border-color 340ms ease;
    overflow: hidden;
  }
  .frame-col.is-on .frame { border-color: var(--accent-soft); }
  .frame-col.is-on .frame-arrow { opacity: 1; }
  .detail-vide {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    padding: 24px 32px;
    text-align: center;
    opacity: 1;
    transition: opacity 300ms ease;
  }
  .detail-vide.is-cache { opacity: 0; }
  .detail-vide .titre {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail-vide .texte {
    max-width: 34ch;
    font: 400 13px/1.65 var(--sans);
    color: var(--muted-2);
    text-wrap: pretty;
  }
  .frame-col.tone-green .frame, .frame-col.tone-green .frame-arrow { border-color: var(--green-soft); }
  .frame-col.tone-blue .frame, .frame-col.tone-blue .frame-arrow { border-color: var(--blue-soft); }
  .detail {
    position: absolute;
    inset: 0;
    padding: 20px 22px;
    overflow: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
    display: grid;
    align-content: start;
    gap: 14px;
  }
  .detail.is-shown { opacity: 1; pointer-events: auto; }
  .detail-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .detail-title { font: 500 13px/1.3 var(--sans); color: var(--ink); }
  .detail.tone-green .detail-title { font-weight: 600; color: var(--green); }
  .detail.tone-blue .detail-title { font-weight: 600; color: var(--blue); }
  .detail-symbol {
    font: 400 10.5px/1.3 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .detail.tone-green .detail-symbol { color: var(--green); }
  .detail.tone-blue .detail-symbol { color: var(--blue); }
  .detail-grid {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr);
    gap: 10px 18px;
  }
  .detail-label {
    font: 400 10px/1.7 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail-text {
    font: 400 13px/1.65 var(--sans);
    color: var(--ink-3);
    text-wrap: pretty;
  }
  .detail code {
    font: 400 12.5px/1.7 var(--mono);
    color: var(--ink-2);
    background: var(--accent-tint);
    border: 1px solid var(--accent-soft);
    border-radius: 6px;
    padding: 10px 12px;
    display: block;
  }
  .detail.tone-green code {
    color: var(--green-ink);
    background: var(--green-tint);
    border-color: var(--green-line);
  }
  .detail.tone-blue code {
    color: var(--blue-ink);
    background: var(--blue-tint);
    border-color: var(--blue-soft);
  }
  .composition { display: grid; gap: 8px; }
  .composition .bar { background: var(--green-track); }
  .composition-legend {
    display: flex;
    gap: 20px;
    font: 400 11.5px/1.4 var(--mono);
    color: var(--ink-3);
  }

  /* ---------- Référentiel Comparables ---------- */
  /* Champ numérique libre, aligné sur la valeur qu'il remplace. */
  .mini-input {
    width: 74px;
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    font: 500 12px/1.3 var(--mono);
    color: var(--ink);
    text-align: right;
  }
  .mini-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .mini-input::placeholder { font-family: var(--sans); color: var(--muted-2); }
  .mini-input.is-invalide { border-color: var(--warn); background: var(--warn-tint); }

  /* ---------- Verrou du gearing cible ---------- */
  /* Le gearing sectoriel est une donnée observée : on ne la remplace pas par
     inadvertance. Le verrou rend le geste délibéré, et son état dit d'un coup
     d'oeil si le CMPC affiché repose sur la médiane du secteur ou sur une cible
     posée à la main. */
  .result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .verrou {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
    color: var(--muted);
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease, background-color 160ms ease;
  }
  .verrou:hover { color: var(--ink-3); border-color: var(--muted-2); }
  .verrou.is-open {
    color: var(--accent);
    border-color: var(--accent-chip);
    background: var(--accent-tint);
  }
  .verrou svg { display: block; }
  .cible-champ { display: inline-flex; align-items: center; gap: 6px; }
  .cible-unite { font: 400 11.5px/1 var(--mono); color: var(--muted); }
  .result-row.is-erreur {
    background: var(--warn-tint);
    color: var(--warn);
    font-size: 11.5px;
  }
  .result-row.is-erreur span:last-child { color: var(--warn); }
  .result-row.is-appoint {
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--muted);
    text-wrap: pretty;
  }
  .result-row.is-appoint span:last-child { color: var(--ink-4); }
  /* Une phrase, et non un couple libelle/valeur : elle ne doit pas heriter de
     la police a chasse fixe reservee aux nombres. */
  .result-row.is-appoint span:only-child {
    font-family: var(--sans);
    color: var(--muted);
  }

  /* Bulle : un bloc de contenu autonome dans le panneau de détail. */
  .bulle {
    display: block;
    margin-top: 14px;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--tile);
  }
  .bulle-titre {
    display: block;
    margin-bottom: 8px;
    font: 500 10.5px/1 var(--sans);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* Le tableau déborde du panneau dès que les montants sont longs : il défile
     dans sa bulle plutôt que d'élargir le panneau ou de se faire compresser. */
  .bulle .fin-table { margin-top: 0; }
  .bulle-defilante {
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--muted-2) var(--line);
  }

  .fin-table {
    width: 100%;
    border-collapse: collapse;
    font: 400 12.5px/1.5 var(--sans);
  }
  /* Une gouttière entre colonnes, et non un simple alignement à droite : les
     montants américains libellés en FCFA font douze chiffres, et deux cellules
     voisines se touchaient au point qu'un tiret de valeur manquante se lisait
     comme le signe d'un résultat négatif. */
  .fin-table th, .fin-table td {
    padding: 7px 0 7px 16px;
    border-bottom: 1px solid #f1f2f6;
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }
  .fin-table th:first-child, .fin-table td:first-child {
    padding-left: 0;
    text-align: left;
    font-family: var(--sans);
    color: var(--ink-4);
  }
  .fin-table thead th {
    font: 400 10px/1.7 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fin-table tbody tr:last-child td { border-bottom: 0; }
  .notice {
    border: 1px dashed var(--line);
    border-radius: var(--radius, 10px);
    background: var(--tile);
    padding: 18px 20px;
    display: grid;
    gap: 8px;
  }
  .notice h3 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .notice p {
    margin: 0;
    font: 400 13px/1.65 var(--sans);
    color: var(--ink-3);
    text-wrap: pretty;
  }

  /* ---------- Aucune société dans le périmètre ---------- */
  /* Même cadre pointillé que la notice du CMPC : un état vide n'est pas une
     erreur de la page, et ne doit pas se présenter comme un incident. */
  .vide404 {
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: var(--tile);
    padding: 34px 26px 30px;
    display: grid;
    justify-items: center;
    gap: 9px;
    text-align: center;
  }
  .vide404-img { width: 190px; height: auto; margin-bottom: 6px; }
  .v4-corps { fill: var(--surface); stroke: var(--muted-2); stroke-width: 2; }
  .v4-plein { fill: var(--ink-4); }
  .v4-trait {
    fill: none;
    stroke: var(--ink-4);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Les boulons tombés au sol, dans un gris plus clair que la machine : ils
     racontent la panne sans venir concurrencer le visage, qui doit rester ce
     que l'oeil attrape en premier. */
  .v4-boulon path, .v4-boulon circle {
    fill: none;
    stroke: var(--muted-2);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .v4-etiquette { fill: var(--accent-tint); stroke: var(--accent-chip); stroke-width: 1.6; }
  .v4-etiquette-texte {
    font: 500 13px var(--mono);
    fill: var(--accent);
    letter-spacing: 0.04em;
  }
  .vide404-code {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .vide404-titre { font: 500 14px/1.35 var(--sans); color: var(--ink-2); }
  .vide404-texte {
    max-width: 36ch;
    font: 400 12.5px/1.6 var(--sans);
    color: var(--muted);
    text-wrap: pretty;
  }

  /* ---------- Onglet Multiples ---------- */
  .multiples { max-width: 1060px; margin: 0 auto; padding: 22px 32px 40px; }
  .multiples-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .multiples-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .multiples-toggle button {
    font: 400 12px/1 var(--sans); letter-spacing: 0.02em;
    padding: 8px 16px; border: none; background: var(--surface); color: var(--muted);
    cursor: pointer; transition: background 200ms ease, color 200ms ease;
  }
  .multiples-toggle button.is-active { background: var(--ink); color: #fff; }
  .multiples-exercice { font: 400 11.5px/1 var(--mono); color: var(--muted); }
  .multiples-view { min-height: 500px; }
  .multiples-vide {
    text-align: center; padding: 60px 20px; color: var(--muted);
    font: 400 13px/1.6 var(--sans);
  }
  .multiples-graph-wrap { display: flex; flex-direction: column; gap: 24px; }
  .multiples-chart {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 24px 16px;
  }
  .multiples-chart-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;
  }
  .multiples-chart-title { font: 500 13px/1 var(--sans); color: var(--ink); }
  .multiples-chart-ville { font: 400 11px/1 var(--mono); color: var(--muted); }
  .multiples-bars { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; }
  .multiple-bar-row { display: flex; align-items: center; gap: 12px; }
  .multiple-bar-label {
    width: 140px; flex-shrink: 0; font: 400 11.5px/1 var(--mono); color: var(--ink-3);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .multiple-bar-track {
    /* Débordement visible : le repère de médiane dépasse la piste en haut et
       en bas pour former un trait continu d'une barre à l'autre, et sa légende
       se pose au-dessus de la première. */
    flex: 1; height: 28px; background: var(--tile); border-radius: 6px; position: relative;
  }
  .multiple-bar-fill {
    position: absolute; top: 0; left: 0; bottom: 0; border-radius: 6px;
    display: flex; align-items: center; padding: 0 10px; min-width: 48px;
    font: 500 11px/1 var(--mono); color: #fff;
  }
  .multiple-bar-fill.tone-ve-ebitda { background: var(--green); }
  .multiple-bar-fill.tone-ve-ca { background: var(--blue); }
  .multiple-bar-mediane {
    position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--warn);
    z-index: 2;
  }
  .multiple-bar-mediane.is-suite::after { content: none; }
  .multiple-bar-mediane::after {
    content: "méd."; position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font: 500 9px/1 var(--mono); color: var(--warn); white-space: nowrap;
  }
  .multiples-table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .multiples-table th, .multiples-table td {
    padding: 10px 14px; text-align: right;
    font: 400 12px/1 var(--mono);
    border-bottom: 1px solid var(--line);
  }
  .multiples-table th:first-child, .multiples-table td:first-child { text-align: left; }
  .multiples-table th {
    background: var(--tile); font-weight: 500; color: var(--ink-3);
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .multiples-table td { color: var(--ink); }
  .multiples-table tr:last-child td { border-bottom: none; }
  .multiples-table tr.is-mediane td { background: var(--green-tint); font-weight: 500; }
  .multiples-table .cell-nul { color: var(--muted-2); font-style: italic; }
  .multiples-note {
    font: 400 11.5px/1.5 var(--sans); color: var(--muted); margin-top: 16px;
    padding: 10px 14px; background: var(--accent-tint); border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  /* ---------- Boîte de dialogue de l'export ---------- */
  .export-fond {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(13, 27, 42, 0.42);
  }
  .export-boite {
    width: min(440px, 100%); background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px 22px; text-align: center;
    box-shadow: 0 18px 48px rgba(13, 27, 42, 0.18);
  }
  .export-image { display: block; margin: 0 auto 16px; }
  .export-titre {
    display: block; font: 500 15px/1.35 var(--sans); color: var(--ink);
    margin-bottom: 8px;
  }
  .export-detail {
    display: block; font: 400 12.5px/1.55 var(--sans); color: var(--muted);
    margin-bottom: 22px;
  }
  .export-choix { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .export-choix button {
    min-width: 104px; padding: 9px 18px; border-radius: 8px; cursor: pointer;
    font: 400 13px/1 var(--sans); letter-spacing: 0.02em;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .export-oui { border: 1px solid var(--ink); background: var(--ink); color: #fff; }
  .export-oui:hover { background: var(--accent); border-color: var(--accent); }
  .export-non { border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); }
  .export-non:hover { border-color: var(--ink); color: var(--ink); }
  .export-annuler {
    border: 0; background: none; cursor: pointer; padding: 4px 6px;
    font: 400 11.5px/1.4 var(--sans); color: var(--muted);
    text-decoration: underline; text-underline-offset: 2px;
  }
  .export-annuler:hover { color: var(--ink); }

  [hidden] { display: none !important; }
  .is-busy { opacity: .55; transition: opacity 160ms ease; }
  .is-locked { pointer-events: none; }

  @media (max-width: 940px) {
    .params, .wacc { grid-template-columns: 1fr; gap: 26px; }
    .frame-col { height: auto; min-height: 420px; }
    .frame-arrow { display: none; }
    .result { position: static; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="eyebrow">wacc43</span>
        <h1>Coût moyen pondéré du capital</h1>
      </div>
      <div class="brand-aside">
        <span class="fiscal" id="fiscal">Exercice 2026</span>
        <button type="button" class="dl" id="telecharger"
                title="Télécharger le calcul au format Excel"
                aria-label="Télécharger le calcul au format Excel">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2.4v8.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M4.9 7.5L8 10.6l3.1-3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.9 12.2v.5a1.4 1.4 0 001.4 1.4h7.4a1.4 1.4 0 001.4-1.4v-.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <nav class="tabs">
      <button type="button" data-tab="params" class="is-active">Paramètres</button>
      <button type="button" data-tab="wacc">CMPC</button>
      <!-- N'apparaissent qu'avec le référentiel Comparables -->
      <button type="button" data-tab="societes" id="tabSocietes" hidden>Sociétés</button>
      <button type="button" data-tab="multiples" id="tabMultiples" hidden>Multiples</button>
    </nav>
  </div>
</header>

<main class="params" id="panel-params">
  <div class="params-main" id="paramsMain"></div>
  <aside class="result" id="paramsResult"></aside>
</main>

<main class="wacc" id="panel-wacc" hidden>
  <section class="stack" id="stack"></section>
  <div class="frame-col" id="frameCol">
    <span class="frame-arrow" id="frameArrow"></span>
    <div class="frame" id="frame"></div>
  </div>
</main>

<main class="wacc" id="panel-societes" hidden>
  <section class="stack" id="stackSoc"></section>
  <div class="frame-col" id="frameColSoc">
    <span class="frame-arrow" id="frameArrowSoc"></span>
    <div class="frame" id="frameSoc"></div>
  </div>
</main>

<main class="multiples" id="panel-multiples" hidden>
  <div class="multiples-bar">
    <div class="multiples-toggle" id="multiplesToggle">
      <button type="button" data-view="graph" class="is-active">Graphique</button>
      <button type="button" data-view="calc">Calcul</button>
    </div>
    <span class="multiples-exercice" id="multiplesExercice"></span>
  </div>
  <div class="multiples-view" id="multiplesGraph"></div>
  <div class="multiples-view" id="multiplesCalc" hidden></div>
</main>

<!-- Le bouton flèche ne télécharge pas tout de suite : il demande d'abord si
     l'échantillon de comparables doit accompagner le calcul. -->
<div class="export-fond" id="exportFond" hidden>
  <div class="export-boite" role="dialog" aria-modal="true"
       aria-labelledby="exportTitre" aria-describedby="exportDetail">
    <svg class="export-image" width="168" height="108" viewBox="0 0 168 108"
         fill="none" aria-hidden="true">
      <path d="M84 22v60" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M62 88h44" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M72 88c2-8 5-11 12-11s10 3 12 11" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30 30h108" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="84" cy="19" r="4.4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.4"/>
      <path d="M30 30v8M138 30v8" stroke="var(--line)" stroke-width="2"/>
      <path d="M16 42h28l-14 20z" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M124 42h28l-14 20z" fill="var(--surface)" stroke="var(--muted)" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <span class="export-titre" id="exportTitre">Voulez-vous inclure les comparables boursiers à l'export ?</span>
    <span class="export-detail" id="exportDetail">Les comparables ajoutent une feuille : capitalisation, dette, VE, EBITDA et VE / EBITDA par société.</span>
    <div class="export-choix">
      <button type="button" class="export-oui" id="exportOui">Oui</button>
      <button type="button" class="export-non" id="exportNon">Non</button>
    </div>
    <button type="button" class="export-annuler" id="exportAnnuler">Annuler l'export</button>
  </div>
</div>

<script>
  // ---- Jeu de données injecté au build (wacc_html.py) ----
  // DATA_START
  const DATA = {
    "mature": 0.0423,
    "adjustment": { "rows": [], "correction": 0 },
    "rf": { "2026-30": 4.94 },
    "pays": { "—": { "crp": 0.0064, "tax": 0.25 } },
    "industries": { "—": { "beta": 1.163, "de": 0.32, "spread": 0.0134 } },
    "options": { "years": [2026], "maturities": ["30Y", "10Y"], "countries": ["—"], "countries_grouped": [["—", ["—"]]], "industries": ["—"] },
    "defaults": { "year": 2026, "maturity": "30Y", "country": "—", "industry": "—", "d": 0.01, "e": 0.005, "inflation_ref": 0.025, "inflation_local": 0.03 }
  };
  // DATA_END

  const STEPS = { d: 0.005, e: 0.005, inflation_ref: 0.005, inflation_local: 0.005 };
  const MANUAL = [
    { key: "d", label: "Prime de taille (d)", hint: "Ajustement small cap / PME" },
    { key: "e", label: "Prime spécifique (e)", hint: "Risques idiosyncratiques" },
    { key: "inflation_ref", label: "Inflation, monnaie du taux sans risque", hint: "EUR ou USD selon la devise de référence" },
    { key: "inflation_local", label: "Inflation, monnaie locale", hint: "Projection annuelle du pays cible" }
  ];
  const CHEVRON = '<svg width="9" height="6" viewBox="0 0 9 6" fill="none" aria-hidden="true"><path d="M1 1l3.5 3.5L8 1" stroke="#71717a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CADENAS = {
    ferme: '<svg width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><rect x="0.75" y="5.4" width="9.5" height="6.85" rx="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M3 5.4V3.6a2.5 2.5 0 0 1 5 0v1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    ouvert: '<svg width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><rect x="0.75" y="5.4" width="9.5" height="6.85" rx="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M3 5.4V3.6a2.5 2.5 0 0 1 4.85-.66" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const frPct = (v, dec) => (v * 100).toFixed(dec === undefined ? 2 : dec).replace(".", ",") + " %";
  const frNum = (v, dec) => v.toFixed(dec === undefined ? 2 : dec).replace(".", ",");
  const frPts = (v) => (v * 100).toFixed(2).replace(".", ",") + (Math.abs(v * 100) < 2 ? " pt" : " pts");

  // `continent` ne vient pas du jeu de données : c'est un filtre d'affichage,
  // sans effet sur le calcul. Il part sur « Tous » pour qu'aucun pays ne soit
  // masqué tant que l'utilisateur n'a rien demandé.
  // `continent` et `zone` ne viennent pas du jeu de données : ce sont des
  // filtres d'affichage, sans effet sur le calcul. On part sur « Tous », donc
  // sans rien masquer tant que l'utilisateur n'a rien demandé.
  // Le gearing part verrouillé sur la médiane observée du secteur. Un gearing
  // est une donnée, pas un réglage : on ne le remplace qu'après avoir ouvert le
  // verrou, et l'état de ce verrou dit lequel des deux le CMPC affiché utilise.
  let params = Object.assign({
    continent: "Tous", zone: null,
    gearing_verrou: true,   // fermé : médiane du secteur
    gearing_cible: null,    // poids de dette cible D/V, en %, une fois validé
    gearing_saisie: "",     // texte tel que tapé, conservé pour réafficher l'erreur
    gearing_erreur: null,
    // Même mécanique que le gearing : la place de cotation est une donnée du
    // périmètre, pas un réglage. Fermé, le calcul prend la zone entière ;
    // ouvert, cliquer une place le restreint à elle. Une place qui disparaît
    // du périmètre courant (changement de secteur ou de zone) redevient
    // simplement introuvable dans les statistiques publiées : statsSecteur()
    // retombe alors sur la zone, sans qu'il faille la réinitialiser ici.
    place_verrou: true,     // fermé : toutes les places du périmètre
    place_cible: null,      // place choisie pour restreindre le calcul
  }, DATA.defaults);
  if (!params.referentiel) params.referentiel = "damodaran";
  if (!params.secteur) {
    const connus = (DATA.comparables || {}).industries || [];
    if (connus.length) params.secteur = connus[0].nom;
  }
  let model = null;
  let tab = "params";   // on règle les hypothèses avant de lire le résultat

  // Le référentiel Comparables tient sur le seul export Cap IQ : il en tire les
  // sociétés, les bêtas médians et le gearing sectoriel. Le taux sans risque,
  // lui, est commun aux deux référentiels. Il suffit que l'univers soit là.
  const estComparables = () =>
    Boolean((DATA.comparables || {}).societes) && params.referentiel === "comparables";

  // ---- Taux sans risque, commun aux deux référentiels ----
  //
  //     taux sans risque = US Bond (année, maturité) + prime de risque pays
  //
  // Le MEDAF repose sur le taux des US Bonds quelle que soit la méthode. La
  // prime de marché qui multiplie le bêta est mesurée sur le marché américain :
  // lui adosser un rendement souverain local reviendrait à additionner les
  // conditions de deux marchés dans une même formule. Le risque du pays
  // valorisé entre par la prime de risque pays, explicitement.
  //
  // Ce taux est donc libellé en dollar, et le CMPC qui en découle aussi : la
  // conversion en monnaie locale se fait par le différentiel d'inflation.
  const DOLLAR = "dollar";

  // Économies où le dollar a cours légal : le CMPC y est déjà en monnaie
  // locale, et le convertir ajouterait un écart sans objet. Les monnaies
  // simplement arrimées au dollar — riyal, dirham, dollar de Hong Kong — n'y
  // figurent pas : un ancrage se défait, le différentiel reste alors le bon
  // véhicule.
  const PAYS_DOLLAR = ["United States", "Ecuador", "El Salvador", "Panama"];

  function tauxSansRisque() {
    const code = params.maturity === "30Y" ? "30" : "10";
    const brut = DATA.rf[params.year + "-" + code];
    if (brut === undefined) return null;
    const pays = DATA.pays[params.country] || {};
    const primeDefaut = pays.crp === undefined;
    const prime = primeDefaut ? 0.01 : pays.crp;
    return {
      pays: params.country,
      libelle: "US Bond " + params.maturity + " (" + params.year + ")",
      socle: brut / 100, prime: prime, primeDefaut: primeDefaut,
      taux: brut / 100 + prime,
      monnaie: DOLLAR, source: "US Treasury",
      locale: PAYS_DOLLAR.indexOf(params.country) >= 0,
    };
  }

  // Separateur de milliers en espace insecable U+00A0 : U+202F manque a IBM Plex Mono.
  const frMontant = (v) =>
    v == null ? "—" : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " M";

  // Les deux colonnes de cartes — CMPC et Sociétés — partagent la même mécanique :
  // une carte dépliée à la fois, un panneau de détail, une flèche qui la pointe.
  const PANNEAUX = {
    cmpc: {
      stack: "stack", frame: "frame", col: "frameCol", arrow: "frameArrow",
      ouvert: null, items: [], detail: null,
      vide: {
        titre: "Détail de la composante",
        texte: "Sélectionne une composante à gauche : sa méthodologie, ses sources, ses hypothèses et son calcul s'afficheront ici."
      }
    },
    soc: {
      stack: "stackSoc", frame: "frameSoc", col: "frameColSoc", arrow: "frameArrowSoc",
      ouvert: null, items: [], detail: null,
      vide: {
        titre: "Détail de la société",
        texte: "Sélectionne une société à gauche : son activité, son pays et ses trois derniers exercices s'afficheront ici."
      }
    }
  };

  /* ================= Calcul =================
     Transcription de wacc_core.py : les mêmes formules, appliquées dans le
     navigateur aux données embarquées ci-dessus. Aucun appel réseau.
  */

  function adjustedSpread(costOfDebt) {
    for (const [threshold, spread] of DATA.adjustment.rows) {
      if (costOfDebt <= threshold) return { value: spread + DATA.adjustment.correction, adjusted: true };
    }
    return { value: costOfDebt, adjusted: false };
  }

  function computeModel(p) {
    const notes = [];
    const country = DATA.pays[p.country] || {};
    const industry = DATA.industries[p.industry] || {};

    // Le taux sans risque vient de la même fonction que sous le référentiel
    // Comparables. Écrire deux fois la même règle, c'est se donner rendez-vous
    // pour la voir diverger.
    const rf = tauxSansRisque();
    const crp = rf ? rf.prime : 0.01;
    if (country.crp === undefined) notes.push("Prime de risque pays indisponible, 1,00 % retenu");
    let tax = country.tax;
    if (tax === undefined) { tax = 0.25; notes.push("Taux d'IS indisponible pour ce pays, 25,00 % retenu"); }
    let beta = industry.beta, de = industry.de;
    if (beta === undefined || de === undefined) { beta = 1.0; de = 0.5; notes.push("Bêta sectoriel indisponible, valeurs par défaut retenues"); }
    let rawSpread = industry.spread;
    if (rawSpread === undefined) { rawSpread = 0.05; notes.push("Spread de financement indisponible, 5,00 % retenu"); }

    let rfPct, a;
    if (rf) {
      rfPct = rf.socle * 100;
      a = rf.taux;
    } else {
      rfPct = 0;
      a = 0.03;
      notes.push("Taux US " + p.maturity + " indisponible pour " + p.year + ", 3,00 % retenu");
    }

    const c = DATA.mature;
    const b = beta * (1 + de * (1 - tax));
    const re = a + b * c + p.d + p.e;
    const spread = adjustedSpread(rawSpread);
    const rdPre = spread.value + a;
    const rdPost = rdPre * (1 - tax);
    const ev = 1 / (1 + de);
    const dv = 1 - ev;
    const wacc = re * ev + rdPost * dv;
    const local = (1 + wacc) * (1 + p.inflation_local) / (1 + p.inflation_ref) - 1;

    const contribFp = re * ev;
    const contribDette = rdPost * dv;
    const economieImpot = rdPre * tax;
    const spreadLabel = spread.adjusted ? "Spread de financement (ajusté)" : "Spread de financement";

    const components = [
      {
        id: "re", title: "Coût des fonds propres", symbol: "Re", value: frPct(re), tone: "accent",
        rows: [
          { label: "Taux US Bond " + p.maturity + " (" + p.year + ")", value: frPct(rfPct / 100) },
          { label: "Prime de risque pays", value: frPct(crp) },
          { label: "Taux sans risque local (a)", value: frPct(a), strong: true },
          { label: "Beta désendetté", value: frNum(beta, 3) },
          { label: "Gearing sectoriel", value: frNum(de, 2) },
          { label: "Beta réendetté (b)", value: frNum(b, 3), strong: true },
          { label: "Prime de risque marché (c)", value: frPct(c) },
          { label: "Prime de taille (d)", value: frPct(p.d) },
          { label: "Prime spécifique (e)", value: frPct(p.e) }
        ],
        methodology: "MEDAF. Taux sans risque construit sur l'obligation US " + p.maturity + ", majoré de la prime de risque pays ; bêta sectoriel désendetté puis ré-endetté au gearing sectoriel.",
        source: "US Treasury " + p.maturity + " (moyenne " + p.year + ") ; prime pays, prime de risque marché et bêta sectoriel Damodaran (" + p.industry + ", " + p.country + ").",
        hypothesis: "Primes de taille et spécifique maintenues sur tout l'horizon ; gearing sectoriel considéré comme cible.",
        formula: ["Re = a + b × c + d + e", "= " + frPct(a) + " + " + frNum(b, 3) + " × " + frPct(c) + " + " + frPct(p.d) + " + " + frPct(p.e) + " = " + frPct(re)]
      },
      {
        id: "rd", title: "Coût de la dette", symbol: "Rd", value: frPct(rdPre), tone: "accent",
        rows: [
          { label: "Taux sans risque local (a)", value: frPct(a) },
          { label: spreadLabel, value: frPct(spread.value) },
          { label: "Coût de la dette avant impôt", value: frPct(rdPre), strong: true },
          { label: "Coût de la dette après impôt", value: frPct(rdPost) }
        ],
        methodology: "Coût marginal de la dette : taux sans risque local majoré du spread de financement sectoriel, puis net d'économie d'impôt.",
        source: "Spread de financement sectoriel Damodaran (" + p.industry + ")" + (spread.adjusted ? " ; spread ajusté via la table de notation." : "."),
        hypothesis: "Refinancement aux conditions actuelles ; charges financières intégralement déductibles.",
        formula: [
          "Rd = a + spread = " + frPct(a) + " + " + frPct(spread.value) + " = " + frPct(rdPre),
          "Rd après impôt = " + frPct(rdPre) + " × (1 − " + frPct(tax) + ") = " + frPct(rdPost)
        ]
      },
      {
        id: "ev", title: "Poids des fonds propres", symbol: "E/V", value: frPct(ev), tone: "accent",
        rows: [
          { label: "Gearing sectoriel (D/E)", value: frNum(de, 2) },
          { label: "Quote-part fonds propres", value: frPct(ev), strong: true },
          { label: "Quote-part dette", value: frPct(dv) }
        ],
        methodology: "Structure financière cible en valeur de marché, déduite du gearing sectoriel plutôt que du levier comptable spot.",
        source: "Gearing médian de l'échantillon sectoriel retenu pour le désendettement du bêta.",
        hypothesis: "Structure stable sur l'horizon d'actualisation, sans opération de haut de bilan.",
        formula: ["E/V = 1 / (1 + D/E) = 1 / " + frNum(1 + de, 2) + " = " + frPct(ev)]
      },
      {
        id: "dv", title: "Poids de la dette", symbol: "D/V", value: frPct(dv), tone: "accent",
        rows: [
          { label: "Gearing sectoriel (D/E)", value: frNum(de, 2) },
          { label: "Quote-part dette", value: frPct(dv), strong: true },
          { label: "Quote-part fonds propres", value: frPct(ev) }
        ],
        methodology: "Complément de la quote-part de fonds propres, sur la même structure cible ; dette financière brute, trésorerie non déduite.",
        source: "Gearing médian de l'échantillon sectoriel retenu pour le désendettement du bêta.",
        hypothesis: "Obligations locatives assimilées à de la dette financière.",
        formula: ["D/V = (D/E) / (1 + D/E) = " + frNum(de, 2) + " / " + frNum(1 + de, 2) + " = " + frPct(dv)]
      },
      {
        id: "tax", title: "Taux d'imposition", symbol: "t", value: frPct(tax), tone: "accent",
        rows: [
          { label: "Corporate tax rate", value: frPct(tax), strong: true },
          { label: "Coût de la dette avant impôt", value: frPct(rdPre) },
          { label: "Économie d'impôt", value: frPts(economieImpot) }
        ],
        methodology: "Taux d'impôt sur les sociétés normatif, également utilisé pour le ré-endettement du bêta.",
        source: "Taux d'IS de droit commun Damodaran (" + p.country + ").",
        hypothesis: "Aucun déficit reportable activé ; pas de plafonnement de la déductibilité.",
        formula: [
          "Économie d'impôt = Rd × t = " + frPct(rdPre) + " × " + frPct(tax) + " = " + frPts(economieImpot),
          "Beta réendetté = " + frNum(beta, 3) + " × (1 + " + frNum(de, 2) + " × (1 − " + frPct(tax) + ")) = " + frNum(b, 3)
        ]
      },
      {
        id: "wacc", title: "Coût moyen pondéré du capital", symbol: "WACC", value: frPct(wacc), tone: "green", final: true,
        rows: [
          { label: "Fonds propres " + frPct(re) + " × " + frPct(ev), value: frPts(contribFp) },
          { label: "Dette " + frPct(rdPost) + " × " + frPct(dv), value: frPts(contribDette) },
          { label: "WACC", value: frPct(wacc), strong: true }
        ],
        composition: {
          equity: wacc ? frPct(contribFp / wacc, 1) : "—",
          debt: wacc ? frPct(contribDette / wacc, 1) : "—",
          equityPct: wacc ? contribFp / wacc * 100 : 50,
          debtPct: wacc ? contribDette / wacc * 100 : 50
        },
        methodology: "Moyenne des deux coûts pondérée par la structure cible, la dette étant retenue après économie d'impôt.",
        retained: frPct(wacc) + " dans la monnaie du taux sans risque, " + frPct(local) + " en monnaie locale après différentiel d'inflation.",
        formula: ["WACC = E/V × Re + D/V × Rd après impôt", "= " + frPct(ev) + " × " + frPct(re) + " + " + frPct(dv) + " × " + frPct(rdPost) + " = " + frPct(wacc)]
      },
      {
        id: "loc", title: "CMPC en monnaie locale", symbol: "CMPC loc.", value: frPct(local), tone: "blue", final: true,
        rows: [
          { label: "CMPC monnaie du taux sans risque", value: frPct(wacc) },
          { label: "Inflation monnaie locale", value: frPct(p.inflation_local) },
          { label: "Inflation monnaie du taux sans risque", value: frPct(p.inflation_ref) },
          { label: "CMPC en monnaie locale", value: frPct(local), strong: true }
        ],
        methodology: "Conversion du CMPC exprimé dans la monnaie du taux sans risque vers la monnaie locale par le différentiel d'inflation attendu, selon la parité des pouvoirs d'achat.",
        source: "Prévisions d'inflation des deux zones monétaires, saisies dans l'onglet Paramètres.",
        hypothesis: "Différentiel d'inflation constant sur l'horizon ; les flux actualisés doivent être exprimés dans la même monnaie que ce taux.",
        formula: [
          "CMPC loc. = (1 + CMPC) × (1 + infl. loc.) / (1 + infl. réf.) − 1",
          "= " + frNum(1 + wacc, 4) + " × " + frNum(1 + p.inflation_local, 4) + " / " + frNum(1 + p.inflation_ref, 4) + " − 1 = " + frPct(local)
        ]
      }
    ];

    return {
      fiscalYear: "Exercice " + p.year,
      chips: [p.country, p.industry],
      market: [
        { label: "Prime de risque pays", value: frPct(crp) },
        { label: "Beta désendetté", value: frNum(beta, 3) },
        { label: "Gearing sectoriel", value: frNum(de, 2) }
      ],
      notes: notes,
      result: {
        wacc: frPct(wacc), ke: frPct(re), kd: frPct(rdPost), local: frPct(local),
        structure: frPct(ev, 0) + " / " + frPct(dv, 0),
        equityPct: ev * 100, debtPct: dv * 100
      },
      // Les nombres avant mise en forme : le classeur Excel les reprend tels
      // quels plutôt que de refaire les formules dans son coin.
      brut: {
        socle: rfPct / 100, prime: crp, a: a,
        beta: beta, de: de, tax: tax, betaReendette: b,
        primeMarche: c, d: p.d, e: p.e, ke: re,
        spread: spread.value, spreadAjuste: spread.adjusted,
        kd: rdPost, we: ev, wd: dv, wacc: wacc, waccLocal: local,
        inflationRef: p.inflation_ref, inflationLocale: p.inflation_local,
      },
      components: components
    };
  }

  /* ================= Onglets ================= */
  function renderTabs() {
    // Les onglets Sociétés et Multiples n'existent que sous référentiel Comparables.
    if (!estComparables() && (tab === "societes" || tab === "multiples")) tab = "params";
    $("tabSocietes").hidden = !estComparables();
    $("tabMultiples").hidden = !estComparables();

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.classList.toggle("is-active", b.dataset.tab === tab);
    });
    $("panel-params").hidden = tab !== "params";
    $("panel-wacc").hidden = tab !== "wacc";
    $("panel-societes").hidden = tab !== "societes";
    $("panel-multiples").hidden = tab !== "multiples";
    if (tab === "wacc" || tab === "societes") requestAnimationFrame(placeArrows);
    if (tab === "multiples") chargerMultiples();
  }
  document.querySelectorAll(".tabs button").forEach((b) => {
    b.addEventListener("click", () => { tab = b.dataset.tab; renderTabs(); });
  });

  /* ================= Onglet Paramètres ================= */
  function optionsHtml(key, options) {
    // Une option est soit une valeur brute, soit un couple [valeur, libellé].
    return options
      .map((o) => (Array.isArray(o) ? o : [o, o]))
      .map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(params[key]) ? " selected" : ""}>${esc(l)}</option>`)
      .join("");
  }

  function selectField(key, label, options) {
    return `
      <span class="field">
        <span class="field-label">${esc(label)}</span>
        <span class="select-wrap">
          <select data-param="${key}">
            ${optionsHtml(key, options)}
          </select>
          ${CHEVRON}
        </span>
      </span>`;
  }

  // Menu à deux niveaux : les pays sont présentés par continent. `groupes` est
  // [[continent, [pays...]], ...] ; on retombe sur la liste plate si le jeu de
  // données est ancien et ne porte pas encore le découpage.
  function selectFieldGroupe(key, label, groupes, repli) {
    if (!Array.isArray(groupes) || !groupes.length) return selectField(key, label, repli || []);
    return `
      <span class="field">
        <span class="field-label">${esc(label)}</span>
        <span class="select-wrap">
          <select data-param="${key}">
            ${groupes.map(([groupe, membres]) => `<optgroup label="${esc(groupe)}">${optionsHtml(key, membres)}</optgroup>`).join("")}
          </select>
          ${CHEVRON}
        </span>
      </span>`;
  }

  /* ================= Découpage géographique ================= */
  const TOUS = "Tous";

  function groupesPays() { return DATA.options.countries_grouped || []; }
  function continents() { return groupesPays().map(([c]) => c); }
  function zonesDuContinent(c) { return (DATA.options.zones_par_continent || {})[c] || []; }
  // Le continent raccourcit la liste des pays proposés — c'est un confort de
  // saisie — mais il ne change jamais celui qui est retenu, et la zone n'y
  // touche pas davantage. Le pays désigne l'émetteur valorisé, donc sa prime de
  // risque et son taux d'IS ; le continent cadre l'échantillon de comparables,
  // c'est-à-dire l'endroit où le secteur est assez représenté pour qu'une
  // médiane veuille dire quelque chose. Deux questions distinctes : l'écart
  // entre les deux s'ajuste par la prime spécifique, pas en déplaçant le pays.
  function paysVisibles() {
    const groupes = groupesPays();
    if (params.continent === TOUS) return groupes.flatMap(([, m]) => m);
    const t = groupes.find(([c]) => c === params.continent);
    return t ? t[1] : groupes.flatMap(([, m]) => m);
  }

  // Quand le pays retenu sort du continent filtré, il reste proposé dans son
  // propre groupe. Sans cela le menu porterait une valeur absente de ses
  // options, et le navigateur retomberait silencieusement sur la première —
  // c'est précisément ainsi que changer de continent déplaçait le pays.
  function champPays(label) {
    if (params.continent === TOUS) {
      return selectFieldGroupe("country", label, groupesPays(), DATA.options.countries);
    }
    const membres = paysVisibles();
    const groupes = membres.includes(params.country)
      ? [[params.continent, membres]]
      : [["Pays retenu, hors " + params.continent, [params.country]],
         [params.continent, membres]];
    return selectFieldGroupe("country", label, groupes, DATA.options.countries);
  }

  // L'univers de comparables, société par société : la seule source de la page,
  // et exactement la population que compte le cadrage.
  const COMPARABLES = (DATA.comparables || {}).societes || {};

  // Les sociétés du périmètre courant : industrie demandée, et zone retenue par
  // le filtre géographique. La zone est celle calculée au build, la même qui
  // produit les effectifs du cadrage — la redéduire ici à partir du pays
  // supposerait que tout pays coté soit connu de Damodaran, ce que le Malawi et
  // la Gambie ne sont pas. Les deux affichages ne peuvent donc pas diverger.
  function societesDuPerimetre() {
    const ind = industrieCourante();
    const zones = params.continent === TOUS ? null : perimetreCourant().zones;
    return Object.keys(COMPARABLES)
      .filter((id) => {
        const s = COMPARABLES[id];
        if (ind && s.industrie !== ind) return false;
        if (zones && zones.indexOf(s.zone) === -1) return false;
        if (params.place_cible && s.place !== params.place_cible) return false;
        return true;
      })
      // Les plus grosses capitalisations d'abord : elles portent le secteur.
      .sort((a, b) => (COMPARABLES[b].capitalisation || 0) - (COMPARABLES[a].capitalisation || 0));
  }

  /* ---------- Effectifs de sociétés ---------- */
  // Les effectifs viennent des seules sociétés réellement référencées. À ce jour
  // la place d'Abidjan, soit sept pays et une seule zone sur dix-huit : partout
  // ailleurs le compte est nul, et le panneau doit l'écrire plutôt que d'afficher
  // un tiret qu'on lirait comme une donnée manquante.
  // L'industrie qui filtre les effectifs. Sous Comparables, la nomenclature est
  // celle de l'univers ; sous Damodaran, aucune correspondance n'existe entre
  // ses 94 secteurs et ceux de l'export, donc on ne filtre pas.
  function industrieCourante() { return estComparables() ? params.secteur : null; }

  function effectif(zone) {
    const source = (DATA.comparables || {}).zones || DATA.zones_societes || {};
    const bloc = source[zone];
    if (!bloc) return { total: 0, n: null, places: [] };
    const ind = industrieCourante();
    if (!ind) {
      return { total: bloc.total || 0, n: null, places: Object.keys(bloc.places || {}) };
    }
    // Sans société de cette industrie dans la zone, il n'y a pas non plus de
    // place d'où elles viendraient. Retomber ici sur les places de la zone
    // entière faisait remonter les marchés d'Afrique australe et de l'Est sur
    // une sélection qui n'y comptait aucune société : le résumé décrivait le
    // continent, pas le choix de l'utilisateur.
    const detail = bloc.industries ? bloc.industries[ind] : null;
    return {
      total: bloc.total || 0,
      n: detail ? detail.n : 0,
      places: detail ? Object.keys(detail.places || {}) : [],
    };
  }

  // Ce que le périmètre courant contient réellement : zone retenue si elle
  // l'est, sinon toutes les zones du continent, filtrées sur l'industrie. Une
  // seule lecture partagée par le résumé, la carte et l'onglet Sociétés — trois
  // affichages qui divergeaient tant qu'ils comptaient chacun de leur côté.
  function perimetreCourant() {
    const ind = industrieCourante();
    const zones = params.continent === TOUS
      ? []
      : (params.zone ? [params.zone] : zonesDuContinent(params.continent).map(([z]) => z));

    let n = 0;
    const places = [];
    const peuplees = [];
    zones.forEach((zone) => {
      const e = effectif(zone);
      const compte = (ind ? e.n : e.total) || 0;
      if (!compte) return;
      n += compte;
      peuplees.push(zone);
      e.places.forEach((p) => { if (places.indexOf(p) === -1) places.push(p); });
    });
    places.sort();
    return {
      nom: params.zone || params.continent,
      zones: zones, peuplees: peuplees, n: n, places: places,
    };
  }

  /* ---------- Carte ---------- */
  // Une teinte par continent, éclaircie zone par zone : les zones d'un même
  // continent se distinguent sans changer de famille de couleur. Rien ici ne
  // code un montant.
  const TEINTES = {
    "Afrique": "#b8452f", "Amériques": "#2563a8", "Asie": "#1a7f6b",
    "Europe": "#7d5aa8", "Océanie": "#a8781f", "Autres": "#8b8b93",
  };
  function teinte(continent) { return TEINTES[continent] || TEINTES["Autres"]; }

  // Une couleur franche par zone, et non des nuances d'une même teinte : sur une
  // carte, deux nuances voisines d'un même continent se confondent dès que les
  // blocs sont contigus. La palette est fixe et ordonnée, pour qu'une zone garde
  // sa couleur d'un continent à l'autre et d'une session à l'autre.
  const PALETTE_ZONES = [
    "#c1553b", "#2f7fb5", "#3f9e78", "#8a63b8", "#c99a2e",
    "#5b8c5a", "#b4577f", "#4a7fa5",
  ];
  function teinteZone(continent, rang, total) {
    return PALETTE_ZONES[rang % PALETTE_ZONES.length];
  }

  /* ---------- Globe, pour le continent « Tous » ---------- */
  let globeLon = 15, globeLat = 12;
  let anneauxCache = null;

  // Le fond est stocké projeté en équirectangulaire ; on en redéduit lon/lat
  // pour le reprojeter en orthographique. x = lon + 180 et y = 90 - lat.
  function anneaux() {
    if (anneauxCache) return anneauxCache;
    const fond = DATA.carte ? DATA.carte.fond || "" : "";
    anneauxCache = fond.split("Z").filter(Boolean).map((bloc) =>
      bloc.replace("M", "").split("L").map((couple) => {
        const paire = couple.trim().split(/\s+/).map(Number);
        return [paire[0] - 180, 90 - paire[1]];
      })
    );
    return anneauxCache;
  }

  const RAD = Math.PI / 180;
  function ortho(lon, lat, R, cx, cy) {
    const dl = (lon - globeLon) * RAD, la = lat * RAD, l0 = globeLat * RAD;
    const visible = Math.sin(l0) * Math.sin(la) + Math.cos(l0) * Math.cos(la) * Math.cos(dl) > 0;
    return {
      visible: visible,
      x: cx + R * Math.cos(la) * Math.sin(dl),
      y: cy - R * (Math.cos(l0) * Math.sin(la) - Math.sin(l0) * Math.cos(la) * Math.cos(dl)),
    };
  }

  function globeHtml() {
    const R = 84, cx = 90, cy = 90;
    const terres = anneaux().map((ring) => {
      let d = "", ouvert = false;
      for (const couple of ring) {
        const p = ortho(couple[0], couple[1], R, cx, cy);
        if (!p.visible) { ouvert = false; continue; }
        d += (ouvert ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1);
        ouvert = true;
      }
      return d;
    }).filter(Boolean).join("");

    return '<svg class="carte carte-globe" viewBox="0 0 180 180" role="img" aria-label="Globe des continents">' +
      '<circle class="globe-mer" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/>' +
      '<path class="carte-fond" d="' + terres + '"/></svg>';
  }

  /* ---------- Carte d'un continent ---------- */
  // Le tracé suit les frontières réelles : chaque zone est l'union des pays qui
  // la composent. Les pays du continent absents du jeu Damodaran sont dessinés
  // en neutre, sinon le continent apparaîtrait troué.
  function continentHtml(continent) {
    const bloc = (DATA.carte.continents || {})[continent];
    if (!bloc) return "";
    const ind = industrieCourante();
    const noms = Object.keys(bloc.zones || {});
    const aires = noms.map((zone, i) => {
      const e = effectif(zone);
      const compte = (ind ? e.n : e.total) || 0;
      // Une zone sans société n'a rien à mettre en avant : elle est tracée en
      // neutre, et la sélection ne l'allume pas. Garder la surbrillance sur une
      // zone vide donnait à croire qu'un résultat s'y trouvait.
      const vide = !compte;
      const classes = "zone" + (vide ? " is-vide" : (params.zone === zone ? " is-on" : ""));
      const libelle = zone + " — " + (compte
        ? compte + " société" + (compte > 1 ? "s" : "")
        : "aucune société");
      return '<path class="' + classes + '" d="' + bloc.zones[zone] +
        '" fill="' + teinteZone(continent, i, noms.length) + '" data-zone="' + esc(zone) +
        '"><title>' + esc(libelle) + "</title></path>";
    }).join("");

    return '<svg class="carte" viewBox="' + bloc.vue.join(" ") + '" role="img" aria-label="Carte de ' +
      esc(continent) + '" preserveAspectRatio="xMidYMid meet">' +
      (bloc.autres ? '<path class="carte-hors" d="' + bloc.autres + '"/>' : "") +
      aires + "</svg>";
  }

  function carteHtml() {
    if (!DATA.carte || !DATA.carte.fond) return "";
    const svg = params.continent === TOUS ? globeHtml() : continentHtml(params.continent);
    return svg ? '<div class="carte-bloc">' + svg + "</div>" : "";
  }

  /* ---------- CMPC du référentiel Comparables ---------- */
  // Le gearing sectoriel est observé : c'est la médiane des rapports dette /
  // capitalisation des sociétés complètes du secteur. Il sert tel quel, et ne
  // cède la place à une cible que si l'utilisateur ouvre le cadenas.
  // Le coût de la dette, lui, n'est pas publié : elle est supposée levée au taux
  // souverain, hypothèse la plus neutre disponible et certainement optimiste
  // pour un émetteur privé. Elle est écrite sous le résultat plutôt que
  // dissimulée dans le calcul.
  // En deçà de ce nombre de sociétés, une médiane de zone ne décrit plus un
  // secteur. Sur les 126 couples zone x secteur, 40 % n'en comptent aucune et
  // un tiers une seule : la médiane serait alors cette société.
  const SEUIL = (DATA.comparables || {}).seuil || 3;
  const ECHANTILLON = (DATA.comparables || {}).echantillon || 20;

  // Le secteur, à l'échelle la plus étroite qui tienne debout. On essaie la
  // zone retenue, puis le continent, puis l'univers, et on garde la première
  // qui atteigne le seuil — à défaut la plus large qui compte au moins une
  // société. Le périmètre effectivement retenu est rendu avec les chiffres :
  // un repli muet ferait passer une médiane continentale pour une médiane de
  // zone, ce que rien à l'écran ne permettrait de voir.
  function statsSecteur(nom) {
    const bloc = ((DATA.comparables || {}).secteurs || {})[nom];
    if (!bloc) return null;

    const echelles = [];
    if (params.continent !== TOUS) {
      // La place n'apparaît que verrouillée sur une valeur : cliquer une place
      // dans le cadrage la met ici, avant la zone, comme échelle la plus étroite
      // — c'est explicitement celle que l'utilisateur vise.
      if (params.place_cible) {
        echelles.push({ echelle: "place", perimetre: params.place_cible,
                        stats: (bloc.places || {})[params.place_cible] });
      }
      if (params.zone) {
        echelles.push({ echelle: "zone", perimetre: params.zone,
                        stats: (bloc.zones || {})[params.zone] });
      }
      echelles.push({ echelle: "continent", perimetre: params.continent,
                      stats: (bloc.continents || {})[params.continent] });
    } else {
      // L'univers ne sert jamais de repli : depuis que l'univers couvre trois
      // continents, y retomber mêlerait une banque de Lagos à une valeur du
      // Nasdaq sans que ce soit demandé. Il n'est retenu que sur « Tous », où
      // c'est l'utilisateur qui l'a explicitement choisi.
      echelles.push({ echelle: "univers", perimetre: "tous continents",
                      stats: bloc.univers });
    }

    // La plus étroite qui atteigne le seuil ; sinon le premier repli disponible,
    // dans l'ordre place -> zone -> continent.
    const retenu = echelles.find((e) => e.stats && e.stats.societes >= SEUIL)
      || echelles.find((e, i) => i > 0 && e.stats && e.stats.societes > 0)
      || echelles.find((e) => e.stats && e.stats.societes > 0);
    if (!retenu) return null;

    const demande = echelles[0];
    return Object.assign({}, retenu.stats, {
      nom: nom,
      perimetre: retenu.perimetre,
      echelle: retenu.echelle,
      repli: retenu.echelle !== demande.echelle,
      demande: demande.perimetre,
      demandeN: demande.stats ? demande.stats.societes : 0,
    });
  }

  // Le continent de l'émetteur valorisé, celui dont on prend la courbe
  // souveraine et le taux d'IS.
  function continentEmetteur() {
    const e = DATA.pays[params.country];
    return e && e.continent ? e.continent : null;
  }

  // Prendre des bêtas de marchés développés pour valoriser un émetteur africain
  // est une pratique courante — les bêtas africains sont écrasés par
  // l'illiquidité. Ce n'est donc pas une erreur, mais cela doit se lire : un
  // rapport relu six mois plus tard ne dirait plus d'où venait le bêta.
  // Le pays de valorisation et le périmètre des comparables sont deux choses
  // distinctes : le premier porte la prime de risque pays et le taux d'IS, le
  // second dit où l'on va chercher un secteur suffisamment représenté. Aller
  // chercher les banques là où elles cotent n'est pas un pis-aller, c'est le
  // principe — et l'écart de marché qui en résulte s'ajuste par la prime
  // spécifique, que l'utilisateur règle. La page le dit dans ces termes plutôt
  // que d'agiter un avertissement sans remède.
  function ecartDeMarche() {
    const emetteur = continentEmetteur();
    if (!emetteur) return null;
    if (params.continent === TOUS) {
      return { comparables: "tous continents confondus", emetteur: emetteur };
    }
    if (params.continent === emetteur) return null;
    return { comparables: params.continent, emetteur: emetteur };
  }

  // Les sociétés qui alimentent réellement la médiane : les plus grosses
  // capitalisations du périmètre retenu par statsSecteur — qui n'est pas
  // toujours celui qu'affiche la liste. Sur une zone trop mince, la médiane est
  // reprise sur le continent, et les vingt retenues sont alors ailleurs.
  //
  // La sélection est refaite ici plutôt que reçue du build : c'est la même règle
  // appliquée aux mêmes données, et un test vérifie que la médiane des sociétés
  // retenues côté navigateur égale celle publiée par le build.
  function societesRetenues() {
    const stats = statsSecteur(params.secteur);
    if (!stats) return { ids: [], stats: null };
    const dans = (c) => stats.echelle === "place" ? c.place === stats.perimetre
                      : stats.echelle === "zone" ? c.zone === stats.perimetre
                      : stats.echelle === "continent" ? c.continent === stats.perimetre
                      : true;
    const ids = Object.keys(COMPARABLES)
      .filter((id) => COMPARABLES[id].industrie === params.secteur && dans(COMPARABLES[id]))
      .sort((a, b) => (COMPARABLES[b].capitalisation || 0) - (COMPARABLES[a].capitalisation || 0))
      .slice(0, ECHANTILLON);
    return { ids: ids, stats: stats };
  }

  function gearingSectoriel(nomSecteur) {
    const s = statsSecteur(nomSecteur);
    return s && s.gearing != null ? s.gearing : null;
  }

  // Le champ cible se saisit en poids de dette D/V, borné à 0-100 %. Le calcul,
  // lui, raisonne en D/E : la conversion est faite ici une fois pour toutes.
  // 100 % de dette laisserait des fonds propres nuls, donc un D/E infini : la
  // borne haute est exclue, et le champ le dit plutôt que de rendre l'infini.
  const GEARING_MAX = 100;

  function valideGearingCible(texte) {
    const brut = String(texte == null ? "" : texte).trim().replace(",", ".");
    if (brut === "") return { valeur: null, erreur: null };
    const x = Number(brut);
    if (!Number.isFinite(x)) return { valeur: null, erreur: "Valeur non numérique." };
    if (x < 0) return { valeur: null, erreur: "Le gearing cible ne peut pas être négatif." };
    if (x >= GEARING_MAX) {
      return {
        valeur: null,
        erreur: x > GEARING_MAX
          ? "Le gearing cible ne peut pas dépasser 100 %."
          : "À 100 % de dette les fonds propres sont nuls : le CMPC n'est plus défini.",
      };
    }
    return { valeur: x, erreur: null };
  }

  // Cible convertie en D/E, ou null si le verrou est fermé ou la saisie absente.
  function gearingCibleDE() {
    if (params.gearing_verrou || params.gearing_cible == null) return null;
    const dv = params.gearing_cible / 100;
    return dv / (1 - dv);
  }

  function gearingRetenu() {
    const cible = gearingCibleDE();
    return cible != null ? cible : gearingSectoriel(params.secteur);
  }

  // Refermer le cadenas est la remise à zéro : la cible et son éventuelle erreur
  // disparaissent avec lui. Laisser une saisie en mémoire derrière un verrou
  // fermé ferait réapparaître une valeur oubliée à la réouverture suivante.
  function basculerVerrou() {
    params.gearing_verrou = !params.gearing_verrou;
    if (params.gearing_verrou) {
      params.gearing_cible = null;
      params.gearing_saisie = "";
      params.gearing_erreur = null;
    }
    apply();
  }

  // Le bêta et le gearing sont les **médianes** du secteur sur l'univers de
  // comparables, calculées sur les seules sociétés complètes. Le bêta à trois
  // ans est retenu : sur des marchés peu liquides, celui à un an bouge trop pour
  // servir de base à un coût du capital.
  function cmpcComparables() {
    if (!estComparables()) return null;
    const secteur = statsSecteur(params.secteur);
    const rf = tauxSansRisque();
    const g = gearingRetenu();
    const pays = DATA.pays[params.country] || {};
    if (!rf || !secteur || secteur.beta_3ans == null || g == null || !(g >= 0)) {
      return null;
    }
    // Damodaran ne publie pas de taux d'IS pour 23 pays sur 157, dont les
    // États-Unis — d'où viennent plus de la moitié des comparables. Refuser de
    // calculer y serait absurde : on retient 25 %, comme le fait déjà le
    // référentiel Damodaran dans le même cas, et l'encadré le signale.
    const taxDefaut = pays.tax == null;
    const tax = taxDefaut ? 0.25 : pays.tax;
    const gSect = secteur.gearing;
    const cible = gearingCibleDE();
    const betaL = secteur.beta_3ans;

    // Hamada. Le bêta médian du secteur est endetté au levier de l'échantillon :
    // le transposer tel quel sur une structure cible différente reviendrait à
    // changer les pondérations sans changer le risque, ce qui n'a pas de sens.
    // On le désendette au gearing observé puis on le ré-endette à la cible.
    // Quand la cible est absente, g vaut gSect et la transformation est neutre —
    // même formule, aucun cas particulier à maintenir.
    const relevable = gSect != null && gSect >= 0;
    const betaU = relevable ? betaL / (1 + (1 - tax) * gSect) : null;
    const beta = relevable ? betaU * (1 + (1 - tax) * g) : betaL;

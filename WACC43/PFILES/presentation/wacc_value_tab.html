      ' applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">' +
      '<alignment horizontal="' + align + '" vertical="center"' + (retour ? ' wrapText="1"' : "") +
      "/></xf>";

    // Polices : 0 encre, 1 blanc gras, 2 encre gras, 3 vert (à renseigner),
    // 4 noir gras, 5 italique, 6 italique gras, 7 noir simple.
    const polices = [
      police("", "FF0D1B2A"),
      police("<b/>", "FFFFFFFF"),
      police("<b/>", "FF0D1B2A"),
      police("", "FF008000"),
      police("<b/>", "FF000000"),
      police("<i/>", "FF0D1B2A"),
      police("<b/><i/>", "FF0D1B2A"),
      police("", "FF000000"),
    ];
    // Fonds : 2 bandeau, 3 en-tête, 4 blanc, 5 calcul, 6 résultat,
    // 7 synthèse retenue, 8 bandeau Fisher, 9 bandeau synthèse.
    const fonds = [
      '<fill><patternFill patternType="none"/></fill>',
      '<fill><patternFill patternType="gray125"/></fill>',
      remplissage("FF2C6FAC"), remplissage("FF1B3A5C"), remplissage("FFFFFFFF"),
      remplissage("FFF8FAFC"), remplissage("FFD6E4F0"), remplissage("FFF4ECD6"),
      remplissage("FF171C8F"), remplissage("FF27B093"),
    ];
    const bordures = [
      bordure(null, null, null, null),
      bordure("thin", "thin", "thin", "thin"),
      bordure("medium", "medium", "medium", "medium"),
      bordure("thin", null, "thin", "thin"),
    ];

    const styles = [
      xf(0, 0, 0, 0, "left"),                    // vide
      xf(0, 1, 2, 3, "left"),                    // bandeau de section
      xf(0, 1, 8, 3, "left"),                    // bandeau Fisher
      xf(0, 1, 9, 3, "left"),                    // bandeau synthèse
      xf(0, 1, 3, 1, "left", true),              // en-tête
      xf(0, 1, 3, 1, "center", true),            // en-tête centré
      xf(0, 0, 4, 1, "left", true),              // libellé
      xf(0, 2, 4, 1, "left", true),              // libellé gras
      xf(10, 3, 4, 1, "right"),                  // à renseigner, %
      xf(168, 3, 4, 1, "right"),                 // à renseigner, % à une décimale
      xf(2, 3, 4, 1, "right"),                   // à renseigner, nombre
      xf(10, 4, 5, 1, "right"),                  // calcul intermédiaire, %
      xf(2, 4, 5, 1, "right"),                   // calcul intermédiaire, nombre
      xf(10, 2, 6, 2, "right"),                  // résultat de section
      xf(10, 7, 4, 1, "right"),                  // valeur reprise, %
      xf(168, 7, 4, 1, "right"),                 // valeur reprise, % à une décimale
      xf(0, 5, 4, 1, "left", true),              // commentaire
      xf(0, 6, 4, 1, "left", true),              // commentaire gras
      xf(0, 2, 6, 1, "left", true),              // synthèse, libellé
      xf(10, 4, 6, 1, "right"),                  // synthèse, valeur
      xf(0, 5, 6, 1, "left", true),              // synthèse, commentaire
      xf(0, 2, 7, 1, "left", true),              // taux retenu, libellé
      xf(10, 2, 7, 2, "right"),                  // taux retenu, valeur
      xf(0, 6, 7, 1, "left", true),              // taux retenu, commentaire

      // Feuille « Sociétés ». Ces nombres sont des données relevées, pas des
      // cellules à renseigner : ils gardent l'encre du texte. Seuls la ligne
      // des médianes et le report vers le CMPC sont mis en avant, parce que
      // ce sont les deux seules lignes que le calcul reprend.
      xf(0, 5, 4, 0, "left", true),              // note d'en-tête
      xf(0, 0, 4, 1, "left"),                    // nom de société
      xf(0, 0, 4, 1, "center"),                  // ticker, place
      xf(3, 0, 4, 1, "right"),                   // montant en millions
      xf(2, 0, 4, 1, "right"),                   // nombre à deux décimales
      xf(169, 0, 4, 1, "right"),                 // bêta, trois décimales
      xf(168, 0, 4, 1, "right"),                 // pourcentage à une décimale
      xf(170, 0, 4, 1, "right"),                 // multiple, 0,0x
      xf(0, 2, 6, 1, "left"),                    // médiane, libellé
      xf(3, 4, 6, 1, "right"),                   // médiane, montant
      xf(2, 4, 6, 1, "right"),                   // médiane, deux décimales
      xf(169, 4, 6, 1, "right"),                 // médiane, bêta
      xf(168, 4, 6, 1, "right"),                 // médiane, pourcentage
      xf(170, 4, 6, 1, "right"),                 // médiane, multiple
      xf(0, 2, 7, 1, "left", true),              // report vers le CMPC, libellé
      xf(169, 2, 7, 1, "right"),                 // report, bêta
      xf(2, 2, 7, 1, "right"),                   // report, nombre
      xf(168, 2, 7, 1, "right"),                 // report, pourcentage
      xf(170, 2, 7, 1, "right"),                 // report, multiple
      xf(0, 6, 7, 1, "left", true),              // report, commentaire
    ];

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="3"><numFmt numFmtId="168" formatCode="0.0%"/>' +
      '<numFmt numFmtId="169" formatCode="0.000"/>' +
      '<numFmt numFmtId="170" formatCode="0.0&quot;x&quot;"/></numFmts>' +
      '<fonts count="' + polices.length + '">' + polices.join("") + "</fonts>" +
      '<fills count="' + fonds.length + '">' + fonds.join("") + "</fills>" +
      '<borders count="' + bordures.length + '">' + bordures.join("") + "</borders>" +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="' + styles.length + '">' + styles.join("") + "</cellXfs>" +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      "</styleSheet>";
  }

  // Chaque chaîne de la feuille (libellés, commentaires, bandeaux) est
  // écrite une fois dans une table partagée et référencée par indice — c'est
  // la construction qu'utilise tout tableur qui enregistre un .xlsx. Le
  // générateur minimal d'origine écrivait des chaînes en ligne (t="inlineStr") :
  // valide selon la norme, mais ce n'est pas ce qu'un fichier issu d'un vrai
  // tableur contient jamais, et Excel s'est montré capricieux dessus au
  // moment de copier une cellule vers un autre classeur.
  function xlChaines() {
    const table = [];
    const index = new Map();
    let total = 0;
    return {
      // Les deux feuilles puisent dans la même table : un libellé de périmètre
      // qui figure des deux côtés n'y est écrit qu'une fois.
      indice: function (texte) {
        total++;
        const trouve = index.get(texte);
        if (trouve !== undefined) return trouve;
        const i = table.length;
        table.push(texte);
        index.set(texte, i);
        return i;
      },
      xml: function () {
        return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
          ' count="' + total + '" uniqueCount="' + table.length + '">' +
          table.map((texte) => '<si><t xml:space="preserve">' + xmlEsc(texte) + "</t></si>").join("") +
          "</sst>";
      },
    };
  }

  function xlFeuille(lignes, largeurs, fusions, chaines) {
    const colonnes = largeurs.map((w, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("");
    const corps = lignes.map((ligne) => {
      const cellules = ligne.cellules.map((c) => {
        const ref = c.col + ligne.r;
        if (c.texte != null) {
          return '<c r="' + ref + '" s="' + c.s + '" t="s"><v>' + chaines.indice(c.texte) + "</v></c>";
        }
        const f = c.formule ? "<f>" + xmlEsc(c.formule) + "</f>" : "";
        const v = Number.isFinite(c.valeur) ? "<v>" + xlNombre(c.valeur) + "</v>" : "";
        return f || v
          ? '<c r="' + ref + '" s="' + c.s + '">' + f + v + "</c>"
          : '<c r="' + ref + '" s="' + c.s + '"/>';
      }).join("");
      // Une cellule fusionnée qui renvoie à la ligne ne s'ajuste pas toute
      // seule : là où le texte est long, la hauteur est posée explicitement.
      const haut = ligne.ht ? ' ht="' + ligne.ht + '" customHeight="1"' : "";
      return '<row r="' + ligne.r + '"' + haut + ">" + cellules + "</row>";
    }).join("");
    const merges = fusions.length
      ? '<mergeCells count="' + fusions.length + '">' +
        fusions.map((ref) => '<mergeCell ref="' + ref + '"/>').join("") + "</mergeCells>"
      : "";

    // Jamais tabSelected sur ces vues : sans <bookViews> pour dire quel onglet
    // est actif dans workbook.xml (que ce classeur n'a jamais eu besoin
    // d'écrire), l'attribut isolé mettait Excel dans un état de sélection
    // fautif propre à ce fichier — invisible à l'ouverture, mais qui cassait
    // tout copier-coller depuis lui (« Cette action ne fonctionne pas sur
    // plusieurs sélections. »). Isolé par bissection le 29/08/2026 : le
    // classeur s'ouvrait, se relisait et se recalculait sans reproche, seul le
    // copier-coller trahissait le problème.
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="' + XL_HAUTEUR + '"/><cols>' + colonnes + "</cols>" +
      "<sheetData>" + corps + "</sheetData>" + merges + "</worksheet>";
  }

  // Une ligne du gabarit : le libellé en A, la valeur en C, le commentaire en E.
  function ligneXl(o) {
    const cellules = [{ col: "A", s: o.sL || XL.libelle, texte: o.libelle }];
    const valeur = { col: "C", s: o.sV };
    if (o.formule) valeur.formule = o.formule;
    if (Number.isFinite(o.valeur)) valeur.valeur = o.valeur;
    cellules.push(valeur);
    if (o.commentaire) cellules.push({ col: "E", s: o.sC || XL.commentaire, texte: o.commentaire });
    return { r: o.r, cellules: cellules };
  }

  // Les bandeaux sont fusionnés de A à E : les cinq cellules portent le même
  // style, sinon le trait du bas s'arrête au milieu du bandeau.
  function bandeauXl(r, texte, style, colonnes) {
    return { r: r, cellules: (colonnes || ["A", "B", "C", "D", "E"]).map((col, i) =>
      i === 0 ? { col: col, s: style, texte: texte } : { col: col, s: style }) };
  }

  // Les nombres du classeur, quel que soit le référentiel : une seule forme en
  // sortie, deux façons de la remplir. Rien n'est recalculé ici — tout vient du
  // modèle affiché, sans quoi la page et le fichier finiraient par diverger.
  function chiffresClasseur() {
    const rf = tauxSansRisque();
    if (!rf) return null;
    const primeNote = rf.primeDefaut ? " — non publiée, 1,00 % retenu" : "";
    const sourceTaux = "US Treasury " + params.maturity + ", moyenne " + params.year + " (home.treasury.gov)";
    const sourcePrime = "Damodaran, ctryprem.xlsx — prime de risque pays " + params.country + primeNote;
    const sourcePrimeMarche = "Damodaran, ctryprem.xlsx — prime de risque des marchés matures (cellule E3)";
    const sourceTaille = "Prime de taille + prime spécifique, saisies dans l'onglet Paramètres";

    if (estComparables()) {
      const cc = cmpcComparables();
      if (!cc) return null;
      // L'échantillon est repris tel que l'onglet Sociétés le marque : même
      // périmètre, même tri, mêmes vingt valeurs. Le classeur et l'écran ne
      // peuvent donc pas décrire deux populations différentes.
      const ret = societesRetenues();
      return {
        referentiel: "Comparables",
        societes: ret.ids.length ? {
          ids: ret.ids, perimetre: cc.perimetre, echelle: cc.echelle,
          total: cc.societes, relevable: cc.relevable,
          betaL: cc.betaL, gearingSecteur: cc.gearingSecteur,
          gearingSaisi: cc.gearingSaisi,
        } : null,
        objet: params.secteur,
        origineBeta: "médian comparables",
        origineGearing: "moyen comparables",
        socle: rf.socle, prime: rf.prime, a: rf.taux,
        betaDesendette: cc.relevable ? cc.betaU : cc.betaL,
        gearing: cc.gearing, tax: cc.tax, betaReendette: cc.beta,
        primeMarche: cc.prime, primeTaille: cc.d + cc.e, ke: cc.ke,
        spread: 0, kdPre: cc.rf.taux, kd: cc.kd, we: cc.we, wd: cc.wd,
        wacc: cc.wacc, conversion: cc.conversion,
        inflationRef: cc.inflationRef, inflationLocale: cc.inflationLocale,
        waccLocal: cc.waccLocal,
        sources: {
          taux: sourceTaux,
          prime: sourcePrime,
          beta: "Médiane des bêtas cotés à trois ans du secteur " + params.secteur + ", " +
            cc.perimetre + " (" + cc.retenues + " sociétés)" +
            (cc.relevable
              ? ", désendettée au gearing de l'échantillon (" + frNum(cc.gearingSecteur, 2) + ")"
              : " — gearing de l'échantillon non publié, bêta employé tel quel"),
          impot: cc.taxDefaut
            ? "Taux d'IS non publié pour " + params.country + " : 25 % retenu, comme sous le référentiel Damodaran"
            : "Damodaran, countrytaxrates.xls — taux d'IS " + params.country,
          gearing: cc.gearingSaisi
            ? "Gearing cible posé dans la page : " + frPct(cc.wd, 0) + " de dette"
            : "Gearing médian du secteur, " + cc.perimetre,
          primeMarche: sourcePrimeMarche,
          primeTaille: sourceTaille,
          spread: "Dette supposée levée au taux souverain : aucun spread de crédit n'est publié sous ce référentiel",
        },
      };
    }

    const b = model && model.brut;
    if (!b) return null;
    return {
      referentiel: "Damodaran",
      // Ce référentiel ne lit aucune société : ses bêtas et son levier viennent
      // des tables sectorielles de Damodaran. Joindre malgré tout une liste de
      // comparables donnerait à lire des chiffres qui n'entrent pas dans ce
      // calcul-là — l'onglet n'est donc pas écrit.
      societes: null,
      objet: params.industry,
      origineBeta: "sectoriel Damodaran",
      origineGearing: "sectoriel Damodaran",
      socle: b.socle, prime: b.prime, a: b.a,
      betaDesendette: b.beta, gearing: b.de, tax: b.tax, betaReendette: b.betaReendette,
      primeMarche: b.primeMarche, primeTaille: b.d + b.e, ke: b.ke,
      spread: b.spread, kdPre: b.a + b.spread, kd: b.kd, we: b.we, wd: b.wd,
      wacc: b.wacc, conversion: true,
      inflationRef: b.inflationRef, inflationLocale: b.inflationLocale,
      waccLocal: b.waccLocal,
      sources: {
        taux: sourceTaux,
        prime: sourcePrime,
        beta: "Damodaran, betaemerg.xls — bêta désendetté pays émergents, " + params.industry,
        impot: "Damodaran, countrytaxrates.xls — taux d'IS " + params.country,
        gearing: "Damodaran, betaemerg.xls — D/E Ratio du secteur " + params.industry,
        primeMarche: sourcePrimeMarche,
        primeTaille: sourceTaille,
        spread: "Damodaran, wacc.xls — spread de dette sectoriel, US" +
                (b.spreadAjuste ? ", ajusté par la table de correction (coût de la dette faible)" : ""),
      },
    };
  }

  // Le gabarit, ligne à ligne. Les numéros de ligne sont ceux du
  // fichier d'origine : les formules y renvoient, et un lecteur qui connaît le
  // modèle retrouve ses repères sans les chercher.
  function lignesClasseur(x) {
    // Quand le dollar a cours légal dans le pays valorisé, le CMPC est déjà en
    // monnaie locale : la transposition recopie la ligne plutôt que d'appliquer
    // un différentiel d'inflation entre une zone et elle-même.
    const fisher = x.conversion
      ? { formule: "(1+C23)*(1+C28)/(1+C27)-1",
          note: "Équation de Fisher — transposition rigoureuse USD → monnaie locale" }
      : { formule: "C23",
          note: "Le dollar a cours légal dans ce pays : le CMPC y est déjà en monnaie locale, aucune transposition n'est appliquée" };

    return [
      bandeauXl(1, "COÛT DES FONDS PROPRES (Ke) EN USD", XL.bandeau),
      { r: 2, cellules: [
          { col: "A", s: XL.entete, texte: "Composante" },
          { col: "C", s: XL.enteteCentre, texte: "Valeur" },
          { col: "E", s: XL.entete, texte: "Commentaire" }] },
      ligneXl({ r: 3, libelle: "Taux sans risque US (Rf)", valeur: x.socle, sV: XL.saisiePct2, commentaire: x.sources.taux }),
      ligneXl({ r: 4, libelle: "Prime de risque pays " + params.country + " (CRP)", valeur: x.prime, sV: XL.saisiePct2, commentaire: x.sources.prime }),
      ligneXl({ r: 5, libelle: "Taux sans risque local (Rf + CRP)", sL: XL.libelleGras, formule: "C3+C4", valeur: x.a, sV: XL.calculPct2,
                commentaire: "Intégration du risque pays au taux sans risque local", sC: XL.commentaireGras }),
      ligneXl({ r: 6, libelle: "Beta non endetté " + x.origineBeta + " (βu)", valeur: x.betaDesendette, sV: XL.saisieNum2, commentaire: x.sources.beta }),
      ligneXl({ r: 7, libelle: "Taux d'IS " + params.country + " (t)", valeur: x.tax, sV: XL.saisiePct2, commentaire: x.sources.impot }),
      ligneXl({ r: 8, libelle: "Gearing : D/E " + x.origineGearing, valeur: x.gearing, sV: XL.saisiePct1, commentaire: x.sources.gearing }),
      ligneXl({ r: 9, libelle: "Beta endetté (βL) = βu × [1 + (1−t) × D/E]", sL: XL.libelleGras, formule: "C6*(1+(1-C7)*C8)", valeur: x.betaReendette, sV: XL.calculNum2,
                commentaire: "Re-leverage Hamada — endettement de l'échantillon" }),
      ligneXl({ r: 10, libelle: "Prime de risque marché US (ERP mature)", valeur: x.primeMarche, sV: XL.saisiePct2, commentaire: x.sources.primeMarche }),
      ligneXl({ r: 11, libelle: "Prime de taille (small cap premium)", valeur: x.primeTaille, sV: XL.saisiePct2, commentaire: x.sources.primeTaille }),
      ligneXl({ r: 12, libelle: "Coût des fonds propres Ke = Rf_local + βL × ERP + Prime taille", sL: XL.libelleGras,
                formule: "C5+C9*C10+C11", valeur: x.ke, sV: XL.resultat }),

      bandeauXl(14, "COÛT DE LA DETTE (Kd) EN USD", XL.bandeau),
      ligneXl({ r: 15, libelle: "Taux sans risque local (Rf + CRP)", formule: "C5", valeur: x.a, sV: XL.valeurPct2,
                commentaire: "Idem partie Ke — taux sans risque local" }),
      ligneXl({ r: 16, libelle: "Spread de la dette (Damodaran EM)", valeur: x.spread, sV: XL.saisiePct2, commentaire: x.sources.spread }),
      ligneXl({ r: 17, libelle: "Coût de la dette avant IS Kd_pre = Rf_local + spread", sL: XL.libelleGras, formule: "C15+C16", valeur: x.kdPre, sV: XL.calculPct2,
                commentaire: "Coût de la dette brute (CRP déjà inclus via Rf_local)", sC: XL.commentaireGras }),
      ligneXl({ r: 18, libelle: "Coût de la dette après IS Kd = Kd_pre × (1 − t)", sL: XL.libelleGras, formule: "C17*(1-C7)", valeur: x.kd, sV: XL.resultat,
                commentaire: "Économie fiscale (intérêts déductibles)", sC: XL.commentaireGras }),

      bandeauXl(20, "PONDÉRATION WACC EN MONNAIE DU TAUX SANS RISQUE", XL.bandeau),
      ligneXl({ r: 21, libelle: "Poids fonds propres E/V = 1 / (1 + D/E)", formule: "1/(1+C8)", valeur: x.we, sV: XL.valeurPct1,
                commentaire: "Structure cible de l'échantillon" }),
      ligneXl({ r: 22, libelle: "Poids dette D/V = (D/E) / (1 + D/E)", formule: "C8/(1+C8)", valeur: x.wd, sV: XL.valeurPct1,
                commentaire: "Complément à 100%" }),
      ligneXl({ r: 23, libelle: "WACC monnaie taux sans risque = (E/V) × Ke + (D/V) × Kd", sL: XL.libelleGras,
                formule: "C21*C12+C22*C18", valeur: x.wacc, sV: XL.resultat,
                commentaire: "Coût moyen pondéré du capital (en monnaie du taux sans risque)", sC: XL.commentaireGras }),

      bandeauXl(26, "TRANSPOSITION USD → MONNAIE LOCALE (DIFFÉRENTIEL D'INFLATION — FISHER)", XL.bandeauFisher),
      ligneXl({ r: 27, libelle: "Inflation long terme États-Unis (π_US)", valeur: x.inflationRef, sV: XL.saisiePct2,
                commentaire: "Saisie dans l'onglet Paramètres (ex. Cleveland Fed — Ten years expected inflation)" }),
      ligneXl({ r: 28, libelle: "Inflation long terme " + params.country + " (π_loc)", valeur: x.inflationLocale, sV: XL.saisiePct2,
                commentaire: "Saisie dans l'onglet Paramètres (ex. critère de convergence UEMOA, 3 % plafond)" }),
      ligneXl({ r: 29, libelle: "Différentiel d'inflation (π_loc − π_US)", sL: XL.libelleGras, formule: "C28-C27", valeur: x.inflationLocale - x.inflationRef, sV: XL.calculPct2,
                commentaire: "Positif : inflation locale > inflation US ⇒ CMPC local > CMPC en monnaie du taux sans risque", sC: XL.commentaireGras }),
      ligneXl({ r: 30, libelle: "WACC monnaie locale = (1 + WACC_USD) × (1 + π_loc) / (1 + π_US) − 1", sL: XL.libelleGras,
                formule: fisher.formule, valeur: x.waccLocal, sV: XL.resultat, commentaire: fisher.note, sC: XL.commentaireGras }),

      bandeauXl(33, "SYNTHÈSE — TAUX D'ACTUALISATION RETENU", XL.bandeauSynthese),
      ligneXl({ r: 34, libelle: "WACC monnaie du taux sans risque", sL: XL.syntheseL, formule: "C23", valeur: x.wacc, sV: XL.syntheseV,
                commentaire: "Référentiel " + x.referentiel + " — " + x.objet + ", " + params.country + ", exercice " + params.year, sC: XL.syntheseC }),
      ligneXl({ r: 35, libelle: "WACC en monnaie locale (retenu pour DCF)", sL: XL.retenuL, formule: "C30", valeur: x.waccLocal, sV: XL.retenuV,
                commentaire: "Devise locale — à appliquer aux flux du DCF exprimés dans cette monnaie", sC: XL.retenuC }),
    ];
  }

  /* ---------- Feuille « Sociétés » ---------- */
  // Une ligne par comparable de l'échantillon, dans l'ordre où l'onglet Sociétés
  // les classe — par capitalisation décroissante. Trois blocs se suivent : les
  // sociétés, la médiane de chaque colonne, puis ce que le CMPC reprend de
  // cette médiane, cellule de la feuille WACC à l'appui. Les multiples d'EBITDA
  // sont là pour la valorisation par comparables : ils n'entrent pas dans le
  // coût du capital, et la ligne de report le dit.
  //
  // Le cadre suit l'information, et pas l'inverse. S&P ne publie pas d'EBITDA
  // pour les banques ni les assureurs — la notion n'a pas de sens pour elles —
  // si bien qu'un secteur de vingt comparables peut n'en compter qu'une qui en
  // porte un, ou aucune. Les colonnes qui en dérivent sont donc retirées quand
  // personne n'en publie, leurs médianes tues sous le seuil, et le multiple
  // reporté annonce sur combien de sociétés il porte. Sans cela la feuille
  // affichait « médiane de l'échantillon (20 sociétés) » au-dessus d'un multiple
  // tiré d'une seule — et un #NUM! là où il n'y en avait aucune.

  // L'exercice de référence de la feuille : le plus récent qu'au moins la
  // moitié de l'échantillon documente. Prendre la dernière colonne de l'export
  // sans regarder laisserait un tableau de cases vides dès qu'un exercice n'est
  // pas encore publié partout.
  function exerciceReference(sample) {
    const annees = (sample[0].annees || []).slice().reverse();
    for (const a of annees) {
      const publient = sample.filter((s) => (s.ca || {})[String(a)] != null).length;
      if (publient * 2 >= sample.length) return a;
    }
    return annees[0] || null;
  }

  function lignesSocietes(x) {
    const info = x.societes;
    if (!info) return null;
    const sample = info.ids.map((id) => COMPARABLES[id]).filter(Boolean);
    if (!sample.length) return null;

    const an = exerciceReference(sample);
    const cle = String(an);
    const ca = (s) => (s.ca || {})[cle];
    const eb = (s) => (s.ebitda || {})[cle];
    const ve = (s) => s.capitalisation + s.dette;

    // Combien de sociétés portent réellement un EBITDA à cet exercice. Tout ce
    // qui en découle se règle sur ce nombre, jamais sur la taille de
    // l'échantillon : c'est le même seuil que la page applique aux médianes de
    // zone, pour la même raison — en deçà, la médiane serait cette société.
    const avecEbitda = sample.filter((s) => eb(s) != null).length;
    const multiples = avecEbitda >= SEUIL;

    // Une colonne par donnée, dans l'ordre où on la lit — l'identité, la taille,
    // le levier, les bêtas, puis les comptes et les multiples qui en découlent.
    // Celles qui dérivent de l'EBITDA sortent du tableau quand personne n'en
    // publie : un en-tête au-dessus de vingt cases vides est un cadre sans
    // information, et non une donnée manquante.
    const colonnes = [
      { cle: "nom", entete: "Société", largeur: 40, sE: XL.entete, s: XL.socNom,
        texte: (s) => s.nom },
      { cle: "ticker", entete: "Ticker", largeur: 10, s: XL.socTexte,
        texte: (s) => s.ticker || "" },
      { cle: "place", entete: "Place", largeur: 8, s: XL.socTexte,
        texte: (s) => s.place || "hors cote" },
      { cle: "pays", entete: "Pays", largeur: 17, sE: XL.entete, s: XL.socNom,
        texte: (s) => s.pays },
      { cle: "capi", entete: "Capitalisation", largeur: 14, s: XL.socMontant,
        sM: XL.medMontant, valeur: (s) => s.capitalisation },
      { cle: "dette", entete: "Dette totale", largeur: 12.5, s: XL.socMontant,
        sM: XL.medMontant, valeur: (s) => s.dette },
      { cle: "de", entete: "Dette / capi (D/E)", largeur: 12.5, s: XL.socNum2,
        sM: XL.medNum2,
        valeur: (s) => (s.capitalisation ? s.dette / s.capitalisation : null),
        formule: (s, r, L) => L.dette + r + "/" + L.capi + r },
      { cle: "beta1", entete: "Bêta 1 an", largeur: 9, s: XL.socNum3, sM: XL.medNum3,
        valeur: (s) => s.beta_1an },
      { cle: "beta3", entete: "Bêta 3 ans", largeur: 9, s: XL.socNum3, sM: XL.medNum3,
        valeur: (s) => s.beta_3ans },
      { cle: "ca", entete: "Chiffre d'affaires " + an, largeur: 15, s: XL.socMontant,
        sM: XL.medMontant, valeur: ca },
      { cle: "ebitda", entete: "EBITDA " + an, largeur: 15, s: XL.socMontant,
        sM: XL.medMontant, valeur: eb, ebitda: true },
      { cle: "marge", entete: "Marge d'EBITDA", largeur: 11.5, s: XL.socPct1,
        sM: XL.medPct1, ebitda: true,
        valeur: (s) => (ca(s) && eb(s) != null ? eb(s) / ca(s) : null),
        formule: (s, r, L) => (ca(s) && eb(s) != null ? L.ebitda + r + "/" + L.ca + r : null) },
      { cle: "ve", entete: "VE " + an, largeur: 14, s: XL.socMontant, sM: XL.medMontant,
        valeur: ve, formule: (s, r, L) => L.capi + r + "+" + L.dette + r },
      { cle: "mult", entete: "VE / EBITDA", largeur: 11.5, s: XL.socMult,
        sM: XL.medMult, ebitda: true,
        valeur: (s) => (eb(s) > 0 ? ve(s) / eb(s) : null),
        formule: (s, r, L) => (eb(s) > 0 ? L.ve + r + "/" + L.ebitda + r : null) },
    ].filter((c) => avecEbitda > 0 || !c.ebitda);

    // Les lettres sont attribuées après le filtrage, et les formules les lisent
    // par clé : retirer une colonne ne décale rien à la main.
    const LETTRES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const L = {};
    colonnes.forEach((c, i) => { c.col = LETTRES[i]; L[c.cle] = c.col; });
    const cols = colonnes.map((c) => c.col);
    const fin = cols[cols.length - 1];

    const lignes = [];
    const fusions = ["A1:" + fin + "1", "A2:" + fin + "2"];

    lignes.push(bandeauXl(1, "COMPARABLES DU SECTEUR — " + x.objet + ", " + info.perimetre,
                          XL.bandeau, cols));

    // La note chiffre séparément l'effectif de l'échantillon et celui qui porte
    // un EBITDA : les deux diffèrent dès qu'un secteur mêle des modèles
    // comptables, et les confondre ferait décrire une population en en
    // chiffrant une autre.
    const note = "Les " + sample.length + " sociétés qui produisent les médianes du CMPC : " +
      (info.total > sample.length
        ? "les plus grosses capitalisations des " + info.total + " du périmètre retenu, " + info.perimetre
        : "tout le périmètre retenu, " + info.perimetre) +
      ". Montants en millions FCFA, exercice " + an + ". VE = capitalisation boursière + dette totale. " +
      (avecEbitda === 0
        ? "Aucune ne publie d'EBITDA à cet exercice — S&P n'en publie ni pour les banques ni pour les assureurs : " +
          "les colonnes qui en dérivent sont retirées plutôt que laissées vides."
        : (avecEbitda < sample.length
            ? "EBITDA publié pour " + avecEbitda + " d'entre elles seulement : la marge et le multiple ne portent que sur celles-là. "
            : "Toutes publient un EBITDA à cet exercice. ") +
          (multiples ? "" : "Moins de " + SEUIL + " valeurs : aucune médiane n'en est tirée, elle décrirait ces sociétés et non le secteur."));
    lignes.push({ r: 2, ht: 26, cellules: cols.map((col, i) =>
      i === 0 ? { col: col, s: XL.socNote, texte: note } : { col: col, s: XL.socNote }) });

    lignes.push({ r: 4, ht: 26, cellules: colonnes.map((c) => ({
      col: c.col, s: c.sE || XL.enteteCentre, texte: c.entete })) });

    const PREMIERE = 5;
    sample.forEach((s, i) => {
      const r = PREMIERE + i;
      lignes.push({ r: r, cellules: colonnes.map((c) => {
        const cellule = { col: c.col, s: c.s };
        if (c.texte) {
          cellule.texte = c.texte(s);
          return cellule;
        }
        const f = c.formule ? c.formule(s, r, L) : null;
        const v = c.valeur(s);
        if (f) cellule.formule = f;
        if (Number.isFinite(v)) cellule.valeur = v;
        return cellule;
      }) });
    });

    // La médiane est écrite en formule sur la plage juste au-dessus : qui
    // retire une société de l'échantillon voit immédiatement le bêta bouger,
    // ce qu'une valeur figée ne dirait pas.
    const derniere = PREMIERE + sample.length - 1;
    const m = derniere + 1;
    const med = {};
    colonnes.forEach((c) => {
      if (c.valeur) med[c.cle] = mediane(sample.map((s) => c.valeur(s)));
    });

    lignes.push({ r: m, cellules: colonnes.map((c, i) => {
      if (!c.valeur) {
        return i === 0
          ? { col: c.col, s: XL.medL, texte: "Médiane de l'échantillon (" + sample.length +
              (sample.length > 1 ? " sociétés)" : " société)") }
          : { col: c.col, s: XL.medL };
      }
      // MEDIAN() sur une plage vide rend #NUM!, et sur une seule valeur rend
      // cette valeur en la faisant passer pour une médiane de secteur : sous
      // le seuil, la cellule reste vide et le bas de feuille dit pourquoi.
      if (c.ebitda && !multiples) return { col: c.col, s: c.sM };
      return { col: c.col, s: c.sM, valeur: med[c.cle],
               formule: "MEDIAN(" + c.col + PREMIERE + ":" + c.col + derniere + ")" };
    }) });

    // Report vers le CMPC. Le libellé court sur A:D, la valeur tient en E et le
    // commentaire jusqu'à la dernière colonne — la seule mise en page où la
    // phrase se lit en entier sans écraser le tableau au-dessus.
    const bandeau = m + 2;
    fusions.push("A" + bandeau + ":" + fin + bandeau);
    lignes.push(bandeauXl(bandeau, "VALEURS REPRISES DANS LE CALCUL DU CMPC",
                          XL.bandeauSynthese, cols));

    let ligne = bandeau;
    const report = (libelle, o) => {
      ligne++;
      fusions.push("A" + ligne + ":D" + ligne, "F" + ligne + ":" + fin + ligne);
      const cellules = cols.slice(0, 4).map((col, i) =>
        i === 0 ? { col: col, s: XL.reportL, texte: libelle } : { col: col, s: XL.reportL });
      const valeur = { col: "E", s: o.s };
      if (o.formule) valeur.formule = o.formule;
      if (Number.isFinite(o.valeur)) valeur.valeur = o.valeur;
      cellules.push(valeur);
      cols.slice(5).forEach((col, i) =>
        cellules.push(i === 0 ? { col: col, s: XL.reportC, texte: o.commentaire }
                              : { col: col, s: XL.reportC }));
      lignes.push({ r: ligne, ht: 24, cellules: cellules });
      return ligne;
    };

    const rBeta = report("Bêta (3 ans) médian de l'échantillon (βL)", {
      s: XL.reportNum3, formule: L.beta3 + m, valeur: med.beta3,
      commentaire: info.relevable
        ? "Endetté au levier de l'échantillon : il est désendetté deux lignes plus bas avant d'entrer dans le CMPC"
        : "Levier de l'échantillon non publié : reporté tel quel en WACC!C6, sans ré-endettement" });

    let rDE = null;
    if (info.relevable) {
      rDE = report("Gearing médian de l'échantillon (D/E)", {
        s: XL.reportNum2, formule: L.de + m, valeur: med.de,
        commentaire: "Médiane de la colonne Dette / capitalisation ci-dessus" });
      report("Bêta désendetté βu = βL / (1 + (1 − t) × D/E)", {
        s: XL.reportNum3,
        formule: "E" + rBeta + "/(1+(1-WACC!C7)*E" + rDE + ")",
        valeur: med.beta3 / (1 + (1 - x.tax) * med.de),
        commentaire: "Reporté en WACC!C6 — t est le taux d'IS lu sur la feuille WACC" });
    }

    // Sans cible saisie, le gearing retenu EST la médiane : on y renvoie plutôt
    // que d'en recopier le nombre, sans quoi retirer une société du tableau
    // laisserait deux lignes voisines annoncer deux leviers différents.
    report("Gearing retenu pour la pondération (D/E)", {
      s: XL.reportNum2, valeur: x.gearing,
      formule: info.gearingSaisi || rDE === null ? null : "E" + rDE,
      commentaire: (info.gearingSaisi
        ? "Gearing cible posé dans la page"
        : "Gearing médian de l'échantillon") + " — reporté en WACC!C8" });

    // Les deux lignes d'EBITDA portent leur propre effectif : c'est la seule
    // façon de ne pas laisser lire un multiple d'une société comme un multiple
    // de secteur. Elles disparaissent avec les colonnes dont elles dépendent.
    if (avecEbitda > 0) {
      const porte = avecEbitda + (avecEbitda > 1 ? " sociétés" : " société") +
        " sur " + sample.length;
      const trop_peu = "Seulement " + porte + " publient un EBITDA — sous " + SEUIL +
        ", la médiane décrirait ces sociétés et non le secteur : elle n'est pas calculée";

      report("VE / EBITDA médian (" + porte + ")", {
        s: XL.reportMult,
        formule: multiples ? L.mult + m : null,
        valeur: multiples ? med.mult : null,
        commentaire: multiples
          ? "Multiple observé sur les comparables — repère de valorisation, il n'entre pas dans le CMPC"
          : trop_peu });

      report("Marge d'EBITDA médiane (" + porte + ")", {
        s: XL.reportPct1,
        formule: multiples ? L.marge + m : null,
        valeur: multiples ? med.marge : null,
        commentaire: multiples
          ? "Sur les seules sociétés dont S&P publie un EBITDA"
          : trop_peu });
    }

    return { lignes: lignes, fusions: fusions,
             largeurs: colonnes.map((c) => c.largeur) };
  }

  function classeurXlsx(x, avecSocietes) {
    const chaines = xlChaines();
    const feuilleWacc = xlFeuille(lignesClasseur(x), XL_COLS, XL_FUSIONS, chaines);
    const soc = avecSocietes ? lignesSocietes(x) : null;
    const feuilleSoc = soc ? xlFeuille(soc.lignes, soc.largeurs, soc.fusions, chaines) : null;
    const onglets = feuilleSoc ? ["WACC", "Sociétés"] : ["WACC"];
    const titre = "CMPC " + x.objet + ", " + params.country;
    const horodatage = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");

    const coreProps = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"' +
      ' xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"' +
      ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      "<dc:title>" + xmlEsc(titre) + "</dc:title>" +
      "<dc:creator>wacc43</dc:creator><cp:lastModifiedBy>wacc43</cp:lastModifiedBy>" +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + horodatage + "</dcterms:created>" +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + horodatage + "</dcterms:modified>" +
      "</cp:coreProperties>";

    const appProps = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"' +
      ' xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
      "<Application>wacc43</Application><DocSecurity>0</DocSecurity><ScaleCrop>false</ScaleCrop>" +
      '<HeadingPairs><vt:vector size="2" baseType="variant">' +
      "<vt:variant><vt:lpstr>Feuilles de calcul</vt:lpstr></vt:variant>" +
      "<vt:variant><vt:i4>" + onglets.length + "</vt:i4></vt:variant></vt:vector></HeadingPairs>" +
      '<TitlesOfParts><vt:vector size="' + onglets.length + '" baseType="lpstr">' +
      onglets.map((n) => "<vt:lpstr>" + xmlEsc(n) + "</vt:lpstr>").join("") +
      "</vt:vector></TitlesOfParts>" +
      "<LinksUpToDate>false</LinksUpToDate><SharedDoc>false</SharedDoc>" +
      "<HyperlinksChanged>false</HyperlinksChanged><AppVersion>16.0300</AppVersion></Properties>";

    const parties = [
      { nom: "[Content_Types].xml", contenu:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        (feuilleSoc ? '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' : "") +
        '<Override PartName="/xl/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>' +
        '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
        '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
        "</Types>" },
      { nom: "_rels/.rels", contenu:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
        '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
        "</Relationships>" },
      { nom: "xl/workbook.xml", contenu:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
        ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        "<sheets>" + onglets.map((n, i) =>
          '<sheet name="' + xmlEsc(n) + '" sheetId="' + (i + 1) + '" r:id="' +
          (i === 0 ? "rId3" : "rId5") + '"/>').join("") + "</sheets>" +
        '<calcPr calcId="124519" fullCalcOnLoad="1"/></workbook>' },
      { nom: "xl/_rels/workbook.xml.rels", contenu:
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>' +
        (feuilleSoc ? '<Relationship Id="rId5" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>' : "") +
        "</Relationships>" },
      { nom: "xl/theme/theme1.xml", contenu: XL_THEME1 },
      { nom: "xl/styles.xml", contenu: xlStyles() },
      { nom: "xl/sharedStrings.xml", contenu: chaines.xml() },
      { nom: "xl/worksheets/sheet1.xml", contenu: feuilleWacc },
      { nom: "docProps/core.xml", contenu: coreProps },
      { nom: "docProps/app.xml", contenu: appProps },
    ];
    if (feuilleSoc) {
      parties.splice(parties.length - 2, 0,
                     { nom: "xl/worksheets/sheet2.xml", contenu: feuilleSoc });
    }
    return new Blob([zipStored(parties)], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    });
  }

  function nomClasseur(x) {
    return ("CMPC_" + x.objet + "_" + params.country + "_" + params.year + ".xlsx")
      .replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "_");
  }

  // La question ne se pose que s'il y a une feuille à joindre : sous le
  // référentiel Damodaran, ou sur un cadrage sans comparable, il n'y a rien à
  // inclure et poser la question ferait choisir entre une réponse et rien.
  function exportProposable() {
    const x = chiffresClasseur();
    return Boolean(x && lignesSocietes(x));
  }

  function ouvrirExport() {
    if (!exportProposable()) {
      telechargerClasseur(false);
      return;
    }
    $("exportFond").hidden = false;
    $("exportOui").focus();
  }

  function fermerExport() {
    $("exportFond").hidden = true;
    $("telecharger").focus();
  }

  function telechargerClasseur(avecSocietes) {
    const x = chiffresClasseur();
    if (!x) return;
    const url = URL.createObjectURL(classeurXlsx(x, avecSocietes));
    const lien = document.createElement("a");
    lien.href = url;
    lien.download = nomClasseur(x);
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    // Révoquée au tour suivant : libérer l'URL dans la même pile d'exécution
    // annule le téléchargement sur certains navigateurs.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Sans taux publié ni gearing, il n'y a pas de CMPC : le bouton le dit plutôt
  // que de livrer un classeur à trous.
  function majBoutonClasseur() {
    const bouton = $("telecharger");
    const possible = Boolean(chiffresClasseur());
    bouton.disabled = !possible;
    bouton.title = possible
      ? "Télécharger le calcul au format Excel"
      : "Le CMPC n'est pas calculable avec ces paramètres";
    // Un changement de cadrage sous la boîte ouverte la laisserait poser une
    // question sur un calcul qui n'existe plus.
    if (!possible) $("exportFond").hidden = true;
  }

  $("telecharger").addEventListener("click", ouvrirExport);
  $("exportOui").addEventListener("click", () => { fermerExport(); telechargerClasseur(true); });
  $("exportNon").addEventListener("click", () => { fermerExport(); telechargerClasseur(false); });
  $("exportAnnuler").addEventListener("click", fermerExport);

  // Le fond ferme, la boîte non : sans cette coupure, tout clic sur un bouton
  // remonterait au fond et annulerait l'export qu'on vient de demander.
  $("exportFond").addEventListener("click", (e) => {
    if (e.target === $("exportFond")) fermerExport();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("exportFond").hidden) fermerExport();
  });

  /* ================= Paramètres et URL ================= */
  function setParam(key, value) {
    if (key === "year") {
      value = Number(value);
    } else if (key === "continent") {
      // Le pays n'est pas touché : il désigne l'émetteur valorisé, que le
      // continent des comparables ne concerne pas. S'il sort de la liste
      // filtrée, champPays() l'y maintient dans son propre groupe.
      params.continent = value;
      params.zone = null;          // la zone appartenait au continent précédent
      apply();
      return;
    } else if (key === "zone") {
      // Recliquer la zone déjà retenue la désélectionne : c'est le seul moyen de
      // revenir au continent entier sans passer par le menu. Le pays n'est pas
      // recalé : il désigne l'émetteur valorisé, pas le périmètre de l'échantillon.
      params.zone = params.zone === value ? null : value;
      apply();
      return;
    } else if (key === "secteur") {
      // Même tolérance que pour l'URL : accents et casse approximatifs acceptés,
      // et on conserve la valeur précédente plutôt qu'un libellé inconnu.
      const connus = ((DATA.comparables || {}).industries || []).map((i) => i.nom);
      value = resolveOption(value, connus) || params.secteur;
    } else if (key === "gearing_cible") {
      // La saisie brute est conservée telle quelle : c'est elle qu'il faut
      // réafficher pour que l'utilisateur voie ce qui a été refusé.
      const verdict = valideGearingCible(value);
      params.gearing_saisie = String(value == null ? "" : value);
      params.gearing_cible = verdict.valeur;
      params.gearing_erreur = verdict.erreur;
      apply();
      return;
    }
    params[key] = value;
    apply();
  }

  function bumpParam(key, dir) {
    params[key] = Math.max(0, Math.round((params[key] + dir * STEPS[key]) * 1000) / 1000);
    apply();
  }

  function apply() {
    model = computeModel(params);
    renderAll();
    // L'URL porte la configuration : un lien copié rouvre le même calcul. Le
    // texte en cours de saisie et son message d'erreur n'en font pas partie :
    // ce sont des états d'écran, pas des hypothèses de calcul.
    try {
      if (window.history.replaceState) {
        const partage = Object.assign({}, params);
        delete partage.gearing_saisie;
        delete partage.gearing_erreur;
        window.history.replaceState(null, "", "?" + new URLSearchParams(partage));
      }
    } catch (err) { /* page ouverte en fichier local : sans effet */ }
  }

  // Une URL saisie à la main peut perdre les accents ou la casse ("Cote d'Ivoire"
  // pour "Côte d'Ivoire") : on retrouve l'entrée exacte plutôt que de retomber
  // silencieusement sur les valeurs par défaut.
  function normalize(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  }

  function resolveOption(value, options) {
    if (options.includes(value)) return value;
    const target = normalize(value);
    return options.find((o) => normalize(o) === target) || null;
  }

  function readUrlParams() {
    let query;
    try { query = new URLSearchParams(window.location.search); } catch (err) { return; }
    if (query.has("maturity") && DATA.options.maturities.includes(query.get("maturity"))) {
      params.maturity = query.get("maturity");
    }
    // « brvm » et « industrie_brvm » sont les anciens noms, restés dans les
    // liens déjà partagés : on les accepte encore, sans les produire.
    const demande = query.get("referentiel");
    if (["damodaran", "comparables", "brvm"].includes(demande)) {
      params.referentiel = demande === "brvm" ? "comparables" : demande;
    }
    const secteurs = ((DATA.comparables || {}).industries || []).map((i) => i.nom);
    for (const cle of ["secteur", "industrie_brvm"]) {
      if (query.has(cle)) {
        const trouvee = resolveOption(query.get(cle), secteurs);
        if (trouvee) params.secteur = trouvee;
      }
    }
    for (const [key, list] of [["country", DATA.options.countries], ["industry", DATA.options.industries]]) {
      if (query.has(key)) {
        const found = resolveOption(query.get(key), list);
        if (found) params[key] = found;
      }
    }
    if (query.has("year")) {
      const year = Number(query.get("year"));
      if (DATA.options.years.includes(year)) params.year = year;
    }
    for (const key of ["d", "e", "inflation_ref", "inflation_local"]) {
      if (query.has(key)) {
        const value = Number(query.get(key));
        if (Number.isFinite(value)) params[key] = value;
      }
    }
  }

  function renderAll() {
    $("fiscal").textContent = model.fiscalYear;
    majBoutonClasseur();
    renderParams();

    // On mémorise la carte dépliée pour la rouvrir après redessin, si elle existe encore.
    const ouverts = { cmpc: PANNEAUX.cmpc.ouvert, soc: PANNEAUX.soc.ouvert };
    PANNEAUX.cmpc.ouvert = null;
    PANNEAUX.soc.ouvert = null;

    chargerCmpc();
    chargerSocietes();

    for (const cle of ["cmpc", "soc"]) {
      const garde = ouverts[cle];
      if (garde && PANNEAUX[cle].items.some((c) => c.id === garde)) toggle(cle, garde);
    }
    renderTabs();
  }

  readUrlParams();
  model = computeModel(params);
  renderTabs();
  renderAll();
</script>
</body>
</html>

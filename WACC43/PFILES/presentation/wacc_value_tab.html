          { label: "Prime de risque pays", value: "incluse dans le taux souverain" },
        ].concat(lignesBeta).concat([
          { label: "Prime de risque marché", value: frPct(cc.prime) },
          { label: "Prime de taille (d)", value: frPct(cc.d) },
          { label: "Prime spécifique (e)", value: frPct(cc.e) },
          { label: "Coût des fonds propres", value: frPct(cc.ke), strong: true },
        ]),
        methodology: "MEDAF sur taux souverain local : taux sans risque + bêta (3 ans) du secteur x prime de marché + prime de taille + prime spécifique.",
        source: "Bêtas à trois ans médians sur " + cc.retenues + " société(s) du secteur" +
          (cc.retenues < cc.societes ? ", les plus grosses capitalisations de " + cc.perimetre +
           " qui en compte " + cc.societes : " sur " + cc.perimetre) +
          ", taux souverain UMOA-Titres, prime de marché mature Damodaran.",
        hypothesis: (cc.relevable && cc.gearingSaisi
            ? "Le bêta médian est endetté au levier de l'échantillon : il est désendetté à ce levier puis ré-endetté au gearing cible (Hamada), sinon la structure changerait sans que le risque suive. "
            : "Le bêta est employé tel quel : la structure retenue est celle de l'échantillon dont il provient, le ré-endettement serait sans effet. ") +
          "Le taux souverain porte déjà le risque pays, aucune prime pays ne s'y ajoute. Attention : les bêtas africains publiés sont très faibles — médiane 0,05 à trois ans, souvent proches de zéro faute de liquidité — ce qui écrase mécaniquement le coût des fonds propres vers le taux sans risque.",
        retained: "Bêta (3 ans) " + frNum(cc.beta, 3) + (cc.beta1 == null ? "" : ", horizon 1 an publié à " + frNum(cc.beta1, 3) + " mais non utilisé") + ", taux sans risque " + frPct(cc.rf.taux) + ", prime de marché " + frPct(cc.prime) + ".",
        formula: (cc.relevable && cc.gearingSaisi
          ? ["Bêta désendetté = " + frNum(cc.betaL, 3) + " / (1 + (1 - " + frPct(cc.tax, 1) + ") x " + frNum(cc.gearingSecteur, 2) + ") = " + frNum(cc.betaU, 3),
             "Bêta ré-endetté = " + frNum(cc.betaU, 3) + " x (1 + (1 - " + frPct(cc.tax, 1) + ") x " + frNum(cc.gearing, 2) + ") = " + frNum(cc.beta, 3)]
          : []).concat([
            "Ke = a + b x c + d + e",
            "= " + frPct(cc.rf.taux) + " + " + frNum(cc.beta, 3) + " x " + frPct(cc.prime) +
            " + " + frPct(cc.d) + " + " + frPct(cc.e) + " = " + frPct(cc.ke),
          ]),
      },
      {
        id: "kd", title: "Coût de la dette après IS", symbol: "Kd", value: frPct(cc.kd), tone: "green",
        rows: [
          { label: "Taux souverain " + cc.rf.libelle, value: frPct(cc.rf.taux) },
          { label: "Spread de financement", value: "non publié, nul par hypothèse" },
          { label: "Coût de la dette avant IS", value: frPct(cc.rf.taux), strong: true },
          { label: "Taux d'IS", value: frPct(cc.tax, 1) },
          { label: "Économie d'impôt", value: frPts(cc.rf.taux * cc.tax) },
          { label: "Coût de la dette après IS", value: frPct(cc.kd), strong: true },
        ],
        methodology: "Taux souverain diminué de l'économie d'impôt.",
        source: "Courbe souveraine UMOA-Titres, taux d'IS de droit commun Damodaran (" + params.country + ").",
        hypothesis: "Aucun spread de financement n'est publié pour ce référentiel : la dette est supposée levée au taux souverain. L'hypothèse est neutre, et probablement optimiste pour un émetteur privé.",
        retained: "Taux souverain " + frPct(cc.rf.taux) + ", IS " + frPct(cc.tax, 1) + ".",
        formula: ["Kd = " + frPct(cc.rf.taux) + " x (1 - " + frPct(cc.tax, 1) + ") = " + frPct(cc.kd)],
      },
      {
        id: "poids", title: "Structure financière", symbol: "FP / D",
        value: frPct(cc.we, 0) + " / " + frPct(cc.wd, 0),
        rows: [
          { label: "Gearing observé du secteur (D/E)", value: cc.gearingSecteur == null ? "non publié" : frNum(cc.gearingSecteur, 2) },
        ].concat(cc.gearingSaisi
          ? [{ label: "Gearing cible saisi (D/V)", value: frPct(cc.gearingCible / 100, 0) }]
          : []).concat([
            { label: "Gearing retenu (D/E)", value: frNum(cc.gearing, 2), strong: true },
            { label: "Poids des fonds propres, E/V", value: frPct(cc.we) },
            { label: "Poids de la dette, D/V", value: frPct(cc.wd) },
          ]),
        composition: {
          equity: frPct(cc.we, 0), debt: frPct(cc.wd, 0),
          equityPct: (cc.we * 100).toFixed(1), debtPct: (cc.wd * 100).toFixed(1),
        },
        methodology: "Déduite du gearing : fonds propres / valeur = 1 / (1 + D/E).",
        source: cc.gearingSaisi
          ? "Gearing cible saisi à la main, cadenas de l'encadré « Secteur comparable » ouvert."
          : "Médiane des rapports dette / capitalisation du secteur, sur les sociétés complètes de l'univers de comparables.",
        hypothesis: cc.gearingSaisi
          ? "Le gearing cible remplace la médiane du secteur, et sert aussi à ré-endetter le bêta."
          : "Médiane et non moyenne : sur des marchés où quelques capitalisations écrasent la distribution, une moyenne dit surtout ce que fait la plus grosse valeur du secteur.",
        retained: "Gearing D/E = " + frNum(cc.gearing, 2) + ".",
        formula: ["E/V = 1 / (1 + D/E) = 1 / " + frNum(1 + cc.gearing, 2) + " = " + frPct(cc.we),
                  "D/V = 1 - E/V = " + frPct(cc.wd)],
      },
      {
        id: "wacc", title: "CMPC", symbol: "CMPC", value: frPct(cc.wacc), final: true,
        rows: [
          { label: "Fonds propres " + frPct(cc.ke) + " x " + frPct(cc.we, 0), value: frPts(contribFp) },
          { label: "Dette " + frPct(cc.kd) + " x " + frPct(cc.wd, 0), value: frPts(contribDette) },
          { label: "CMPC", value: frPct(cc.wacc), strong: true },
        ],
        methodology: "Moyenne du coût des fonds propres et du coût de la dette, pondérée par la structure financière.",
        source: "Composantes ci-dessus.",
        hypothesis: "Exprimé en monnaie locale : le taux souverain qui l'alimente l'est déjà, aucune conversion d'inflation n'est appliquée.",
        retained: "CMPC = " + frPct(cc.wacc) + ".",
        formula: ["CMPC = E/V x Ke + D/V x Kd",
                  "= " + frPct(cc.we, 0) + " x " + frPct(cc.ke) + " + " + frPct(cc.wd, 0) +
                  " x " + frPct(cc.kd) + " = " + frPct(cc.wacc)],
      },
    ];
  }

  /* ---------- Bulles de résumé ---------- */
  // Deux bulles sur la ligne de titre : ce qui est cadré et combien de sociétés
  // s'y rattachent, puis les places d'où ces sociétés proviennent. Sans zone
  // retenue, le résumé porte sur le continent entier.
  function resumeCadrage() {
    if (params.continent === TOUS) return "";
    const p = perimetreCourant();
    const libelle = p.n ? p.n + " société" + (p.n > 1 ? "s" : "") : "aucune société";
    return '<span class="chip">' + esc(p.nom) + " · " + libelle + "</span>";
  }

  // Les places d'où proviennent les sociétés du périmètre, sur leur propre
  // ligne. Elles sont huit dès qu'on regarde les banques africaines, et bien
  // davantage à mesure que l'univers s'étend : repliées dans une bulle sur la
  // ligne de titre, elles la faisaient déborder. La ligne défile plutôt que de
  // s'allonger, et la barre n'apparaît que lorsqu'il y a de quoi défiler.
  function placesCadrage() {
    const p = perimetreCourant();
    if (!p.n || !p.places.length) return "";
    return '<div class="places-bloc">' +
      '<div class="places" id="placesPiste" tabindex="0" role="group" aria-label="Places de cotation du périmètre">' +
      p.places.map((m) => '<span class="place">' + esc(m) + "</span>").join("") +
      '</div>' +
      '<input type="range" class="places-slider" id="placesRail" min="0" max="100" step="0.1" value="0"' +
      ' aria-label="Faire défiler les places de cotation" hidden>' +
      "</div>";
  }

  // Le rail et la bande sont liés dans les deux sens : tirer la poignée fait
  // défiler, faire défiler ramène la poignée. Un rail qui ne suivrait pas le
  // défilement à la molette indiquerait une position fausse dès le premier geste.
  let ajusterPlaces = null;

  function brancherPlaces() {
    const piste = $("placesPiste");
    const rail = $("placesRail");
    ajusterPlaces = null;
    if (!piste || !rail) return;

    const amplitude = () => piste.scrollWidth - piste.clientWidth;
    const poser = (pct) => rail.style.setProperty("--_p", pct.toFixed(2) + "%");

    function ajuster() {
      const max = amplitude();
      // Sans débordement, le rail n'a rien à commander : on le retire plutôt
      // que d'offrir une poignée qui ne bouge pas.
      rail.hidden = max <= 1;
      if (rail.hidden) return;
      const pct = (piste.scrollLeft / max) * 100;
      rail.value = String(pct);
      poser(pct);
    }

    rail.addEventListener("input", () => {
      const pct = Number(rail.value);
      piste.scrollLeft = (pct / 100) * amplitude();
      poser(pct);
    });
    piste.addEventListener("scroll", ajuster, { passive: true });
    ajusterPlaces = ajuster;
    ajuster();
  }

  function stepperField(item) {
    return `
      <span class="field">
        <span style="display:grid;gap:2px">
          <span class="field-label">${esc(item.label)}</span>
          <span class="field-hint">${esc(item.hint)}</span>
        </span>
        <span class="stepper">
          <span class="stepper-value">${frPct(params[item.key])}</span>
          <span class="stepper-btns">
            <button type="button" data-step="${item.key}" data-dir="-1">−</button>
            <button type="button" data-step="${item.key}" data-dir="1">+</button>
          </span>
        </span>
      </span>`;
  }

  function blocDamodaran() {
    const chips = model.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("");
    return `
      <section class="card-block">
        <span class="block-head">
          <h2>Données de marché</h2>
          <span class="chips">${chips}</span>
        </span>
        <div class="tiles">
          ${model.market.map((m) => `
            <span class="tile">
              <span class="tile-label">${esc(m.label)}</span>
              <span class="tile-value">${esc(m.value)}</span>
            </span>`).join("")}
        </div>
        ${model.notes.length ? `<span class="note">${model.notes.map(esc).join(" · ")}</span>` : ""}
      </section>`;
  }

  function renderParams() {
    const referentiels = (DATA.comparables || {}).societes
      ? selectField("referentiel", "Référentiel",
                    [["damodaran", "Damodaran"], ["comparables", "Comparables"]])
      : "";

    // Sous référentiel Comparables, la maturité se choisit sur la courbe
    // souveraine de l'État retenu, dont la profondeur varie de 7 à 15 ans.
    const courbe = estComparables() ? courbePays() : null;
    const champMaturite = courbe
      ? selectField("maturite_uemoa", "Maturité sur la courbe souveraine", courbe.points.map((p) => p[0]))
      : selectField("maturity", "Maturité du taux sans risque", DATA.options.maturities);

    // L'industrie change de taxonomie selon le référentiel : les secteurs de
    // l'univers de comparables, ou les 94 d'un référentiel de marché.
    // Tous les secteurs de l'univers sont proposés, y compris ceux absents de
    // la zone retenue : les masquer priverait de la vue continentale, qui reste
    // calculable et que le panneau signale comme telle.
    const secteurs = ((DATA.comparables || {}).industries || []).map((i) => i.nom);
    const champIndustrie = estComparables()
      ? selectField("secteur", "Industrie", secteurs)
      : selectField("industry", "Industrie", DATA.options.industries);

    $("paramsMain").innerHTML = `
      <section class="card-block">
        <h2>Contexte de marché</h2>
        <div class="grid-2">
          ${selectField("year", "Année de valorisation", DATA.options.years)}
          ${champMaturite}
          ${referentiels}
          ${selectField("continent", "Continent", [TOUS].concat(continents()))}
        </div>
      </section>

      <section class="card-block">
        <span class="block-head">
          <h2>Cadrage</h2>
          <span class="chips">${resumeCadrage()}</span>
        </span>
        ${placesCadrage()}
        <div class="geo">
          <div class="geo-carte">${carteHtml()}</div>
          <div class="geo-choix">
            ${champIndustrie}
            ${champPays("Pays de valorisation")}
          </div>
        </div>
      </section>

      ${estComparables() ? "" : blocDamodaran()}

      <section class="card-block">
        <h2>Paramètres manuels</h2>
        <div class="grid-2">${MANUAL.map(stepperField).join("")}</div>
      </section>`;

    // Le cadre Cadrage est rendu sous les deux référentiels : le rail se
    // rebranche ici, avant l'embranchement, sur les éléments qui viennent
    // d'être recréés.
    brancherPlaces();

    if (estComparables()) {
      // Le panneau décrit l'échantillon qui alimente le calcul, et à quelle
      // échelle il a été pris. Afficher un bêta issu d'une population et un
      // effectif issu d'une autre donnait un encadré cohérent en apparence et
      // faux ligne à ligne.
      const secteur = statsSecteur(params.secteur);
      const rf = tauxSansRisque();
      const dateCourbe = COURBES ? (COURBES.date || "") : "";
      const cc = cmpcComparables();
      const gSect = gearingSectoriel(params.secteur);
      const ouvert = !params.gearing_verrou;
      $("paramsResult").innerHTML = `
        <span class="result-head">
          <h2>Secteur comparable</h2>
          <button type="button" class="verrou${ouvert ? " is-open" : ""}" id="verrouGearing"
                  aria-pressed="${ouvert ? "true" : "false"}"
                  title="${ouvert ? "Revenir au gearing observé du secteur" : "Saisir un gearing cible"}">
            ${ouvert ? CADENAS.ouvert : CADENAS.ferme}<span>${ouvert ? "Cible" : "Observé"}</span>
          </button>
        </span>
        <span class="result-hero">
          <span class="field-label">CMPC calculé</span>
          <span class="result-hero-row">
            <span class="result-hero-value"${cc ? "" : ' style="color:var(--muted-2)"'}>${cc ? frPct(cc.wacc) : "—"}</span>
          </span>
        </span>
        <span class="result-rows">
          <span class="result-row"><span>Sociétés du secteur${secteur ? ", " + esc(secteur.perimetre) : ""}</span><span>${secteur ? secteur.societes : 0}</span></span>
          ${(() => { const e = ecartDeMarche(); return e ? `
            <span class="result-row is-appoint">
              <span>Comparables pris ${esc(e.comparables)}, pour un émetteur
                ${esc(e.emetteur)} : le bêta ne vient pas du marché de la société
                valorisée.</span>
            </span>` : ""; })()}
          ${secteur && secteur.repli ? `
            <span class="result-row is-appoint">
              <span>${esc(secteur.demande)} ne compte ${secteur.demandeN
                ? secteur.demandeN + " société" + (secteur.demandeN > 1 ? "s" : "")
                : "aucune société"} dans ce secteur, sous le seuil de ${SEUIL} :
                médiane reprise sur ${esc(secteur.perimetre)}.</span>
            </span>` : ""}
          ${secteur && secteur.retenues < secteur.societes ? `
            <span class="result-row is-appoint">
              <span>Médianes calculées sur les ${secteur.retenues} plus grosses
                capitalisations : au-delà, ce sont les micro-capitalisations
                illiquides qui décident.</span>
            </span>` : ""}
          <span class="result-row"><span>Bêta médian (3 ans)</span><span>${secteur && secteur.beta_3ans != null ? frNum(secteur.beta_3ans, 3) : "—"}</span></span>
          <span class="result-row"><span>Capitalisation cumulée</span><span>${esc(frMontant(secteur ? secteur.capitalisation : null))}</span></span>
          <span class="result-row"><span>Taux sans risque ${rf ? esc(rf.libelle) : ""}</span><span>${rf ? frPct(rf.taux) : "indisponible"}</span></span>
          <span class="result-row"><span>Gearing sectoriel (D/E)</span><span>${gSect == null ? "non publié" : frNum(gSect, 2)}</span></span>
          ${ouvert ? `
            <span class="result-row">
              <span>Gearing cible (D/V)</span>
              <span class="cible-champ">
                <input class="mini-input${params.gearing_erreur ? " is-invalide" : ""}" type="number"
                       step="1" min="0" max="100" inputmode="decimal"
                       data-num="gearing_cible" id="champGearingCible"
                       aria-label="Gearing cible, poids de la dette en pourcentage"
                       aria-invalid="${params.gearing_erreur ? "true" : "false"}"
                       placeholder="${gSect == null ? "—" : frNum(gSect / (1 + gSect) * 100, 0)}"
                       value="${esc(params.gearing_saisie)}">
                <span class="cible-unite">%</span>
              </span>
            </span>
            ${params.gearing_erreur
              ? `<span class="result-row is-erreur" id="erreurGearing"><span>${esc(params.gearing_erreur)}</span></span>`
              : (params.gearing_cible != null
                  ? `<span class="result-row is-appoint"><span>Équivalent D/E</span><span>${frNum(gearingCibleDE(), 2)}</span></span>`
                  : `<span class="result-row is-appoint"><span>Champ vide</span><span>médiane du secteur retenue</span></span>`)}` : ""}
          ${cc ? `
            <span class="result-row"><span>Coût des fonds propres</span><span>${frPct(cc.ke)}</span></span>
            <span class="result-row"><span>Coût de la dette après IS</span><span>${frPct(cc.kd)}</span></span>
            <span class="result-row"><span>Fonds propres / dette</span><span>${frPct(cc.we, 0)} / ${frPct(cc.wd, 0)}</span></span>` : ""}
        </span>
        <button type="button" class="cta" id="goSoc">Voir les sociétés</button>
        <span class="note">${rf
          ? `Taux souverain ${esc(rf.pays)} au ${esc(dateCourbe)}, publié par UMOA-Titres. Il porte déjà le risque pays : aucune prime ne s'y ajoute, et le coût du capital qui en découle est directement en monnaie locale.`
          : "Courbe souveraine indisponible pour ce pays."} Le bêta retenu est la médiane des bêtas cotés à trois ans du secteur${secteur ? ", sur " + esc(secteur.perimetre) : ""}.${cc && cc.gearingSaisi
          ? ` Il est désendetté au gearing observé du secteur puis ré-endetté au gearing cible, sans quoi la structure changerait sans que le risque suive.`
          : ` Il est employé tel quel : la structure retenue est celle de l'échantillon dont il provient, le ré-endettement serait sans effet.`}${cc
          ? ` La dette est supposée levée au taux souverain, faute de spread publié pour ce référentiel — hypothèse neutre, et probablement optimiste pour un émetteur privé.`
          : " Le gearing du secteur n'est pas publié : ouvrez le cadenas pour poser une cible et obtenir le CMPC."}</span>`;
      $("goSoc").addEventListener("click", () => { tab = "societes"; renderTabs(); });
      $("verrouGearing").addEventListener("click", basculerVerrou);
      brancherChamps();
      brancherNombres($("paramsResult"));
      // Le panneau est redessiné à chaque validation : sans cela le curseur
      // quitterait le champ juste après une saisie refusée, et il faudrait y
      // revenir à la souris pour corriger.
      if (ouvert && params.gearing_erreur) {
        const champ = $("champGearingCible");
        champ.focus();
        champ.select();
      }
      return;
    }

    const r = model.result;
    $("paramsResult").innerHTML = `
      <h2>Résultat</h2>
      <span class="result-hero">
        <span class="field-label">CMPC calculé</span>
        <span class="result-hero-row">
          <span class="result-hero-value">${esc(r.wacc)}</span>
        </span>
      </span>
      <span class="result-rows">
        <span class="result-row"><span>Ke, capitaux propres</span><span>${esc(r.ke)}</span></span>
        <span class="result-row"><span>Kd, dette après impôt</span><span>${esc(r.kd)}</span></span>
        <span class="result-row is-blue"><span>CMPC monnaie locale</span><span>${esc(r.local)}</span></span>
      </span>
      <span class="structure">
        <span class="structure-head"><span>Structure cible</span><span>${esc(r.structure)}</span></span>
        <span class="bar">
          <span class="eq" style="width:${r.equityPct}%"></span>
          <span class="dt" style="width:${r.debtPct}%"></span>
        </span>
      </span>
      <button type="button" class="cta" id="goWacc">Voir le détail du CMPC</button>
      <span class="note">Le CMPC est recalculé à chaque modification. Le taux sans risque, la prime de risque marché et le bêta proviennent de la base de marché.</span>`;

    $("goWacc").addEventListener("click", () => { tab = "wacc"; renderTabs(); });
    brancherChamps();
  }

  function brancherChamps() {
    $("paramsMain").querySelectorAll("select[data-param]").forEach((sel) => {
      sel.addEventListener("change", () => setParam(sel.dataset.param, sel.value));
    });
    $("paramsMain").querySelectorAll("[data-zone]").forEach((el) => {
      el.addEventListener("click", () => setParam("zone", el.dataset.zone));
    });
  }

  // Champs numériques libres. On écoute « change » et non « input » : réagir à
  // chaque frappe redessinerait le panneau et ferait perdre le focus au champ.
  function brancherNombres(racine) {
    racine.querySelectorAll("input[data-num]").forEach((champ) => {
      champ.addEventListener("change", () => setParam(champ.dataset.num, champ.value));
    });
    $("paramsMain").querySelectorAll("button[data-step]").forEach((btn) => {
      btn.addEventListener("click", () => bumpParam(btn.dataset.step, Number(btn.dataset.dir)));
    });
  }

  /* ================= Colonnes de cartes (CMPC et Sociétés) ================= */
  function renderStack(cle) {
    const pan = PANNEAUX[cle];
    $(pan.stack).innerHTML = pan.items.map((c) => `
      <div class="comp${c.tone && c.tone !== "accent" ? " tone-" + c.tone : ""}${c.final ? " is-final" : ""}" data-comp="${esc(c.id)}">
        <button type="button" class="comp-head" aria-expanded="false">
          <span class="comp-title">${c.titleHtml || esc(c.title)}</span>
          <span class="comp-value">${esc(c.value)}</span>
        </button>
        <div class="comp-wrap"><div class="comp-clip"><div class="comp-body">
          <span class="sub-rows">
            ${(c.rows || []).map((r) => `
              <span class="sub-row${r.strong ? " is-strong" : ""}">
                <span>${esc(r.label)}</span><span>${esc(r.value)}</span>
              </span>`).join("")}
          </span>
        </div></div></div>
      </div>`).join("");

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      el.querySelector(".comp-head").addEventListener("click", () => toggle(cle, el.dataset.comp));
    });
  }

  function renderFrame(cle) {
    const pan = PANNEAUX[cle];
    const attente = `
      <div class="detail-vide${pan.ouvert ? " is-cache" : ""}" data-vide="1">
        <span class="titre">${esc(pan.vide.titre)}</span>
        <span class="texte">${esc(pan.vide.texte)}</span>
      </div>`;
    $(pan.frame).innerHTML = attente + pan.items.map((c) => `
      <div class="detail${c.tone && c.tone !== "accent" ? " tone-" + c.tone : ""}" data-detail="${esc(c.id)}">
        ${pan.detail(c)}
      </div>`).join("");
  }

  function toggle(cle, id) {
    const pan = PANNEAUX[cle];
    pan.ouvert = pan.ouvert === id ? null : id;
    const item = pan.items.find((c) => c.id === pan.ouvert);
    const tone = item && item.tone && item.tone !== "accent" ? item.tone : null;

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      const on = el.dataset.comp === pan.ouvert;
      el.classList.toggle("is-open", on);
      el.querySelector(".comp-head").setAttribute("aria-expanded", on ? "true" : "false");
    });
    $(pan.frame).querySelectorAll(".detail").forEach((el) => {
      el.classList.toggle("is-shown", el.dataset.detail === pan.ouvert);
    });
    const attente = $(pan.frame).querySelector(".detail-vide");
    if (attente) attente.classList.toggle("is-cache", Boolean(pan.ouvert));

    const col = $(pan.col);
    col.classList.toggle("is-on", Boolean(pan.ouvert));
    col.classList.remove("tone-green", "tone-blue");
    if (tone) col.classList.add("tone-" + tone);

    placeArrow(cle);
    setTimeout(() => placeArrow(cle), 200);
    setTimeout(() => placeArrow(cle), 460);
  }

  function placeArrow(cle) {
    const pan = PANNEAUX[cle];
    if (!pan.ouvert) return;
    const col = $(pan.col);
    const head = $(pan.stack).querySelector('.comp[data-comp="' + CSS.escape(pan.ouvert) + '"] .comp-head');
    if (!head) return;
    const cr = col.getBoundingClientRect();
    const hr = head.getBoundingClientRect();
    const max = Math.max(40, cr.height - 30);
    const y = hr.top + hr.height / 2 - cr.top - 6;
    $(pan.arrow).style.top = Math.round(Math.min(max, Math.max(16, y))) + "px";
  }

  function placeArrows() {
    Object.keys(PANNEAUX).forEach(placeArrow);
  }

  // Une seule paire d'écouteurs, posée ici : les rebrancher à chaque rendu du
  // panneau les accumulerait, un par changement de paramètre.
  // Les largeurs des pastilles changent quand la police de caractères arrive :
  // mesurer avant son chargement donnerait un débordement qui n'existe plus après.
  function reajuster() {
    placeArrows();
    if (ajusterPlaces) ajusterPlaces();
  }
  window.addEventListener("resize", reajuster);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reajuster);

  /* ---- Détail d'une composante du CMPC ---- */
  function detailComposante(c) {
    const compo = c.composition ? `
      <span class="composition">
        <span class="bar">
          <span class="eq" style="width:${c.composition.equityPct}%"></span>
          <span class="dt" style="width:${c.composition.debtPct}%"></span>
        </span>
        <span class="composition-legend">
          <span>Fonds propres ${esc(c.composition.equity)}</span>
          <span>Dette ${esc(c.composition.debt)}</span>
        </span>
      </span>` : "";
    const rows = [
      ["Méthodologie", c.methodology],
      ["Source", c.source],
      ["Hypothèse", c.hypothesis],
      ["Retenu", c.retained]
    ].filter(([, t]) => Boolean(t));
    return `
      <span class="detail-head">
        <span class="detail-title">${esc(c.title)}</span>
        <span class="detail-symbol">${esc(c.symbol)}</span>
      </span>
      ${compo}
      <span class="detail-grid">
        ${rows.map(([l, t]) => `<span class="detail-label">${esc(l)}</span><span class="detail-text">${esc(t)}</span>`).join("")}
      </span>
      ${c.formula && c.formula.length ? `<code>${c.formula.map(esc).join("<br>")}</code>` : ""}`;
  }

  /* ---- Détail d'une société cotée ---- */
  function detailSociete(c) {
    const s = c.societe;
    const annees = s.annees || [];
    const postes = [
      ["Chiffre d'affaires", s.ca],
      ["EBITDA", s.ebitda],
      ["Résultat net", s.rn]
    ];
    const lignes = postes.map(([libelle, serie]) => `
      <tr>
        <td>${esc(libelle)}</td>
        ${annees.map((a) => `<td>${esc(frMontant((serie || {})[String(a)]))}</td>`).join("")}
      </tr>`).join("");

    // L'activité tient dans la grille d'en-tête — l'industrie fine de S&P — et
    // les comptes dans leur propre bulle. La description en prose n'est plus
    // embarquée : elle pesait à elle seule les deux tiers du jeu de données.
    return `
      <span class="detail-head">
        <span class="detail-title">${esc(s.nom)}</span>
        <span class="detail-symbol">${esc(s.ticker || c.id)}</span>
      </span>
      <span class="detail-grid">
        <span class="detail-label">Pays</span><span class="detail-text">${esc(s.pays)}${s.zone ? " — " + esc(s.zone) : ""}</span>
        <span class="detail-label">Place</span><span class="detail-text">${esc(s.place || "hors cote")}</span>
        <span class="detail-label">Activité</span><span class="detail-text">${esc(s.activite || s.industrie)}</span>
        <span class="detail-label">Capitalisation</span><span class="detail-text">${esc(frMontant(s.capitalisation))} FCFA</span>
        <span class="detail-label">Dette totale</span><span class="detail-text">${esc(frMontant(s.dette))} FCFA</span>
        <span class="detail-label">Bêta (3 ans)</span><span class="detail-text">${s.beta_3ans == null ? "non publié" : frNum(s.beta_3ans, 3)}${s.beta_1an == null ? "" : ", horizon 1 an : " + frNum(s.beta_1an, 3)}. Le CMPC retient la médiane du secteur, pas ce bêta.</span>
      </span>
      <span class="bulle">
        <span class="bulle-titre">Données financières</span>
        <table class="fin-table">
          <thead><tr><th>En millions FCFA</th>${annees.map((a) => `<th>${a}</th>`).join("")}</tr></thead>
          <tbody>${lignes}</tbody>
        </table>
      </span>`;
  }

  /* ---- Alimentation des deux colonnes ---- */
  function chargerCmpc() {
    const pan = PANNEAUX.cmpc;
    pan.detail = detailComposante;
    const cc = estComparables() ? cmpcComparables() : null;
    pan.items = estComparables() ? (cc ? composantesComparables(cc) : []) : model.components;
    if (estComparables() && !cc) {
      $(pan.stack).innerHTML = `
        <div class="notice">
          <h3>Gearing sectoriel à renseigner</h3>
          <p>Aucun gearing n'est disponible pour ce secteur : sans lui, la répartition entre
          fonds propres et dette est inconnue et le CMPC ne peut pas être calculé. Ouvrez le
          cadenas de l'encadré « Secteur comparable », dans l'onglet Paramètres, pour poser
          un gearing cible.</p>
          <p>Les bêtas cotés, les capitalisations et les états financiers des sociétés du
          secteur restent consultables dans l'onglet Sociétés.</p>
        </div>`;
      $(pan.frame).innerHTML = "";
      $(pan.col).classList.remove("is-on");
      pan.ouvert = null;
      return;
    }
    renderStack("cmpc");
    renderFrame("cmpc");
  }

  // Marge d'EBITDA du dernier exercice où les deux postes sont renseignés.
  // Les banques ne publient pas d'EBITDA : la ligne le dit plutôt que d'afficher 0.
  function margeEbitda(s) {
    for (const annee of (s.annees || []).slice().reverse()) {
      const ebitda = (s.ebitda || {})[String(annee)];
      const ca = (s.ca || {})[String(annee)];
      if (ebitda != null && ca) {
        return { label: `Marge d'EBITDA ${annee}`, value: frPct(ebitda / ca, 1) };
      }
    }
    return { label: "Marge d'EBITDA", value: "non publiée" };
  }

  // Petite vignette de l'état vide : un ordinateur qui ne comprend pas la
  // question. Tracé à la main plutôt qu'importé — la page n'appelle aucun
  // serveur, une illustration distante la rendrait dépendante du réseau.
  const ORDI_PERPLEXE = `
    <svg class="vide404-img" viewBox="0 0 168 136" fill="none" aria-hidden="true">
      <rect x="21" y="11" width="104" height="72" rx="9" class="v4-corps"/>
      <circle cx="55" cy="43" r="4.2" class="v4-plein"/>
      <circle cx="91" cy="43" r="4.2" class="v4-plein"/>
      <path d="M46 30c4-3.4 9.6-3.4 13.2-.4" class="v4-trait"/>
      <path d="M57 63c3.9-4.4 7.8-4.4 11.7 0s7.8 4.4 11.7 0" class="v4-trait"/>
      <path d="M73 83v14M58 99h30" class="v4-trait"/>
      <g transform="rotate(-9 132 30)">
        <rect x="112" y="16" width="41" height="27" rx="8" class="v4-etiquette"/>
        <text x="132.5" y="34" text-anchor="middle" class="v4-etiquette-texte">404</text>
      </g>
      <g class="v4-boulon">
        <path d="M36 110l5.2 3v6l-5.2 3-5.2-3v-6z"/>
        <circle cx="36" cy="116" r="2.2"/>
        <circle cx="59" cy="124" r="3.6"/>
        <circle cx="59" cy="124" r="1.4"/>
        <g transform="rotate(-14 90 112)">
          <circle cx="90" cy="112" r="4"/>
          <path d="M87.9 112h4.2M94 112h13"/>
        </g>
        <path d="M124 116l4.3 2.5v5l-4.3 2.5-4.3-2.5v-5z"/>
        <circle cx="124" cy="121" r="1.8"/>
        <circle cx="143" cy="111" r="2.4"/>
      </g>
    </svg>`;

  function etatVideSocietes() {
    const ou = params.zone
      || (params.continent === TOUS ? "l'ensemble du monde" : params.continent);
    const secteur = params.secteur || "ce secteur";
    return `
      <div class="vide404" data-vide-soc="1">
        ${ORDI_PERPLEXE}
        <span class="vide404-code">Oups, erreur 404</span>
        <span class="vide404-titre">Aucune société trouvée dans cette zone</span>
        <span class="vide404-texte">Rien en « ${esc(secteur)} » du côté de ${esc(ou)}.
        Changez d'industrie, ou élargissez la zone géographique.</span>
      </div>`;
  }

  function chargerSocietes() {
    const pan = PANNEAUX.soc;
    pan.detail = detailSociete;
    const ids = societesDuPerimetre();
    pan.items = ids.map((id) => {
      const s = COMPARABLES[id];
      const derniere = (s.annees || []).slice(-1)[0];
      const val = (serie) => frMontant((serie || {})[String(derniere)]);
      const gearing = s.capitalisation ? s.dette / s.capitalisation : null;
      return {
        id: id,
        title: s.nom,
        value: frMontant(s.capitalisation),
        societe: s,
        rows: [
          { label: "Pays", value: s.pays },
          { label: "Place", value: s.place || "hors cote" },
          { label: "Bêta (3 ans)", value: s.beta_3ans == null ? "non publié" : frNum(s.beta_3ans, 3) },
          { label: `Chiffre d'affaires ${derniere || ""}`.trim(), value: val(s.ca), strong: true },
          margeEbitda(s),
          { label: `Résultat net ${derniere || ""}`.trim(), value: val(s.rn) },
          { label: "Dette / capitalisation", value: gearing == null ? "—" : frNum(gearing, 2) }
        ]
      };
    });

    // L'onglet se réécrit dans tous les cas, résultats ou non. Le laisser sur
    // son contenu précédent était le défaut : rien ne distinguait « pas de
    // société ici » de « la page n'a pas suivi ».
    if (!pan.items.length) {
      pan.ouvert = null;
      $(pan.stack).innerHTML = etatVideSocietes();
      $(pan.frame).innerHTML = "";
      $(pan.col).classList.remove("is-on", "tone-green", "tone-blue");
      return;
    }
    renderStack("soc");
    renderFrame("soc");
  }

  /* ================= Paramètres et URL ================= */
  // Après un changement de continent ou de zone, le pays retenu peut être sorti
  // de la liste visible. On le remplace par le premier de la nouvelle liste.
  function recalerPays() {
    const visibles = paysVisibles();
    if (visibles.length && !visibles.includes(params.country)) params.country = visibles[0];
  }

  function setParam(key, value) {
    if (key === "year") {
      value = Number(value);
    } else if (key === "continent") {
      // Changer de continent ne doit jamais laisser un pays sélectionné hors de
      // la liste visible : le menu afficherait alors une valeur absente de ses
      // options, et le navigateur retomberait silencieusement sur la première.
      params.continent = value;
      params.zone = null;          // la zone appartenait au continent précédent
      recalerPays();
      apply();
      return;
    } else if (key === "zone") {
      // Recliquer la zone déjà retenue la désélectionne : c'est le seul moyen de
      // revenir au continent entier sans passer par le menu. Le pays n'est pas
      // recalé : il désigne l'émetteur valorisé, pas le périmètre de l'échantillon.
      params.zone = params.zone === value ? null : value;
      apply();
      return;
    } else if (key === "country") {
      // Choisir un pays hors du filtre courant déplace le filtre plutôt que
      // d'ignorer le clic.
      const cont = continentDe(value);
      if (params.continent !== TOUS && cont && cont !== params.continent) {
        params.continent = cont;
        params.zone = null;
      }
    } else if (key === "secteur") {
      // Même tolérance que pour l'URL : accents et casse approximatifs acceptés,
      // et on conserve la valeur précédente plutôt qu'un libellé inconnu.
      const connus = ((DATA.comparables || {}).industries || []).map((i) => i.nom);
      value = resolveOption(value, connus) || params.secteur;
    } else if (key === "gearing_cible") {
      // La saisie brute est conservée telle quelle : c'est elle qu'il faut
      // réafficher pour que l'utilisateur voie ce qui a été refusé.
      const verdict = valideGearingCible(value);
      params.gearing_saisie = String(value == null ? "" : value);
      params.gearing_cible = verdict.valeur;
      params.gearing_erreur = verdict.erreur;
      apply();
      return;
    }
    params[key] = value;
    apply();
  }

  function bumpParam(key, dir) {
    params[key] = Math.max(0, Math.round((params[key] + dir * STEPS[key]) * 1000) / 1000);
    apply();
  }

  function apply() {
    model = computeModel(params);
    renderAll();
    // L'URL porte la configuration : un lien copié rouvre le même calcul. Le
    // texte en cours de saisie et son message d'erreur n'en font pas partie :
    // ce sont des états d'écran, pas des hypothèses de calcul.
    try {
      if (window.history.replaceState) {
        const partage = Object.assign({}, params);
        delete partage.gearing_saisie;
        delete partage.gearing_erreur;
        window.history.replaceState(null, "", "?" + new URLSearchParams(partage));
      }
    } catch (err) { /* page ouverte en fichier local : sans effet */ }
  }

  // Une URL saisie à la main peut perdre les accents ou la casse ("Cote d'Ivoire"
  // pour "Côte d'Ivoire") : on retrouve l'entrée exacte plutôt que de retomber
  // silencieusement sur les valeurs par défaut.
  function normalize(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  }

  function resolveOption(value, options) {
    if (options.includes(value)) return value;
    const target = normalize(value);
    return options.find((o) => normalize(o) === target) || null;
  }

  function readUrlParams() {
    let query;
    try { query = new URLSearchParams(window.location.search); } catch (err) { return; }
    if (query.has("maturity") && DATA.options.maturities.includes(query.get("maturity"))) {
      params.maturity = query.get("maturity");
    }
    // « brvm » et « industrie_brvm » sont les anciens noms, restés dans les
    // liens déjà partagés : on les accepte encore, sans les produire.
    const demande = query.get("referentiel");
    if (["damodaran", "comparables", "brvm"].includes(demande)) {
      params.referentiel = demande === "brvm" ? "comparables" : demande;
    }
    const secteurs = ((DATA.comparables || {}).industries || []).map((i) => i.nom);
    for (const cle of ["secteur", "industrie_brvm"]) {
      if (query.has(cle)) {
        const trouvee = resolveOption(query.get(cle), secteurs);
        if (trouvee) params.secteur = trouvee;
      }
    }
    for (const [key, list] of [["country", DATA.options.countries], ["industry", DATA.options.industries]]) {
      if (query.has(key)) {
        const found = resolveOption(query.get(key), list);
        if (found) params[key] = found;
      }
    }
    if (query.has("year")) {
      const year = Number(query.get("year"));
      if (DATA.options.years.includes(year)) params.year = year;
    }
    for (const key of ["d", "e", "inflation_ref", "inflation_local"]) {
      if (query.has(key)) {
        const value = Number(query.get(key));
        if (Number.isFinite(value)) params[key] = value;
      }
    }
  }

  function renderAll() {
    $("fiscal").textContent = model.fiscalYear;
    renderParams();

    // On mémorise la carte dépliée pour la rouvrir après redessin, si elle existe encore.
    const ouverts = { cmpc: PANNEAUX.cmpc.ouvert, soc: PANNEAUX.soc.ouvert };
    PANNEAUX.cmpc.ouvert = null;
    PANNEAUX.soc.ouvert = null;

    chargerCmpc();
    chargerSocietes();

    for (const cle of ["cmpc", "soc"]) {
      const garde = ouverts[cle];
      if (garde && PANNEAUX[cle].items.some((c) => c.id === garde)) toggle(cle, garde);
    }
    renderTabs();
  }

  readUrlParams();
  model = computeModel(params);
  renderTabs();
  renderAll();
</script>
</body>
</html>

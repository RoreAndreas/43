    const ke = rf.taux + beta * DATA.mature + Number(params.d) + Number(params.e);
    const kd = rf.taux * (1 - tax);
    const we = 1 / (1 + g);
    const wacc = ke * we + kd * (1 - we);

    // Le CMPC sort dans la devise du socle. Tant que ce socle était la seule
    // courbe UMOA, cette devise était le FCFA du pays valorisé et la question
    // ne se posait pas. Avec trois socles, un CMPC nigérian sort en dollars :
    // il faut le ramener en monnaie locale par le différentiel d'inflation,
    // comme le fait le référentiel Damodaran. Quand la devise du socle est
    // déjà celle du pays, aucune conversion n'est appliquée — l'appliquer
    // quand même ajouterait l'écart des deux curseurs à un taux déjà local.
    const inflationRef = Number(params.inflation_ref);
    const inflationLocale = Number(params.inflation_local);
    const conversion = !rf.locale;
    const waccLocal = conversion
      ? (1 + wacc) * (1 + inflationLocale) / (1 + inflationRef) - 1
      : wacc;
    return {
      beta: beta, betaL: betaL, betaU: betaU, beta1: secteur.beta_1an,
      relevable: relevable, rf: rf, tax: tax,
      perimetre: secteur.perimetre, echelle: secteur.echelle, repli: secteur.repli,
      retenues: secteur.retenues,
      demande: secteur.demande, demandeN: secteur.demandeN,
      gearing: g, gearingSecteur: gSect,
      gearingCible: cible != null ? params.gearing_cible : null,
      gearingSaisi: cible != null, societes: secteur.societes,
      prime: DATA.mature, d: Number(params.d), e: Number(params.e),
      ke: ke, kd: kd, we: we, wd: 1 - we, taxDefaut: taxDefaut,
      wacc: wacc, waccLocal: waccLocal, conversion: conversion,
      inflationRef: inflationRef, inflationLocale: inflationLocale,
    };
  }

  // Cascade affichée dans l'onglet CMPC sous le référentiel Comparables.
  // Chaque carte porte le même niveau de détail que sous Damodaran : les valeurs
  // intermédiaires en clair, et non le seul résultat. Un CMPC dont on ne voit
  // pas les paliers ne se vérifie pas, il se croit.
  // Le taux sans risque n'est plus une ligne mais une construction : socle
  // souverain, prime de risque pays quand elle n'y figure pas déjà, total. Une
  // seule ligne « taux souverain » cacherait laquelle des deux moitiés bouge
  // quand on change de pays sans changer de socle.
  function lignesTaux(cc) {
    return [
      { label: "Taux " + cc.rf.libelle, value: frPct(cc.rf.socle) },
      { label: "Prime de risque pays (" + cc.rf.pays + ")" +
               (cc.rf.primeDefaut ? ", non publiée : 1,00 % retenu" : ""),
        value: frPct(cc.rf.prime) },
      { label: "Taux sans risque retenu, en " + cc.rf.monnaie, value: frPct(cc.rf.taux), strong: true },
    ];
  }

  function composantesComparables(cc) {
    const contribFp = cc.ke * cc.we;
    const contribDette = cc.kd * cc.wd;

    // Le ré-endettement n'apparaît que s'il déplace quelque chose. Quand la
    // cible vaut le gearing observé, il est neutre : trois lignes de plus qui
    // répètent le même nombre feraient du bruit, pas de la transparence.
    const lignesBeta = cc.relevable && cc.gearingSaisi
      ? [
          { label: "Bêta (3 ans) médian du secteur", value: frNum(cc.betaL, 3) },
          { label: "Gearing de l'échantillon (D/E)", value: frNum(cc.gearingSecteur, 2) },
          { label: "Bêta désendetté", value: frNum(cc.betaU, 3) },
          { label: "Gearing retenu (D/E)", value: frNum(cc.gearing, 2) },
          { label: "Bêta ré-endetté, retenu", value: frNum(cc.beta, 3), strong: true },
        ]
      : [{ label: "Bêta (3 ans) médian du secteur", value: frNum(cc.beta, 3), strong: true }];

    return [
      {
        id: "ke", title: "Coût des fonds propres", symbol: "Ke", value: frPct(cc.ke), tone: "blue",
        rows: lignesTaux(cc).concat(lignesBeta).concat([
          { label: "Prime de risque marché", value: frPct(cc.prime) },
          { label: "Prime de taille (d)", value: frPct(cc.d) },
          { label: "Prime spécifique (e)", value: frPct(cc.e) },
          { label: "Coût des fonds propres", value: frPct(cc.ke), strong: true },
        ]),
        methodology: "MEDAF sur taux souverain local : taux sans risque + bêta (3 ans) du secteur x prime de marché + prime de taille + prime spécifique.",
        source: "Bêtas à trois ans médians sur " + cc.retenues + " société(s) du secteur" +
          (cc.retenues < cc.societes ? ", les plus grosses capitalisations de " + cc.perimetre +
           " qui en compte " + cc.societes : " sur " + cc.perimetre) +
          ", taux " + cc.rf.libelle + " publié par le " + cc.rf.source +
          ", prime de risque pays et prime de marché mature Damodaran.",
        hypothesis: (cc.relevable && cc.gearingSaisi
            ? "Bêta désendetté puis ré-endetté au gearing cible (Hamada). "
            : "Bêta employé tel quel, structure de l'échantillon retenue. ") +
          "Taux sans risque en US Bonds, cohérent avec la prime de marché. Bêtas africains parfois proches de zéro par illiquidité, ce qui écrase le coût des fonds propres vers le taux sans risque.",

        formula: (cc.relevable && cc.gearingSaisi
          ? ["Bêta désendetté = " + frNum(cc.betaL, 3) + " / (1 + (1 - " + frPct(cc.tax, 1) + ") x " + frNum(cc.gearingSecteur, 2) + ") = " + frNum(cc.betaU, 3),
             "Bêta ré-endetté = " + frNum(cc.betaU, 3) + " x (1 + (1 - " + frPct(cc.tax, 1) + ") x " + frNum(cc.gearing, 2) + ") = " + frNum(cc.beta, 3)]
          : []).concat([
            "a = taux US Bond + prime pays = " + frPct(cc.rf.socle) + " + " +

          ]).concat([
            "Ke = a + b x c + d + e",

            " + " + frPct(cc.d) + " + " + frPct(cc.e) + " = " + frPct(cc.ke),
          ]),
      },
      {
        id: "kd", title: "Coût de la dette après IS", symbol: "Kd", value: frPct(cc.kd), tone: "green",
        rows: [

          ", prime de risque pays Damodaran, " + (cc.taxDefaut
          ? "taux d'IS non publié par Damodaran pour " + params.country + " : 25 % retenu"
          : "taux d'IS de droit commun Damodaran (" + params.country + ")") + ".",
        hypothesis: "Aucun spread publié : dette supposée levée au taux souverain — neutre, probablement optimiste pour un émetteur privé.",
        retained: "Taux sans risque " + frPct(cc.rf.taux) + ", IS " + frPct(cc.tax, 1) + ".",
        formula: ["Kd = " + frPct(cc.rf.taux) + " x (1 - " + frPct(cc.tax, 1) + ") = " + frPct(cc.kd)],
      },
      {
        id: "poids", title: "Structure financière", symbol: "FP / D",
        value: frPct(cc.we, 0) + " / " + frPct(cc.wd, 0),
        rows: [
          { label: "Gearing observé du secteur (D/E)", value: cc.gearingSecteur == null ? "non publié" : frNum(cc.gearingSecteur, 2) },
        ].concat(cc.gearingSaisi
          ? [{ label: "Gearing cible saisi (D/V)", value: frPct(cc.gearingCible / 100, 0) }]
          : []).concat([
            { label: "Gearing retenu (D/E)", value: frNum(cc.gearing, 2), strong: true },
            { label: "Poids des fonds propres, E/V", value: frPct(cc.we) },
            { label: "Poids de la dette, D/V", value: frPct(cc.wd) },
          ]),
        composition: {
          equity: frPct(cc.we, 0), debt: frPct(cc.wd, 0),
          equityPct: (cc.we * 100).toFixed(1), debtPct: (cc.wd * 100).toFixed(1),
        },
        methodology: "Déduite du gearing : fonds propres / valeur = 1 / (1 + D/E).",
        source: cc.gearingSaisi
          ? "Gearing cible saisi à la main, cadenas de l'encadré « Secteur comparable » ouvert."
          : "Médiane des rapports dette / capitalisation du secteur, sur les sociétés complètes de l'univers de comparables.",
        hypothesis: cc.gearingSaisi
          ? "Le gearing cible remplace la médiane et sert aussi à ré-endetter le bêta."
          : "Médiane, pas moyenne : une moyenne serait dominée par la plus grosse capitalisation du secteur.",
        retained: "Gearing D/E = " + frNum(cc.gearing, 2) + ".",
        formula: ["E/V = 1 / (1 + D/E) = 1 / " + frNum(1 + cc.gearing, 2) + " = " + frPct(cc.we),
                  "D/V = 1 - E/V = " + frPct(cc.wd)],
      },
      {
        id: "wacc", title: cc.conversion ? "CMPC en " + cc.rf.monnaie : "CMPC",
        symbol: "CMPC", value: frPct(cc.wacc), final: !cc.conversion,
        rows: [
          { label: "Fonds propres " + frPct(cc.ke) + " x " + frPct(cc.we, 0), value: frPts(contribFp) },
          { label: "Dette " + frPct(cc.kd) + " x " + frPct(cc.wd, 0), value: frPts(contribDette) },
          { label: "CMPC", value: frPct(cc.wacc), strong: true },
        ],
        methodology: "Moyenne du coût des fonds propres et du coût de la dette, pondérée par la structure financière.",
        source: "Composantes ci-dessus.",
        hypothesis: cc.conversion
          ? "Exprimé en " + cc.rf.monnaie + ", devise du socle souverain. La conversion en monnaie locale fait l'objet de la carte suivante."
          : "Déjà en monnaie locale : le socle souverain est libellé dans la devise du pays valorisé, sans conversion.",
        retained: "CMPC = " + frPct(cc.wacc) + (cc.conversion ? " en " + cc.rf.monnaie + "." : "."),
        formula: ["CMPC = E/V x Ke + D/V x Kd",
                  "= " + frPct(cc.we, 0) + " x " + frPct(cc.ke) + " + " + frPct(cc.wd, 0) +
                  " x " + frPct(cc.kd) + " = " + frPct(cc.wacc)],
      },
    ].concat(cc.conversion ? [{
      // Cette carte n'apparaît que lorsque le socle n'est pas dans la monnaie
      // du pays valorisé. Sur un émetteur de l'UMOA ou de la zone euro, elle
      // serait une conversion d'une monnaie vers elle-même : deux curseurs
      // d'inflation réglés différemment y ajouteraient un écart sans objet.
      id: "loc", title: "CMPC en monnaie locale", symbol: "CMPC loc.",
      value: frPct(cc.waccLocal), tone: "blue", final: true,
      rows: [
        { label: "CMPC en " + cc.rf.monnaie, value: frPct(cc.wacc) },
        { label: "Inflation attendue, monnaie locale", value: frPct(cc.inflationLocale) },
        { label: "Inflation attendue, " + cc.rf.monnaie, value: frPct(cc.inflationRef) },
        { label: "Différentiel", value: frPts(cc.waccLocal - cc.wacc) },
        { label: "CMPC en monnaie locale", value: frPct(cc.waccLocal), strong: true },
      ],
      methodology: "Conversion du CMPC exprimé dans la devise du socle souverain vers la monnaie du pays valorisé, par le différentiel d'inflation attendu, selon la parité des pouvoirs d'achat.",
      source: "Prévisions d'inflation des deux zones monétaires, saisies dans l'onglet Paramètres — aucune source ne les fournit pour les 157 pays du référentiel.",
      hypothesis: "Différentiel d'inflation constant, parité des pouvoirs d'achat vérifiée à terme. Les deux curseurs sont des hypothèses de l'utilisateur, pas des données : par défaut, ils imposent un écart de 0,5 point sans rapport avec le pays retenu.",
      retained: frPct(cc.wacc) + " en " + cc.rf.monnaie + ", " + frPct(cc.waccLocal) + " en monnaie locale.",
      formula: [
        "CMPC loc. = (1 + CMPC) x (1 + infl. loc.) / (1 + infl. " + cc.rf.monnaie + ") - 1",
        "= " + frNum(1 + cc.wacc, 4) + " x " + frNum(1 + cc.inflationLocale, 4) + " / " +
        frNum(1 + cc.inflationRef, 4) + " - 1 = " + frPct(cc.waccLocal),
      ],
    }] : []);
  }

  /* ---------- Bulles de résumé ---------- */
  // Deux bulles sur la ligne de titre : ce qui est cadré et combien de sociétés
  // s'y rattachent, puis les places d'où ces sociétés proviennent. Sans zone
  // retenue, le résumé porte sur le continent entier.
  function resumeCadrage() {
    if (params.continent === TOUS) return "";
    const p = perimetreCourant();
    const libelle = p.n ? p.n + " société" + (p.n > 1 ? "s" : "") : "aucune société";
    return '<span class="chip">' + esc(p.nom) + " · " + libelle + "</span>";
  }

  // Les places d'où proviennent les sociétés du périmètre, sur leur propre
  // ligne. Elles sont huit dès qu'on regarde les banques africaines, et bien
  // davantage à mesure que l'univers s'étend : repliées dans une bulle sur la
  // ligne de titre, elles la faisaient déborder. La ligne défile plutôt que de
  // s'allonger, et la barre n'apparaît que lorsqu'il y a de quoi défiler.
  //
  // Le cadenas n'a de sens que sous Comparables : c'est le seul référentiel où
  // une place restreint un calcul, celui des médianes sectorielles. Sous
  // Damodaran, la ligne reste ce qu'elle a toujours été — une information, pas
  // un contrôle — plutôt que de présenter un bouton sans effet.
  function placesCadrage() {
    const p = perimetreCourant();
    if (!p.n || !p.places.length) return "";
    const verrouille = estComparables();
    const ouvert = verrouille && !params.place_verrou;
    const cadenas = verrouille
      ? '<button type="button" class="verrou' + (ouvert ? " is-open" : "") + '" id="verrouPlace"' +
        ' aria-pressed="' + (ouvert ? "true" : "false") + '"' +
        ' title="' + (ouvert
          ? "Revenir à toutes les places du périmètre"
          : "Choisir une place pour restreindre le calcul") + '">' +
        (ouvert ? CADENAS.ouvert : CADENAS.ferme) +
        "<span>" + (ouvert ? "Focus" : "Toutes") + "</span></button>"
      : "";
    return '<div class="places-bloc">' +
      (cadenas ? '<div class="places-head">' + cadenas + '</div>' : "") +
      '<div class="places" id="placesPiste" tabindex="0" role="group" aria-label="Places de cotation du périmètre">' +
      p.places.map((m) => {
        const actif = m === params.place_cible;
        const classes = "place" + (ouvert ? " is-cliquable" : "") + (actif ? " is-actif" : "");
        const attrs = ouvert
          ? ' data-place="' + esc(m) + '" role="button" tabindex="0" aria-pressed="' + (actif ? "true" : "false") + '"'
          : "";
        return '<span class="' + classes + '"' + attrs + ">" + esc(m) + "</span>";
      }).join("") +
      '</div>' +
      '<input type="range" class="places-slider" id="placesRail" min="0" max="100" step="0.1" value="0"' +
      ' aria-label="Faire défiler les places de cotation" hidden>' +
      "</div>";
  }

  function basculerVerrouPlace() {
    params.place_verrou = !params.place_verrou;
    if (params.place_verrou) params.place_cible = null;
    apply();
  }

  function choisirPlace(valeur) {
    params.place_cible = params.place_cible === valeur ? null : valeur;
    apply();
  }

  // Le rail et la bande sont liés dans les deux sens : tirer la poignée fait
  // défiler, faire défiler ramène la poignée. Un rail qui ne suivrait pas le
  // défilement à la molette indiquerait une position fausse dès le premier geste.
  let ajusterPlaces = null;

  function brancherPlaces() {
    const piste = $("placesPiste");
    const rail = $("placesRail");
    const verrou = $("verrouPlace");
    ajusterPlaces = null;
    if (verrou) verrou.addEventListener("click", basculerVerrouPlace);
    if (piste) {
      piste.querySelectorAll(".place[data-place]").forEach((el) => {
        el.addEventListener("click", () => choisirPlace(el.dataset.place));
        el.addEventListener("keydown", (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          ev.preventDefault();
          choisirPlace(el.dataset.place);
        });
      });
    }
    if (!piste || !rail) return;

    const amplitude = () => piste.scrollWidth - piste.clientWidth;
    const poser = (pct) => rail.style.setProperty("--_p", pct.toFixed(2) + "%");

    function ajuster() {
      const max = amplitude();
      // Sans débordement, le rail n'a rien à commander : on le retire plutôt
      // que d'offrir une poignée qui ne bouge pas.
      rail.hidden = max <= 1;
      if (rail.hidden) return;
      const pct = (piste.scrollLeft / max) * 100;
      rail.value = String(pct);
      poser(pct);
    }

    rail.addEventListener("input", () => {
      const pct = Number(rail.value);
      piste.scrollLeft = (pct / 100) * amplitude();
      poser(pct);
    });
    piste.addEventListener("scroll", ajuster, { passive: true });
    ajusterPlaces = ajuster;
    ajuster();
  }

  function stepperField(item) {
    return `
      <span class="field">
        <span style="display:grid;gap:2px">
          <span class="field-label">${esc(item.label)}</span>
          <span class="field-hint">${esc(item.hint)}</span>
        </span>
        <span class="stepper">
          <span class="stepper-value">${frPct(params[item.key])}</span>
          <span class="stepper-btns">
            <button type="button" data-step="${item.key}" data-dir="-1">−</button>
            <button type="button" data-step="${item.key}" data-dir="1">+</button>
          </span>
        </span>
      </span>`;
  }

  function blocDamodaran() {
    const chips = model.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("");
    return `
      <section class="card-block">
        <span class="block-head">
          <h2>Données de marché</h2>
          <span class="chips">${chips}</span>
        </span>
        <div class="tiles">
          ${model.market.map((m) => `
            <span class="tile">
              <span class="tile-label">${esc(m.label)}</span>
              <span class="tile-value">${esc(m.value)}</span>
            </span>`).join("")}
        </div>
        ${model.notes.length ? `<span class="note">${model.notes.map(esc).join(" · ")}</span>` : ""}
      </section>`;
  }

  // Sous référentiel Comparables, la devise de référence n'est plus une
  // constante : elle dépend du socle affecté au pays. Les deux curseurs
  // d'inflation le disent, sans quoi on saisirait une inflation américaine
  // pour un taux libellé en euros — ou un différentiel là où le taux est déjà
  // dans la monnaie du pays et où rien n'est converti.
  function champsManuels() {
    const rf = estComparables() ? tauxSansRisque() : null;
    if (!rf) return MANUAL;
    return MANUAL.map((champ) => {
      if (champ.key === "inflation_ref") {
        return Object.assign({}, champ, {
          hint: rf.locale
            ? "Sans effet ici : le dollar a cours légal dans ce pays"
            : "Devise du taux sans risque : le " + rf.monnaie,
        });
      }
      if (champ.key === "e") {
        return ecartDeMarche()
          ? Object.assign({}, champ, {
              hint: "Écart de marché des comparables, et risques idiosyncratiques" })
          : champ;
      }
      if (champ.key === "inflation_local") {
        return Object.assign({}, champ, {
          hint: rf.locale
            ? "Sans effet ici : aucune conversion n'est appliquée"
            : "Projection annuelle pour " + params.country,
        });
      }
      return champ;
    });
  }

  function renderParams() {
    const referentiels = (DATA.comparables || {}).societes
      ? selectField("referentiel", "Référentiel",
                    [["damodaran", "Damodaran"], ["comparables", "Comparables"]])
      : "";

    // Une seule maturité pour les deux référentiels, puisqu'ils s'appuient
    // désormais sur la même courbe.
    const champMaturite = selectField("maturity", "Maturité du taux sans risque",
                                      DATA.options.maturities);

    // L'industrie change de taxonomie selon le référentiel : les secteurs de
    // l'univers de comparables, ou les 94 d'un référentiel de marché.
    // Tous les secteurs de l'univers sont proposés, y compris ceux absents de
    // la zone retenue : les masquer priverait de la vue continentale, qui reste
    // calculable et que le panneau signale comme telle.
    const secteurs = ((DATA.comparables || {}).industries || []).map((i) => i.nom);
    const champIndustrie = estComparables()
      ? selectField("secteur", "Industrie", secteurs)
      : selectField("industry", "Industrie", DATA.options.industries);

    $("paramsMain").innerHTML = `
      <section class="card-block">
        <h2>Contexte de marché</h2>
        <div class="grid-2">
          ${selectField("year", "Année de valorisation", DATA.options.years)}
          ${champMaturite}
          ${referentiels}
          ${selectField("continent", "Continent", [TOUS].concat(continents()))}
        </div>
      </section>

      <section class="card-block">
        <span class="block-head">
          <h2>Cadrage</h2>
          <span class="chips">${resumeCadrage()}</span>
        </span>
        ${placesCadrage()}
        <div class="geo">
          <div class="geo-carte">${carteHtml()}</div>
          <div class="geo-choix">
            ${champIndustrie}
            ${champPays("Pays de valorisation")}
          </div>
        </div>
      </section>

      ${estComparables() ? "" : blocDamodaran()}

      <section class="card-block">
        <h2>Paramètres manuels</h2>
        <div class="grid-2">${champsManuels().map(stepperField).join("")}</div>
      </section>`;

    // Le cadre Cadrage est rendu sous les deux référentiels : le rail se
    // rebranche ici, avant l'embranchement, sur les éléments qui viennent
    // d'être recréés.
    brancherPlaces();

    if (estComparables()) {
      // Le panneau décrit l'échantillon qui alimente le calcul, et à quelle
      // échelle il a été pris. Afficher un bêta issu d'une population et un
      // effectif issu d'une autre donnait un encadré cohérent en apparence et
      // faux ligne à ligne.
      const secteur = statsSecteur(params.secteur);
      const rf = tauxSansRisque();
      const cc = cmpcComparables();
      const gSect = gearingSectoriel(params.secteur);
      const ouvert = !params.gearing_verrou;
      $("paramsResult").innerHTML = `
        <span class="result-head">
          <h2>Secteur comparable</h2>
          <button type="button" class="verrou${ouvert ? " is-open" : ""}" id="verrouGearing"
                  aria-pressed="${ouvert ? "true" : "false"}"
                  title="${ouvert ? "Revenir au gearing observé du secteur" : "Saisir un gearing cible"}">
            ${ouvert ? CADENAS.ouvert : CADENAS.ferme}<span>${ouvert ? "Cible" : "Observé"}</span>
          </button>
        </span>
        <span class="result-hero">
          <span class="field-label">CMPC calculé${cc && cc.conversion ? ", en monnaie locale" : ""}</span>
          <span class="result-hero-row">
            <span class="result-hero-value"${cc ? "" : ' style="color:var(--muted-2)"'}>${cc ? frPct(cc.waccLocal) : "—"}</span>
          </span>
        </span>
        <span class="result-rows">
          <span class="result-row"><span>Sociétés du secteur${secteur ? ", " + esc(secteur.perimetre) : ""}</span><span>${secteur ? secteur.societes : 0}</span></span>
          ${(() => { const e = ecartDeMarche(); return e ? `
            <span class="result-row is-appoint">
              <span>Comparables pris ${esc(e.comparables)}, émetteur
                ${esc(e.emetteur)} : le secteur se cherche là où il est
                représenté, non là où l'émetteur est domicilié. Le pays n'entre
                que par sa prime de risque et son taux d'IS ; l'écart de marché
                s'ajuste par la prime spécifique (e).</span>
            </span>` : ""; })()}
          ${secteur && secteur.repli ? `
            <span class="result-row is-appoint">
              <span>${esc(secteur.demande)} ne compte ${secteur.demandeN
                ? secteur.demandeN + " société" + (secteur.demandeN > 1 ? "s" : "")
                : "aucune société"} dans ce secteur, sous le seuil de ${SEUIL} :
                médiane reprise sur ${esc(secteur.perimetre)}.</span>
            </span>` : ""}
          ${secteur && secteur.retenues < secteur.societes ? `
            <span class="result-row is-appoint">
              <span>Médianes calculées sur les ${secteur.retenues} plus grosses
                capitalisations : au-delà, ce sont les micro-capitalisations
                illiquides qui décident.</span>
            </span>` : ""}
          <span class="result-row"><span>Bêta médian (3 ans)</span><span>${secteur && secteur.beta_3ans != null ? frNum(secteur.beta_3ans, 3) : "—"}</span></span>
          <span class="result-row"><span>Taux ${rf ? esc(rf.libelle) : "US Bond"}</span><span>${rf ? frPct(rf.socle) : "indisponible"}</span></span>
          ${rf ? `
            <span class="result-row"><span>Prime de risque pays</span><span>${frPct(rf.prime)}</span></span>
            <span class="result-row"><span>Taux sans risque, en ${esc(rf.monnaie)}</span><span>${frPct(rf.taux)}</span></span>` : ""}
          <span class="result-row"><span>Gearing sectoriel (D/E)</span><span>${gSect == null ? "non publié" : frNum(gSect, 2)}</span></span>
          ${ouvert ? `
            <span class="result-row">
              <span>Gearing cible (D/V)</span>
              <span class="cible-champ">
                <input class="mini-input${params.gearing_erreur ? " is-invalide" : ""}" type="number"
                       step="1" min="0" max="100" inputmode="decimal"
                       data-num="gearing_cible" id="champGearingCible"
                       aria-label="Gearing cible, poids de la dette en pourcentage"
                       aria-invalid="${params.gearing_erreur ? "true" : "false"}"
                       placeholder="${gSect == null ? "—" : frNum(gSect / (1 + gSect) * 100, 0)}"
                       value="${esc(params.gearing_saisie)}">
                <span class="cible-unite">%</span>
              </span>
            </span>
            ${params.gearing_erreur
              ? `<span class="result-row is-erreur" id="erreurGearing"><span>${esc(params.gearing_erreur)}</span></span>`
              : (params.gearing_cible != null
                  ? `<span class="result-row is-appoint"><span>Équivalent D/E</span><span>${frNum(gearingCibleDE(), 2)}</span></span>`
                  : `<span class="result-row is-appoint"><span>Champ vide</span><span>médiane du secteur retenue</span></span>`)}` : ""}
          ${cc ? `
            <span class="result-row"><span>Coût des fonds propres</span><span>${frPct(cc.ke)}</span></span>
            <span class="result-row"><span>Coût de la dette après IS</span><span>${frPct(cc.kd)}</span></span>
            <span class="result-row"><span>Fonds propres / dette</span><span>${frPct(cc.we, 0)} / ${frPct(cc.wd, 0)}</span></span>
            ${cc.taxDefaut ? `

  function brancherChamps() {
    $("paramsMain").querySelectorAll("select[data-param]").forEach((sel) => {

  // chaque frappe redessinerait le panneau et ferait perdre le focus au champ.
  function brancherNombres(racine) {
    racine.querySelectorAll("input[data-num]").forEach((champ) => {

  function toggle(cle, id) {
    const pan = PANNEAUX[cle];
    pan.ouvert = pan.ouvert === id ? null : id;
    const item = pan.items.find((c) => c.id === pan.ouvert);
    const tone = item && item.tone && item.tone !== "accent" ? item.tone : null;

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      const on = el.dataset.comp === pan.ouvert;
      el.classList.toggle("is-open", on);
      el.querySelector(".comp-head").setAttribute("aria-expanded", on ? "true" : "false");
    });
    $(pan.frame).querySelectorAll(".detail").forEach((el) => {
      el.classList.toggle("is-shown", el.dataset.detail === pan.ouvert);
    });
    const attente = $(pan.frame).querySelector(".detail-vide");
    if (attente) attente.classList.toggle("is-cache", Boolean(pan.ouvert));

    const col = $(pan.col);
    col.classList.toggle("is-on", Boolean(pan.ouvert));
    col.classList.remove("tone-green", "tone-blue");
    if (tone) col.classList.add("tone-" + tone);

    placeArrow(cle);
    setTimeout(() => placeArrow(cle), 200);
    setTimeout(() => placeArrow(cle), 460);
  }

  function placeArrow(cle) {
    const pan = PANNEAUX[cle];
    if (!pan.ouvert) return;
    const col = $(pan.col);
    const head = $(pan.stack).querySelector('.comp[data-comp="' + CSS.escape(pan.ouvert) + '"] .comp-head');
    if (!head) return;
    const cr = col.getBoundingClientRect();
    const hr = head.getBoundingClientRect();
    const max = Math.max(40, cr.height - 30);
    const y = hr.top + hr.height / 2 - cr.top - 6;
    $(pan.arrow).style.top = Math.round(Math.min(max, Math.max(16, y))) + "px";
  }

  function placeArrows() {
    Object.keys(PANNEAUX).forEach(placeArrow);

  /* ================= Onglet Multiples VE/EBITDA =================
     Les multiples d'entreprise (VE/EBITDA, VE/CA) calculés à partir des
     sociétés retenues pour la médiane sectorielle. Ils servent la valorisation
     par comparables : ils n'entrent pas dans le coût du capital, mais c'est la
     même population qui les produit.

     Deux vues sont proposées :
      - Graphique : barres horizontales par exercice, avec la médiane marquée.
      - Calcul   : tableau détaillé société par société, formules à l'appui.

     VE = capitalisation boursière + dette totale (en millions, même unité).
     VE/EBITDA = VE / EBITDA de l'exercice ; vide si l'EBITDA n'est pas publié
     (banques, assureurs — S&P ne le fournit pas pour elles).
     VE/CA = VE / chiffre d'affaires de l'exercice.
  */

  // Calcule les multiples d'une société pour un exercice donné.
  function multiplesSociete(s, an) {
    const ca = (s.ca || {})[String(an)];
    const ebitda = (s.ebitda || {})[String(an)];
    const ve = (s.capitalisation != null && s.dette != null)
      ? s.capitalisation + s.dette : null;
    return {
      ve: ve,
      veEbitda: (ve != null && ebitda) ? ve / ebitda : null,
      veCa: (ve != null && ca) ? ve / ca : null,
    };
  }

  // Médiane d'une liste de valeurs, les trous ignorés. Partagée par cet onglet
  // et par la feuille « Sociétés » du classeur : deux implantations finiraient
  // par diverger d'un arrondi, et le fichier ne dirait plus ce que dit l'écran.
  function mediane(valeurs) {
    const v = valeurs.filter((x) => Number.isFinite(x)).sort((a, b) => a - b);
    if (!v.length) return null;
    const m = Math.floor(v.length / 2);
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  }

  // Agrège les multiples de toutes les sociétés retenues pour un exercice.
  function multiplesParExercice(an) {
    const ids = societesRetenues().ids;
    const lignes = [];
    const tousVeEbitda = [];
    const tousVeCa = [];
    for (const id of ids) {
      const s = COMPARABLES[id];
      if (!s) continue;
      const m = multiplesSociete(s, an);
      if (m.ve == null) continue;
      if (m.veEbitda != null) tousVeEbitda.push(m.veEbitda);
      if (m.veCa != null) tousVeCa.push(m.veCa);
      lignes.push({
        id, nom: s.nom, pays: s.pays, place: s.place,
        ve: m.ve, veEbitda: m.veEbitda, veCa: m.veCa,
      });
    }
    lignes.sort((a, b) => (b.ve || 0) - (a.ve || 0));
    return {
      lignes,
      medianes: { veEbitda: mediane(tousVeEbitda), veCa: mediane(tousVeCa) },
      nbAvecEbitda: tousVeEbitda.length,
      nbAvecCa: tousVeCa.length,
      nbTotal: lignes.length,
    };
  }

  /* ---------- Rendu ---------- */
  // La vue choisie survit au changement de cadrage : on passe d'un continent à
  // l'autre pour comparer, pas pour retrouver un onglet remis à zéro.
  let vueMultiples = "graph";

  const RATIOS_MULT = [
    { cle: "veEbitda", titre: "VE / EBITDA", tone: "tone-ve-ebitda", denom: "EBITDA",
      absent: "S&P n'en publie ni pour les banques ni pour les assureurs — la notion n'a pas de sens pour elles." },
    { cle: "veCa", titre: "VE / chiffre d'affaires", tone: "tone-ve-ca",
      denom: "chiffre d'affaires", absent: "" },
  ];

  const frMult = (v) => (v == null ? "—" : frNum(v, 1) + "x");

  // Combien de sociétés portent le ratio — et non combien sont retenues. Les
  // deux nombres diffèrent dès qu'un secteur mêle des modèles comptables : sur
  // les banques africaines, une seule des vingt retenues publie un EBITDA. Les
  // confondre ferait décrire une population en en chiffrant une autre, et la
  // médiane n'est rendue qu'au-delà du seuil qui gouverne déjà celles du CMPC.
  function porteeRatio(bloc, ratio) {
    const valeurs = bloc.lignes.map((l) => l[ratio.cle]).filter((v) => v != null);
    return { valeurs: valeurs, n: valeurs.length,
             mediane: valeurs.length >= SEUIL ? bloc.medianes[ratio.cle] : null };
  }

  // « sur 11 sociétés sur 11 » se lit mal : le dénominateur ne s'écrit que
  // lorsqu'il diffère, c'est-à-dire quand il apprend quelque chose.
  const effectifRatio = (n, total) =>
    n + (n > 1 ? " sociétés" : " société") + (n === total ? "" : " sur " + total);

  // Le cadre suit l'information. Sans barre, pas de graphique : un cadre vide
  // se lirait comme une panne plutôt que comme une donnée absente. Sans assez
  // de barres, pas de repère de médiane : le trait se poserait sur une société
  // en se donnant pour le secteur. Et dans les deux cas la tête de graphique
  // écrit l'effectif, pour qu'on lise le nombre avec sa portée.
  function graphiqueMultiple(ratio, bloc, an) {
    const portee = porteeRatio(bloc, ratio);
    const tete = (droite) =>
      '<div class="multiples-chart-head"><span class="multiples-chart-title">' +
      esc(ratio.titre) + '</span><span class="multiples-chart-ville">' + esc(droite) +
      "</span></div>";

    if (!portee.n) {
      return '<section class="multiples-chart">' + tete("exercice " + an) +
        '<p class="multiples-vide">Aucune des ' + bloc.nbTotal +
        " sociétés retenues ne publie de " + esc(ratio.denom) + " pour l'exercice " +
        an + ". " + esc(ratio.absent) + "</p></section>";
    }

    // Une valeur ne fait pas un graphique : seule, sa barre remplit toute la
    // piste et se lit comme un maximum, alors qu'elle n'est comparée à rien.
    // Sous le seuil on écrit donc les nombres en clair — le cadre rend ce
    // qu'il y a, pas un dessin qui en promettrait plus.
    if (portee.n < SEUIL) {
      const detail = bloc.lignes.filter((l) => l[ratio.cle] != null)
        .sort((a, b) => b[ratio.cle] - a[ratio.cle])
        .map((l) => esc(l.nom) + " " + esc(frMult(l[ratio.cle])))
        .join(" · ");
      return '<section class="multiples-chart">' +
        tete("exercice " + an + " — " + effectifRatio(portee.n, bloc.nbTotal)) +
        '<p class="multiples-vide">' + detail + ". Trop peu de sociétés publient un " +
        esc(ratio.denom) + " ici pour en tirer une médiane de secteur.</p></section>";
    }

    const haut = Math.max.apply(null, portee.valeurs);
    const part = (v) => Math.max(4, Math.round((v / haut) * 100));
    const barres = bloc.lignes.filter((l) => l[ratio.cle] != null)
      .sort((a, b) => b[ratio.cle] - a[ratio.cle])
      .map((l, i) =>
        '<div class="multiple-bar-row">' +
        '<span class="multiple-bar-label" title="' + esc(l.nom) + '">' + esc(l.nom) + "</span>" +
        '<span class="multiple-bar-track">' +
        '<span class="multiple-bar-fill ' + ratio.tone + '" style="width:' +
        part(l[ratio.cle]) + '%">' + esc(frMult(l[ratio.cle])) + "</span>" +
        // Le trait traverse tout le graphique, mais ne porte sa légende qu'une
        // fois : vingt « méd. » empilés feraient du bruit, pas de la lecture.
        '<span class="multiple-bar-mediane' + (i ? " is-suite" : "") +
        '" style="left:' + part(portee.mediane) + '%"></span>' +
        "</span></div>").join("");

    const droite = "exercice " + an + " — médiane " + frMult(portee.mediane) +
      " sur " + effectifRatio(portee.n, bloc.nbTotal);
    return '<section class="multiples-chart">' + tete(droite) +
      '<div class="multiples-bars">' + barres + "</div></section>";
  }

  // La vue Calcul montre le numérateur et le dénominateur à côté du rapport :
  // un multiple qu'on ne peut pas refaire de tête ne se vérifie pas. Les
  // colonnes d'un ratio que personne ne publie ne sont pas dessinées.
  function tableauMultiples(bloc, an) {
    const cle = String(an);
    const avec = RATIOS_MULT.map((ratio) => porteeRatio(bloc, ratio));
    const nul = (t) => '<span class="cell-nul">' + t + "</span>";
    const montant = (v) => (v == null ? nul("n. p.") : esc(frMontant(v)));
    const rapport = (v) => (v == null ? nul("—") : esc(frMult(v)));

    const entetes = ["Société", "Place", "VE"]
      .concat(avec[0].n ? ["EBITDA " + an, "VE / EBITDA"] : [])
      .concat(avec[1].n ? ["CA " + an, "VE / CA"] : []);

    const corps = bloc.lignes.map((l) => {
      const s = COMPARABLES[l.id] || {};
      return "<tr><td>" + esc(l.nom) + "</td><td>" + esc(l.place || "hors cote") +
        "</td><td>" + montant(l.ve) + "</td>" +
        (avec[0].n ? "<td>" + montant((s.ebitda || {})[cle]) + "</td><td>" +
                     rapport(l.veEbitda) + "</td>" : "") +
        (avec[1].n ? "<td>" + montant((s.ca || {})[cle]) + "</td><td>" +
                     rapport(l.veCa) + "</td>" : "") + "</tr>";
    }).join("");

    // La ligne de médiane ne remplit que les colonnes qui en supportent une :
    // une case vide dit « pas assez de valeurs », un nombre dirait le contraire.
    const ligneMediane = '<tr class="is-mediane"><td>Médiane</td><td></td><td></td>' +
      (avec[0].n ? "<td></td><td>" + rapport(avec[0].mediane) + "</td>" : "") +
      (avec[1].n ? "<td></td><td>" + rapport(avec[1].mediane) + "</td>" : "") + "</tr>";

    const manquants = RATIOS_MULT
      .map((ratio, i) => ({ ratio: ratio, portee: avec[i] }))
      .filter((o) => o.portee.n < bloc.nbTotal)
      .map((o) => o.ratio.titre + " : " + (o.portee.n
        ? effectifRatio(o.portee.n, bloc.nbTotal)
        : "aucune société"));

    return '<table class="multiples-table"><thead><tr>' +
      entetes.map((t) => "<th>" + esc(t) + "</th>").join("") +
      "</tr></thead><tbody>" + corps + ligneMediane + "</tbody></table>" +
      '<p class="multiples-note">VE = capitalisation boursière + dette totale, en ' +
      "millions FCFA, exercice " + an + ". " +
      (manquants.length
        ? "Tous les comparables ne publient pas tout : " + esc(manquants.join(", ")) +
          ". Les médianes ne portent que sur les sociétés renseignées, et ne sont " +
          "calculées qu'au-delà de " + SEUIL + " valeurs. "
        : "Tous les comparables retenus publient les deux dénominateurs. ") +
      "Ces multiples servent la valorisation par comparables : ils n'entrent pas " +
      "dans le coût du capital.</p>";
  }

  function chargerMultiples() {
    const retenues = societesRetenues();
    const membres = retenues.ids.map((id) => COMPARABLES[id]).filter(Boolean);
    // Le même exercice de référence que la feuille « Sociétés » du classeur :
    // l'écran et le fichier exporté doivent parler du même millésime.
    const an = membres.length ? exerciceReference(membres) : null;
    const graph = $("multiplesGraph");
    const calc = $("multiplesCalc");

    $("multiplesToggle").querySelectorAll("button").forEach((b) =>
      b.classList.toggle("is-active", b.dataset.view === vueMultiples));
    graph.hidden = vueMultiples !== "graph";
    calc.hidden = vueMultiples !== "calc";

    if (an == null) {
      $("multiplesExercice").textContent = "";
      const vide = '<p class="multiples-vide">Aucune société retenue sur ce cadrage : ' +
        "il n'y a pas de multiple à calculer. Changez d'industrie, ou élargissez la zone.</p>";
      graph.innerHTML = vide;
      calc.innerHTML = vide;
      return;
    }

    const bloc = multiplesParExercice(an);
    $("multiplesExercice").textContent = retenues.stats.perimetre + " — exercice " +
      an + " — " + bloc.nbTotal + (bloc.nbTotal > 1 ? " sociétés" : " société");
    graph.innerHTML = '<div class="multiples-graph-wrap">' +
      RATIOS_MULT.map((ratio) => graphiqueMultiple(ratio, bloc, an)).join("") + "</div>";
    calc.innerHTML = tableauMultiples(bloc, an);
  }

  $("multiplesToggle").addEventListener("click", (e) => {
    const bouton = e.target.closest("button[data-view]");
    if (!bouton || bouton.dataset.view === vueMultiples) return;
    vueMultiples = bouton.dataset.view;
    chargerMultiples();
  });

  // Un filet coloré sans légende est une énigme. Et quand la médiane a été
  // reprise sur un périmètre plus large, aucune carte de la liste n'est marquée :
  // il faut alors dire où sont passées les sociétés retenues plutôt que de
  // laisser un filet absent passer pour un oubli.
  //
  // Les libellés de périmètre sont annoncés après une virgule et jamais après
  // « de » : « de Amérique du Nord » se lit mal, et l'élision correcte diffère
  // selon la zone — d'Afrique, des Amériques, d'Europe de l'Ouest.
  function legendeRetenues(retenues, marquees, affichees) {
    if (!retenues.stats || !retenues.ids.length) return "";
    const total = retenues.ids.length;
    const visibles = affichees.filter((id) => marquees.has(id)).length;
    const perimetre = esc(retenues.stats.perimetre);
    const filet = '<span class="soc-filet"></span>';

    if (visibles === total && total === affichees.length) {
      return '<p class="soc-legende">' + filet + "Les " + total + " sociétés de ce " +
        "périmètre alimentent toutes la médiane sectorielle.</p>";
    }
    if (visibles === total) {
      return '<p class="soc-legende">' + filet + "Les " + total + " sociétés marquées " +
        "alimentent la médiane : les plus grosses capitalisations du périmètre retenu, " +
        perimetre + ".</p>";
    }
    if (visibles) {
      return '<p class="soc-legende">' + filet + "La médiane porte sur " + total +
        " sociétés du périmètre retenu, " + perimetre + " — dont " + visibles +
        (visibles > 1 ? " figurent" : " figure") + " ici, marquée" +
        (visibles > 1 ? "s" : "") + ". Désélectionnez la zone sur la carte pour " +
        "voir les autres.</p>";
    }
    return '<p class="soc-legende is-ailleurs">La médiane est calculée sur ' + total +
      " sociétés du périmètre retenu, " + perimetre + ", faute d'un échantillon " +
      "suffisant ici : aucune d'elles ne figure dans cette zone. Désélectionnez la " +
      "zone sur la carte pour les voir.</p>";
  }


  /* ================= Classeur Excel =================
     Le bouton flèche de l'en-tête rend le calcul dans le même gabarit qu'à l'origine :
     mêmes sections, mêmes lignes, mêmes formules, et les valeurs de l'écran
     dans la colonne du milieu — celles que le modèle laisse à renseigner. La
     colonne des commentaires porte la source de chaque nombre, ce qui est
     précisément ce qu'on relit six mois plus tard.

     La page est servie en statique : le classeur s'écrit donc ici, dans le
     navigateur. Un .xlsx est une archive ZIP de fichiers XML, et une entrée
     ZIP peut être stockée sans compression : à part un CRC32, il n'y a rien à
     embarquer.

     Chaque cellule calculée porte sa formule ET sa valeur. Excel recalcule à
     l'ouverture, les autres tableurs affichent la valeur en attendant : le
     classeur reste un modèle qu'on peut tirer, pas une photographie.

     Second onglet, « Sociétés » : l'échantillon de comparables qui produit les
     médianes, une ligne par valeur, avec ce que le CMPC lui emprunte — bêta et
     levier — et les agrégats d'exploitation dont se déduisent les multiples
     d'EBITDA. Le classeur porte ainsi de quoi refaire le calcul et de quoi le
     confronter à une valorisation par comparables, sans rouvrir la page. Sous
     le référentiel Damodaran il n'y a pas d'échantillon : aucune société
     n'entre dans ce calcul-là, et l'onglet n'est pas écrit plutôt que de
     donner à lire une liste qui ne sert à rien.
  */
  const XL_COLS = [56.3, 3.3, 7.1, 2.0, 64.5];
  const XL_HAUTEUR = 11;
  const XL_THEME1 = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><a:theme xmlns:a=\"http://schemas.openxmlformats.org/drawingml/2006/main\" name=\"Office Theme\"><a:themeElements><a:clrScheme name=\"Office\"><a:dk1><a:sysClr val=\"windowText\" lastClr=\"000000\"/></a:dk1><a:lt1><a:sysClr val=\"window\" lastClr=\"FFFFFF\"/></a:lt1><a:dk2><a:srgbClr val=\"44546A\"/></a:dk2><a:lt2><a:srgbClr val=\"E7E6E6\"/></a:lt2><a:accent1><a:srgbClr val=\"4472C4\"/></a:accent1><a:accent2><a:srgbClr val=\"ED7D31\"/></a:accent2><a:accent3><a:srgbClr val=\"A5A5A5\"/></a:accent3><a:accent4><a:srgbClr val=\"FFC000\"/></a:accent4><a:accent5><a:srgbClr val=\"5B9BD5\"/></a:accent5><a:accent6><a:srgbClr val=\"70AD47\"/></a:accent6><a:hlink><a:srgbClr val=\"0563C1\"/></a:hlink><a:folHlink><a:srgbClr val=\"954F72\"/></a:folHlink></a:clrScheme><a:fontScheme name=\"Office\"><a:majorFont><a:latin typeface=\"Calibri Light\"/><a:ea typeface=\"\"/><a:cs typeface=\"\"/></a:majorFont><a:minorFont><a:latin typeface=\"Calibri\"/><a:ea typeface=\"\"/><a:cs typeface=\"\"/></a:minorFont></a:fontScheme><a:fmtScheme name=\"Office\"><a:fillStyleLst><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln w=\"6350\"><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill></a:ln><a:ln w=\"12700\"><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill></a:ln><a:ln w=\"19050\"><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill><a:solidFill><a:schemeClr val=\"phClr\"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme></a:themeElements></a:theme>";
  const XL_FUSIONS = ["A1:E1", "A14:E14", "A20:E20", "A26:E26", "A33:E33"];


  // Index dans <cellXfs>, tel que les écrit xlStyles().
  const XL = {
    vide: 0, bandeau: 1, bandeauFisher: 2, bandeauSynthese: 3,
    entete: 4, enteteCentre: 5,
    libelle: 6, libelleGras: 7,
    saisiePct2: 8, saisiePct1: 9, saisieNum2: 10,
    calculPct2: 11, calculNum2: 12, resultat: 13,
    valeurPct2: 14, valeurPct1: 15,
    commentaire: 16, commentaireGras: 17,
    syntheseL: 18, syntheseV: 19, syntheseC: 20,
    retenuL: 21, retenuV: 22, retenuC: 23,
    socNote: 24, socNom: 25, socTexte: 26,
    socMontant: 27, socNum2: 28, socNum3: 29, socPct1: 30, socMult: 31,
    medL: 32, medMontant: 33, medNum2: 34, medNum3: 35, medPct1: 36, medMult: 37,
    reportL: 38, reportNum3: 39, reportNum2: 40, reportPct1: 41, reportMult: 42,
    reportC: 43,
  };

  const xmlEsc = (s) => String(s)
    .replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]))
    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "");

  // Douze chiffres significatifs : au-delà, on écrirait le bruit du binaire.
  const xlNombre = (v) => Number(v.toPrecision(12));

  let XL_CRC = null;
  function crc32(octets) {
    if (!XL_CRC) {
      XL_CRC = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        XL_CRC[n] = c >>> 0;
      }
    }
    let crc = 0xffffffff;
    for (let i = 0; i < octets.length; i++) crc = XL_CRC[(crc ^ octets[i]) & 0xff] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }

  // Archive ZIP « stored » : sans compression, il n'y a ni deflate à écrire ni
  // bibliothèque à charger, et le fichier reste un .xlsx parfaitement valide.
  function zipStored(entrees) {
    const encodeur = new TextEncoder();
    const d = new Date();
    const heure = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xffff;
    const jour = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xffff;

    const locaux = [];
    const centraux = [];
    let offset = 0;
    for (const entree of entrees) {
      const nom = encodeur.encode(entree.nom);
      const corps = encodeur.encode(entree.contenu);
      const crc = crc32(corps);

      const entete = new Uint8Array(30);
      const ve = new DataView(entete.buffer);
      ve.setUint32(0, 0x04034b50, true);
      ve.setUint16(4, 20, true);
      ve.setUint16(6, 0x0800, true);   // noms de fichiers en UTF-8
      ve.setUint16(8, 0, true);        // méthode 0 : stocké
      ve.setUint16(10, heure, true);
      ve.setUint16(12, jour, true);
      ve.setUint32(14, crc, true);
      ve.setUint32(18, corps.length, true);
      ve.setUint32(22, corps.length, true);
      ve.setUint16(26, nom.length, true);
      locaux.push(entete, nom, corps);

      const central = new Uint8Array(46);
      const vc = new DataView(central.buffer);
      vc.setUint32(0, 0x02014b50, true);
      vc.setUint16(4, 20, true);
      vc.setUint16(6, 20, true);
      vc.setUint16(8, 0x0800, true);
      vc.setUint16(10, 0, true);
      vc.setUint16(12, heure, true);
      vc.setUint16(14, jour, true);
      vc.setUint32(16, crc, true);
      vc.setUint32(20, corps.length, true);
      vc.setUint32(24, corps.length, true);
      vc.setUint16(28, nom.length, true);
      vc.setUint32(42, offset, true);
      centraux.push(central, nom);

      offset += entete.length + nom.length + corps.length;
    }

    const tailleCentral = centraux.reduce((n, b) => n + b.length, 0);
    const fin = new Uint8Array(22);
    const vf = new DataView(fin.buffer);
    vf.setUint32(0, 0x06054b50, true);
    vf.setUint16(8, entrees.length, true);
    vf.setUint16(10, entrees.length, true);
    vf.setUint32(12, tailleCentral, true);
    vf.setUint32(16, offset, true);

    const blocs = locaux.concat(centraux, [fin]);
    const total = blocs.reduce((n, b) => n + b.length, 0);
    const archive = new Uint8Array(total);
    let curseur = 0;
    for (const bloc of blocs) { archive.set(bloc, curseur); curseur += bloc.length; }
    return archive;
  }

  // Polices, fonds et bordures du gabarit d'origine. Le vert des valeurs marque
  // ce que le modèle attend qu'on renseigne : c'est exactement ce que la page
  // remplit, et le laisser vert dit d'où vient chaque nombre.
  function xlStyles() {
    const police = (attrs, couleur) =>
      "<font>" + attrs + '<sz val="9"/><color rgb="' + couleur + '"/><name val="Arial"/></font>';
    const remplissage = (couleur) =>
      '<fill><patternFill patternType="solid"><fgColor rgb="' + couleur +
      '"/><bgColor indexed="64"/></patternFill></fill>';

      style ? "<" + balise + ' style="' + style + '"><color rgb="FF000000"/></' + balise + ">"
            : "<" + balise + "/>";
    const bordure = (g, d, h, b) =>
      "<border>" + cote("left", g) + cote("right", d) + cote("top", h) + cote("bottom", b) +
      "<diagonal/></border>";

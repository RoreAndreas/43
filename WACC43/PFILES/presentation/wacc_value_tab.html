<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wacc43 — Coût moyen pondéré du capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f7;
    --surface: #ffffff;
    --line: #e4e4e7;
    --ink: #18181b;
    --ink-2: #27272a;
    --ink-3: #3f3f46;
    --ink-4: #52525b;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --tile: #fafafa;
    --field: #f4f4f5;
    --accent: #6d4bb0;
    --accent-soft: #e8e0f4;
    --accent-tint: #faf8fd;
    --accent-chip: #d8cff0;
    --green: #0f6f5c;
    --green-soft: #c9e0d9;
    --green-tint: #f2f8f6;
    --green-line: #cfe1dc;
    --green-ink: #123f36;
    --green-bar: #7ab3a6;
    --green-track: #e2efeb;
    --blue: #1d4ed8;
    --blue-soft: #d5def8;
    --blue-tint: #f2f5fd;
    --blue-ink: #152c66;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- En-tête ---------- */
  .top {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1060px;
    margin: 0 auto;
    padding: 22px 32px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .brand-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .eyebrow {
    font: 400 10.5px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand h1 {
    margin: 0;
    font: 600 21px/1.25 var(--sans);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .fiscal {
    font: 400 11.5px/1.4 var(--mono);
    color: var(--muted);
  }
  .tabs { display: flex; gap: 26px; }
  .tabs button {
    font: 400 13px/1 var(--sans);
    color: var(--muted);
    padding: 0 0 13px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: color 240ms ease, border-color 240ms ease;
  }
  .tabs button.is-active {
    font-weight: 500;
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  /* ---------- Onglet Paramètres ---------- */
  .params {
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px 120px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 26px;
    align-items: start;
  }
  .params-main { display: grid; gap: 20px; }
  .card-block {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    display: grid;
    gap: 18px;
  }
  .card-block h2 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
    font: 400 10.5px/1 var(--mono);
    color: var(--ink-3);
  }
  .chip.is-accent {
    border-color: var(--accent-chip);
    background: var(--accent-tint);
    color: var(--accent);
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px 22px;
  }
  .field { display: grid; gap: 7px; }
  .field-label {
    font: 400 11.5px/1.4 var(--sans);
    color: var(--ink-4);
  }
  .field-hint {
    font: 400 10.5px/1.4 var(--sans);
    color: var(--muted-2);
  }
  .select-wrap { position: relative; display: grid; }
  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    padding: 11px 34px 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    font: 400 13.5px/1.2 var(--sans);
    color: var(--ink);
    cursor: pointer;
  }
  .select-wrap svg {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 10px 9px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
  }
  .stepper-value {
    font: 500 14px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .stepper-btns { display: flex; gap: 4px; }
  .stepper button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-3);
    font: 400 14px/1 var(--mono);
    cursor: pointer;
  }
  .stepper button:hover { background: var(--field); }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .tile {
    background: var(--tile);
    padding: 13px 15px;
    display: grid;
    gap: 5px;
  }
  .tile-label {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tile-value {
    font: 500 16px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .note {
    font: 400 11px/1.6 var(--sans);
    color: var(--muted-2);
    text-wrap: pretty;
  }

  /* ---------- Carte ---------- */
  .carte-bloc {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }
  .carte {
    width: 100%;
    height: auto;
    display: block;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .carte-fond {
    fill: #e8e8ea;
    stroke: #d6d6da;
    /* Le tracé est dessiné dans un cadre de 360 unités affiché sur ~700 px :
       une épaisseur en unités du cadre serait deux fois trop épaisse. */
    stroke-width: 0.3;
  }
  .pin {
    cursor: pointer;
    transition: r 120ms ease, opacity 120ms ease;
  }
  .pin.is-off { opacity: 0.18; }
  .pin.is-on {
    stroke: var(--surface);
    stroke-width: 1.1;
    paint-order: stroke;
  }
  .pin:hover { r: 3.2; }
  .carte-globe { max-width: 320px; margin: 0 auto; }
  .globe-mer { fill: #eef1f5; stroke: var(--line); stroke-width: 0.6; }

  /* Zones : contours schématiques, pas des frontières. */
  .zone {
    cursor: pointer;
    fill-opacity: 0.3;
    stroke: #ffffff;
    stroke-width: 0.35;
    stroke-linejoin: round;
    transition: fill-opacity 120ms ease;
  }
  .zone:hover { fill-opacity: 0.62; }
  .zone.is-on { fill-opacity: 0.72; stroke-width: 0.6; }

  /* Deux colonnes : la carte reste à gauche, les choix passent à droite. */
  .geo {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .geo-choix { display: grid; gap: 16px; align-content: start; }
  @media (max-width: 860px) {
    .geo { grid-template-columns: 1fr; }
  }

  .zones-liste { display: grid; gap: 4px; }
  .zone-ligne {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    align-items: center;
    gap: 4px 8px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    font: 400 12px/1.3 var(--sans);
    color: var(--ink);
    text-align: left;
    cursor: pointer;
  }
  .zone-ligne:hover { border-color: var(--muted); }
  .zone-ligne.is-on { border-color: var(--accent); background: var(--accent-tint); }
  .zone-puce { width: 10px; height: 10px; border-radius: 3px; }
  .zone-nom { font-weight: 500; }
  .zone-pays { color: var(--muted); font-size: 11px; }
  .zone-compte {
    grid-column: 2 / -1;
    font: 500 11px/1.3 var(--mono);
    color: var(--green-ink);
  }
  .zone-compte.is-vide { color: var(--muted-2); font-weight: 400; }
  .zone-places {
    grid-column: 2 / -1;
    font-size: 10.5px;
    color: var(--muted);
  }

  /* ---------- Aside résultat ---------- */
  .result {
    position: sticky;
    top: 24px;
    display: grid;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
  }
  .result h2 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-hero { display: grid; gap: 6px; }
  .result-hero-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-hero-value {
    font: 500 34px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--green);
  }
  .result-rows {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .result-row {
    background: var(--tile);
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 400 12px/1.4 var(--sans);
    color: var(--ink-4);
  }
  .result-row span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .result-row.is-blue span:last-child { color: var(--blue); }
  .structure { display: grid; gap: 7px; }
  .structure-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 400 11px/1 var(--mono);
    color: var(--muted);
  }
  .bar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: #ececef;
  }
  .bar .eq { background: var(--green); }
  .bar .dt { background: var(--green-bar); }
  .cta {
    padding: 11px 14px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font: 400 11.5px/1 var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .cta:hover { background: var(--ink-2); }

  /* ---------- Onglet CMPC ---------- */
  .wacc {
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px 120px;
    display: grid;
    grid-template-columns: 430px minmax(0, 1fr);
    gap: 52px;
    align-items: start;
  }
  .stack { display: grid; gap: 9px; }
  .comp {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    overflow: hidden;
    transition: background-color 340ms cubic-bezier(.4, 0, .2, 1),
                color 340ms cubic-bezier(.4, 0, .2, 1),
                border-color 340ms cubic-bezier(.4, 0, .2, 1);
  }
  .comp.is-final { margin-top: 9px; }
  .comp-head {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 20px;
    padding: 18px 20px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .comp.is-final .comp-head { padding: 22px 20px; }
  .comp-title { font: 500 14.5px/1.35 var(--sans); color: inherit; }
  .comp.is-final .comp-title { font-weight: 600; }
  .comp-value {
    font: 500 24px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: inherit;
  }
  .comp.is-final .comp-value { font-size: 32px; letter-spacing: -0.02em; }
  .comp.tone-green { border-color: var(--green-soft); color: var(--green); }
  .comp.tone-blue { border-color: var(--blue-soft); color: var(--blue); }
  .comp.is-open { background: var(--accent); border-color: var(--accent); color: #fff; }
  .comp.tone-green.is-open { background: var(--green); border-color: var(--green); color: #fff; }
  .comp.tone-blue.is-open { background: var(--blue); border-color: var(--blue); color: #fff; }
  .comp-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 380ms cubic-bezier(.4, 0, .2, 1);
  }
  .comp.is-open .comp-wrap { grid-template-rows: 1fr; }
  .comp-clip { overflow: hidden; }
  .comp-body {
    opacity: 0;
    transition: opacity 300ms ease 40ms;
    padding: 0 20px 18px;
  }
  .comp.is-final .comp-body { padding: 0 20px 20px; }
  .comp.is-open .comp-body { opacity: 1; }
  .sub-rows {
    display: grid;
    border-top: 1px solid rgba(255, 255, 255, .2);
    padding-top: 4px;
  }
  .sub-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .14);
    font: 400 12.5px/1.45 var(--sans);
    color: rgba(255, 255, 255, .8);
  }
  .sub-row:last-child { border-bottom: 0; }
  .sub-row.is-strong { font-weight: 500; color: #fff; }
  .sub-row span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  /* ---------- Panneau de détail ---------- */
  .frame-col { position: relative; height: 620px; }
  .frame-arrow {
    position: absolute;
    left: -7px;
    width: 13px;
    height: 13px;
    background: var(--surface);
    border-left: 1px solid var(--accent-soft);
    border-bottom: 1px solid var(--accent-soft);
    transform: rotate(45deg);
    opacity: 0;
    transition: top 420ms cubic-bezier(.4, 0, .2, 1), opacity 300ms ease, border-color 340ms ease;
  }
  /* Le cadre reste visible même sans sélection : il porte alors un message
     d'attente. Seule la flèche apparaît quand une carte est dépliée. */
  .frame {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    transition: border-color 340ms ease;
    overflow: hidden;
  }
  .frame-col.is-on .frame { border-color: var(--accent-soft); }
  .frame-col.is-on .frame-arrow { opacity: 1; }
  .detail-vide {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    padding: 24px 32px;
    text-align: center;
    opacity: 1;
    transition: opacity 300ms ease;
  }
  .detail-vide.is-cache { opacity: 0; }
  .detail-vide .titre {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail-vide .texte {
    max-width: 34ch;
    font: 400 13px/1.65 var(--sans);
    color: var(--muted-2);
    text-wrap: pretty;
  }
  .frame-col.tone-green .frame, .frame-col.tone-green .frame-arrow { border-color: var(--green-soft); }
  .frame-col.tone-blue .frame, .frame-col.tone-blue .frame-arrow { border-color: var(--blue-soft); }
  .detail {
    position: absolute;
    inset: 0;
    padding: 20px 22px;
    overflow: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
    display: grid;
    align-content: start;
    gap: 14px;
  }
  .detail.is-shown { opacity: 1; pointer-events: auto; }
  .detail-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .detail-title { font: 500 13px/1.3 var(--sans); color: var(--ink); }
  .detail.tone-green .detail-title { font-weight: 600; color: var(--green); }
  .detail.tone-blue .detail-title { font-weight: 600; color: var(--blue); }
  .detail-symbol {
    font: 400 10.5px/1.3 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .detail.tone-green .detail-symbol { color: var(--green); }
  .detail.tone-blue .detail-symbol { color: var(--blue); }
  .detail-grid {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr);
    gap: 10px 18px;
  }
  .detail-label {
    font: 400 10px/1.7 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail-text {
    font: 400 13px/1.65 var(--sans);
    color: var(--ink-3);
    text-wrap: pretty;
  }
  .detail code {
    font: 400 12.5px/1.7 var(--mono);
    color: var(--ink-2);
    background: var(--accent-tint);
    border: 1px solid var(--accent-soft);
    border-radius: 6px;
    padding: 10px 12px;
    display: block;
  }
  .detail.tone-green code {
    color: var(--green-ink);
    background: var(--green-tint);
    border-color: var(--green-line);
  }
  .detail.tone-blue code {
    color: var(--blue-ink);
    background: var(--blue-tint);
    border-color: var(--blue-soft);
  }
  .composition { display: grid; gap: 8px; }
  .composition .bar { background: var(--green-track); }
  .composition-legend {
    display: flex;
    gap: 20px;
    font: 400 11.5px/1.4 var(--mono);
    color: var(--ink-3);
  }

  /* ---------- Référentiel BRVM ---------- */
  .soc-list {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .soc-line {
    background: var(--tile);
    padding: 11px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .soc-ident { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .soc-flag { font-size: 15px; line-height: 1; flex: none; }
  .soc-nom {
    font: 400 12.5px/1.4 var(--sans);
    color: var(--ink);
    /* Les raisons sociales sont longues : on les laisse passer à la ligne
       plutôt que de les tronquer. */
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .soc-line.is-more {
    justify-content: flex-start;
    font: 400 11.5px/1.4 var(--sans);
    color: var(--muted);
  }
  .soc-pays { font: 400 10.5px/1.4 var(--mono); color: var(--muted-2); }
  .soc-cap {
    font: 500 12.5px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .fin-table {
    width: 100%;
    border-collapse: collapse;
    font: 400 12.5px/1.5 var(--sans);
  }
  .fin-table th, .fin-table td {
    padding: 7px 0;
    border-bottom: 1px solid #f1f2f6;
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }
  .fin-table th:first-child, .fin-table td:first-child {
    text-align: left;
    font-family: var(--sans);
    color: var(--ink-4);
  }
  .fin-table thead th {
    font: 400 10px/1.7 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fin-table tbody tr:last-child td { border-bottom: 0; }
  .notice {
    border: 1px dashed var(--line);
    border-radius: var(--radius, 10px);
    background: var(--tile);
    padding: 18px 20px;
    display: grid;
    gap: 8px;
  }
  .notice h3 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .notice p {
    margin: 0;
    font: 400 13px/1.65 var(--sans);
    color: var(--ink-3);
    text-wrap: pretty;
  }

  [hidden] { display: none !important; }
  .is-busy { opacity: .55; transition: opacity 160ms ease; }
  .is-locked { pointer-events: none; }

  @media (max-width: 940px) {
    .params, .wacc { grid-template-columns: 1fr; gap: 26px; }
    .frame-col { height: auto; min-height: 420px; }
    .frame-arrow { display: none; }
    .result { position: static; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="eyebrow">wacc43</span>
        <h1>Coût moyen pondéré du capital</h1>
      </div>
      <span class="fiscal" id="fiscal">Exercice 2026</span>
    </div>
    <nav class="tabs">
      <button type="button" data-tab="params" class="is-active">Paramètres</button>
      <button type="button" data-tab="wacc">CMPC</button>
      <!-- N'apparaît qu'avec le référentiel BRVM -->
      <button type="button" data-tab="societes" id="tabSocietes" hidden>Sociétés</button>
    </nav>
  </div>
</header>

<main class="params" id="panel-params">
  <div class="params-main" id="paramsMain"></div>
  <aside class="result" id="paramsResult"></aside>
</main>

<main class="wacc" id="panel-wacc" hidden>
  <section class="stack" id="stack"></section>
  <div class="frame-col" id="frameCol">
    <span class="frame-arrow" id="frameArrow"></span>
    <div class="frame" id="frame"></div>
  </div>
</main>

<main class="wacc" id="panel-societes" hidden>
  <section class="stack" id="stackSoc"></section>
  <div class="frame-col" id="frameColSoc">
    <span class="frame-arrow" id="frameArrowSoc"></span>
    <div class="frame" id="frameSoc"></div>
  </div>
</main>

<script>
  // ---- Jeu de données injecté au build (wacc_html.py) ----
  // DATA_START
  const DATA = {
    "mature": 0.0423,
    "adjustment": { "rows": [], "correction": 0 },
    "rf": { "2026-30": 4.94 },
    "pays": { "—": { "crp": 0.0064, "tax": 0.25 } },
    "industries": { "—": { "beta": 1.163, "de": 0.32, "spread": 0.0134 } },
    "options": { "years": [2026], "maturities": ["30Y", "10Y"], "countries": ["—"], "countries_grouped": [["—", ["—"]]], "industries": ["—"] },
    "defaults": { "year": 2026, "maturity": "30Y", "country": "—", "industry": "—", "d": 0.01, "e": 0.005, "inflation_ref": 0.025, "inflation_local": 0.03 }
  };
  // DATA_END

  const STEPS = { d: 0.005, e: 0.005, inflation_ref: 0.005, inflation_local: 0.005 };
  const MANUAL = [
    { key: "d", label: "Prime de taille (d)", hint: "Ajustement small cap / PME" },
    { key: "e", label: "Prime spécifique (e)", hint: "Risques idiosyncratiques" },
    { key: "inflation_ref", label: "Inflation, monnaie du taux sans risque", hint: "EUR ou USD selon la devise de référence" },
    { key: "inflation_local", label: "Inflation, monnaie locale", hint: "Projection annuelle du pays cible" }
  ];
  const CHEVRON = '<svg width="9" height="6" viewBox="0 0 9 6" fill="none" aria-hidden="true"><path d="M1 1l3.5 3.5L8 1" stroke="#71717a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const frPct = (v, dec) => (v * 100).toFixed(dec === undefined ? 2 : dec).replace(".", ",") + " %";
  const frNum = (v, dec) => v.toFixed(dec === undefined ? 2 : dec).replace(".", ",");
  const frPts = (v) => (v * 100).toFixed(2).replace(".", ",") + (Math.abs(v * 100) < 2 ? " pt" : " pts");

  const BRVM = DATA.brvm || null;

  // `continent` ne vient pas du jeu de données : c'est un filtre d'affichage,
  // sans effet sur le calcul. Il part sur « Tous » pour qu'aucun pays ne soit
  // masqué tant que l'utilisateur n'a rien demandé.
  // `continent` et `zone` ne viennent pas du jeu de données : ce sont des
  // filtres d'affichage, sans effet sur le calcul. On part sur « Tous », donc
  // sans rien masquer tant que l'utilisateur n'a rien demandé.
  let params = Object.assign({ continent: "Tous", zone: null }, DATA.defaults);
  if (!params.referentiel) params.referentiel = "damodaran";
  if (!params.industrie_brvm && BRVM && BRVM.industries.length) {
    params.industrie_brvm = BRVM.industries[0].nom;
  }
  let model = null;
  let tab = "params";   // on règle les hypothèses avant de lire le résultat

  if (!params.maturite_uemoa) params.maturite_uemoa = "10 ans";

  const estBrvm = () => Boolean(BRVM) && params.referentiel === "brvm";

  // La courbe souveraine de l'État sélectionné. Les libellés de pays diffèrent
  // entre Damodaran et UMOA-Titres (Senegal / Sénégal) : on les rapproche par
  // la même normalisation que pour les paramètres d'URL.
  function courbePays() {
    if (!BRVM || !BRVM.courbes) return null;
    const trouve = resolveOption(params.country, Object.keys(BRVM.courbes.pays));
    return trouve ? { pays: trouve, points: BRVM.courbes.pays[trouve] } : null;
  }

  // Taux sans risque local : il porte déjà le risque pays, aucune prime à ajouter.
  function tauxSansRisque() {
    const courbe = courbePays();
    if (!courbe) return null;
    const point = courbe.points.find((p) => p[0] === params.maturite_uemoa)
      || courbe.points[courbe.points.length - 1];
    return { pays: courbe.pays, libelle: point[0], taux: point[2] };
  }
  const industrieBrvm = () =>
    (BRVM && BRVM.industries.find((i) => i.nom === params.industrie_brvm)) ||
    (BRVM && BRVM.industries[0]) || null;

  // Separateur de milliers en espace insecable U+00A0 : U+202F manque a IBM Plex Mono.
  const frMontant = (v) =>
    v == null ? "—" : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " M";

  // Les deux colonnes de cartes — CMPC et Sociétés — partagent la même mécanique :
  // une carte dépliée à la fois, un panneau de détail, une flèche qui la pointe.
  const PANNEAUX = {
    cmpc: {
      stack: "stack", frame: "frame", col: "frameCol", arrow: "frameArrow",
      ouvert: null, items: [], detail: null,
      vide: {
        titre: "Détail de la composante",
        texte: "Sélectionne une composante à gauche : sa méthodologie, ses sources, ses hypothèses et son calcul s'afficheront ici."
      }
    },
    soc: {
      stack: "stackSoc", frame: "frameSoc", col: "frameColSoc", arrow: "frameArrowSoc",
      ouvert: null, items: [], detail: null,
      vide: {
        titre: "Détail de la société",
        texte: "Sélectionne une société à gauche : son activité, son pays et ses trois derniers exercices s'afficheront ici."
      }
    }
  };

  /* ================= Calcul =================
     Transcription de wacc_core.py : les mêmes formules, appliquées dans le
     navigateur aux données embarquées ci-dessus. Aucun appel réseau.
  */

  function adjustedSpread(costOfDebt) {
    for (const [threshold, spread] of DATA.adjustment.rows) {
      if (costOfDebt <= threshold) return { value: spread + DATA.adjustment.correction, adjusted: true };
    }
    return { value: costOfDebt, adjusted: false };
  }

  function computeModel(p) {
    const notes = [];
    const country = DATA.pays[p.country] || {};
    const industry = DATA.industries[p.industry] || {};

    let crp = country.crp;
    if (crp === undefined) { crp = 0.01; notes.push("Prime de risque pays indisponible, 1,00 % retenu"); }
    let tax = country.tax;
    if (tax === undefined) { tax = 0.25; notes.push("Taux d'IS indisponible pour ce pays, 25,00 % retenu"); }
    let beta = industry.beta, de = industry.de;
    if (beta === undefined || de === undefined) { beta = 1.0; de = 0.5; notes.push("Bêta sectoriel indisponible, valeurs par défaut retenues"); }
    let rawSpread = industry.spread;
    if (rawSpread === undefined) { rawSpread = 0.05; notes.push("Spread de financement indisponible, 5,00 % retenu"); }

    const code = p.maturity === "30Y" ? "30" : "10";
    let rfPct = DATA.rf[p.year + "-" + code];
    let a;
    if (rfPct === undefined) {
      rfPct = 0;
      a = 0.03;
      notes.push("Taux US " + p.maturity + " indisponible pour " + p.year + ", 3,00 % retenu");
    } else {
      a = rfPct / 100 + crp;
    }

    const c = DATA.mature;
    const b = beta * (1 + de * (1 - tax));
    const re = a + b * c + p.d + p.e;
    const spread = adjustedSpread(rawSpread);
    const rdPre = spread.value + a;
    const rdPost = rdPre * (1 - tax);
    const ev = 1 / (1 + de);
    const dv = 1 - ev;
    const wacc = re * ev + rdPost * dv;
    const local = (1 + wacc) * (1 + p.inflation_local) / (1 + p.inflation_ref) - 1;

    const contribFp = re * ev;
    const contribDette = rdPost * dv;
    const economieImpot = rdPre * tax;
    const spreadLabel = spread.adjusted ? "Spread de financement (ajusté)" : "Spread de financement";

    const components = [
      {
        id: "re", title: "Coût des fonds propres", symbol: "Re", value: frPct(re), tone: "accent",
        rows: [
          { label: "Taux US Bond " + p.maturity + " (" + p.year + ")", value: frPct(rfPct / 100) },
          { label: "Prime de risque pays", value: frPct(crp) },
          { label: "Taux sans risque local (a)", value: frPct(a), strong: true },
          { label: "Beta désendetté", value: frNum(beta, 3) },
          { label: "Gearing sectoriel", value: frNum(de, 2) },
          { label: "Beta réendetté (b)", value: frNum(b, 3), strong: true },
          { label: "Prime de risque marché (c)", value: frPct(c) },
          { label: "Prime de taille (d)", value: frPct(p.d) },
          { label: "Prime spécifique (e)", value: frPct(p.e) }
        ],
        methodology: "MEDAF. Taux sans risque construit sur l'obligation US " + p.maturity + ", majoré de la prime de risque pays ; bêta sectoriel désendetté puis ré-endetté au gearing sectoriel.",
        source: "US Treasury " + p.maturity + " (moyenne " + p.year + ") ; prime pays, prime de risque marché et bêta sectoriel Damodaran (" + p.industry + ", " + p.country + ").",
        hypothesis: "Primes de taille et spécifique maintenues sur tout l'horizon ; gearing sectoriel considéré comme cible.",
        formula: ["Re = a + b × c + d + e", "= " + frPct(a) + " + " + frNum(b, 3) + " × " + frPct(c) + " + " + frPct(p.d) + " + " + frPct(p.e) + " = " + frPct(re)]
      },
      {
        id: "rd", title: "Coût de la dette", symbol: "Rd", value: frPct(rdPre), tone: "accent",
        rows: [
          { label: "Taux sans risque local (a)", value: frPct(a) },
          { label: spreadLabel, value: frPct(spread.value) },
          { label: "Coût de la dette avant impôt", value: frPct(rdPre), strong: true },
          { label: "Coût de la dette après impôt", value: frPct(rdPost) }
        ],
        methodology: "Coût marginal de la dette : taux sans risque local majoré du spread de financement sectoriel, puis net d'économie d'impôt.",
        source: "Spread de financement sectoriel Damodaran (" + p.industry + ")" + (spread.adjusted ? " ; spread ajusté via la table de notation." : "."),
        hypothesis: "Refinancement aux conditions actuelles ; charges financières intégralement déductibles.",
        formula: [
          "Rd = a + spread = " + frPct(a) + " + " + frPct(spread.value) + " = " + frPct(rdPre),
          "Rd après impôt = " + frPct(rdPre) + " × (1 − " + frPct(tax) + ") = " + frPct(rdPost)
        ]
      },
      {
        id: "ev", title: "Poids des fonds propres", symbol: "E/V", value: frPct(ev), tone: "accent",
        rows: [
          { label: "Gearing sectoriel (D/E)", value: frNum(de, 2) },
          { label: "Quote-part fonds propres", value: frPct(ev), strong: true },
          { label: "Quote-part dette", value: frPct(dv) }
        ],
        methodology: "Structure financière cible en valeur de marché, déduite du gearing sectoriel plutôt que du levier comptable spot.",
        source: "Gearing médian de l'échantillon sectoriel retenu pour le désendettement du bêta.",
        hypothesis: "Structure stable sur l'horizon d'actualisation, sans opération de haut de bilan.",
        formula: ["E/V = 1 / (1 + D/E) = 1 / " + frNum(1 + de, 2) + " = " + frPct(ev)]
      },
      {
        id: "dv", title: "Poids de la dette", symbol: "D/V", value: frPct(dv), tone: "accent",
        rows: [
          { label: "Gearing sectoriel (D/E)", value: frNum(de, 2) },
          { label: "Quote-part dette", value: frPct(dv), strong: true },
          { label: "Quote-part fonds propres", value: frPct(ev) }
        ],
        methodology: "Complément de la quote-part de fonds propres, sur la même structure cible ; dette financière brute, trésorerie non déduite.",
        source: "Gearing médian de l'échantillon sectoriel retenu pour le désendettement du bêta.",
        hypothesis: "Obligations locatives assimilées à de la dette financière.",
        formula: ["D/V = (D/E) / (1 + D/E) = " + frNum(de, 2) + " / " + frNum(1 + de, 2) + " = " + frPct(dv)]
      },
      {
        id: "tax", title: "Taux d'imposition", symbol: "t", value: frPct(tax), tone: "accent",
        rows: [
          { label: "Corporate tax rate", value: frPct(tax), strong: true },
          { label: "Coût de la dette avant impôt", value: frPct(rdPre) },
          { label: "Économie d'impôt", value: frPts(economieImpot) }
        ],
        methodology: "Taux d'impôt sur les sociétés normatif, également utilisé pour le ré-endettement du bêta.",
        source: "Taux d'IS de droit commun Damodaran (" + p.country + ").",
        hypothesis: "Aucun déficit reportable activé ; pas de plafonnement de la déductibilité.",
        formula: [
          "Économie d'impôt = Rd × t = " + frPct(rdPre) + " × " + frPct(tax) + " = " + frPts(economieImpot),
          "Beta réendetté = " + frNum(beta, 3) + " × (1 + " + frNum(de, 2) + " × (1 − " + frPct(tax) + ")) = " + frNum(b, 3)
        ]
      },
      {
        id: "wacc", title: "Coût moyen pondéré du capital", symbol: "WACC", value: frPct(wacc), tone: "green", final: true,
        rows: [
          { label: "Fonds propres " + frPct(re) + " × " + frPct(ev), value: frPts(contribFp) },
          { label: "Dette " + frPct(rdPost) + " × " + frPct(dv), value: frPts(contribDette) },
          { label: "WACC", value: frPct(wacc), strong: true }
        ],
        composition: {
          equity: wacc ? frPct(contribFp / wacc, 1) : "—",
          debt: wacc ? frPct(contribDette / wacc, 1) : "—",
          equityPct: wacc ? contribFp / wacc * 100 : 50,
          debtPct: wacc ? contribDette / wacc * 100 : 50
        },
        methodology: "Moyenne des deux coûts pondérée par la structure cible, la dette étant retenue après économie d'impôt.",
        retained: frPct(wacc) + " dans la monnaie du taux sans risque, " + frPct(local) + " en monnaie locale après différentiel d'inflation.",
        formula: ["WACC = E/V × Re + D/V × Rd après impôt", "= " + frPct(ev) + " × " + frPct(re) + " + " + frPct(dv) + " × " + frPct(rdPost) + " = " + frPct(wacc)]
      },
      {
        id: "loc", title: "CMPC en monnaie locale", symbol: "CMPC loc.", value: frPct(local), tone: "blue", final: true,
        rows: [
          { label: "CMPC monnaie du taux sans risque", value: frPct(wacc) },
          { label: "Inflation monnaie locale", value: frPct(p.inflation_local) },
          { label: "Inflation monnaie du taux sans risque", value: frPct(p.inflation_ref) },
          { label: "CMPC en monnaie locale", value: frPct(local), strong: true }
        ],
        methodology: "Conversion du CMPC exprimé dans la monnaie du taux sans risque vers la monnaie locale par le différentiel d'inflation attendu, selon la parité des pouvoirs d'achat.",
        source: "Prévisions d'inflation des deux zones monétaires, saisies dans l'onglet Paramètres.",
        hypothesis: "Différentiel d'inflation constant sur l'horizon ; les flux actualisés doivent être exprimés dans la même monnaie que ce taux.",
        formula: [
          "CMPC loc. = (1 + CMPC) × (1 + infl. loc.) / (1 + infl. réf.) − 1",
          "= " + frNum(1 + wacc, 4) + " × " + frNum(1 + p.inflation_local, 4) + " / " + frNum(1 + p.inflation_ref, 4) + " − 1 = " + frPct(local)
        ]
      }
    ];

    return {
      fiscalYear: "Exercice " + p.year,
      chips: [p.country, p.industry],
      market: [
        { label: "Prime de risque pays", value: frPct(crp) },
        { label: "Beta désendetté", value: frNum(beta, 3) },
        { label: "Gearing sectoriel", value: frNum(de, 2) }
      ],
      notes: notes,
      result: {
        wacc: frPct(wacc), ke: frPct(re), kd: frPct(rdPost), local: frPct(local),
        structure: frPct(ev, 0) + " / " + frPct(dv, 0),
        equityPct: ev * 100, debtPct: dv * 100
      },
      components: components
    };
  }

  /* ================= Onglets ================= */
  function renderTabs() {
    // L'onglet Sociétés n'existe que sous référentiel BRVM.
    if (!estBrvm() && tab === "societes") tab = "params";
    $("tabSocietes").hidden = !estBrvm();

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.classList.toggle("is-active", b.dataset.tab === tab);
    });
    $("panel-params").hidden = tab !== "params";
    $("panel-wacc").hidden = tab !== "wacc";
    $("panel-societes").hidden = tab !== "societes";
    if (tab === "wacc" || tab === "societes") requestAnimationFrame(placeArrows);
  }
  document.querySelectorAll(".tabs button").forEach((b) => {
    b.addEventListener("click", () => { tab = b.dataset.tab; renderTabs(); });
  });

  /* ================= Onglet Paramètres ================= */
  function optionsHtml(key, options) {
    // Une option est soit une valeur brute, soit un couple [valeur, libellé].
    return options
      .map((o) => (Array.isArray(o) ? o : [o, o]))
      .map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(params[key]) ? " selected" : ""}>${esc(l)}</option>`)
      .join("");
  }

  function selectField(key, label, options) {
    return `
      <span class="field">
        <span class="field-label">${esc(label)}</span>
        <span class="select-wrap">
          <select data-param="${key}">
            ${optionsHtml(key, options)}
          </select>
          ${CHEVRON}
        </span>
      </span>`;
  }

  // Menu à deux niveaux : les pays sont présentés par continent. `groupes` est
  // [[continent, [pays...]], ...] ; on retombe sur la liste plate si le jeu de
  // données est ancien et ne porte pas encore le découpage.
  function selectFieldGroupe(key, label, groupes, repli) {
    if (!Array.isArray(groupes) || !groupes.length) return selectField(key, label, repli || []);
    return `
      <span class="field">
        <span class="field-label">${esc(label)}</span>
        <span class="select-wrap">
          <select data-param="${key}">
            ${groupes.map(([groupe, membres]) => `<optgroup label="${esc(groupe)}">${optionsHtml(key, membres)}</optgroup>`).join("")}
          </select>
          ${CHEVRON}
        </span>
      </span>`;
  }

  /* ================= Découpage géographique ================= */
  const TOUS = "Tous";

  function groupesPays() { return DATA.options.countries_grouped || []; }
  function continents() { return groupesPays().map(([c]) => c); }
  function zonesDuContinent(c) { return (DATA.options.zones_par_continent || {})[c] || []; }
  function continentDe(pays) { const e = DATA.pays[pays]; return e && e.continent ? e.continent : null; }
  function zoneDe(pays) { const e = DATA.pays[pays]; return e && e.zone ? e.zone : null; }

  // La zone affine le continent : sans zone on retombe sur le continent, sans
  // continent sur la liste entière.
  function paysVisibles() {
    const groupes = groupesPays();
    if (params.continent === TOUS) return groupes.flatMap(([, m]) => m);
    if (params.zone) {
      const z = zonesDuContinent(params.continent).find(([nom]) => nom === params.zone);
      if (z) return z[1];
    }
    const t = groupes.find(([c]) => c === params.continent);
    return t ? t[1] : groupes.flatMap(([, m]) => m);
  }

  function champPays(label) {
    return params.continent === TOUS
      ? selectFieldGroupe("country", label, groupesPays(), DATA.options.countries)
      : selectField("country", label, paysVisibles());
  }

  /* ---------- Effectifs de sociétés ---------- */
  // Les effectifs viennent des seules sociétés réellement référencées. À ce jour
  // la place d'Abidjan, soit sept pays et une seule zone sur dix-huit : partout
  // ailleurs le compte est nul, et le panneau doit l'écrire plutôt que d'afficher
  // un tiret qu'on lirait comme une donnée manquante.
  function industrieCourante() { return estBrvm() ? params.industrie_brvm : null; }

  function effectif(zone) {
    const bloc = (DATA.zones_societes || {})[zone];
    if (!bloc) return { total: 0, n: null, places: [] };
    const ind = industrieCourante();
    const detail = ind && bloc.industries ? bloc.industries[ind] : null;
    return {
      total: bloc.total || 0,
      n: detail ? detail.n : null,
      places: Object.keys((detail ? detail.places : bloc.places) || {}),
    };
  }

  /* ---------- Carte ---------- */
  // Une teinte par continent, éclaircie zone par zone : les zones d'un même
  // continent se distinguent sans changer de famille de couleur. Rien ici ne
  // code un montant.
  const TEINTES = {
    "Afrique": "#c2683a", "Amériques": "#1d4ed8", "Asie": "#0f6f5c",
    "Europe": "#6d4bb0", "Océanie": "#8a6d1f", "Autres": "#71717a",
  };
  function teinte(continent) { return TEINTES[continent] || TEINTES["Autres"]; }

  function teinteZone(continent, rang, total) {
    const base = teinte(continent);
    const l = total > 1 ? rang / (total - 1) : 0;
    return "color-mix(in srgb, " + base + " " + (100 - Math.round(l * 45)) + "%, white)";
  }

  function pointsDe(noms) {
    const pts = DATA.carte ? DATA.carte.points || {} : {};
    return noms.map((n) => (pts[n] ? { nom: n, x: pts[n][0], y: pts[n][1] } : null)).filter(Boolean);
  }

  function enveloppe(points) {
    if (points.length < 3) return points.slice();
    const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const croix = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const bas = [], haut = [];
    for (const q of p) {
      while (bas.length >= 2 && croix(bas[bas.length - 2], bas[bas.length - 1], q) <= 0) bas.pop();
      bas.push(q);
    }
    for (let i = p.length - 1; i >= 0; i--) {
      const q = p[i];
      while (haut.length >= 2 && croix(haut[haut.length - 2], haut[haut.length - 1], q) <= 0) haut.pop();
      haut.push(q);
    }
    bas.pop(); haut.pop();
    return bas.concat(haut);
  }

  // Contour schématique d'une zone : enveloppe convexe de ses pays, dilatée pour
  // que le trait ne passe pas sur les points eux-mêmes. Ce n'est pas une
  // frontière, c'est un repère de lecture.
  function contourZone(points, marge) {
    if (!points.length) return "";
    const cx = points.reduce((s, p) => s + p[0], 0) / points.length;
    const cy = points.reduce((s, p) => s + p[1], 0) / points.length;
    if (points.length < 3) {
      const r = (points.length === 1 ? 2.6 : 3.4) + marge;
      return "M" + (cx - r) + " " + cy + "a" + r + " " + r + " 0 1 0 " + (r * 2) + " 0a" + r + " " + r + " 0 1 0 " + (-r * 2) + " 0Z";
    }
    const dilate = enveloppe(points).map(([x, y]) => {
      const dx = x - cx, dy = y - cy;
      const d = Math.hypot(dx, dy) || 1;
      return [x + (dx / d) * marge, y + (dy / d) * marge];
    });
    return "M" + dilate.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join("L") + "Z";
  }

  function cadre(points, marge) {
    const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
    const x0 = Math.min.apply(null, xs) - marge, x1 = Math.max.apply(null, xs) + marge;
    const y0 = Math.min.apply(null, ys) - marge, y1 = Math.max.apply(null, ys) + marge;
    // Rapport 2:1 imposé, sinon un continent étiré déforme le fond de carte.
    let w = x1 - x0, h = y1 - y0;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    if (w / h < 2) w = h * 2; else h = w / 2;
    return { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
  }

  /* ---------- Globe, pour le continent « Tous » ---------- */
  let globeLon = 15, globeLat = 12;
  let anneauxCache = null;

  // Le fond est stocké projeté en équirectangulaire ; on en redéduit lon/lat
  // pour le reprojeter en orthographique. x = lon + 180 et y = 90 - lat.
  function anneaux() {
    if (anneauxCache) return anneauxCache;
    const fond = DATA.carte ? DATA.carte.fond || "" : "";
    anneauxCache = fond.split("Z").filter(Boolean).map((bloc) =>
      bloc.replace("M", "").split("L").map((couple) => {
        const paire = couple.trim().split(/\s+/).map(Number);
        return [paire[0] - 180, 90 - paire[1]];
      })
    );
    return anneauxCache;
  }

  const RAD = Math.PI / 180;
  function ortho(lon, lat, R, cx, cy) {
    const dl = (lon - globeLon) * RAD, la = lat * RAD, l0 = globeLat * RAD;
    const visible = Math.sin(l0) * Math.sin(la) + Math.cos(l0) * Math.cos(la) * Math.cos(dl) > 0;
    return {
      visible: visible,
      x: cx + R * Math.cos(la) * Math.sin(dl),
      y: cy - R * (Math.cos(l0) * Math.sin(la) - Math.sin(l0) * Math.cos(la) * Math.cos(dl)),
    };
  }

  function globeHtml() {
    const R = 84, cx = 90, cy = 90;
    const terres = anneaux().map((ring) => {
      let d = "", ouvert = false;
      for (const couple of ring) {
        const p = ortho(couple[0], couple[1], R, cx, cy);
        if (!p.visible) { ouvert = false; continue; }
        d += (ouvert ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1);
        ouvert = true;
      }
      return d;
    }).filter(Boolean).join("");

    const pts = DATA.carte ? DATA.carte.points || {} : {};
    const pastilles = Object.keys(pts).map((nom) => {
      const p = ortho(pts[nom][0] - 180, 90 - pts[nom][1], R, cx, cy);
      if (!p.visible) return "";
      const actif = params.country === nom;
      return '<circle class="pin' + (actif ? " is-on" : "") + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
        '" r="' + (actif ? 3 : 1.6) + '" fill="' + teinte(continentDe(nom)) + '" data-pays="' + esc(nom) +
        '"><title>' + esc(nom) + "</title></circle>";
    }).join("");

    return '<svg class="carte carte-globe" viewBox="0 0 180 180" role="img" aria-label="Globe des pays disponibles">' +
      '<circle class="globe-mer" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/>' +
      '<path class="carte-fond" d="' + terres + '"/>' + pastilles + "</svg>";
  }

  /* ---------- Carte d'un continent ---------- */
  function continentHtml(continent) {
    const zonesList = zonesDuContinent(continent);
    const tousPoints = pointsDe(zonesList.flatMap(([, membres]) => membres));
    if (!tousPoints.length) return "";
    const vue = cadre(tousPoints, 6);
    const marge = Math.max(1.5, vue.w * 0.012);

    // Les enveloppes se recouvrent — les Caraïbes tombent dans celle de
    // l'Amérique latine, le Moyen-Orient dans celle de l'Asie. On trace les plus
    // étendues en premier pour que les plus petites restent cliquables et
    // lisibles au-dessus.
    const aires = zonesList
      .map(([zone, membres], i) => {
        const pts = pointsDe(membres).map((p) => [p.x, p.y]);
        if (!pts.length) return null;
        const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
        const etendue = (Math.max.apply(null, xs) - Math.min.apply(null, xs) + 1) *
                        (Math.max.apply(null, ys) - Math.min.apply(null, ys) + 1);
        return { zone: zone, membres: membres, pts: pts, rang: i, etendue: etendue };
      })
      .filter(Boolean)
      .sort((a, b) => b.etendue - a.etendue)
      .map((z) => '<path class="zone' + (params.zone === z.zone ? " is-on" : "") +
        '" d="' + contourZone(z.pts, marge) + '" fill="' + teinteZone(continent, z.rang, zonesList.length) +
        '" data-zone="' + esc(z.zone) + '"><title>' + esc(z.zone) + " — " + z.membres.length +
        " pays</title></path>")
      .join("");

    const pastilles = tousPoints.map((p) => {
      const actif = params.country === p.nom;
      const attenue = params.zone && zoneDe(p.nom) !== params.zone;
      return '<circle class="pin' + (actif ? " is-on" : "") + (attenue ? " is-off" : "") +
        '" cx="' + p.x + '" cy="' + p.y + '" r="' + (actif ? vue.w * 0.014 : vue.w * 0.008).toFixed(2) +
        '" data-pays="' + esc(p.nom) + '"><title>' + esc(p.nom) + "</title></circle>";
    }).join("");

    return '<svg class="carte" viewBox="' + vue.x.toFixed(1) + " " + vue.y.toFixed(1) + " " +
      vue.w.toFixed(1) + " " + vue.h.toFixed(1) + '" role="img" aria-label="Carte de ' + esc(continent) +
      '" preserveAspectRatio="xMidYMid meet"><path class="carte-fond" d="' + DATA.carte.fond + '"/>' +
      aires + pastilles + "</svg>";
  }

  function carteHtml() {
    if (!DATA.carte || !DATA.carte.fond) return "";
    const monde = params.continent === TOUS;
    const svg = monde ? globeHtml() : continentHtml(params.continent);
    if (!svg) return "";
    const note = monde
      ? "Vue d'ensemble. Choisissez un continent pour en détailler les zones."
      : "Survolez une zone pour la mettre en évidence, cliquez-la pour n'en garder que les pays. Les teintes distinguent les zones et ne codent aucun montant ; les contours sont schématiques, ce ne sont pas des frontières.";
    return '<div class="carte-bloc">' + svg + '<span class="note">' + esc(note) + "</span></div>";
  }

  /* ---------- Panneau des zones ---------- */
  function panneauZones() {
    if (params.continent === TOUS) {
      return '<span class="note">Choisissez un continent pour voir ses zones et les sociétés référencées.</span>';
    }
    const zonesList = zonesDuContinent(params.continent);
    const ind = industrieCourante();
    const lignes = zonesList.map(([zone, membres], i) => {
      const e = effectif(zone);
      const valeur = ind ? e.n : e.total;
      const choisie = params.zone === zone;
      const compte = valeur ? valeur + " société" + (valeur > 1 ? "s" : "") : "aucune société";
      const places = valeur && e.places.length
        ? '<span class="zone-places">' + e.places.map(esc).join(" · ") + "</span>" : "";
      return '<button type="button" class="zone-ligne' + (choisie ? " is-on" : "") + '" data-zone="' + esc(zone) + '">' +
        '<span class="zone-puce" style="background:' + teinteZone(params.continent, i, zonesList.length) + '"></span>' +
        '<span class="zone-nom">' + esc(zone) + "</span>" +
        '<span class="zone-pays">' + membres.length + " pays</span>" +
        '<span class="zone-compte' + (valeur ? "" : " is-vide") + '">' + compte + "</span>" +
        places + "</button>";
    }).join("");
    const rappel = ind
      ? "Effectifs pour « " + ind + " ». Le détail société par société est dans l'onglet Sociétés."
      : "Les sociétés référencées proviennent de la place d'Abidjan, qui ne couvre qu'une zone à ce jour. Passez au référentiel Comparables pour filtrer par industrie.";
    return '<div class="zones-liste">' + lignes + '</div><span class="note">' + esc(rappel) + "</span>";
  }

  function stepperField(item) {
    return `
      <span class="field">
        <span style="display:grid;gap:2px">
          <span class="field-label">${esc(item.label)}</span>
          <span class="field-hint">${esc(item.hint)}</span>
        </span>
        <span class="stepper">
          <span class="stepper-value">${frPct(params[item.key])}</span>
          <span class="stepper-btns">
            <button type="button" data-step="${item.key}" data-dir="-1">−</button>
            <button type="button" data-step="${item.key}" data-dir="1">+</button>
          </span>
        </span>
      </span>`;
  }

  function blocDamodaran() {
    const chips = model.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("");
    return `
      <section class="card-block">
        <span class="block-head">
          <h2>Données de marché</h2>
          <span class="chips">${chips}</span>
        </span>
        <div class="tiles">
          ${model.market.map((m) => `
            <span class="tile">
              <span class="tile-label">${esc(m.label)}</span>
              <span class="tile-value">${esc(m.value)}</span>
            </span>`).join("")}
        </div>
        ${model.notes.length ? `<span class="note">${model.notes.map(esc).join(" · ")}</span>` : ""}
      </section>`;
  }

  const APERCU_MAX = 4;   // aperçu volontairement court : le détail est dans l'onglet Sociétés

  function blocBrvm() {
    const ind = industrieBrvm();
    const tickers = ind ? ind.tickers : [];
    // Les plus grosses capitalisations d'abord : ce sont elles qui portent le secteur.
    const apercu = tickers.slice()
      .sort((a, b) => (BRVM.societes[b].capitalisation || 0) - (BRVM.societes[a].capitalisation || 0))
      .slice(0, APERCU_MAX);
    const reste = tickers.length - apercu.length;

    const lignes = apercu.map((t) => {
      const s = BRVM.societes[t];
      return `
        <span class="soc-line">
          <span class="soc-ident">
            <span class="soc-flag">${s.drapeau}</span>
            <span class="soc-nom">${esc(s.nom)}</span>
            <span class="soc-pays">${esc(t)}</span>
          </span>
          <span class="soc-cap">${esc(frMontant(s.capitalisation))}</span>
        </span>`;
    }).join("") + (reste > 0
      ? `<span class="soc-line is-more">+ ${reste} autre${reste > 1 ? "s" : ""} société${reste > 1 ? "s" : ""} dans l'onglet Sociétés</span>`
      : "");

    return `
      <section class="card-block">
        <span class="block-head">
          <h2>Comparables</h2>
          <span class="chips">
            <span class="chip">${tickers.length} société${tickers.length > 1 ? "s" : ""}</span>
            <span class="chip is-accent">Comparables</span>
          </span>
        </span>
        <div class="soc-list">${lignes}</div>
        <span class="note">Sociétés cotées au ${esc((BRVM.maj || "").slice(0, 10))}, capitalisation en millions FCFA. Le détail de chacune est dans l'onglet Sociétés.</span>
      </section>`;
  }

  function renderParams() {
    const referentiels = BRVM
      // La valeur reste « brvm » : elle circule dans les liens partagés et dans
      // estBrvm(). Seul le libellé affiché change.
      ? selectField("referentiel", "Référentiel", [["damodaran", "Damodaran"], ["brvm", "Comparables"]])
      : "";

    // Sous référentiel BRVM, la maturité se choisit sur la courbe souveraine de
    // l'État retenu, dont la profondeur varie de 7 à 15 ans selon l'émetteur.
    const courbe = estBrvm() ? courbePays() : null;
    const champMaturite = courbe
      ? selectField("maturite_uemoa", "Maturité sur la courbe souveraine", courbe.points.map((p) => p[0]))
      : selectField("maturity", "Maturité du taux sans risque", DATA.options.maturities);

    // L'industrie change de taxonomie selon le référentiel : les 12 secteurs des
    // comparables, ou les 94 d'un référentiel de marché.
    const champIndustrie = estBrvm() && BRVM
      ? selectField("industrie_brvm", "Industrie", BRVM.industries.map((i) => i.nom))
      : selectField("industry", "Industrie", DATA.options.industries);

    $("paramsMain").innerHTML = `
      <section class="card-block">
        <h2>Contexte de marché</h2>
        <div class="grid-2">
          ${selectField("year", "Année de valorisation", DATA.options.years)}
          ${champMaturite}
          ${referentiels}
          ${selectField("continent", "Continent", [TOUS].concat(continents()))}
        </div>
      </section>

      <section class="card-block">
        <h2>Zone géographique</h2>
        <div class="geo">
          <div class="geo-carte">${carteHtml()}</div>
          <div class="geo-choix">
            ${panneauZones()}
            ${champIndustrie}
            ${champPays("Pays")}
          </div>
        </div>
      </section>

      ${estBrvm() ? blocBrvm() : blocDamodaran()}

      <section class="card-block">
        <h2>Paramètres manuels</h2>
        <div class="grid-2">${MANUAL.map(stepperField).join("")}</div>
      </section>`;

    if (estBrvm()) {
      const ind = industrieBrvm();
      const tickers = ind ? ind.tickers : [];
      const betas = tickers.map((t) => BRVM.societes[t].beta).filter((b) => b != null);
      const caps = tickers.map((t) => BRVM.societes[t].capitalisation).filter((c) => c != null);
      const rf = tauxSansRisque();
      const dateCourbe = BRVM.courbes ? (BRVM.courbes.date || "") : "";
      $("paramsResult").innerHTML = `
        <h2>Secteur BRVM</h2>
        <span class="result-hero">
          <span class="field-label">CMPC calculé</span>
          <span class="result-hero-row">
            <span class="result-hero-value" style="color:var(--muted-2)">—</span>
          </span>
        </span>
        <span class="result-rows">
          <span class="result-row"><span>Sociétés du secteur</span><span>${tickers.length}</span></span>
          <span class="result-row"><span>Bêta coté moyen</span><span>${betas.length ? frNum(betas.reduce((a, b) => a + b, 0) / betas.length, 2) : "—"}</span></span>
          <span class="result-row"><span>Capitalisation cumulée</span><span>${esc(frMontant(caps.reduce((a, b) => a + b, 0)))}</span></span>
          <span class="result-row"><span>Taux sans risque ${rf ? esc(rf.libelle) : ""}</span><span>${rf ? frPct(rf.taux) : "indisponible"}</span></span>
          <span class="result-row"><span>Gearing sectoriel</span><span>à définir</span></span>
        </span>
        <button type="button" class="cta" id="goSoc">Voir les sociétés</button>
        <span class="note">${rf
          ? `Taux souverain ${esc(rf.pays)} au ${esc(dateCourbe)}, publié par UMOA-Titres. Il porte déjà le risque pays : aucune prime ne s'y ajoute, et le coût du capital qui en découlera sera directement en monnaie locale.`
          : "Courbe souveraine indisponible pour ce pays."} Le CMPC reste en attente du gearing sectoriel. Les bêtas affichés sont les bêtas cotés à un an, non désendettés.</span>`;
      $("goSoc").addEventListener("click", () => { tab = "societes"; renderTabs(); });
      brancherChamps();
      return;
    }

    const r = model.result;
    $("paramsResult").innerHTML = `
      <h2>Résultat</h2>
      <span class="result-hero">
        <span class="field-label">CMPC calculé</span>
        <span class="result-hero-row">
          <span class="result-hero-value">${esc(r.wacc)}</span>
        </span>
      </span>
      <span class="result-rows">
        <span class="result-row"><span>Ke, capitaux propres</span><span>${esc(r.ke)}</span></span>
        <span class="result-row"><span>Kd, dette après impôt</span><span>${esc(r.kd)}</span></span>
        <span class="result-row is-blue"><span>CMPC monnaie locale</span><span>${esc(r.local)}</span></span>
      </span>
      <span class="structure">
        <span class="structure-head"><span>Structure cible</span><span>${esc(r.structure)}</span></span>
        <span class="bar">
          <span class="eq" style="width:${r.equityPct}%"></span>
          <span class="dt" style="width:${r.debtPct}%"></span>
        </span>
      </span>
      <button type="button" class="cta" id="goWacc">Voir le détail du CMPC</button>
      <span class="note">Le CMPC est recalculé à chaque modification. Le taux sans risque, la prime de risque marché et le bêta proviennent de la base de marché.</span>`;

    $("goWacc").addEventListener("click", () => { tab = "wacc"; renderTabs(); });
    brancherChamps();
  }

  function brancherChamps() {
    $("paramsMain").querySelectorAll("select[data-param]").forEach((sel) => {
      sel.addEventListener("change", () => setParam(sel.dataset.param, sel.value));
    });
    $("paramsMain").querySelectorAll("circle[data-pays]").forEach((pin) => {
      pin.addEventListener("click", () => setParam("country", pin.dataset.pays));
    });
    $("paramsMain").querySelectorAll("[data-zone]").forEach((el) => {
      el.addEventListener("click", () => setParam("zone", el.dataset.zone));
    });
    $("paramsMain").querySelectorAll("button[data-step]").forEach((btn) => {
      btn.addEventListener("click", () => bumpParam(btn.dataset.step, Number(btn.dataset.dir)));
    });
  }

  /* ================= Colonnes de cartes (CMPC et Sociétés) ================= */
  function renderStack(cle) {
    const pan = PANNEAUX[cle];
    $(pan.stack).innerHTML = pan.items.map((c) => `
      <div class="comp${c.tone && c.tone !== "accent" ? " tone-" + c.tone : ""}${c.final ? " is-final" : ""}" data-comp="${esc(c.id)}">
        <button type="button" class="comp-head" aria-expanded="false">
          <span class="comp-title">${c.titleHtml || esc(c.title)}</span>
          <span class="comp-value">${esc(c.value)}</span>
        </button>
        <div class="comp-wrap"><div class="comp-clip"><div class="comp-body">
          <span class="sub-rows">
            ${(c.rows || []).map((r) => `
              <span class="sub-row${r.strong ? " is-strong" : ""}">
                <span>${esc(r.label)}</span><span>${esc(r.value)}</span>
              </span>`).join("")}
          </span>
        </div></div></div>
      </div>`).join("");

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      el.querySelector(".comp-head").addEventListener("click", () => toggle(cle, el.dataset.comp));
    });
  }

  function renderFrame(cle) {
    const pan = PANNEAUX[cle];
    const attente = `
      <div class="detail-vide${pan.ouvert ? " is-cache" : ""}" data-vide="1">
        <span class="titre">${esc(pan.vide.titre)}</span>
        <span class="texte">${esc(pan.vide.texte)}</span>
      </div>`;
    $(pan.frame).innerHTML = attente + pan.items.map((c) => `
      <div class="detail${c.tone && c.tone !== "accent" ? " tone-" + c.tone : ""}" data-detail="${esc(c.id)}">
        ${pan.detail(c)}
      </div>`).join("");
  }

  function toggle(cle, id) {
    const pan = PANNEAUX[cle];
    pan.ouvert = pan.ouvert === id ? null : id;
    const item = pan.items.find((c) => c.id === pan.ouvert);
    const tone = item && item.tone && item.tone !== "accent" ? item.tone : null;

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      const on = el.dataset.comp === pan.ouvert;
      el.classList.toggle("is-open", on);
      el.querySelector(".comp-head").setAttribute("aria-expanded", on ? "true" : "false");
    });
    $(pan.frame).querySelectorAll(".detail").forEach((el) => {
      el.classList.toggle("is-shown", el.dataset.detail === pan.ouvert);
    });
    const attente = $(pan.frame).querySelector(".detail-vide");
    if (attente) attente.classList.toggle("is-cache", Boolean(pan.ouvert));

    const col = $(pan.col);
    col.classList.toggle("is-on", Boolean(pan.ouvert));
    col.classList.remove("tone-green", "tone-blue");
    if (tone) col.classList.add("tone-" + tone);

    placeArrow(cle);
    setTimeout(() => placeArrow(cle), 200);
    setTimeout(() => placeArrow(cle), 460);
  }

  function placeArrow(cle) {
    const pan = PANNEAUX[cle];
    if (!pan.ouvert) return;
    const col = $(pan.col);
    const head = $(pan.stack).querySelector('.comp[data-comp="' + CSS.escape(pan.ouvert) + '"] .comp-head');
    if (!head) return;
    const cr = col.getBoundingClientRect();
    const hr = head.getBoundingClientRect();
    const max = Math.max(40, cr.height - 30);
    const y = hr.top + hr.height / 2 - cr.top - 6;
    $(pan.arrow).style.top = Math.round(Math.min(max, Math.max(16, y))) + "px";
  }

  function placeArrows() {
    Object.keys(PANNEAUX).forEach(placeArrow);
  }

  window.addEventListener("resize", placeArrows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeArrows);

  /* ---- Détail d'une composante du CMPC ---- */
  function detailComposante(c) {
    const compo = c.composition ? `
      <span class="composition">
        <span class="bar">
          <span class="eq" style="width:${c.composition.equityPct}%"></span>
          <span class="dt" style="width:${c.composition.debtPct}%"></span>
        </span>
        <span class="composition-legend">
          <span>Fonds propres ${esc(c.composition.equity)}</span>
          <span>Dette ${esc(c.composition.debt)}</span>
        </span>
      </span>` : "";
    const rows = [
      ["Méthodologie", c.methodology],
      ["Source", c.source],
      ["Hypothèse", c.hypothesis],
      ["Retenu", c.retained]
    ].filter(([, t]) => Boolean(t));
    return `
      <span class="detail-head">
        <span class="detail-title">${esc(c.title)}</span>
        <span class="detail-symbol">${esc(c.symbol)}</span>
      </span>
      ${compo}
      <span class="detail-grid">
        ${rows.map(([l, t]) => `<span class="detail-label">${esc(l)}</span><span class="detail-text">${esc(t)}</span>`).join("")}
      </span>
      ${c.formula && c.formula.length ? `<code>${c.formula.map(esc).join("<br>")}</code>` : ""}`;
  }

  /* ---- Détail d'une société cotée ---- */
  function detailSociete(c) {
    const s = c.societe;
    const annees = s.annees || [];
    const postes = [
      ["Chiffre d'affaires", s.ca],
      ["EBITDA", s.ebitda],
      ["Charges d'exploitation", s.charges],
      ["Résultat net", s.rn],
      ["Capitaux propres", s.capitaux_propres],
      ["Dette nette", s.dette_nette]
    ];
    const lignes = postes.map(([libelle, serie]) => `
      <tr>
        <td>${esc(libelle)}</td>
        ${annees.map((a) => `<td>${esc(frMontant((serie || {})[String(a)]))}</td>`).join("")}
      </tr>`).join("");

    return `
      <span class="detail-head">
        <span class="detail-title">${s.drapeau} ${esc(s.nom)}</span>
        <span class="detail-symbol">${esc(c.id)}</span>
      </span>
      <span class="detail-grid">
        <span class="detail-label">Pays</span><span class="detail-text">${esc(s.pays)}</span>
        <span class="detail-label">Capitalisation</span><span class="detail-text">${esc(frMontant(s.capitalisation))} FCFA</span>
        <span class="detail-label">Bêta 1 an</span><span class="detail-text">${s.beta == null ? "non publié" : frNum(s.beta, 2)}</span>
        ${s.presentation ? `<span class="detail-label">Activité</span><span class="detail-text">${esc(s.presentation)}</span>` : ""}
      </span>
      <table class="fin-table">
        <thead><tr><th>En millions FCFA</th>${annees.map((a) => `<th>${a}</th>`).join("")}</tr></thead>
        <tbody>${lignes}</tbody>
      </table>`;
  }

  /* ---- Alimentation des deux colonnes ---- */
  function chargerCmpc() {
    const pan = PANNEAUX.cmpc;
    pan.detail = detailComposante;
    pan.items = estBrvm() ? [] : model.components;
    if (estBrvm()) {
      $(pan.stack).innerHTML = `
        <div class="notice">
          <h3>Calcul en attente</h3>
          <p>Le référentiel BRVM ne dispose pas encore de son taux sans risque ni de son
          gearing sectoriel : le CMPC n'est donc pas calculé ici. Les bêtas cotés, les
          capitalisations et les états financiers des sociétés du secteur sont consultables
          dans l'onglet Sociétés.</p>
          <p>Bascule sur le référentiel Damodaran pour un calcul complet.</p>
        </div>`;
      $(pan.frame).innerHTML = "";
      $(pan.col).classList.remove("is-on");
      pan.ouvert = null;
      return;
    }
    renderStack("cmpc");
    renderFrame("cmpc");
  }

  // Marge d'EBITDA du dernier exercice où les deux postes sont renseignés.
  // Les banques ne publient pas d'EBITDA : la ligne le dit plutôt que d'afficher 0.
  function margeEbitda(s) {
    for (const annee of (s.annees || []).slice().reverse()) {
      const ebitda = (s.ebitda || {})[String(annee)];
      const ca = (s.ca || {})[String(annee)];
      if (ebitda != null && ca) {
        return { label: `Marge d'EBITDA ${annee}`, value: frPct(ebitda / ca, 1) };
      }
    }
    return { label: "Marge d'EBITDA", value: "non publiée" };
  }

  function chargerSocietes() {
    const pan = PANNEAUX.soc;
    pan.detail = detailSociete;
    const ind = industrieBrvm();
    // Même ordre que l'aperçu des paramètres : les plus grosses capitalisations d'abord.
    const tickers = !ind ? [] : ind.tickers.slice()
      .sort((a, b) => (BRVM.societes[b].capitalisation || 0) - (BRVM.societes[a].capitalisation || 0));
    pan.items = tickers.map((t) => {
      const s = BRVM.societes[t];
      const derniere = (s.annees || []).slice(-1)[0];
      const val = (serie) => frMontant((serie || {})[String(derniere)]);
      return {
        id: t,
        title: s.nom,
        titleHtml: `<span class="soc-flag">${s.drapeau}</span> ${esc(s.nom)}`,
        value: frMontant(s.capitalisation),
        societe: s,
        rows: [
          { label: "Pays", value: s.pays },
          { label: "Bêta 1 an", value: s.beta == null ? "non publié" : frNum(s.beta, 2) },
          { label: `Chiffre d'affaires ${derniere || ""}`.trim(), value: val(s.ca), strong: true },
          margeEbitda(s),
          { label: `Résultat net ${derniere || ""}`.trim(), value: val(s.rn) },
          { label: `Capitaux propres ${derniere || ""}`.trim(), value: val(s.capitaux_propres) }
        ]
      };
    });
    renderStack("soc");
    renderFrame("soc");
  }

  /* ================= Paramètres et URL ================= */
  // Après un changement de continent ou de zone, le pays retenu peut être sorti
  // de la liste visible. On le remplace par le premier de la nouvelle liste.
  function recalerPays() {
    const visibles = paysVisibles();
    if (visibles.length && !visibles.includes(params.country)) params.country = visibles[0];
  }

  function setParam(key, value) {
    if (key === "year") {
      value = Number(value);
    } else if (key === "continent") {
      // Changer de continent ne doit jamais laisser un pays sélectionné hors de
      // la liste visible : le menu afficherait alors une valeur absente de ses
      // options, et le navigateur retomberait silencieusement sur la première.
      params.continent = value;
      params.zone = null;          // la zone appartenait au continent précédent
      recalerPays();
      apply();
      return;
    } else if (key === "zone") {
      // Recliquer la zone déjà retenue la désélectionne : c'est le seul moyen de
      // revenir au continent entier sans passer par le menu.
      params.zone = params.zone === value ? null : value;
      recalerPays();
      apply();
      return;
    } else if (key === "country") {
      // Choisir un pays hors du filtre courant déplace le filtre plutôt que
      // d'ignorer le clic.
      const cont = continentDe(value);
      if (params.continent !== TOUS && cont && cont !== params.continent) {
        params.continent = cont;
        params.zone = null;
      }
      if (params.zone && zoneDe(value) !== params.zone) params.zone = null;
    } else if (key === "industrie_brvm" && BRVM) {
      // Même tolérance que pour l'URL : accents et casse approximatifs acceptés,
      // et on conserve la valeur précédente plutôt qu'un libellé inconnu.
      value = resolveOption(value, BRVM.industries.map((i) => i.nom)) || params.industrie_brvm;
    }
    params[key] = value;
    apply();
  }

  function bumpParam(key, dir) {
    params[key] = Math.max(0, Math.round((params[key] + dir * STEPS[key]) * 1000) / 1000);
    apply();
  }

  function apply() {
    model = computeModel(params);
    renderAll();
    // L'URL porte la configuration : un lien copié rouvre le même calcul.
    try {
      if (window.history.replaceState) {
        window.history.replaceState(null, "", "?" + new URLSearchParams(params));
      }
    } catch (err) { /* page ouverte en fichier local : sans effet */ }
  }

  // Une URL saisie à la main peut perdre les accents ou la casse ("Cote d'Ivoire"
  // pour "Côte d'Ivoire") : on retrouve l'entrée exacte plutôt que de retomber
  // silencieusement sur les valeurs par défaut.
  function normalize(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  }

  function resolveOption(value, options) {
    if (options.includes(value)) return value;
    const target = normalize(value);
    return options.find((o) => normalize(o) === target) || null;
  }

  function readUrlParams() {
    let query;
    try { query = new URLSearchParams(window.location.search); } catch (err) { return; }
    if (query.has("maturity") && DATA.options.maturities.includes(query.get("maturity"))) {
      params.maturity = query.get("maturity");
    }
    if (BRVM && query.has("referentiel") && ["damodaran", "brvm"].includes(query.get("referentiel"))) {
      params.referentiel = query.get("referentiel");
    }
    if (BRVM && query.has("industrie_brvm")) {
      const trouvee = resolveOption(query.get("industrie_brvm"), BRVM.industries.map((i) => i.nom));
      if (trouvee) params.industrie_brvm = trouvee;
    }
    for (const [key, list] of [["country", DATA.options.countries], ["industry", DATA.options.industries]]) {
      if (query.has(key)) {
        const found = resolveOption(query.get(key), list);
        if (found) params[key] = found;
      }
    }
    if (query.has("year")) {
      const year = Number(query.get("year"));
      if (DATA.options.years.includes(year)) params.year = year;
    }
    for (const key of ["d", "e", "inflation_ref", "inflation_local"]) {
      if (query.has(key)) {
        const value = Number(query.get(key));
        if (Number.isFinite(value)) params[key] = value;
      }
    }
  }

  function renderAll() {
    $("fiscal").textContent = model.fiscalYear;
    renderParams();

    // On mémorise la carte dépliée pour la rouvrir après redessin, si elle existe encore.
    const ouverts = { cmpc: PANNEAUX.cmpc.ouvert, soc: PANNEAUX.soc.ouvert };
    PANNEAUX.cmpc.ouvert = null;
    PANNEAUX.soc.ouvert = null;

    chargerCmpc();
    if (BRVM) chargerSocietes();

    for (const cle of ["cmpc", "soc"]) {
      const garde = ouverts[cle];
      if (garde && PANNEAUX[cle].items.some((c) => c.id === garde)) toggle(cle, garde);
    }
    renderTabs();
  }

  readUrlParams();
  model = computeModel(params);
  renderTabs();
  renderAll();
</script>
</body>
</html>

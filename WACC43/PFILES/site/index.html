<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wacc43 — Coût moyen pondéré du capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f7;
    --surface: #ffffff;
    --line: #e4e4e7;
    --ink: #18181b;
    --ink-2: #27272a;
    --ink-3: #3f3f46;
    --ink-4: #52525b;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --tile: #fafafa;
    --field: #f4f4f5;
    --accent: #6d4bb0;
    --accent-soft: #e8e0f4;
    --accent-tint: #faf8fd;
    --accent-chip: #d8cff0;
    --green: #0f6f5c;
    --green-soft: #c9e0d9;
    --green-tint: #f2f8f6;
    --green-line: #cfe1dc;
    --green-ink: #123f36;
    --green-bar: #7ab3a6;
    --green-track: #e2efeb;
    --blue: #1d4ed8;
    --blue-soft: #d5def8;
    --blue-tint: #f2f5fd;
    --blue-ink: #152c66;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- En-tête ---------- */
  .top {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1060px;
    margin: 0 auto;
    padding: 22px 32px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .brand-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .eyebrow {
    font: 400 10.5px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand h1 {
    margin: 0;
    font: 600 21px/1.25 var(--sans);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .fiscal {
    font: 400 11.5px/1.4 var(--mono);
    color: var(--muted);
  }
  .tabs { display: flex; gap: 26px; }
  .tabs button {
    font: 400 13px/1 var(--sans);
    color: var(--muted);
    padding: 0 0 13px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: color 240ms ease, border-color 240ms ease;
  }
  .tabs button.is-active {
    font-weight: 500;
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  /* ---------- Onglet Paramètres ---------- */
  .params {
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px 120px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 26px;
    align-items: start;
  }
  .params-main { display: grid; gap: 20px; }
  .card-block {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    display: grid;
    gap: 18px;
  }
  .card-block h2 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
    font: 400 10.5px/1 var(--mono);
    color: var(--ink-3);
  }
  .chip.is-accent {
    border-color: var(--accent-chip);
    background: var(--accent-tint);
    color: var(--accent);
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px 22px;
  }
  .field { display: grid; gap: 7px; }
  .field-label {
    font: 400 11.5px/1.4 var(--sans);
    color: var(--ink-4);
  }
  .field-hint {
    font: 400 10.5px/1.4 var(--sans);
    color: var(--muted-2);
  }
  .select-wrap { position: relative; display: grid; }
  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    padding: 11px 34px 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    font: 400 13.5px/1.2 var(--sans);
    color: var(--ink);
    cursor: pointer;
  }
  .select-wrap svg {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 10px 9px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
  }
  .stepper-value {
    font: 500 14px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .stepper-btns { display: flex; gap: 4px; }
  .stepper button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-3);
    font: 400 14px/1 var(--mono);
    cursor: pointer;
  }
  .stepper button:hover { background: var(--field); }
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .tile {
    background: var(--tile);
    padding: 13px 15px;
    display: grid;
    gap: 5px;
  }
  .tile-label {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tile-value {
    font: 500 16px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .note {
    font: 400 11px/1.6 var(--sans);
    color: var(--muted-2);
    text-wrap: pretty;
  }

  /* ---------- Carte ---------- */
  .carte-bloc {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }
  .carte {
    width: 100%;
    height: auto;
    display: block;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .carte-fond {
    fill: #e8e8ea;
    stroke: #d6d6da;
    /* Le tracé est dessiné dans un cadre de 360 unités affiché sur ~700 px :
       une épaisseur en unités du cadre serait deux fois trop épaisse. */
    stroke-width: 0.3;
  }
  .pin {
    cursor: pointer;
    transition: r 120ms ease, opacity 120ms ease;
  }
  .pin.is-off { opacity: 0.18; }
  .pin.is-on {
    stroke: var(--surface);
    stroke-width: 1.1;
    paint-order: stroke;
  }
  .pin:hover { r: 3.2; }
  .carte-globe { max-width: 320px; margin: 0 auto; }
  .globe-mer { fill: #eef1f5; stroke: var(--line); stroke-width: 0.6; }

  /* Zones : union des pays qui les composent, frontières réelles. */
  .zone {
    cursor: pointer;
    fill-opacity: 0.68;
    stroke: #ffffff;
    stroke-width: 0.25;
    stroke-linejoin: round;
    transition: fill-opacity 120ms ease;
  }
  .zone:hover { fill-opacity: 0.92; }
  .zone.is-on { fill-opacity: 1; }

  /* Deux colonnes : la carte reste à gauche, les choix passent à droite. Sans
     légende sous le tracé, la carte prend la place qu'elle mérite. */
  .geo {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .geo-choix { display: grid; gap: 16px; align-content: start; }
  @media (max-width: 860px) {
    .geo { grid-template-columns: 1fr; }
  }

  /* Pays du continent absents du jeu de données : tracés en neutre pour que le
     continent reste entier plutôt que troué. */
  .carte-hors {
    fill: #e4e4e7;
    stroke: #ffffff;
    stroke-width: 0.25;
    stroke-linejoin: round;
  }

  /* ---------- Aside résultat ---------- */
  .result {
    position: sticky;
    top: 24px;
    display: grid;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
  }
  .result h2 {
    margin: 0;
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-hero { display: grid; gap: 6px; }
  .result-hero-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-hero-value {
    font: 500 34px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--green);
  }
  .result-rows {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .result-row {
    background: var(--tile);
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 400 12px/1.4 var(--sans);
    color: var(--ink-4);
  }
  .result-row span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .result-row.is-blue span:last-child { color: var(--blue); }
  .structure { display: grid; gap: 7px; }
  .structure-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 400 11px/1 var(--mono);
    color: var(--muted);
  }
  .bar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: #ececef;
  }
  .bar .eq { background: var(--green); }
  .bar .dt { background: var(--green-bar); }
  .cta {
    padding: 11px 14px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font: 400 11.5px/1 var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .cta:hover { background: var(--ink-2); }

  /* ---------- Onglet CMPC ---------- */
  .wacc {
    max-width: 1060px;
    margin: 0 auto;
    padding: 30px 32px 120px;
    display: grid;
    grid-template-columns: 430px minmax(0, 1fr);
    gap: 52px;
    align-items: start;
  }
  .stack { display: grid; gap: 9px; }
  .comp {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    overflow: hidden;
    transition: background-color 340ms cubic-bezier(.4, 0, .2, 1),
                color 340ms cubic-bezier(.4, 0, .2, 1),
                border-color 340ms cubic-bezier(.4, 0, .2, 1);
  }
  .comp.is-final { margin-top: 9px; }
  .comp-head {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 20px;
    padding: 18px 20px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .comp.is-final .comp-head { padding: 22px 20px; }
  .comp-title { font: 500 14.5px/1.35 var(--sans); color: inherit; }
  .comp.is-final .comp-title { font-weight: 600; }
  .comp-value {
    font: 500 24px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: inherit;
  }
  .comp.is-final .comp-value { font-size: 32px; letter-spacing: -0.02em; }
  /* Cartes de sociétés : une liste de valeurs cotées se parcourt, elle ne se
     lit pas comme le résultat d'un calcul. Titres et montants y sont donc plus
     sobres que dans la cascade du CMPC. */
  #stackSoc .comp-head { padding: 13px 16px; }
  #stackSoc .comp-title { font-size: 12.5px; }
  #stackSoc .comp-value { font-size: 16px; }

  .comp.tone-green { border-color: var(--green-soft); color: var(--green); }
  .comp.tone-blue { border-color: var(--blue-soft); color: var(--blue); }
  .comp.is-open { background: var(--accent); border-color: var(--accent); color: #fff; }
  .comp.tone-green.is-open { background: var(--green); border-color: var(--green); color: #fff; }
  .comp.tone-blue.is-open { background: var(--blue); border-color: var(--blue); color: #fff; }
  .comp-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 380ms cubic-bezier(.4, 0, .2, 1);
  }
  .comp.is-open .comp-wrap { grid-template-rows: 1fr; }
  .comp-clip { overflow: hidden; }
  .comp-body {
    opacity: 0;
    transition: opacity 300ms ease 40ms;
    padding: 0 20px 18px;
  }
  .comp.is-final .comp-body { padding: 0 20px 20px; }
  .comp.is-open .comp-body { opacity: 1; }
  .sub-rows {
    display: grid;
    border-top: 1px solid rgba(255, 255, 255, .2);
    padding-top: 4px;
  }
  .sub-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .14);
    font: 400 12.5px/1.45 var(--sans);
    color: rgba(255, 255, 255, .8);
  }
  .sub-row:last-child { border-bottom: 0; }
  .sub-row.is-strong { font-weight: 500; color: #fff; }
  .sub-row span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  /* ---------- Panneau de détail ---------- */
  .frame-col { position: relative; height: 620px; }
  .frame-arrow {
    position: absolute;
    left: -7px;
    width: 13px;
    height: 13px;
    background: var(--surface);
    border-left: 1px solid var(--accent-soft);
    border-bottom: 1px solid var(--accent-soft);
    transform: rotate(45deg);
    opacity: 0;
    transition: top 420ms cubic-bezier(.4, 0, .2, 1), opacity 300ms ease, border-color 340ms ease;
  }
  /* Le cadre reste visible même sans sélection : il porte alors un message
     d'attente. Seule la flèche apparaît quand une carte est dépliée. */
  .frame {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    transition: border-color 340ms ease;
    overflow: hidden;
  }
  .frame-col.is-on .frame { border-color: var(--accent-soft); }
  .frame-col.is-on .frame-arrow { opacity: 1; }
  .detail-vide {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    padding: 24px 32px;
    text-align: center;
    opacity: 1;
    transition: opacity 300ms ease;
  }
  .detail-vide.is-cache { opacity: 0; }
  .detail-vide .titre {
    font: 400 10px/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail-vide .texte {
    max-width: 34ch;
    font: 400 13px/1.65 var(--sans);
    color: var(--muted-2);
    text-wrap: pretty;
  }
  .frame-col.tone-green .frame, .frame-col.tone-green .frame-arrow { border-color: var(--green-soft); }
  .frame-col.tone-blue .frame, .frame-col.tone-blue .frame-arrow { border-color: var(--blue-soft); }
  .detail {
    position: absolute;
    inset: 0;
    padding: 20px 22px;
    overflow: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
    display: grid;
    align-content: start;
    gap: 14px;
  }
  .detail.is-shown { opacity: 1; pointer-events: auto; }
  .detail-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .detail-title { font: 500 13px/1.3 var(--sans); color: var(--ink); }
  .detail.tone-green .detail-title { font-weight: 600; color: var(--green); }
  .detail.tone-blue .detail-title { font-weight: 600; color: var(--blue); }
  .detail-symbol {
    font: 400 10.5px/1.3 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .detail.tone-green .detail-symbol { color: var(--green); }
  .detail.tone-blue .detail-symbol { color: var(--blue); }
  .detail-grid {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr);
    gap: 10px 18px;
  }
  .detail-label {
    font: 400 10px/1.7 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail-text {
    font: 400 13px/1.65 var(--sans);
    color: var(--ink-3);
    text-wrap: pretty;
  }
  .detail code {
    font: 400 12.5px/1.7 var(--mono);
    color: var(--ink-2);
    background: var(--accent-tint);
    border: 1px solid var(--accent-soft);
    border-radius: 6px;
    padding: 10px 12px;
    display: block;
  }
  .detail.tone-green code {
    color: var(--green-ink);
    background: var(--green-tint);
    border-color: var(--green-line);
  }
  .detail.tone-blue code {
    color: var(--blue-ink);
    background: var(--blue-tint);
    border-color: var(--blue-soft);
  }
  .composition { display: grid; gap: 8px; }
  .composition .bar { background: var(--green-track); }
  .composition-legend {
    display: flex;
    gap: 20px;
    font: 400 11.5px/1.4 var(--mono);
    color: var(--ink-3);
  }

  /* ---------- Référentiel BRVM ---------- */
  .soc-list {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .soc-line {
    background: var(--tile);
    padding: 11px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .soc-ident { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .soc-flag { font-size: 15px; line-height: 1; flex: none; }
  .soc-nom {
    font: 400 12.5px/1.4 var(--sans);
    color: var(--ink);
    /* Les raisons sociales sont longues : on les laisse passer à la ligne
       plutôt que de les tronquer. */
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .soc-line.is-more {
    justify-content: flex-start;
    font: 400 11.5px/1.4 var(--sans);
    color: var(--muted);
  }
  .soc-pays { font: 400 10.5px/1.4 var(--mono); color: var(--muted-2); }
  .soc-cap {
    font: 500 12.5px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    white-space: nowrap;
  }
  /* Champ numérique libre, aligné sur la valeur qu'il remplace. */
  .mini-input {
    width: 74px;
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    font: 500 12px/1.3 var(--mono);
    color: var(--ink);
    text-align: right;
  }
  .mini-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .mini-input::placeholder { font-family: var(--sans); color: var(--muted-2); }

  /* Bulle : un bloc de contenu autonome dans le panneau de détail. */
  .bulle {
    display: block;
    margin-top: 14px;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--tile);
  }
  .bulle-titre {
    display: block;
    margin-bottom: 8px;
    font: 500 10.5px/1 var(--sans);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bulle .fin-table { margin-top: 0; }

  .fin-table {
    width: 100%;
    border-collapse: collapse;
    font: 400 12.5px/1.5 var(--sans);
  }
  .fin-table th, .fin-table td {
    padding: 7px 0;
    border-bottom: 1px solid #f1f2f6;
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }
  .fin-table th:first-child, .fin-table td:first-child {
    text-align: left;
    font-family: var(--sans);
    color: var(--ink-4);
  }
  .fin-table thead th {
    font: 400 10px/1.7 var(--mono);

    let beta = industry.beta, de = industry.de;
    if (beta === undefined || de === undefined) { beta = 1.0; de = 0.5; notes.push("Bêta sectoriel indisponible, valeurs par défaut retenues"); }
    let rawSpread = industry.spread;
    if (rawSpread === undefined) { rawSpread = 0.05; notes.push("Spread de financement indisponible, 5,00 % retenu"); }

    const code = p.maturity === "30Y" ? "30" : "10";
    let rfPct = DATA.rf[p.year + "-" + code];
    let a;
    if (rfPct === undefined) {
      rfPct = 0;
      a = 0.03;
      notes.push("Taux US " + p.maturity + " indisponible pour " + p.year + ", 3,00 % retenu");
    } else {
      a = rfPct / 100 + crp;
    }

    const c = DATA.mature;
    const b = beta * (1 + de * (1 - tax));
    const re = a + b * c + p.d + p.e;
    const spread = adjustedSpread(rawSpread);
    const rdPre = spread.value + a;
    const rdPost = rdPre * (1 - tax);
    const ev = 1 / (1 + de);
    const dv = 1 - ev;
    const wacc = re * ev + rdPost * dv;
    const local = (1 + wacc) * (1 + p.inflation_local) / (1 + p.inflation_ref) - 1;

    const contribFp = re * ev;
    const contribDette = rdPost * dv;
    const economieImpot = rdPre * tax;
    const spreadLabel = spread.adjusted ? "Spread de financement (ajusté)" : "Spread de financement";

    const components = [
      {
        id: "re", title: "Coût des fonds propres", symbol: "Re", value: frPct(re), tone: "accent",
        rows: [
          { label: "Taux US Bond " + p.maturity + " (" + p.year + ")", value: frPct(rfPct / 100) },
          { label: "Prime de risque pays", value: frPct(crp) },
          { label: "Taux sans risque local (a)", value: frPct(a), strong: true },
          { label: "Beta désendetté", value: frNum(beta, 3) },
          { label: "Gearing sectoriel", value: frNum(de, 2) },
          { label: "Beta réendetté (b)", value: frNum(b, 3), strong: true },
          { label: "Prime de risque marché (c)", value: frPct(c) },
          { label: "Prime de taille (d)", value: frPct(p.d) },
          { label: "Prime spécifique (e)", value: frPct(p.e) }
        ],
        methodology: "MEDAF. Taux sans risque construit sur l'obligation US " + p.maturity + ", majoré de la prime de risque pays ; bêta sectoriel désendetté puis ré-endetté au gearing sectoriel.",
        source: "US Treasury " + p.maturity + " (moyenne " + p.year + ") ; prime pays, prime de risque marché et bêta sectoriel Damodaran (" + p.industry + ", " + p.country + ").",
        hypothesis: "Primes de taille et spécifique maintenues sur tout l'horizon ; gearing sectoriel considéré comme cible.",
        formula: ["Re = a + b × c + d + e", "= " + frPct(a) + " + " + frNum(b, 3) + " × " + frPct(c) + " + " + frPct(p.d) + " + " + frPct(p.e) + " = " + frPct(re)]
      },
      {
        id: "rd", title: "Coût de la dette", symbol: "Rd", value: frPct(rdPre), tone: "accent",
        rows: [
          { label: "Taux sans risque local (a)", value: frPct(a) },
          { label: spreadLabel, value: frPct(spread.value) },
          { label: "Coût de la dette avant impôt", value: frPct(rdPre), strong: true },
          { label: "Coût de la dette après impôt", value: frPct(rdPost) }
        ],
        methodology: "Coût marginal de la dette : taux sans risque local majoré du spread de financement sectoriel, puis net d'économie d'impôt.",
        source: "Spread de financement sectoriel Damodaran (" + p.industry + ")" + (spread.adjusted ? " ; spread ajusté via la table de notation." : "."),
        hypothesis: "Refinancement aux conditions actuelles ; charges financières intégralement déductibles.",
        formula: [
          "Rd = a + spread = " + frPct(a) + " + " + frPct(spread.value) + " = " + frPct(rdPre),
          "Rd après impôt = " + frPct(rdPre) + " × (1 − " + frPct(tax) + ") = " + frPct(rdPost)
        ]
      },
      {
        id: "ev", title: "Poids des fonds propres", symbol: "E/V", value: frPct(ev), tone: "accent",
        rows: [
          { label: "Gearing sectoriel (D/E)", value: frNum(de, 2) },
          { label: "Quote-part fonds propres", value: frPct(ev), strong: true },
          { label: "Quote-part dette", value: frPct(dv) }
        ],
        methodology: "Structure financière cible en valeur de marché, déduite du gearing sectoriel plutôt que du levier comptable spot.",
        source: "Gearing médian de l'échantillon sectoriel retenu pour le désendettement du bêta.",
        hypothesis: "Structure stable sur l'horizon d'actualisation, sans opération de haut de bilan.",
        formula: ["E/V = 1 / (1 + D/E) = 1 / " + frNum(1 + de, 2) + " = " + frPct(ev)]
      },
      {
        id: "dv", title: "Poids de la dette", symbol: "D/V", value: frPct(dv), tone: "accent",
        rows: [
          { label: "Gearing sectoriel (D/E)", value: frNum(de, 2) },
          { label: "Quote-part dette", value: frPct(dv), strong: true },
          { label: "Quote-part fonds propres", value: frPct(ev) }
        ],
        methodology: "Complément de la quote-part de fonds propres, sur la même structure cible ; dette financière brute, trésorerie non déduite.",
        source: "Gearing médian de l'échantillon sectoriel retenu pour le désendettement du bêta.",
        hypothesis: "Obligations locatives assimilées à de la dette financière.",
        formula: ["D/V = (D/E) / (1 + D/E) = " + frNum(de, 2) + " / " + frNum(1 + de, 2) + " = " + frPct(dv)]
      },
      {
        id: "tax", title: "Taux d'imposition", symbol: "t", value: frPct(tax), tone: "accent",
        rows: [
          { label: "Corporate tax rate", value: frPct(tax), strong: true },
          { label: "Coût de la dette avant impôt", value: frPct(rdPre) },
          { label: "Économie d'impôt", value: frPts(economieImpot) }
        ],
        methodology: "Taux d'impôt sur les sociétés normatif, également utilisé pour le ré-endettement du bêta.",
        source: "Taux d'IS de droit commun Damodaran (" + p.country + ").",
        hypothesis: "Aucun déficit reportable activé ; pas de plafonnement de la déductibilité.",
        formula: [
          "Économie d'impôt = Rd × t = " + frPct(rdPre) + " × " + frPct(tax) + " = " + frPts(economieImpot),
          "Beta réendetté = " + frNum(beta, 3) + " × (1 + " + frNum(de, 2) + " × (1 − " + frPct(tax) + ")) = " + frNum(b, 3)
        ]
      },
      {
        id: "wacc", title: "Coût moyen pondéré du capital", symbol: "WACC", value: frPct(wacc), tone: "green", final: true,
        rows: [
          { label: "Fonds propres " + frPct(re) + " × " + frPct(ev), value: frPts(contribFp) },
          { label: "Dette " + frPct(rdPost) + " × " + frPct(dv), value: frPts(contribDette) },
          { label: "WACC", value: frPct(wacc), strong: true }
        ],
        composition: {
          equity: wacc ? frPct(contribFp / wacc, 1) : "—",
          debt: wacc ? frPct(contribDette / wacc, 1) : "—",
          equityPct: wacc ? contribFp / wacc * 100 : 50,
          debtPct: wacc ? contribDette / wacc * 100 : 50
        },
        methodology: "Moyenne des deux coûts pondérée par la structure cible, la dette étant retenue après économie d'impôt.",
        retained: frPct(wacc) + " dans la monnaie du taux sans risque, " + frPct(local) + " en monnaie locale après différentiel d'inflation.",
        formula: ["WACC = E/V × Re + D/V × Rd après impôt", "= " + frPct(ev) + " × " + frPct(re) + " + " + frPct(dv) + " × " + frPct(rdPost) + " = " + frPct(wacc)]
      },
      {
        id: "loc", title: "CMPC en monnaie locale", symbol: "CMPC loc.", value: frPct(local), tone: "blue", final: true,
        rows: [
          { label: "CMPC monnaie du taux sans risque", value: frPct(wacc) },
          { label: "Inflation monnaie locale", value: frPct(p.inflation_local) },
          { label: "Inflation monnaie du taux sans risque", value: frPct(p.inflation_ref) },
          { label: "CMPC en monnaie locale", value: frPct(local), strong: true }
        ],
        methodology: "Conversion du CMPC exprimé dans la monnaie du taux sans risque vers la monnaie locale par le différentiel d'inflation attendu, selon la parité des pouvoirs d'achat.",
        source: "Prévisions d'inflation des deux zones monétaires, saisies dans l'onglet Paramètres.",
        hypothesis: "Différentiel d'inflation constant sur l'horizon ; les flux actualisés doivent être exprimés dans la même monnaie que ce taux.",
        formula: [
          "CMPC loc. = (1 + CMPC) × (1 + infl. loc.) / (1 + infl. réf.) − 1",
          "= " + frNum(1 + wacc, 4) + " × " + frNum(1 + p.inflation_local, 4) + " / " + frNum(1 + p.inflation_ref, 4) + " − 1 = " + frPct(local)
        ]
      }
    ];

    return {
      fiscalYear: "Exercice " + p.year,
      chips: [p.country, p.industry],
      market: [
        { label: "Prime de risque pays", value: frPct(crp) },
        { label: "Beta désendetté", value: frNum(beta, 3) },
        { label: "Gearing sectoriel", value: frNum(de, 2) }
      ],
      notes: notes,
      result: {
        wacc: frPct(wacc), ke: frPct(re), kd: frPct(rdPost), local: frPct(local),
        structure: frPct(ev, 0) + " / " + frPct(dv, 0),
        equityPct: ev * 100, debtPct: dv * 100
      },
      components: components
    };
  }

  /* ================= Onglets ================= */
  function renderTabs() {
    // L'onglet Sociétés n'existe que sous référentiel BRVM.
    if (!estBrvm() && tab === "societes") tab = "params";
    $("tabSocietes").hidden = !estBrvm();

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.classList.toggle("is-active", b.dataset.tab === tab);
    });
    $("panel-params").hidden = tab !== "params";
    $("panel-wacc").hidden = tab !== "wacc";
    $("panel-societes").hidden = tab !== "societes";
    if (tab === "wacc" || tab === "societes") requestAnimationFrame(placeArrows);
  }
  document.querySelectorAll(".tabs button").forEach((b) => {
    b.addEventListener("click", () => { tab = b.dataset.tab; renderTabs(); });
  });

  /* ================= Onglet Paramètres ================= */
  function optionsHtml(key, options) {
    // Une option est soit une valeur brute, soit un couple [valeur, libellé].
    return options
      .map((o) => (Array.isArray(o) ? o : [o, o]))
      .map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(params[key]) ? " selected" : ""}>${esc(l)}</option>`)
      .join("");
  }

  function selectField(key, label, options) {
    return `
      <span class="field">
        <span class="field-label">${esc(label)}</span>
        <span class="select-wrap">
          <select data-param="${key}">
            ${optionsHtml(key, options)}
          </select>
          ${CHEVRON}
        </span>
      </span>`;
  }

  // Menu à deux niveaux : les pays sont présentés par continent. `groupes` est
  // [[continent, [pays...]], ...] ; on retombe sur la liste plate si le jeu de
  // données est ancien et ne porte pas encore le découpage.
  function selectFieldGroupe(key, label, groupes, repli) {
    if (!Array.isArray(groupes) || !groupes.length) return selectField(key, label, repli || []);
    return `
      <span class="field">
        <span class="field-label">${esc(label)}</span>
        <span class="select-wrap">
          <select data-param="${key}">
            ${groupes.map(([groupe, membres]) => `<optgroup label="${esc(groupe)}">${optionsHtml(key, membres)}</optgroup>`).join("")}
          </select>
          ${CHEVRON}
        </span>
      </span>`;
  }

  /* ================= Découpage géographique ================= */
  const TOUS = "Tous";

  function groupesPays() { return DATA.options.countries_grouped || []; }
  function continents() { return groupesPays().map(([c]) => c); }
  function zonesDuContinent(c) { return (DATA.options.zones_par_continent || {})[c] || []; }
  function continentDe(pays) { const e = DATA.pays[pays]; return e && e.continent ? e.continent : null; }
  function zoneDe(pays) { const e = DATA.pays[pays]; return e && e.zone ? e.zone : null; }

  // La zone affine le continent : sans zone on retombe sur le continent, sans
  // continent sur la liste entière.
  function paysVisibles() {
    const groupes = groupesPays();
    if (params.continent === TOUS) return groupes.flatMap(([, m]) => m);
    if (params.zone) {
      const z = zonesDuContinent(params.continent).find(([nom]) => nom === params.zone);
      if (z) return z[1];
    }
    const t = groupes.find(([c]) => c === params.continent);
    return t ? t[1] : groupes.flatMap(([, m]) => m);
  }

  function champPays(label) {
    return params.continent === TOUS
      ? selectFieldGroupe("country", label, groupesPays(), DATA.options.countries)
      : selectField("country", label, paysVisibles());
  }

  /* ---------- Effectifs de sociétés ---------- */
  // Les effectifs viennent des seules sociétés réellement référencées. À ce jour
  // la place d'Abidjan, soit sept pays et une seule zone sur dix-huit : partout
  // ailleurs le compte est nul, et le panneau doit l'écrire plutôt que d'afficher
  // un tiret qu'on lirait comme une donnée manquante.
  // L'industrie qui filtre les effectifs. Sous Comparables, la nomenclature est
  // celle de l'univers ; sous Damodaran, aucune correspondance n'existe entre
  // ses 94 secteurs et ceux de l'export, donc on ne filtre pas.
  function industrieCourante() { return estBrvm() ? params.industrie_brvm : null; }

  function effectif(zone) {
    const source = (DATA.comparables || {}).zones || DATA.zones_societes || {};
    const bloc = source[zone];
    if (!bloc) return { total: 0, n: null, places: [] };
    const ind = industrieCourante();
    const detail = ind && bloc.industries ? bloc.industries[ind] : null;
    return {
      total: bloc.total || 0,
      n: detail ? detail.n : null,
      places: Object.keys((detail ? detail.places : bloc.places) || {}),
    };
  }

  /* ---------- Carte ---------- */
  // Une teinte par continent, éclaircie zone par zone : les zones d'un même
  // continent se distinguent sans changer de famille de couleur. Rien ici ne
  // code un montant.
  const TEINTES = {
    "Afrique": "#b8452f", "Amériques": "#2563a8", "Asie": "#1a7f6b",
    "Europe": "#7d5aa8", "Océanie": "#a8781f", "Autres": "#8b8b93",
  };
  function teinte(continent) { return TEINTES[continent] || TEINTES["Autres"]; }

  // Une couleur franche par zone, et non des nuances d'une même teinte : sur une
  // carte, deux nuances voisines d'un même continent se confondent dès que les
  // blocs sont contigus. La palette est fixe et ordonnée, pour qu'une zone garde
  // sa couleur d'un continent à l'autre et d'une session à l'autre.
  const PALETTE_ZONES = [
    "#c1553b", "#2f7fb5", "#3f9e78", "#8a63b8", "#c99a2e",
    "#5b8c5a", "#b4577f", "#4a7fa5",
  ];
  function teinteZone(continent, rang, total) {
    return PALETTE_ZONES[rang % PALETTE_ZONES.length];
  }

  /* ---------- Globe, pour le continent « Tous » ---------- */
  let globeLon = 15, globeLat = 12;
  let anneauxCache = null;

  // Le fond est stocké projeté en équirectangulaire ; on en redéduit lon/lat
  // pour le reprojeter en orthographique. x = lon + 180 et y = 90 - lat.
  function anneaux() {
    if (anneauxCache) return anneauxCache;
    const fond = DATA.carte ? DATA.carte.fond || "" : "";
    anneauxCache = fond.split("Z").filter(Boolean).map((bloc) =>
      bloc.replace("M", "").split("L").map((couple) => {
        const paire = couple.trim().split(/\s+/).map(Number);
        return [paire[0] - 180, 90 - paire[1]];
      })
    );
    return anneauxCache;
  }

  const RAD = Math.PI / 180;
  function ortho(lon, lat, R, cx, cy) {
    const dl = (lon - globeLon) * RAD, la = lat * RAD, l0 = globeLat * RAD;
    const visible = Math.sin(l0) * Math.sin(la) + Math.cos(l0) * Math.cos(la) * Math.cos(dl) > 0;
    return {
      visible: visible,
      x: cx + R * Math.cos(la) * Math.sin(dl),
      y: cy - R * (Math.cos(l0) * Math.sin(la) - Math.sin(l0) * Math.cos(la) * Math.cos(dl)),
    };
  }

  function globeHtml() {
    const R = 84, cx = 90, cy = 90;
    const terres = anneaux().map((ring) => {
      let d = "", ouvert = false;
      for (const couple of ring) {
        const p = ortho(couple[0], couple[1], R, cx, cy);
        if (!p.visible) { ouvert = false; continue; }
        d += (ouvert ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1);
        ouvert = true;
      }
      return d;
    }).filter(Boolean).join("");

    return '<svg class="carte carte-globe" viewBox="0 0 180 180" role="img" aria-label="Globe des continents">' +
      '<circle class="globe-mer" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/>' +
      '<path class="carte-fond" d="' + terres + '"/></svg>';
  }

  /* ---------- Carte d'un continent ---------- */
  // Le tracé suit les frontières réelles : chaque zone est l'union des pays qui
  // la composent. Les pays du continent absents du jeu Damodaran sont dessinés
  // en neutre, sinon le continent apparaîtrait troué.
  function continentHtml(continent) {
    const bloc = (DATA.carte.continents || {})[continent];
    if (!bloc) return "";
    const noms = Object.keys(bloc.zones || {});
    const aires = noms.map((zone, i) =>
      '<path class="zone' + (params.zone === zone ? " is-on" : "") + '" d="' + bloc.zones[zone] +
      '" fill="' + teinteZone(continent, i, noms.length) + '" data-zone="' + esc(zone) +
      '"><title>' + esc(zone) + "</title></path>").join("");

    return '<svg class="carte" viewBox="' + bloc.vue.join(" ") + '" role="img" aria-label="Carte de ' +
      esc(continent) + '" preserveAspectRatio="xMidYMid meet">' +
      (bloc.autres ? '<path class="carte-hors" d="' + bloc.autres + '"/>' : "") +
      aires + "</svg>";
  }

  function carteHtml() {
    if (!DATA.carte || !DATA.carte.fond) return "";
    const svg = params.continent === TOUS ? globeHtml() : continentHtml(params.continent);
    return svg ? '<div class="carte-bloc">' + svg + "</div>" : "";
  }

  /* ---------- CMPC du référentiel Comparables ---------- */
  // Le référentiel Comparables ne publie ni gearing sectoriel ni coût de la
  // dette. Le gearing est donc saisi à la main, et la dette est supposée levée
  // au taux souverain : c'est l'hypothèse la plus neutre disponible, et
  // certainement optimiste pour un émetteur privé. Elle est écrite sous le
  // résultat plutôt que dissimulée dans le calcul.
  // Gearing observé du secteur : dette totale cumulée rapportée à la
  // capitalisation cumulée sur l'univers de comparables. Il sert de valeur de
  // départ au champ de saisie, qui reste modifiable.
  function gearingSectoriel(nomIndustrie) {
    const liste = (DATA.comparables || {}).industries || [];
    const trouve = liste.find((i) => i.nom === nomIndustrie);
    return trouve && trouve.gearing != null ? trouve.gearing : null;
  }

  function gearingRetenu() {
    if (params.gearing_brvm != null && params.gearing_brvm !== "") {
      return Number(params.gearing_brvm);
    }
    return gearingSectoriel(params.industrie_brvm);
  }

  function cmpcComparables() {
    if (!estBrvm() || !BRVM) return null;
    const ind = industrieBrvm();
    const tickers = ind ? ind.tickers : [];
    const betas = tickers.map((t) => BRVM.societes[t].beta).filter((b) => b != null);
    const rf = tauxSansRisque();
    const g = gearingRetenu();
    const pays = DATA.pays[params.country] || {};
    if (!rf || !betas.length || g == null || !(g >= 0) || pays.tax == null) return null;
    const saisi = params.gearing_brvm != null && params.gearing_brvm !== "";
    const beta = betas.reduce((a, b) => a + b, 0) / betas.length;
    const ke = rf.taux + beta * DATA.mature + Number(params.d) + Number(params.e);
    const kd = rf.taux * (1 - pays.tax);
    const we = 1 / (1 + g);
    return {
      beta: beta, rf: rf, tax: pays.tax, gearing: g, gearingSaisi: saisi,
      societes: betas.length,
      ke: ke, kd: kd, we: we, wd: 1 - we,
      wacc: ke * we + kd * (1 - we),
    };
  }

  // Cascade affichée dans l'onglet CMPC sous le référentiel Comparables.
  function composantesComparables(cc) {
    return [
      {
        id: "ke", title: "Coût des fonds propres", symbol: "Ke", value: frPct(cc.ke), tone: "blue",
        methodology: "Taux sans risque + bêta coté x prime de marché + prime de taille + prime spécifique.",
        source: "Bêtas cotés à un an des sociétés du secteur, taux souverain UMOA-Titres, prime de marché mature Damodaran.",
        hypothesis: "Le bêta coté est employé tel quel : il est déjà endetté, aucun réendettement ne lui est appliqué. Le taux souverain porte déjà le risque pays, aucune prime pays ne s'y ajoute.",
        retained: "Bêta moyen " + frNum(cc.beta, 2) + ", taux sans risque " + frPct(cc.rf.taux) + ", prime de marché " + frPct(DATA.mature) + ".",
        formula: ["Ke = " + frPct(cc.rf.taux) + " + " + frNum(cc.beta, 2) + " x " + frPct(DATA.mature) +
                  " + " + frPct(Number(params.d)) + " + " + frPct(Number(params.e)) + " = " + frPct(cc.ke)],
      },
      {
        id: "kd", title: "Coût de la dette après IS", symbol: "Kd", value: frPct(cc.kd), tone: "green",
        methodology: "Taux souverain diminué de l'économie d'impôt.",
        source: "Courbe souveraine UMOA-Titres, taux d'IS de droit commun Damodaran.",
        hypothesis: "Aucun spread de financement n'est publié pour ce référentiel : la dette est supposée levée au taux souverain. L'hypothèse est neutre, et probablement optimiste pour un émetteur privé.",
        retained: "Taux souverain " + frPct(cc.rf.taux) + ", IS " + frPct(cc.tax, 1) + ".",
        formula: ["Kd = " + frPct(cc.rf.taux) + " x (1 - " + frPct(cc.tax, 1) + ") = " + frPct(cc.kd)],
      },
      {
        id: "poids", title: "Structure financière", symbol: "FP / D",
        value: frPct(cc.we, 0) + " / " + frPct(cc.wd, 0),
        composition: {
          equity: frPct(cc.we, 0), debt: frPct(cc.wd, 0),
          equityPct: (cc.we * 100).toFixed(1), debtPct: (cc.wd * 100).toFixed(1),
        },
        methodology: "Déduite du gearing : fonds propres / valeur = 1 / (1 + D/E).",
        source: cc.gearingSaisi
          ? "Saisie manuelle."
          : "Dette totale cumulée rapportée à la capitalisation cumulée du secteur, sur l'univers de comparables.",
        hypothesis: cc.gearingSaisi
          ? "Gearing saisi à la main dans l'onglet Paramètres, il remplace celui observé sur le secteur."
          : "Gearing observé sur le secteur : un rapport d'agrégats, et non une moyenne de rapports, qui donnerait autant de poids à une micro-capitalisation très endettée qu'à la première capitalisation du secteur.",
        retained: "Gearing D/E = " + frNum(cc.gearing, 2) + ".",
        formula: ["FP / V = 1 / (1 + " + frNum(cc.gearing, 2) + ") = " + frPct(cc.we)],
      },
      {
        id: "wacc", title: "CMPC", symbol: "CMPC", value: frPct(cc.wacc), final: true,
        methodology: "Moyenne du coût des fonds propres et du coût de la dette, pondérée par la structure financière.",
        source: "Composantes ci-dessus.",
        hypothesis: "Exprimé en monnaie locale : le taux souverain qui l'alimente l'est déjà, aucune conversion d'inflation n'est appliquée.",
        retained: "CMPC = " + frPct(cc.wacc) + ".",
        formula: ["CMPC = " + frPct(cc.ke) + " x " + frPct(cc.we, 0) + " + " + frPct(cc.kd) +
                  " x " + frPct(cc.wd, 0) + " = " + frPct(cc.wacc)],
      },
    ];
  }

  /* ---------- Bulles de résumé ---------- */
  // Deux bulles sur la ligne de titre : ce qui est cadré et combien de sociétés
  // s'y rattachent, puis les places d'où ces sociétés proviennent. Sans zone
  // retenue, le résumé porte sur le continent entier.
  function resumeCadrage() {
    if (params.continent === TOUS) return "";
    const ind = industrieCourante();
    const perimetre = params.zone || params.continent;
    const zonesRetenues = params.zone
      ? [params.zone]
      : zonesDuContinent(params.continent).map(([z]) => z);

    let n = 0;
    const places = [];
    zonesRetenues.forEach((zone) => {
      const e = effectif(zone);
      n += (ind ? e.n : e.total) || 0;
      e.places.forEach((p) => { if (places.indexOf(p) === -1) places.push(p); });
    });

    const libelle = n
      ? n + " société" + (n > 1 ? "s" : "")
      : "aucune société";
    const bulles = ['<span class="chip">' + esc(perimetre) + " · " + libelle + "</span>"];
    if (n && places.length) {
      bulles.push('<span class="chip is-accent">' + places.map(esc).join(" · ") + "</span>");
    }
    return bulles.join("");
  }

  function brancherChamps() {
    $("paramsMain").querySelectorAll("select[data-param]").forEach((sel) => {

    $("paramsMain").querySelectorAll("[data-zone]").forEach((el) => {

    });
  }

  // Champs numériques libres. On écoute « change » et non « input » : réagir à
  // chaque frappe redessinerait le panneau et ferait perdre le focus au champ.
  function brancherNombres(racine) {
    racine.querySelectorAll("input[data-num]").forEach((champ) => {
      champ.addEventListener("change", () => setParam(champ.dataset.num, champ.value));
    });
    $("paramsMain").querySelectorAll("button[data-step]").forEach((btn) => {
      btn.addEventListener("click", () => bumpParam(btn.dataset.step, Number(btn.dataset.dir)));
    });
  }

  /* ================= Colonnes de cartes (CMPC et Sociétés) ================= */
  function renderStack(cle) {
    const pan = PANNEAUX[cle];
    $(pan.stack).innerHTML = pan.items.map((c) => `
      <div class="comp${c.tone && c.tone !== "accent" ? " tone-" + c.tone : ""}${c.final ? " is-final" : ""}" data-comp="${esc(c.id)}">
        <button type="button" class="comp-head" aria-expanded="false">
          <span class="comp-title">${c.titleHtml || esc(c.title)}</span>
          <span class="comp-value">${esc(c.value)}</span>
        </button>
        <div class="comp-wrap"><div class="comp-clip"><div class="comp-body">
          <span class="sub-rows">
            ${(c.rows || []).map((r) => `
              <span class="sub-row${r.strong ? " is-strong" : ""}">
                <span>${esc(r.label)}</span><span>${esc(r.value)}</span>
              </span>`).join("")}
          </span>
        </div></div></div>
      </div>`).join("");

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      el.querySelector(".comp-head").addEventListener("click", () => toggle(cle, el.dataset.comp));
    });
  }

  function renderFrame(cle) {
    const pan = PANNEAUX[cle];
    const attente = `
      <div class="detail-vide${pan.ouvert ? " is-cache" : ""}" data-vide="1">
        <span class="titre">${esc(pan.vide.titre)}</span>
        <span class="texte">${esc(pan.vide.texte)}</span>
      </div>`;
    $(pan.frame).innerHTML = attente + pan.items.map((c) => `
      <div class="detail${c.tone && c.tone !== "accent" ? " tone-" + c.tone : ""}" data-detail="${esc(c.id)}">
        ${pan.detail(c)}
      </div>`).join("");
  }

  function toggle(cle, id) {
    const pan = PANNEAUX[cle];
    pan.ouvert = pan.ouvert === id ? null : id;
    const item = pan.items.find((c) => c.id === pan.ouvert);
    const tone = item && item.tone && item.tone !== "accent" ? item.tone : null;

    $(pan.stack).querySelectorAll(".comp").forEach((el) => {
      const on = el.dataset.comp === pan.ouvert;
      el.classList.toggle("is-open", on);
      el.querySelector(".comp-head").setAttribute("aria-expanded", on ? "true" : "false");
    });
    $(pan.frame).querySelectorAll(".detail").forEach((el) => {
      el.classList.toggle("is-shown", el.dataset.detail === pan.ouvert);
    });
    const attente = $(pan.frame).querySelector(".detail-vide");
    if (attente) attente.classList.toggle("is-cache", Boolean(pan.ouvert));

    const col = $(pan.col);
    col.classList.toggle("is-on", Boolean(pan.ouvert));
    col.classList.remove("tone-green", "tone-blue");
    if (tone) col.classList.add("tone-" + tone);

    placeArrow(cle);
    setTimeout(() => placeArrow(cle), 200);
    setTimeout(() => placeArrow(cle), 460);
  }

  function placeArrow(cle) {
    const pan = PANNEAUX[cle];
    if (!pan.ouvert) return;
    const col = $(pan.col);
    const head = $(pan.stack).querySelector('.comp[data-comp="' + CSS.escape(pan.ouvert) + '"] .comp-head');
    if (!head) return;
    const cr = col.getBoundingClientRect();
    const hr = head.getBoundingClientRect();
    const max = Math.max(40, cr.height - 30);
    const y = hr.top + hr.height / 2 - cr.top - 6;
    $(pan.arrow).style.top = Math.round(Math.min(max, Math.max(16, y))) + "px";
  }

  function placeArrows() {
    Object.keys(PANNEAUX).forEach(placeArrow);
  }

  window.addEventListener("resize", placeArrows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeArrows);

  /* ---- Détail d'une composante du CMPC ---- */
  function detailComposante(c) {
    const compo = c.composition ? `
      <span class="composition">
        <span class="bar">
          <span class="eq" style="width:${c.composition.equityPct}%"></span>
          <span class="dt" style="width:${c.composition.debtPct}%"></span>
        </span>
        <span class="composition-legend">
          <span>Fonds propres ${esc(c.composition.equity)}</span>
          <span>Dette ${esc(c.composition.debt)}</span>
        </span>
      </span>` : "";
    const rows = [
      ["Méthodologie", c.methodology],
      ["Source", c.source],
      ["Hypothèse", c.hypothesis],
      ["Retenu", c.retained]
    ].filter(([, t]) => Boolean(t));
    return `
      <span class="detail-head">
        <span class="detail-title">${esc(c.title)}</span>
        <span class="detail-symbol">${esc(c.symbol)}</span>
      </span>
      ${compo}
      <span class="detail-grid">
        ${rows.map(([l, t]) => `<span class="detail-label">${esc(l)}</span><span class="detail-text">${esc(t)}</span>`).join("")}
      </span>
      ${c.formula && c.formula.length ? `<code>${c.formula.map(esc).join("<br>")}</code>` : ""}`;
  }

  /* ---- Détail d'une société cotée ---- */
  function detailSociete(c) {
    const s = c.societe;
    const annees = s.annees || [];
    const postes = [
      ["Chiffre d'affaires", s.ca],
      ["EBITDA", s.ebitda],
      ["Charges d'exploitation", s.charges],
      ["Résultat net", s.rn],
      ["Capitaux propres", s.capitaux_propres],
      ["Dette nette", s.dette_nette]
    ];
    const lignes = postes.map(([libelle, serie]) => `
      <tr>
        <td>${esc(libelle)}</td>
        ${annees.map((a) => `<td>${esc(frMontant((serie || {})[String(a)]))}</td>`).join("")}
      </tr>`).join("");

    // Deux bulles distinctes : l'activité se lit en prose, les comptes en
    // tableau. Les mêler dans une seule grille obligeait l'oeil à passer de
    // l'une à l'autre sans transition.
    return `
      <span class="detail-head">
        <span class="detail-title">${s.drapeau} ${esc(s.nom)}</span>
        <span class="detail-symbol">${esc(c.id)}</span>
      </span>
      <span class="detail-grid">
        <span class="detail-label">Pays</span><span class="detail-text">${esc(s.pays)}</span>
        <span class="detail-label">Capitalisation</span><span class="detail-text">${esc(frMontant(s.capitalisation))} FCFA</span>
        <span class="detail-label">Bêta 1 an</span><span class="detail-text">${s.beta == null ? "non publié" : frNum(s.beta, 2)}</span>
      </span>
      ${s.presentation ? `
        <span class="bulle">
          <span class="bulle-titre">Activité</span>
          <span class="detail-text">${esc(s.presentation)}</span>
        </span>` : ""}
      <span class="bulle">
        <span class="bulle-titre">Données financières</span>
        <table class="fin-table">
          <thead><tr><th>En millions FCFA</th>${annees.map((a) => `<th>${a}</th>`).join("")}</tr></thead>
          <tbody>${lignes}</tbody>
        </table>
      </span>`;
  }

  /* ---- Alimentation des deux colonnes ---- */
  function chargerCmpc() {
    const pan = PANNEAUX.cmpc;
    pan.detail = detailComposante;
    const cc = estBrvm() ? cmpcComparables() : null;
    pan.items = estBrvm() ? (cc ? composantesComparables(cc) : []) : model.components;
    if (estBrvm() && !cc) {
      $(pan.stack).innerHTML = `
        <div class="notice">
          <h3>Gearing sectoriel à renseigner</h3>
          <p>Le référentiel Comparables ne publie pas de gearing sectoriel : sans lui, la
          répartition entre fonds propres et dette est inconnue et le CMPC ne peut pas être
          calculé. Saisissez-le dans l'onglet Paramètres, ligne « Gearing sectoriel (D/E) ».</p>
          <p>Les bêtas cotés, les capitalisations et les états financiers des sociétés du
          secteur restent consultables dans l'onglet Sociétés.</p>
        </div>`;
      $(pan.frame).innerHTML = "";
      $(pan.col).classList.remove("is-on");
      pan.ouvert = null;
      return;
    }
    renderStack("cmpc");
    renderFrame("cmpc");
  }

  // Marge d'EBITDA du dernier exercice où les deux postes sont renseignés.
  // Les banques ne publient pas d'EBITDA : la ligne le dit plutôt que d'afficher 0.
  function margeEbitda(s) {
    for (const annee of (s.annees || []).slice().reverse()) {
      const ebitda = (s.ebitda || {})[String(annee)];
      const ca = (s.ca || {})[String(annee)];
      if (ebitda != null && ca) {
        return { label: `Marge d'EBITDA ${annee}`, value: frPct(ebitda / ca, 1) };
      }
    }
    return { label: "Marge d'EBITDA", value: "non publiée" };
  }

  function chargerSocietes() {
    const pan = PANNEAUX.soc;
    pan.detail = detailSociete;
    const ind = industrieBrvm();
    // Même ordre que l'aperçu des paramètres : les plus grosses capitalisations d'abord.
    const tickers = !ind ? [] : ind.tickers.slice()
      .sort((a, b) => (BRVM.societes[b].capitalisation || 0) - (BRVM.societes[a].capitalisation || 0));
    pan.items = tickers.map((t) => {
      const s = BRVM.societes[t];
      const derniere = (s.annees || []).slice(-1)[0];
      const val = (serie) => frMontant((serie || {})[String(derniere)]);
      return {
        id: t,
        title: s.nom,
        titleHtml: `<span class="soc-flag">${s.drapeau}</span> ${esc(s.nom)}`,
        value: frMontant(s.capitalisation),
        societe: s,
        rows: [
          { label: "Pays", value: s.pays },
          { label: "Bêta 1 an", value: s.beta == null ? "non publié" : frNum(s.beta, 2) },
          { label: `Chiffre d'affaires ${derniere || ""}`.trim(), value: val(s.ca), strong: true },
          margeEbitda(s),
          { label: `Résultat net ${derniere || ""}`.trim(), value: val(s.rn) },
          { label: `Capitaux propres ${derniere || ""}`.trim(), value: val(s.capitaux_propres) }
        ]
      };
    });
    renderStack("soc");
    renderFrame("soc");
  }

  /* ================= Paramètres et URL ================= */
  // Après un changement de continent ou de zone, le pays retenu peut être sorti
  // de la liste visible. On le remplace par le premier de la nouvelle liste.
  function recalerPays() {
    const visibles = paysVisibles();
    if (visibles.length && !visibles.includes(params.country)) params.country = visibles[0];
  }

  function setParam(key, value) {
    if (key === "year") {
      value = Number(value);
    } else if (key === "continent") {
      // Changer de continent ne doit jamais laisser un pays sélectionné hors de
      // la liste visible : le menu afficherait alors une valeur absente de ses
      // options, et le navigateur retomberait silencieusement sur la première.
      params.continent = value;
      params.zone = null;          // la zone appartenait au continent précédent
      recalerPays();
      apply();
      return;
    } else if (key === "zone") {
      // Recliquer la zone déjà retenue la désélectionne : c'est le seul moyen de
      // revenir au continent entier sans passer par le menu.
      params.zone = params.zone === value ? null : value;
      recalerPays();
      apply();
      return;
    } else if (key === "country") {
      // Choisir un pays hors du filtre courant déplace le filtre plutôt que
      // d'ignorer le clic.
      const cont = continentDe(value);
      if (params.continent !== TOUS && cont && cont !== params.continent) {
        params.continent = cont;
        params.zone = null;
      }
      if (params.zone && zoneDe(value) !== params.zone) params.zone = null;
    } else if (key === "industrie_brvm" && BRVM) {
      // Même tolérance que pour l'URL : accents et casse approximatifs acceptés,
      // et on conserve la valeur précédente plutôt qu'un libellé inconnu.
      value = resolveOption(value, BRVM.industries.map((i) => i.nom)) || params.industrie_brvm;
    }
    params[key] = value;
    apply();
  }

  function bumpParam(key, dir) {
    params[key] = Math.max(0, Math.round((params[key] + dir * STEPS[key]) * 1000) / 1000);
    apply();
  }

  function apply() {
    model = computeModel(params);
    renderAll();
    // L'URL porte la configuration : un lien copié rouvre le même calcul.
    try {
      if (window.history.replaceState) {
        window.history.replaceState(null, "", "?" + new URLSearchParams(params));
      }
    } catch (err) { /* page ouverte en fichier local : sans effet */ }
  }

  // Une URL saisie à la main peut perdre les accents ou la casse ("Cote d'Ivoire"
  // pour "Côte d'Ivoire") : on retrouve l'entrée exacte plutôt que de retomber
  // silencieusement sur les valeurs par défaut.
  function normalize(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  }

  function resolveOption(value, options) {
    if (options.includes(value)) return value;
    const target = normalize(value);
    return options.find((o) => normalize(o) === target) || null;
  }

  function readUrlParams() {
    let query;
    try { query = new URLSearchParams(window.location.search); } catch (err) { return; }
    if (query.has("maturity") && DATA.options.maturities.includes(query.get("maturity"))) {
      params.maturity = query.get("maturity");
    }
    if (BRVM && query.has("referentiel") && ["damodaran", "brvm"].includes(query.get("referentiel"))) {
      params.referentiel = query.get("referentiel");
    }
    if (BRVM && query.has("industrie_brvm")) {
      const trouvee = resolveOption(query.get("industrie_brvm"), BRVM.industries.map((i) => i.nom));
      if (trouvee) params.industrie_brvm = trouvee;
    }
    for (const [key, list] of [["country", DATA.options.countries], ["industry", DATA.options.industries]]) {
      if (query.has(key)) {
        const found = resolveOption(query.get(key), list);
        if (found) params[key] = found;
      }
    }
    if (query.has("year")) {
      const year = Number(query.get("year"));
      if (DATA.options.years.includes(year)) params.year = year;
    }
    for (const key of ["d", "e", "inflation_ref", "inflation_local"]) {
      if (query.has(key)) {
        const value = Number(query.get(key));
        if (Number.isFinite(value)) params[key] = value;
      }
    }
  }

  function renderAll() {
    $("fiscal").textContent = model.fiscalYear;
    renderParams();

    // On mémorise la carte dépliée pour la rouvrir après redessin, si elle existe encore.
    const ouverts = { cmpc: PANNEAUX.cmpc.ouvert, soc: PANNEAUX.soc.ouvert };
    PANNEAUX.cmpc.ouvert = null;
    PANNEAUX.soc.ouvert = null;

    chargerCmpc();
    if (BRVM) chargerSocietes();

    for (const cle of ["cmpc", "soc"]) {
      const garde = ouverts[cle];
      if (garde && PANNEAUX[cle].items.some((c) => c.id === garde)) toggle(cle, garde);
    }
    renderTabs();
  }

  readUrlParams();
  model = computeModel(params);
  renderTabs();
  renderAll();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<title>Budget Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --px:'Press Start 2P',ui-monospace,monospace; --vt:'VT323',ui-monospace,monospace;
  --gold:#ffd166; --red:#ff6b70; --green:#8fe088; --dim:#a8b0e0; --ink:#0c0a12;
  --ffA:#4252c4; --ffB:#1c2680; --ffC:#0c1250; --edge:#e4e4f0; --edgeIn:#6a7ad0;
  --hand:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0c0a12;color:#fff;font-family:var(--vt);font-size:20px;line-height:1.1;-webkit-tap-highlight-color:transparent;overflow:hidden;
  display:flex;flex-direction:column;align-items:center}
/* le bureau de Roré, le soir, dans l'Open Space */
.room{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 70% at 50% 18%,#2a2440 0%,#15121f 55%,#0a0810 100%)}
.room::after{content:'';position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(#5a3a28,#3e2618 30%,#2a190f);box-shadow:0 -2px 0 #7a5236}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button,input,select{font:inherit;color:inherit}
/* ---- le moniteur ---- */
#pc{flex:1;min-height:0;width:min(100% - 150px,1100px);display:flex;flex-direction:column;padding:12px 0 44px;position:relative;margin-right:120px}
.bezel{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#34303c,#24212b);border-radius:14px;padding:10px 10px 0;
  box-shadow:0 0 0 2px #0a080e,inset 0 1px 0 #4e4958,0 18px 40px rgba(0,0,0,.6)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;background:#000;border-radius:4px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 2px #000}
.screen::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.08) 2px 3px);mix-blend-mode:multiply}
.chin{height:30px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--px);font-size:8px;color:#8a8496;position:relative}
.chin .led{width:6px;height:6px;border-radius:50%;background:#5cff8a;box-shadow:0 0 6px #5cff8a}
.chin button{background:#2c2934;border:1px solid #4a4656;border-radius:4px;padding:3px 8px;cursor:pointer;color:#a8a2b6;font-family:var(--px);font-size:8px}
.chin button.on{color:var(--gold);border-color:#8a7440}
.stand{height:14px;width:34%;margin:0 auto;background:linear-gradient(#2a2730,#1a1820);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
#mugWrap{position:absolute;right:-150px;bottom:6px;width:136px;height:136px;pointer-events:none;z-index:4}
#mug{width:100%;height:100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
.steam{position:absolute;left:18%;bottom:88%;width:60%;height:90%;display:flex;justify-content:space-around}
.steam i{width:9px;height:100%;border-radius:9px;background:linear-gradient(transparent,rgba(255,255,255,.22) 40%,rgba(255,255,255,.3) 70%,transparent);filter:blur(5px);animation:steam 3.4s ease-in-out infinite}
.steam i:nth-child(2){animation-delay:-1.1s}.steam i:nth-child(3){animation-delay:-2.2s}
@keyframes steam{0%{transform:translateY(16px) scaleX(1) skewX(0);opacity:0}30%{opacity:1}60%{transform:translateY(-6px) skewX(14deg)}100%{transform:translateY(-26px) skewX(-10deg);opacity:0}}
.room::before{content:'';position:absolute;right:0;bottom:0;width:60%;height:80%;background:radial-gradient(closest-side,rgba(255,170,90,.14),rgba(255,170,90,0))}
/* ---- la scène ---- */
.view{position:relative;flex:1 1 auto;min-height:170px;background:#000;touch-action:pan-y}
#scene{width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
#scene:active{cursor:grabbing}
#dlg{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:10px;align-items:flex-start;padding:8px 10px;cursor:pointer;z-index:2;min-height:64px}
#dlg[hidden]{display:none}
#dlg .face{width:48px;height:48px;flex:none;background:#0a0e3a;border:2px solid #9aa4e0;border-radius:3px}
#dlgWho{font-family:var(--px);font-size:9px;color:var(--gold);margin-bottom:4px}
#dlgTxt{font-size:20px;line-height:1.05;min-height:2.1em}
#dlg::after{content:'▼';position:absolute;right:8px;bottom:4px;font-size:12px;color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#title{position:absolute;left:10px;top:10px;padding:6px 12px;font-family:var(--px);font-size:10px;z-index:2;pointer-events:none;text-transform:uppercase}
#dlg:not([hidden])~#title{display:none}
.hint{position:absolute;right:8px;bottom:8px;font-family:var(--px);font-size:7px;color:#fff;opacity:.75;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:2}
/* ---- les fenêtres bleues ---- */
.ff{background:linear-gradient(180deg,var(--ffA) 0%,var(--ffB) 55%,var(--ffC) 100%);border:3px solid var(--edge);border-radius:7px;
  box-shadow:0 0 0 2px #06061a,inset 0 0 0 2px var(--edgeIn);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.55)}
.ui{flex:none;height:212px;min-height:0;display:grid;grid-template-columns:minmax(132px,30%) 1fr;grid-template-rows:1fr auto;grid-template-areas:'menu panel' 'menu status';gap:6px;padding:8px;background:#0b0910;transition:height .25s}
body.open .ui{height:56%}
#menu{grid-area:menu} #panel{grid-area:panel}
#menu{display:flex;flex-direction:column;padding:6px 4px;overflow:auto;min-height:0}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 6px 5px 28px;cursor:pointer;font-size:21px;position:relative;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:inherit}
.mi.cur{color:var(--gold)}
.mi.sel::before{content:'';position:absolute;left:2px;top:50%;width:22px;height:16px;margin-top:-8px;background:var(--hand) no-repeat center/contain;image-rendering:pixelated;animation:hand .6s steps(2) infinite}
@keyframes hand{50%{transform:translateX(3px)}}
.mi:focus-visible{outline:2px dashed var(--gold);outline-offset:-2px}
#panel{padding:10px 12px;overflow:auto;min-height:0;overscroll-behavior:contain}
#panel p{margin:6px 0}
#status{grid-area:status;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-around;padding:6px 10px;font-size:19px}
#status b{font-family:var(--px);font-size:10px;font-weight:normal}
.gold{color:var(--gold)} .red{color:var(--red)} .green{color:var(--green)} .dim{color:var(--dim)}
.big{font-family:var(--px);font-size:14px;font-weight:normal}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column}
.gap{gap:8px}
.list{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.li{display:flex;align-items:center;gap:8px;padding:4px 6px;background:rgba(0,0,20,.25);border:0;border-radius:3px;text-align:left;width:100%;text-shadow:inherit}
.li.col{flex-direction:column;align-items:stretch;gap:3px}
button.li{cursor:pointer} button.li:hover{background:rgba(255,255,255,.08)}
.li.off{opacity:.55} .li.sel{outline:2px solid var(--gold)}
.li small{font-size:16px}
.li>.grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.flat{background:none;padding:1px 0}
.li.flat>.grow{flex:0 0 38%}
.gauge.wide{flex:1;width:auto;height:7px;background:#06061a;border-color:#06061a}
.wrap{flex-wrap:wrap;gap:0 8px}
p.say{font-size:18px;margin:2px 0 4px}
.gauge{display:inline-block;width:84px;height:8px;background:#0a0e3a;border:1px solid #9aa4e0;flex:none}
.li.col .gauge{width:100%}
.gauge i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:6px 0}
.kv b{font-weight:normal;text-align:right}
input,select{background:#0a0e3a;border:2px solid #9aa4e0;border-radius:3px;padding:4px 6px;font-size:20px;min-width:0}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0}
input.full,select.full,.full{width:100%;margin:4px 0}
input.amount{font-family:var(--px);font-size:16px;flex:1;text-align:right;padding:8px}
input.money{width:6.5em;text-align:right}
.ffbtn{background:linear-gradient(#5a6ad8,#2a3698);border:2px solid var(--edge);border-radius:4px;padding:5px 12px;cursor:pointer;font-size:20px;text-shadow:1px 1px 0 #000;box-shadow:0 0 0 1px #06061a}
.ffbtn:active{transform:translateY(1px)}
.ffbtn.sm{padding:2px 8px}
.ffbtn.red{background:linear-gradient(#c84a5a,#7a1e2e)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{background:#0a0e3a;border:1px solid #9aa4e0;border-radius:3px;padding:2px 7px;cursor:pointer;font-size:18px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:3px;margin:6px 0}
.cat{display:flex;align-items:center;gap:4px;background:rgba(0,0,20,.3);border:2px solid transparent;border-radius:3px;padding:2px 4px;cursor:pointer;font-size:18px;text-align:left;overflow:hidden;white-space:nowrap}
.cat.on{border-color:var(--gold);color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:6px 0}
.dow{text-align:center;color:var(--dim);font-size:16px}
.day{aspect-ratio:1.25;border:1px solid rgba(255,255,255,.15);background:#0a0e3a;border-radius:2px;cursor:pointer;font-size:17px;padding:0}
.day.ok{background:#2e6a3a}.day.zero{background:#2a5a8a}.day.warn{background:#8a6a1e}.day.over{background:#8a2a34}.day.fut{opacity:.4}.day.miss{background:#1a1e48}
.day.today{outline:2px solid #fff}.day.sel{outline:2px solid var(--gold)}
.box{width:26px;height:26px;flex:none;background:#0a0e3a;border:2px solid #9aa4e0;border-radius:3px;cursor:pointer;color:var(--green);font-size:20px;padding:0;line-height:1}
.box.on{background:#24522e}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:22px;padding:0 4px}
.week{display:flex;gap:3px}
.wd{flex:1;background:#0a0e3a;border:1px solid #9aa4e0;border-radius:2px;cursor:pointer;font-size:16px;padding:2px 0}
.wd.on{background:#2e6a3a}.wd.today{outline:2px solid #fff}
.sws{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 8px}
.sw{background:#0a0e3a;border:2px solid #4a5498;border-radius:3px;padding:2px;cursor:pointer;min-width:30px;height:30px}
.sw.on{border-color:var(--gold)}
.sw i{display:block;width:22px;height:22px}
.sw small{font-size:16px;padding:0 4px}
canvas.spark{width:100%;height:30px}
#dchart{width:100%;height:90px;display:block}
.face{display:block}
/* ---- les messages ---- */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;width:min(92vw,380px);pointer-events:none}
.toast{padding:8px 12px;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(4,2,12,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
#modalBox{width:min(100%,420px);max-height:90vh;overflow:auto;padding:14px 16px}
#modalBox p{margin:8px 0}
.banner{background:#7a1e2e;color:#fff;padding:6px 10px;font-size:18px;text-align:center}
/* ---- au téléphone : la scène en haut, les fenêtres dessous ---- */
@media (max-width:640px){
  #pc{padding:6px 6px 40px;width:100%;margin:0}
  .view{flex:none;height:min(calc((100vw - 24px) * .86),46vh)}
  .ui,body.open .ui{flex:1;height:auto;grid-template-areas:'menu panel' 'status status'}
  #status b{font-size:9px}
  .bezel{padding:6px 6px 0;border-radius:10px}
  .view{height:clamp(190px,36vh,330px)}
  .ui{grid-template-columns:128px 1fr;gap:5px;padding:5px}
  .cats{grid-template-columns:1fr 1fr}
  .cat{font-size:16px}
  .gauge{width:56px}
  .toast{padding:5px 10px;font-size:18px}
  .big{font-size:12px}
  .mi{font-size:18px;padding:4px 2px 4px 22px}
  .mi.sel::before{width:18px;height:13px;margin-top:-6px}
  #panel{padding:8px}
  #dlg{left:5px;right:5px;top:5px;padding:6px 8px;gap:8px;min-height:56px}
  #dlg .face{width:40px;height:40px}
  #dlgTxt{font-size:18px}
  #status{font-size:16px;gap:2px 8px;padding:5px 6px}
  #mugWrap{width:76px;height:76px;right:-4px;bottom:2px}
  .steam{display:none}
  .chin{height:24px}
  .stand{height:8px}
  .room::after{height:46px}
}
@media (min-width:900px){ .ui{grid-template-columns:220px 1fr} }
@media (max-width:900px) and (min-width:641px){ #pc{width:100%;margin:0;padding:8px 8px 44px} #mugWrap{right:-6px;width:96px;height:96px} .steam{display:none} }

/* ---- l'onglet au-dessus d'un lieu survolé ---- */
#tag{position:absolute;z-index:3;transform:translate(-50%,-100%);padding:4px 10px 5px;font-size:17px;line-height:1.05;white-space:nowrap;pointer-events:none;text-align:center}
#tag b{font-family:var(--px);font-size:9px;font-weight:normal}
#tag small{font-size:16px;color:#fff}
#tag::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--edge)}
/* ---- le sélecteur de mois : deux flèches de curseur, comme dans les menus ---- */
.monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 6px}
.monthbar span{font-family:var(--px);font-size:10px;min-width:12em;text-align:center}
.arrow{width:22px;height:22px;background:none;border:0;cursor:pointer;position:relative;padding:0}
.arrow::before{content:'';position:absolute;inset:4px 5px;background:#fff;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6));animation:nudge .7s steps(2) infinite}
.arrow.l::before{clip-path:polygon(100% 0,0 50%,100% 100%)}
.arrow.r::before{clip-path:polygon(0 0,100% 50%,0 100%)}
.arrow.l::before{--dx:-2px}.arrow.r::before{--dx:2px}
.arrow:hover::before{background:var(--gold)}
@keyframes nudge{50%{transform:translateX(var(--dx))}}
/* ---- personnages, progression ---- */
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;margin:6px 0}
.charc{display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(0,0,20,.3);border:2px solid transparent;border-radius:4px;padding:4px 2px;cursor:pointer;position:relative;text-shadow:inherit}
.charc:hover{border-color:#9aa4e0}.charc.on{border-color:var(--gold)}
.charc b{font-family:var(--px);font-size:8px;font-weight:normal;margin-top:2px}
.charc small{font-size:14px;color:var(--dim);text-align:center;line-height:1}
.charc .new{position:absolute;top:2px;right:2px;font-style:normal;font-family:var(--px);font-size:6px;color:var(--ink);background:var(--gold);padding:1px 2px;border-radius:2px;text-shadow:none}
.xpbar{display:inline-block;position:relative;width:56px;height:7px;background:#06061a;border:1px solid #9aa4e0;margin:0 6px;vertical-align:middle}
.xpbar i{display:block;height:100%;background:linear-gradient(#9ff0a0,#4ab04a)}
.xpbar.big-bar{display:block;width:100%;height:18px;margin:6px 0}
.xpbar.big-bar span{position:absolute;inset:0;text-align:center;font-size:16px;line-height:16px}
#status .cash,#status .lv{cursor:pointer}
.sw.lock{opacity:.45;cursor:default;border-style:dashed}
#modalBox .chars{max-height:58vh;overflow:auto}
@media (prefers-reduced-motion:reduce){ .arrow::before{animation:none} }
@media (prefers-reduced-motion:reduce){ .mi.sel::before,#dlg::after{animation:none} }
</style>
</head>
<body>
<div class="room"></div>
<div id="banner"></div>
<div id="pc">
  <div class="bezel">
    <div class="screen">
      <div class="view">
        <canvas id="scene" aria-label="La cité suspendue, vue depuis le PC de Roré"></canvas>
        <div id="dlg" class="ff" data-act="dlg" hidden><span id="dlgFace"></span><div class="grow"><div id="dlgWho"></div><div id="dlgTxt"></div></div></div>
        <div id="title" class="ff"></div>
        <div id="tag" class="ff" hidden></div>
        <div class="hint">◀ glisser ▶</div>
      </div>
      <div class="ui">
        <nav id="menu" class="ff" aria-label="Menu"></nav>
        <section id="panel" class="ff"></section>
        <div id="status" class="ff"></div>
      </div>
    </div>
    <div class="chin"><span>ROR&middot;43</span><span class="led"></span><button id="musicBtn" data-act="music" aria-label="Musique">♪ MUSIQUE</button></div>
  </div>
  <div class="stand"></div>
  <div id="mugWrap" aria-hidden="true"><div class="steam"><i></i><i></i><i></i></div><canvas id="mug" width="236" height="236"></canvas></div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div id="modalBox" class="ff"></div></div>
<script>
'use strict';
/* ============================================================
   BUDGET QUEST — tracker de dépenses RPG en pixel art (FCFA)
   Données : localStorage du navigateur (exportables en JSON/CSV)
   ============================================================ */

const STORE_KEY = 'budgetquest.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const ymOf = ds => ds.slice(0, 7);
const parseD = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (ds, n) => { const d = parseD(ds); d.setDate(d.getDate() + n); return dstr(d); };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DOW1 = ['D','L','M','M','J','V','S'];
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const dayLabel = ds => { const d = parseD(ds); return `${['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const NF = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
const num = n => NF.format(Math.round(n)).replace(/[  ]/g, ' ');
const fmt = n => num(n) + ' F';
const fmtS = n => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n)) + ' F';
const kfmt = n => n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'M' : n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + 'k' : String(Math.round(n));
const parseAmt = s => { const v = parseInt(String(s).replace(/[^\d]/g, ''), 10); return isNaN(v) ? 0 : v; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- PIXEL ART ---------------- */
const SWEET = {k:'#1a1c2c',p:'#5d275d',r:'#b13e53',o:'#ef7d57',y:'#ffcd75',l:'#a7f070',g:'#38b764',t:'#257179',n:'#29366f',b:'#3b5dc9',c:'#41a6f6',C:'#73eff7',w:'#f4f4f4',G:'#94b0c2',d:'#566c86',D:'#333c57'};

function norm(rows, w = 16, h = 16, padBottom = 0) {
  let r = rows.map(x => (x + '.'.repeat(w)).slice(0, w));
  for (let i = 0; i < padBottom; i++) r.push('.'.repeat(w));
  while (r.length < h) r.unshift('.'.repeat(w));
  return r.slice(-h);
}

const ICONS = {
  jeu:   ['......xx','.....xxx','....xxx.','x..xxx..','.xxxx...','..xx....','.x.xx...','x.......'],

function habitDone(date, id) { return !!(S.habitLog[date] && S.habitLog[date][id]); }
function habitStreak(id) {
  let d = today(); if (!habitDone(d, id)) d = addDays(d, -1);
  let n = 0; while (habitDone(d, id)) { n++; d = addDays(d, -1); }

// Le multiplicateur de série : +4 % par jour de série, jusqu'à ×2 au 25e jour
const comboOf = streak => 1 + Math.min(streak, 25) * .04;
function computeGame() {
  const t = today(), tym = ymOf(t);
  const byDate = new Map();
  for (const e of S.expenses) { const o = byDate.get(e.date) || {n: 0, sum: 0}; o.n++; o.sum += e.amount; byDate.set(e.date, o); }
  let start = S.createdAt || t;
  for (const d of byDate.keys()) if (d < start) start = d;
  for (const d in S.checkins) if (d < start) start = d;
  for (const d in S.habitLog) if (d < start) start = d;
  if (start > t) start = t;
  // quêtes et suivis, jour par jour
  const habitIds = new Set(S.habits.map(h => h.id)), habitsByDay = {};
  let nHabit = 0, habitsThisMonth = 0;
  for (const d in S.habitLog) { let c = 0; for (const id in S.habitLog[d]) if (S.habitLog[d][id] && habitIds.has(id)) c++; habitsByDay[d] = c; nHabit += c; if (ymOf(d) === tym) habitsThisMonth += c; }
  const trackIds = new Map(S.trackers.map(x => [x.id, x])), trackByDay = {};
  let nTrack = 0;
  for (const d in S.trackerLog) for (const id in S.trackerLog[d]) {
    const tr = trackIds.get(id), v = S.trackerLog[d][id]; if (!tr || v === '' || v == null) continue;
    const goal = tr.goal === '' || tr.goal == null ? null : +tr.goal, ok = goal == null || (tr.dir === 'max' ? +v <= goal : +v >= goal);
    trackByDay[d] = (trackByDay[d] || 0) + (ok ? 10 : 5); nTrack++;
  }

  let xp = 0, streak = 0, best = 0, victories = 0, zeroDays = 0, checkDays = 0, buildDays = 0, bestCombo = 1, xpToday = 0, todayParts = [];
  const allow = {}, allowOf = d => { const ym = ymOf(d); if (!(ym in allow)) allow[ym] = totalBudget(ym) / dim(ym); return allow[ym]; };
  const msNow = monthStats(tym);
  for (let d = start; d <= t; d = addDays(d, 1)) {
    const o = byDate.get(d), n = o ? o.n : 0, sum = o ? o.sum : 0, checked = n > 0 || !!S.checkins[d], isToday = d === t;
    const parts = [];
    if (checked) {
      checkDays++; streak++; if (streak > best) best = streak;
      parts.push(['Journal tenu', 10]);
      if (n) parts.push([`${Math.min(n, 5)} dépense${n > 1 ? 's' : ''} notée${n > 1 ? 's' : ''}`, 2 * Math.min(n, 5)]);
      if (n === 0) { parts.push(['Journée sans dépense', 20]); zeroDays++; }
      const lim = isToday ? msNow.todayAllowance : allowOf(d);
      if (sum <= lim) { // sous le budget du jour : plus on reste loin de la limite, plus ça rapporte
        const bonus = 30 + Math.round(20 * (lim > 0 ? 1 - sum / lim : 1));
        if (isToday) parts.push(['Sous le budget du jour (provisoire)', bonus]);
        else { parts.push(['Sous le budget du jour', bonus]); victories++; buildDays++; }
      }
    } else if (!isToday) streak = 0;
    if (habitsByDay[d]) { parts.push([`${habitsByDay[d]} quête${habitsByDay[d] > 1 ? 's' : ''}`, 15 * habitsByDay[d]]); if (S.habits.length >= 2 && habitsByDay[d] >= S.habits.length) parts.push(['Toutes les quêtes', 25]); }
    if (trackByDay[d]) parts.push(['Mesures de suivi', trackByDay[d]]);
    const combo = comboOf(checked ? streak : 0); if (combo > bestCombo) bestCombo = combo;
    const raw = parts.reduce((a, p) => a + p[1], 0), dayXP = Math.round(raw * combo);
    let bonus = 0;
    if (checked && (streak === 7 || streak === 14 || streak === 30 || streak === 60 || streak === 100)) bonus = streak >= 30 ? 500 : 150;
    xp += dayXP + bonus;
    if (isToday) { xpToday = dayXP + bonus; todayParts = parts.slice(); if (combo > 1) todayParts.push([`Série ×${combo.toFixed(2).replace('.', ',')}`, dayXP - raw]); if (bonus) todayParts.push([`Palier de série (${streak} j)`, bonus]); }
  }

  let savings = 0, underMonths = 0, perfectMonths = 0;

    const m = monthStats(ym); if (!m.count) continue;
    savings += m.budget - m.spent;

    const held = m.cats.filter(c => c.budget > 0 && c.spent <= c.budget).length; xp += 40 * held;
    if (m.cats.every(c => c.spent <= c.budget)) perfectMonths++;

  if (Array.isArray(W_.found)) xp += 10 * W_.found.length; // lieux découverts dans l'ancienne carte : l'XP est conservée

  let level = 1, base = 0; while (xp >= base + xpNeed(level)) { base += xpNeed(level); level++; }

  // PV du mois en cours
  const ms = msNow;
  let dmg = 0;
  for (const c of ms.cats) {
    if (c.budget > 0 && c.spent > c.budget) dmg += Math.min(40, 10 + Math.round((c.spent - c.budget) / c.budget * 50));

  for (let d = 1; d < ms.elapsed; d++) if (ms.daily[d] > ms.allowance * 1.5) dmg += 5;
  const heal = Math.min(30, habitsThisMonth);
  const hp = clamp(100 - dmg + heal, 0, 100);

  // la trésorerie : ce qu'il y avait au départ, plus les rentrées, moins les dépenses depuis
  const sd = S.startDate || S.createdAt || t;
  const inc = S.incomes.filter(e => e.date >= sd).reduce((a, e) => a + e.amount, 0), out = S.expenses.filter(e => e.date >= sd).reduce((a, e) => a + e.amount, 0);
  const cash = S.startCash == null ? null : S.startCash + inc - out;

    nChests, buildDays, buildToday, builtNow: buildDays, built: buildDays, combo: comboOf(streak), bestCombo, xpToday, todayParts,
    nHabit, nTrack, hp, treasure: savings, savings, cash, inc, out, underMonths, perfectMonths, ms, checkedToday};
  g.unlocked = ACH.filter(a => a.test(g)).map(a => a.id);
  return g;
}

  if (place === 'archives') return say + `J'ai ${ms.count} dépense${ms.count > 1 ? 's' : ''} dans mes registres pour ${ymLabel(ms.ym)}.`;

function heroLine(g) {

  const broken = ms.cats.filter(c => c.budget > 0 && c.spent > c.budget);
  if (broken.length) return `Attention : « ${broken[0].cat.name} » a dépassé son budget de ${fmt(broken[0].spent - broken[0].budget)}. L'orage gronde sur la cité.`;

function progress(g, quiet) {
  let changed = false;
  for (const ch of CHESTS) if (!S.world.chests[ch.id] && condMet(ch, g)) {
    S.world.chests[ch.id] = today(); changed = true;
    if (ch.skin && !S.world.skins.includes(ch.skin)) S.world.skins.push(ch.skin);
    if (!quiet) setTimeout(() => { toast('Récompense : ' + ch.name, ch.skin ? `Nouvelle tenue pour ${heroName()} : ${SKINS[ch.skin].name} (Config › Tenues).` : `+${ch.xp} XP`); SFX.quest(); }, 900);
  }
  if (g.level > (S.lastLevel || 1) && !quiet) { // montée de niveau : les accessoires gagnés sont portés tout de suite
    const gained = []; for (let lv = (S.lastLevel || 1) + 1; lv <= g.level; lv++) gained.push(...accsAt(lv));
    for (const k of gained) S.world.look = {...heroLook(), [ACCS[k].slot]: k};
    const newTitle = TITLES.some(t => t[0] > (S.lastLevel || 1) && t[0] <= g.level);
    S.lastLevel = g.level; changed = true; fanfare();
    setTimeout(() => modal(`<div class="center"><div class="gold big">NIVEAU ${g.level} !</div>${robotImg(heroKey(), heroOutfit(), 96, {pose: 'cheer', eyes: 'happy'})}${newTitle ? `<p>${esc(heroName())} devient <b class="gold">${esc(titleFor(g.level))}</b>.</p>` : ''}${gained.length ? `<p>Nouvel accessoire : <b class="gold">${gained.map(k => esc(ACCS[k].name)).join(', ')}</b>. ${esc(heroName())} le porte déjà (Config › Apparence pour changer).</p>` : ''}<p class="dim">Prochain niveau : ${num(xpNeed(g.level))} XP.</p><button class="ffbtn" data-act="closeModal">Continuer</button></div>`), 300);
  }
  else if (g.level !== S.lastLevel) { S.lastLevel = g.level; changed = true; }
  const fresh = g.unlocked.filter(id => !S.seenAch.includes(id));
  if (fresh.length) { S.seenAch.push(...fresh); changed = true; if (!quiet) fresh.forEach((id, i) => setTimeout(() => { const a = ACH.find(x => x.id === id); toast('Trophée : ' + a.name, a.desc); SFX.quest(); }, 600 + i * 700)); }

  }

}

  else if (k === 'income') { const amount = parseAmt(v('amount')); if (!amount) { toast('Montant ?', 'Indique combien tu as reçu.'); return; } S.incomes.push({id: uid(), date: v('date') || today(), amount, note: v('note').trim().slice(0, 60)}); SFX.coin(); toast('Rentrée notée', `+${fmt(amount)} dans la trésorerie.`); UI.sub = 'income'; commit(); }
  else if (k === 'cash') { const c = v('amount'); S.startCash = c.trim() ? parseAmt(c) : null; S.startDate = v('date') || today(); SFX.coin(); commit(); }
});
function welcome(step) { // l'accueil : choisir son personnage, puis son nom et sa trésorerie de départ
  if (!step) return modal(`<div class="center"><div class="gold big">BUDGET QUEST</div><p>Depuis son PC de l'Open Space, Roré veille sur la cité suspendue. Choisis qui tu seras dans la cité.</p></div><div class="chars">${CHAR_ORDER.map(k => `<button class="charc" data-act="welcomeChar" data-k="${k}">${robotImg(k, CHARS[k].outfit, 44)}<b>${esc(CHARS[k].name)}</b><small>${esc(CHARS[k].archetype)}</small>${CHARS[k].isNew ? '<i class="new">NOUVEAU</i>' : ''}</button>`).join('')}</div>`);

}


/* ---- Le panorama : glisser pour se promener, toucher un lieu pour l'ouvrir ---- */
(function sceneInput() {
  const cv = () => $('#scene');
  let down = null;
  document.addEventListener('pointerdown', e => { if (e.target.id !== 'scene') return; down = {x: e.clientX, cam: SCENE.cam, t: performance.now(), moved: false, last: e.clientX, lt: performance.now()}; SCENE.drag = true; SCENE.target = null; SCENE.camV = 0; e.target.setPointerCapture(e.pointerId); });
  document.addEventListener('pointermove', e => { // le survol : l'onglet du lieu et sa surbrillance
    if (e.pointerType !== 'touch') UI.mouse = !down && e.target.id === 'scene' ? [e.clientX, e.clientY] : null;
    if (!down) return; const dx = e.clientX - down.x, k = (window.devicePixelRatio || 1) / SZ; if (Math.abs(dx) > 6) down.moved = true; SCENE.cam = clampCam(down.cam - dx * k); const now = performance.now(); if (now > down.lt) { SCENE.camV = -(e.clientX - down.last) * k / ((now - down.lt) / 1000); down.last = e.clientX; down.lt = now; } });
  document.addEventListener('pointerup', e => {
    if (!down) return; SCENE.drag = false;
    if (!down.moved) { const r = cv().getBoundingClientRect(), k = (window.devicePixelRatio || 1) / SZ, wx = SCENE.cam + (e.clientX - r.left) * k, wy = (e.clientY - r.top) * k; const id = placeAt(wx, wy); if (id) openPlace(id); SCENE.camV = 0; }
    down = null;
  });
  document.addEventListener('pointerout', e => { if (e.target.id === 'scene' && e.pointerType !== 'touch') UI.mouse = null; });
  document.addEventListener('wheel', e => { if (e.target.id !== 'scene') return; e.preventDefault(); SCENE.target = null; SCENE.cam = clampCam(SCENE.cam + (e.deltaX || e.deltaY) / SZ); }, {passive: false});
  const tag = () => (document.activeElement && document.activeElement.tagName) || '';
  document.addEventListener('keydown', e => {
    if (!$('#modal').hidden || /INPUT|SELECT|TEXTAREA/.test(tag())) { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); return; }
    const items = menuItems();
    if (e.key === 'ArrowDown') { e.preventDefault(); UI.menuIdx = (UI.menuIdx + 1) % items.length; SFX.click(); renderUI(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); UI.menuIdx = (UI.menuIdx - 1 + items.length) % items.length; SFX.click(); renderUI(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chooseMenu(UI.menuIdx); }
    else if (e.key === 'Escape' || e.key === 'Backspace') { if (UI.place) { e.preventDefault(); closePlace(); } }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); SCENE.target = null; UI.keyScroll = e.key === 'ArrowLeft' ? -1 : 1; }
    else if ((e.key === 'PageUp' || e.key === 'PageDown') && document.querySelector('#panel .monthbar')) { e.preventDefault(); UI.viewYM = addMonths(UI.viewYM, e.key === 'PageUp' ? -1 : 1); UI.selDay = null; SFX.click(); renderUI(); }
  });
  document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') UI.keyScroll = 0; });
})();

/* ---- La musique : un petit air de village en 8 bits, composé ici ---- */
const MUSIC = {on: false, timer: null, next: 0, step: 0};
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
// do – la mineur – fa – sol, une mélodie pentatonique, une basse et des arpèges
const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
const MELODY = [72, null, 74, 76, null, 79, 76, 74, 72, null, 69, 72, null, null, 74, null, 76, null, 74, 72, 69, null, 72, 74, 72, null, null, null, 67, null, 69, null,
  77, null, 76, 74, null, 72, 74, 76, 74, null, 72, 69, null, 67, null, null, 71, null, 72, 74, null, 76, 74, 72, 74, null, null, null, null, null, null, null];
function tone(f, t, d, type, vol) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); }
function scheduleMusic() {
  const spb = .27;
  while (MUSIC.next < AC.currentTime + .25) {
    const s = MUSIC.step, bar = Math.floor(s / 8) % 4, ch = CHORDS[bar], t = MUSIC.next, night = timeOfDay() === 'night';
    const m = MELODY[s % MELODY.length]; if (m) tone(NOTE(m - (night ? 12 : 0)), t, spb * 1.6, 'square', .018);
    if (s % 4 === 0) tone(NOTE(ch[0] - 24), t, spb * 3.6, 'triangle', .06);
    tone(NOTE(ch[s % 3] + (s % 6 < 3 ? 0 : 12)), t, spb * .8, 'square', .006);
    MUSIC.step++; MUSIC.next += spb;
  }
}
function toggleMusic(force) {
  MUSIC.on = force ?? !MUSIC.on; MUSIC.wanted = MUSIC.on;
  try { localStorage.setItem(STORE_KEY + '.music', MUSIC.on ? '1' : '0'); } catch (e) {}
  if (MUSIC.on) { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume && AC.resume(); MUSIC.next = AC.currentTime + .05; MUSIC.timer = setInterval(scheduleMusic, 60); }
  else clearInterval(MUSIC.timer);
  const b = $('#musicBtn'); if (b) b.classList.toggle('on', MUSIC.on);
}
function fanfare() { beep([[523, .12, 0], [659, .12, .12], [784, .12, .24], [1047, .25, .36], [988, .12, .62], [1047, .5, .74]]); }

/* ---- La tasse de café 43, sur le bureau ---- */
function drawMug() {
  const cv = $('#mug'); if (!cv) return; const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const x = 10, b = H - 6, w = W * .62, h = H * .62;
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x + w / 2, b, w * .6, 6, 0, 0, 7); g.fill();
  const mg = g.createLinearGradient(x, 0, x + w, 0); mg.addColorStop(0, '#ffffff'); mg.addColorStop(.6, '#ecebf3'); mg.addColorStop(1, '#b9b6c9');
  g.fillStyle = mg; g.beginPath(); g.roundRect ? g.roundRect(x, b - h, w, h, 12) : g.rect(x, b - h, w, h); g.fill();
  g.lineWidth = W * .08; g.strokeStyle = '#dcdae6'; g.beginPath(); g.arc(x + w + 2, b - h * .5, h * .24, -Math.PI / 2, Math.PI / 2); g.stroke();
  g.fillStyle = '#3a2216'; g.beginPath(); g.ellipse(x + w / 2, b - h + 2, w / 2 - 3, 6, 0, 0, 7); g.fill();
  g.font = `${Math.round(h * .32)}px 'Press Start 2P'`; g.fillStyle = '#ff8a3d'; g.textAlign = 'center'; g.fillText('43', x + w / 2, b - h * .3);
}

function handCursor() { // la main gantée des menus, dessinée au pixel
  const rows = ['....xxxx......', '...xwwwwx.....', 'xxxxwwwwwxxxx.', 'xwwwwwwwwwwwwx', 'xxxxwwwwwwwwwx', '...xwwwwwwwwwx', '...xxxwwwwwwx.', '....xwwwwwxx..', '.....xxxxxx...'];
  const [c, g] = mkc(rows[0].length, rows.length);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') P1(g, x, y, ch === 'x' ? '#1a1424' : y < 3 ? '#ffffff' : '#d8d4e4'); }));
  document.documentElement.style.setProperty('--hand', `url(${c.toDataURL()})`);
}
function boot() {
  S = load() || defaultState(); save();
  handCursor(); sizeScene();
  UI.game = computeGame(); UI.dlg = S.onboarded && !S.expenses.length ? idleDlg() : null;
  SCENE.cam = clampCam(0);
  renderUI(); progress(UI.game, true);
  try { MUSIC.wanted = localStorage.getItem(STORE_KEY + '.music') === '1'; } catch (e) {}
  if (MUSIC.wanted) { const b = $('#musicBtn'); if (b) b.classList.add('on'); const go = () => { document.removeEventListener('pointerdown', go); if (MUSIC.wanted && !MUSIC.on) toggleMusic(true); }; document.addEventListener('pointerdown', go); }
  if (!S.onboarded) { if (S.heroName || S.expenses.length) { S.onboarded = true; save(); } else welcome(); }
  drawMug();
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("8px 'Press Start 2P'"), document.fonts.load("20px 'VT323'")]).then(() => { SCENE.key = ''; ensureLayers(UI.game); drawMug(); }).catch(() => {});
  let last = performance.now(), lastMin = new Date().getMinutes();
  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    updateScene(dt, now); drawScene(now);
    const m = new Date().getMinutes(); if (m !== lastMin) { lastMin = m; renderUI(); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  if (window.ResizeObserver) new ResizeObserver(() => { sizeScene(); SCENE.cam = clampCam(SCENE.cam); if (SCENE.focus) focusPlace(SCENE.focus); }).observe($('.view'));
  addEventListener('resize', () => { sizeScene(); SCENE.cam = clampCam(SCENE.cam); if (SCENE.target != null && SCENE.focus) focusPlace(SCENE.focus); });
}
boot();

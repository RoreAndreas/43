<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<title>Budget Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --k:#1a1c2c;--p:#5d275d;--r:#b13e53;--o:#ef7d57;--y:#ffcd75;--l:#a7f070;--g:#38b764;--t:#257179;
  --n:#29366f;--b:#3b5dc9;--c:#41a6f6;--C:#73eff7;--w:#f4f4f4;--G:#94b0c2;--d:#566c86;--D:#333c57;
  --px:'Press Start 2P',ui-monospace,monospace;
  --vt:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{background:var(--k)}
body{margin:0 auto;max-width:920px;background:var(--k);color:var(--w);font-family:var(--vt);font-size:21px;line-height:1.15;
  padding:0 0 calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
h1,h2,h3{font-family:var(--px);font-weight:normal;margin:0 0 12px;line-height:1.5}
h2{font-size:11px;color:var(--y);letter-spacing:.5px}
h3{font-size:9px;color:var(--G)}
small,.muted{color:var(--G)}
.box{background:var(--D);margin:16px 16px;padding:12px;position:relative;
  box-shadow:0 -4px 0 0 var(--w),0 4px 0 0 var(--w),-4px 0 0 0 var(--w),4px 0 0 0 var(--w),inset 0 -4px 0 0 rgba(0,0,0,.25)}
.box.dark{background:#22263a}
.box.say{background:var(--k);min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.right{text-align:right}
.pos{color:var(--l)} .neg{color:var(--o)} .gold{color:var(--y)}

/* Buttons */
.btn{font-family:var(--px);font-size:10px;line-height:1.4;padding:10px 12px;background:var(--b);color:var(--w);border:0;cursor:pointer;
  box-shadow:inset -3px -3px 0 0 rgba(0,0,0,.4),0 0 0 3px var(--k);margin:3px}
.btn:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 0 rgba(0,0,0,.4),0 0 0 3px var(--k)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.green{background:var(--g)} .btn.red{background:var(--r)} .btn.gold{background:var(--y);color:var(--k)}
.btn.grey{background:var(--d)} .btn.cyan{background:var(--t)}
.btn.big{font-size:12px;padding:14px 16px;width:calc(100% - 6px)}
.btn.sm{font-size:8px;padding:7px 8px}
.icon-btn{background:none;border:0;color:var(--G);font-family:var(--vt);font-size:22px;cursor:pointer;padding:2px 6px}
.icon-btn:hover{color:var(--w)}

/* Inputs */
input,select{font-family:var(--vt);font-size:22px;background:var(--k);color:var(--w);border:0;padding:6px 8px;
  box-shadow:0 0 0 3px var(--d);outline:none;max-width:100%;border-radius:0}
input:focus,select:focus{box-shadow:0 0 0 3px var(--y)}
input[type=date]{color-scheme:dark}
label.f{display:block;margin:10px 0 4px;color:var(--G);font-size:19px}
.full{width:100%}
.amount-row{display:flex;align-items:center;gap:8px}
.amount-row input{font-size:40px;width:100%;text-align:right;color:var(--y);padding:4px 10px}
.amount-row .cur{font-family:var(--px);font-size:10px;color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.chip{font-family:var(--vt);font-size:19px;background:var(--k);color:var(--G);border:0;padding:4px 8px;cursor:pointer;box-shadow:0 0 0 2px var(--d)}
.chip:active{background:var(--d);color:var(--w)}

/* Category picker */
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:8px 0}
.catbtn{background:var(--k);border:0;color:var(--G);padding:6px 2px;cursor:pointer;font-family:var(--vt);font-size:17px;
  box-shadow:0 0 0 2px var(--d);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.catbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbtn.sel{box-shadow:0 0 0 3px var(--y);color:var(--w);background:#2a2f48}

/* Bars */
.bar{height:14px;background:var(--k);box-shadow:0 0 0 2px var(--w);position:relative;overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;background:var(--g);
  background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.25) 6px 8px);transition:width .4s steps(8)}
.bar.hp>i{background-color:var(--r)} .bar.xp>i{background-color:var(--c)}
.bar>.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--y)}
.stat{display:flex;align-items:center;gap:8px;margin:6px 0}
.stat>span:first-child{font-family:var(--px);font-size:9px;width:26px}
.stat>b{font-weight:normal;min-width:84px;text-align:right}

/* HUD */
.hud{display:flex;gap:12px;align-items:center}
.hud .who{font-family:var(--px);font-size:11px;line-height:1.6}
.hud .ttl{color:var(--y);font-family:var(--vt);font-size:21px;line-height:1.1}
.hud .badges{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:2px}
.hud .badges span{display:inline-flex;align-items:center;gap:4px}

/* Arena */
.map-wrap{padding:0;overflow:hidden}
#world{display:block;width:100%;height:300px;touch-action:manipulation;cursor:pointer;background:var(--k)}
.mapbtn{position:absolute;top:6px;right:6px;margin:0;opacity:.92}
.dpad{position:absolute;left:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,32px);grid-template-rows:repeat(3,32px);
  grid-template-areas:". u ." "l . r" ". d .";gap:2px;opacity:.55}
.dpad button,.abtn{border:0;background:rgba(26,28,44,.6);color:var(--w);font-size:13px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),0 0 0 2px var(--w);
  touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button:active,.abtn:active{background:var(--d)}
.dpad .du{grid-area:u}.dpad .dl{grid-area:l}.dpad .dr{grid-area:r}.dpad .dd{grid-area:d}
.abtn{position:absolute;right:10px;bottom:12px;width:44px;height:44px;font-family:var(--px);font-size:12px;background:rgba(177,62,83,.8);opacity:.7}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
.panel-head{position:sticky;top:-16px;background:var(--D);padding:6px 0 8px;margin:-6px 0 4px;z-index:2}
.trophy.sel{box-shadow:0 0 0 3px var(--y)}
.look-prev{display:flex;justify-content:center;align-items:flex-end;gap:18px;background:var(--t);padding:14px;margin-bottom:12px;box-shadow:inset 0 -10px 0 #257179,0 0 0 3px var(--k)}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.sw{background:var(--k);border:0;padding:4px 6px;cursor:pointer;box-shadow:0 0 0 2px var(--d);min-width:42px;min-height:42px;display:flex;align-items:center;justify-content:center;color:var(--w);font-family:var(--vt);font-size:18px}
.sw i{display:block;width:28px;height:28px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.sw.sel{box-shadow:0 0 0 3px var(--y);background:#2a2f48}
.hud .who{min-width:0}
#sayBtns:empty{display:none}
#say{min-height:2.3em}
.say .speaker{font-family:var(--px);font-size:9px;color:var(--y);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.say .speaker .face{background:var(--D);box-shadow:0 0 0 2px var(--d);flex:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* Monsters */
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.mon{background:var(--k);padding:10px;box-shadow:0 0 0 2px var(--d);display:flex;gap:10px;align-items:center;min-width:0}
.mon .info{flex:1;min-width:0}
.mon .nm{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon .st{font-family:var(--px);font-size:7px;margin:3px 0 5px}
.mon.lv1 .st{color:var(--l)} .mon.lv2 .st{color:var(--y)} .mon.lv3 .st{color:var(--o)} .mon.lv4 .st{color:var(--r)}
.mon.lv4{box-shadow:0 0 0 2px var(--r)}
.mon.lv4 img{animation:shake .3s steps(2) infinite}
.mon.lv3 img{animation:shake 1.2s steps(2) infinite}
@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.mon .bar>i{background-color:var(--g)}
.mon.lv2 .bar>i{background-color:var(--y)} .mon.lv3 .bar>i{background-color:var(--o)} .mon.lv4 .bar>i{background-color:var(--r)}

/* Today */
.big-num{font-size:40px;color:var(--y);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--k);padding:8px;text-align:center;box-shadow:0 0 0 2px var(--d)}
.kpi .v{font-size:24px} .kpi .l{font-size:16px;color:var(--G)}
@media (max-width:420px){.kpi .v{font-size:20px}}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-family:var(--px);font-size:8px;color:var(--G);padding:4px 0}
.cal button{aspect-ratio:1;border:0;background:var(--k);color:var(--w);font-family:var(--vt);font-size:17px;cursor:pointer;
  padding:2px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-width:0;overflow:hidden}
.cal button .amt{font-size:14px;align-self:flex-end;opacity:.9}
.cal button.today{box-shadow:0 0 0 2px var(--y)}
.cal button.sel{box-shadow:0 0 0 3px var(--w)}
.cal .c0{background:#22263a;color:var(--d)}
.cal .cz{background:var(--t)} .cal .c1{background:var(--g)} .cal .c2{background:#6f9a3e} .cal .c3{background:var(--o);color:var(--k)} .cal .c4{background:var(--r)}
.cal .miss{background:var(--k);color:var(--d)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:16px;color:var(--G)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed var(--d)}
.list li:last-child{border-bottom:0}
.dayhead{display:flex;justify-content:space-between;font-family:var(--px);font-size:9px;color:var(--y);margin:14px 0 4px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.monthnav .m{font-family:var(--px);font-size:11px;text-align:center;flex:1;text-transform:capitalize}

/* Variance rows */
.var{padding:8px 0;border-bottom:2px dashed var(--d)}
.var:last-child{border-bottom:0}
.var .bar{margin:6px 0}
.var .bar>i{background-color:var(--g)} .var.over .bar>i{background-color:var(--r)} .var.warn .bar>i{background-color:var(--y)}

/* Habits */
.habit{background:var(--k);padding:10px;margin:10px 0;box-shadow:0 0 0 2px var(--d)}
.habit.done{box-shadow:0 0 0 2px var(--l)}
.check{width:44px;height:44px;border:0;background:var(--D);cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),0 0 0 3px var(--k);
  display:flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--g)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.week button{border:0;background:var(--D);color:var(--G);font-family:var(--vt);font-size:16px;padding:4px 0;cursor:pointer}
.week button.on{background:var(--g);color:var(--k)}
.week button.t{box-shadow:0 0 0 2px var(--y)}

/* Trophies */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{background:var(--k);padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 0 0 2px var(--d);min-width:0}
.trophy.locked{opacity:.45}
.trophy .t1{font-family:var(--px);font-size:8px;color:var(--y);line-height:1.5}
.trophy .t2{font-size:16px;color:var(--G)}

/* Settings */
.catrow{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:2px dashed var(--d)}
.catrow .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catrow .fields .wide{grid-column:1/-1}
.catrow .fields input,.catrow .fields select{width:100%}

/* Nav */
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--k);box-shadow:0 -4px 0 0 var(--w);display:flex;justify-content:center;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav#tabs .in{display:flex;max-width:920px;width:100%}
nav#tabs button{flex:1;background:none;border:0;color:var(--d);font-family:var(--px);font-size:7px;padding:6px 0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
nav#tabs button img{opacity:.5}
nav#tabs button.on{color:var(--y)} nav#tabs button.on img{opacity:1}

/* Toasts / floaters / dialog */
#toasts{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:50;pointer-events:none}
.toast{background:var(--k);color:var(--w);padding:10px 14px;max-width:calc(100% - 40px);font-size:20px;
  box-shadow:0 -4px 0 0 var(--y),0 4px 0 0 var(--y),-4px 0 0 0 var(--y),4px 0 0 0 var(--y);animation:pop .25s steps(3)}
.toast b{font-family:var(--px);font-size:9px;color:var(--y);display:block;margin-bottom:4px;font-weight:normal}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.floater{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--px);font-size:16px;color:var(--C);
  text-shadow:3px 3px 0 var(--k);pointer-events:none;z-index:60;animation:floatup 1.2s steps(12) forwards}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-80px}}
dialog{background:var(--D);color:var(--w);border:0;padding:16px;width:min(520px,calc(100% - 40px));max-height:calc(100% - 40px);
  box-shadow:0 -4px 0 0 var(--w),0 4px 0 0 var(--w),-4px 0 0 0 var(--w),4px 0 0 0 var(--w)}
dialog::backdrop{background:rgba(10,12,24,.75)}
.levelup{text-align:center}
.levelup h1{font-size:18px;color:var(--y);animation:blink .6s steps(2) 4}
.banner{background:var(--r);color:var(--w);padding:8px 12px;margin:12px 16px;font-size:18px}
.rules li{margin:6px 0}
.empty{color:var(--G);text-align:center;padding:12px}
</style>
</head>
<body>
<div id="banner"></div>
<header id="hud"></header>
<main id="view"></main>
<nav id="tabs"><div class="in"></div></nav>
<div id="toasts"></div>
<dialog id="modal"></dialog>

<script>
'use strict';
/* ============================================================
   BUDGET QUEST — tracker de dépenses RPG en pixel art (FCFA)
   Données : localStorage du navigateur (exportables en JSON/CSV)
   ============================================================ */

const STORE_KEY = 'budgetquest.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const ymOf = ds => ds.slice(0, 7);
const parseD = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (ds, n) => { const d = parseD(ds); d.setDate(d.getDate() + n); return dstr(d); };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DOW1 = ['D','L','M','M','J','V','S'];
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const dayLabel = ds => { const d = parseD(ds); return `${['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const NF = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
const num = n => NF.format(Math.round(n)).replace(/[  ]/g, ' ');
const fmt = n => num(n) + ' F';
const fmtS = n => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n)) + ' F';
const kfmt = n => n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'M' : n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + 'k' : String(Math.round(n));
const parseAmt = s => { const v = parseInt(String(s).replace(/[^\d]/g, ''), 10); return isNaN(v) ? 0 : v; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- PIXEL ART ---------------- */
const SWEET = {k:'#1a1c2c',p:'#5d275d',r:'#b13e53',o:'#ef7d57',y:'#ffcd75',l:'#a7f070',g:'#38b764',t:'#257179',n:'#29366f',b:'#3b5dc9',c:'#41a6f6',C:'#73eff7',w:'#f4f4f4',G:'#94b0c2',d:'#566c86',D:'#333c57'};

function norm(rows, w = 16, h = 16, padBottom = 0) {
  let r = rows.map(x => (x + '.'.repeat(w)).slice(0, w));
  for (let i = 0; i < padBottom; i++) r.push('.'.repeat(w));
  while (r.length < h) r.unshift('.'.repeat(w));
  return r.slice(-h);
}

const ICONS = {
  jeu:   ['......xx','.....xxx','....xxx.','x..xxx..','.xxxx...','..xx....','.x.xx...','x.......'],
  journal:['........','.xx..xx.','x..xx..x','x..xx..x','x..xx..x','x..xx..x','.xx..xx.','...xx...'],
  ecarts:['......xx','......xx','...xx.xx','...xx.xx','xx.xx.xx','xx.xx.xx','xx.xx.xx','xxxxxxxx'],
  quetes:['...xx...','...xx...','xxxxxxxx','.xxxxxx.','..xxxx..','.xxxxxx.','.xx..xx.','x......x'],
  suivis:['..xxxx..','...xx...','...xx...','..x..x..','.x....x.','x.xxxx.x','x.xxxx.x','.xxxxxx.'],
  options:['...xx...','.xxxxxx.','.xx..xx.','xx....xx','xx....xx','.xx..xx.','.xxxxxx.','...xx...'],
};
const SMALL = {
  heart: {rows:['.kk.kk..','krwkrrk.','krrrrrk.','krrrrrk.','.krrrk..','..krk...','...k....','........'], pal:{k:SWEET.k,r:SWEET.r,w:SWEET.w}},
  coin:  {rows:['..kkkk..','.kyyyyk.','kywyyyok','kyyyyyok','kyyyyyok','kyyyyook','.kooook.','..kkkk..'], pal:{k:SWEET.k,y:SWEET.y,w:SWEET.w,o:SWEET.o}},
  flame: {rows:['...x....','..xx....','..xxx.x.','.xxyxxx.','.xyyyxx.','xxyyyyxx','xxyyyyxx','.xxxxxx.'], pal:{x:SWEET.o,y:SWEET.y}},
  trophy:{rows:['.xxxxxx.','xxxxxxxx','x.xwxx.x','.xxxxxx.','..xxxx..','...xx...','..xxxx..','.xxxxxx.'], pal:{x:SWEET.y,w:SWEET.w}},
  trophyOff:{rows:['.xxxxxx.','xxxxxxxx','x.xxxx.x','.xxxxxx.','..xxxx..','...xx...','..xxxx..','.xxxxxx.'], pal:{x:SWEET.d}},
  check: {rows:['........','.......x','......xx','x....xx.','xx..xx..','.xxxx...','..xx....','........'], pal:{x:SWEET.w}},
  star:  {rows:['...xx...','...xx...','xxxxxxxx','.xxxxxx.','..xxxx..','.xxxxxx.','.xx..xx.','x......x'], pal:{x:SWEET.C}},
};

function drawSprite(ctx, rows, pal, ox, oy, s = 1, opt = {}) {
  const H = rows.length, W = rows[0].length;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x]; if (ch === '.') continue;
    let col = pal[ch]; if (!col) continue;
    if (opt.grey) { const v = parseInt(col.slice(1, 3), 16) * .3 + parseInt(col.slice(3, 5), 16) * .59 + parseInt(col.slice(5, 7), 16) * .11; const h = Math.round(v * .7).toString(16).padStart(2, '0'); col = '#' + h + h + h; }

function monthStats(ym) {
  const D = dim(ym), t = today(), tym = ymOf(t);
  const cats = S.categories.map(c => ({cat: c, budget: getBudget(ym, c), spent: 0, count: 0}));
  const cmap = Object.fromEntries(cats.map(x => [x.cat.id, x]));

  let other = 0, count = 0;
  for (const e of S.expenses) {

  const spent = daily.reduce((a, b) => a + b, 0);

  const todayAllowance = status === 'current' ? Math.max(0, (budget - spentBefore) / remainingDays) : allowance;

function computeGame() {

  const allow = {};

    const checked = n > 0 || !!S.checkins[d];

        if (!(ym in allow)) allow[ym] = totalBudget(ym) / dim(ym);

    if (S.habits.length >= 2 && c === S.habits.length) xp += 20; // journée parfaite
  }
  xp += 15 * nHabit;
  const trackIds = new Set(S.trackers.map(x => x.id));
  let nTrack = 0;
  for (const d in S.trackerLog) for (const id in S.trackerLog[d]) if (trackIds.has(id) && S.trackerLog[d][id] !== '' && S.trackerLog[d][id] != null) nTrack++;

  const heal = Math.min(30, habitsThisMonth);

  // Trésor = économies cumulées des mois terminés (avec activité)
  let treasure = 0, underMonths = 0, perfectMonths = 0;
  for (let ym = ymOf(start); ym < tym; ym = addMonths(ym, 1)) {

let CUR = MAPS.village, MW = CUR.mw, MH = CUR.mh, WW = MW * TS, WH = MH * TS, EDGE = [], SEA_BOTTOM = 120, PATHS = CUR.paths, HOUSE = CUR.house, SUN_X = CUR.sun, LIGHTHOUSE_X = CUR.lighthouse;
function useMap(id) {

function groundOK(tx, ty) {
  if (tx < 0 || ty < GRASS_ROW || tx >= MW || ty >= MH) return false;
  let e = -Infinity; for (let k = 0; k <= TS; k += 4) e = Math.max(e, coastY(tx * TS + k));

}
function toPath(x, y) {
  let best = Infinity;
  for (const line of PATHS) for (let i = 0; i < line.length - 1; i++) {
    const a = line[i], b = line[i + 1], dx = b.x - a.x, dy = b.y - a.y;

    best = Math.min(best, Math.hypot(a.x + dx * k - x, a.y + dy * k - y));
  }

}

function drawWorldMap() {
  const cv = $('#wmap'); if (!cv) return;
  const c = cv.getContext('2d'), tod = timeOfDay();
  if (!WORLD.ground[tod]) WORLD.ground[tod] = drawGroundLayer(tod, WORLD.objs);
  c.imageSmoothingEnabled = false; c.drawImage(WORLD.ground[tod], 0, 0, WW, WH, 0, 0, WW / 2, WH / 2);
  c.fillStyle = 'rgba(21,18,29,.82)';
  for (let y = GRASS_ROW; y < MH; y++) for (let x = 0; x < MW; x++) if (!WORLD.seen[y * MW + x] && WORLD.map[y * MW + x]) c.fillRect(x * 8, y * 8, 8, 8);
  for (const o of WORLD.objs) {
    if (o.type === 'tree' || !WORLD.seen[Math.min(MH - 1, Math.max(GRASS_ROW, o.y)) * MW + o.x]) continue;
    const mc = o.type === 'lair' ? '#e5484d' : o.type === 'chest' ? (S.world.chests[o.chestId] ? '#9aa3b5' : '#ffd166') : o.type === 'plot' ? '#8f6a44' : o.type === 'npc' ? '#ff8a3d' : o.type === 'sign' ? '#c08a57' : '#f4f4f4';
    c.fillStyle = '#15121d'; c.fillRect(o.x * 8 - 1, o.y * 8 - 1, o.w * 8 + 2, o.h * 8 + 2); c.fillStyle = mc; c.fillRect(o.x * 8, o.y * 8, o.w * 8, o.h * 8);
  }
  c.fillStyle = '#ff8a3d'; c.fillRect(HERO_S.x * 8 - 2, HERO_S.y * 8 - 2, 12, 12); c.fillStyle = '#f4f4f4'; c.fillRect(HERO_S.x * 8, HERO_S.y * 8, 8, 8);
}
function travel(o) {
  if (!o) return;
  const cands = [];
  for (let y = o.y - 1; y <= o.y + o.h; y++) for (let x = o.x - 1; x <= o.x + o.w; x++) if (adjacentTo(o, x, y) && walkable(x, y)) cands.push([x, y]);
  if (!cands.length) return;
  cands.sort((a, b) => b[1] - a[1]);
  const [x, y] = cands[0], h = HERO_S;
  h.x = x; h.y = y; h.fx = x * TS; h.fy = y * TS; h.path = []; h.tgt = null; h.pending = null; h.dir = 'up';
  S.world.x = x; S.world.y = y; UI.worldDirty = true;
  closeModal(); SFX.quest(); worldFx('heal');
  reveal(x, y); proximity();
}

function drawDailyChart() {
  const cv = $('#dchart'); if (!cv) return;
  const ms = monthStats(UI.viewYM), ctx = cv.getContext('2d'), H = cv.height;
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(0, 0, cv.width, H);
  const max = Math.max(ms.allowance * 1.6, ...ms.daily) || 1;
  for (let d = 1; d <= ms.D; d++) {
    const v = ms.daily[d], h = Math.round(v / max * (H - 4));
    const ds = `${ms.ym}-${pad(d)}`;
    ctx.fillStyle = ds > today() ? '#333c57' : '#22263a'; ctx.fillRect(1 + (d - 1) * 6, 2, 5, H - 4);
    if (h > 0) { ctx.fillStyle = v > ms.allowance ? '#b13e53' : '#38b764'; ctx.fillRect(1 + (d - 1) * 6, H - 2 - h, 5, h); ctx.fillStyle = v > ms.allowance ? '#ef7d57' : '#a7f070'; ctx.fillRect(1 + (d - 1) * 6, H - 2 - h, 5, 1); }
  }
  const y = H - 2 - Math.round(ms.allowance / max * (H - 4));
  ctx.fillStyle = '#ffcd75'; for (let x = 0; x < cv.width; x += 3) ctx.fillRect(x, y, 2, 1);
}

      <select name="dir"><option value="min">au moins</option><option value="max">au plus</option></select>
      <input name="goal" type="number" step="any" inputmode="decimal" placeholder="Objectif" style="width:110px"></div>
      <button class="btn green big" style="margin-top:10px">+ Créer le suivi</button>

function drawSparks() {
  document.querySelectorAll('canvas.spark').forEach(cv => {
    const tr = S.trackers.find(x => x.id === cv.dataset.id); if (!tr) return;
    const ctx = cv.getContext('2d'), H = cv.height, t = today();
    const vals = Array.from({length: 14}, (_, i) => { const x = S.trackerLog[addDays(t, i - 13)]; const v = x ? x[tr.id] : undefined; return v === undefined || v === '' ? null : +v; });
    const goal = tr.goal === '' || tr.goal == null ? null : +tr.goal;
    const max = Math.max(goal || 0, ...vals.filter(v => v != null), 1);
    ctx.fillStyle = '#1a1c2c'; ctx.fillRect(0, 0, cv.width, H);
    vals.forEach((v, i) => {
      ctx.fillStyle = '#22263a'; ctx.fillRect(1 + i * 5, 1, 4, H - 2);
      if (v == null) return;
      const h = Math.max(1, Math.round(v / max * (H - 2)));
      const good = goal == null ? true : tr.dir === 'max' ? v <= goal : v >= goal;
      ctx.fillStyle = good ? '#38b764' : '#ef7d57'; ctx.fillRect(1 + i * 5, H - 1 - h, 4, h);
    });
    if (goal != null) { const y = H - 1 - Math.round(goal / max * (H - 2)); ctx.fillStyle = '#ffcd75'; for (let x = 0; x < cv.width; x += 3) ctx.fillRect(x, y, 2, 1); }
  });
}

/* ---------------- PROGRESSION / FEEDBACK ---------------- */
function toast(title, msg) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<b>${esc(title)}</b>${esc(msg)}`;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200);
}
function floater(txt, color) {
  const el = document.createElement('div'); el.className = 'floater'; el.textContent = txt; if (color) el.style.color = color;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
}
function commit(fx) {
  const before = UI.game || computeGame();
  save();
  const g = render();
  const dxp = g.xp - before.xp;
  if (dxp > 0) floater(`+${dxp} XP`);
  if (fx) fx(g, before);
  progress(g);
}
function softCommit() {
  const before = UI.game || computeGame();
  save();
  const g = computeGame(); UI.game = g; renderHUD(g);
  const dxp = g.xp - before.xp;
  if (dxp > 0) floater(`+${dxp} XP`);
  progress(g);
}
function progress(g, quiet = false) {
  if (g.level > (S.lastLevel || 1) && !quiet) {
    S.lastLevel = g.level; save(); SFX.lvl();
    setTimeout(() => queueModal(`<div class="levelup"><h1>NIVEAU ${g.level} !</h1>${heroImg(96)}<p>${titleFor(g.level) !== titleFor(g.level - 1) ? `${esc(heroName())} devient <b class="gold">${titleFor(g.level)}</b> !` : `${esc(heroName())} gagne en puissance.`}</p><p class="muted">Prochain niveau dans ${g.xpNext - g.xpIn} XP.</p><button class="btn gold big" data-act="close">Continuer</button></div>`), 400);
  } else if (g.level !== S.lastLevel) { S.lastLevel = g.level; save(); }
  const fresh = g.unlocked.filter(id => !S.seenAch.includes(id));
  if (fresh.length) {
    S.seenAch.push(...fresh); save();
    fresh.forEach((id, i) => setTimeout(() => { const a = ACH.find(x => x.id === id); toast('🏆 Trophée débloqué', `${a.name} — ${a.desc}`); SFX.quest(); }, 600 + i * 700));
  }
  if (g.builtNow > (S.world.built || 0)) {
    const old = S.world.built || 0; S.world.built = g.builtNow; save();
    for (let i = old; i < g.builtNow; i++) setTimeout(() => toast('🏗 Nouveau bâtiment au village', `${VILLAGE[i].name} — construit grâce à ton trésor !`), 900 + (i - old) * 700);
    if (UI.tab === 'jeu') ensureWorld();
  }
}

    <label class="f">Montant (FCFA)</label><input name="amount" class="full" inputmode="numeric" value="${num(e.amount)}" required>

    <label class="f">Note</label><input name="note" class="full" value="${esc(e.note)}" maxlength="80">
    <label class="f">Date</label><input name="date" type="date" class="full" value="${e.date}" required>
    <div class="row" style="margin-top:14px"><button class="btn green">✓ Enregistrer</button><button type="button" class="btn red" data-act="delExp" data-id="${e.id}">✕ Supprimer</button><button type="button" class="btn grey" data-act="close">Annuler</button></div>
  </form>`);
}
function editTracker(id) {
  const tr = S.trackers.find(x => x.id === id); if (!tr) return;
  openModal(`<h2>✎ Modifier le suivi</h2><form data-form="trackerEdit" data-id="${tr.id}">
    <label class="f">Nom</label><input name="name" class="full" value="${esc(tr.name)}" maxlength="40" required>
    <label class="f">Unité</label><input name="unit" class="full" value="${esc(tr.unit || '')}" maxlength="15">
    <label class="f">Objectif</label><div class="row"><select name="dir"><option value="min" ${tr.dir !== 'max' ? 'selected' : ''}>au moins</option><option value="max" ${tr.dir === 'max' ? 'selected' : ''}>au plus</option></select><input name="goal" type="number" step="any" class="grow" value="${tr.goal ?? ''}"></div>
    <div class="row" style="margin-top:14px"><button class="btn green">✓ Enregistrer</button><button type="button" class="btn grey" data-act="close">Annuler</button></div>
  </form>`);
}

/* ---------------- ACTIONS ---------------- */
async function download(name, text, type) {
  // Dans claude.ai, le fichier passe par la capacité « downloads » ; ailleurs, par un lien classique.
  if (window.claude && typeof window.claude.use === 'function') {
    let d = null;
    try { d = await window.claude.use('downloads'); } catch (e) {}
    if (d) {
      try { await d.save({filename: name, data: text}); toast('⬇ Export', name); }
      catch (e) { if (!e || e.code !== 'declined') toast('Export impossible', (e && e.message) || ''); }
      return;
    }
  }
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function addExpense(amount, catId, note, date) {
  const before = monthStats(ymOf(date)).cats.find(c => c.cat.id === catId);
  S.expenses.push({id: uid(), date, amount, catId, note: note.trim(), ts: Date.now()});
  delete S.checkins[date];
  S.lastCat = catId;
  const after = monthStats(ymOf(date)).cats.find(c => c.cat.id === catId);
  const broke = before && after && before.spent <= before.budget && after.spent > after.budget;
  return {broke, after};
}

const ACT = {
  tab: a => { UI.tab = a.dataset.id; try { localStorage.setItem(STORE_KEY + '.tab', UI.tab); } catch (e) {} SFX.click(); render(); window.scrollTo(0, 0); },
  month: a => { UI.viewYM = addMonths(UI.viewYM, +a.dataset.d); UI.selDay = null; render(); },
  chip: a => {
    const inp = a.closest('form').querySelector('[name=amount]');
    const v = +a.dataset.v; const n = v === 0 ? 0 : parseAmt(inp.value) + v;
    inp.value = n ? num(n) : ''; UI.draft.amount = inp.value; SFX.click();
  },
  pickcat: a => { UI.pickCat = a.dataset.id; a.closest('form').querySelectorAll('.catbtn').forEach(b => b.classList.toggle('sel', b.dataset.id === UI.pickCat)); SFX.click(); },
  zero: () => {
    const t = today();
    if (S.checkins[t]) delete S.checkins[t]; else S.checkins[t] = true;
    commit(g => { if (S.checkins[t]) { worldFx('heal'); SFX.quest(); toast('✦ Journée sans dépense', 'Les monstres dorment. +35 XP'); } });
    if (UI.dlg && UI.dlg.obj && UI.dlg.obj.type === 'fire') interact(UI.dlg.obj);
  },
  habit: a => {
    const {id, date} = a.dataset;
    S.habitLog[date] = S.habitLog[date] || {};
    if (S.habitLog[date][id]) { delete S.habitLog[date][id]; if (!Object.keys(S.habitLog[date]).length) delete S.habitLog[date]; }
    else S.habitLog[date][id] = true;
    const on = habitDone(date, id);
    commit(() => { if (on) { worldFx('heal'); SFX.quest(); } });
  },
  day: a => { UI.selDay = a.dataset.d || null; render(); },
  addOn: a => { UI.draft.date = a.dataset.d; openPanel('add'); setTimeout(() => { const i = $('#modal [name=amount]'); if (i) i.focus(); }, 50); },
  A: () => { if (UI.near && adjacentTo(UI.near, HERO_S.x, HERO_S.y)) interact(UI.near); else interactNear(); },
  worldmap: () => { SFX.click(); openPanel('map'); },
  travel: a => travel(WORLD.objs.find(o => o.id === a.dataset.id)),
  panel: a => openPanel(a.dataset.p),
  look: a => { const k = a.dataset.k; S.world.look = {...heroLook(), [k]: a.dataset.v}; SFX.click(); commit(); },
  skin: a => { if (!S.world.skins.includes(a.dataset.id)) return; S.world.skin = a.dataset.id; SFX.quest(); commit(); toast('♞ Nouvelle tenue', SKINS[S.world.skin].name); },
  addCat: a => { UI.pickCat = a.dataset.id; openPanel('add'); setTimeout(() => { const i = $('#modal [name=amount]'); if (i) i.focus(); }, 50); },
  edit: a => editExpense(a.dataset.id),
  delExp: a => { if (!confirm('Supprimer cette dépense ?')) return; S.expenses = S.expenses.filter(e => e.id !== a.dataset.id); closeModal(); commit(); },
  close: () => closeModal(),
  renHabit: a => { const h = S.habits.find(x => x.id === a.dataset.id); const n = prompt('Nouveau nom de la quête :', h.name); if (n && n.trim()) { h.name = n.trim().slice(0, 50); commit(); } },
  delHabit: a => { const h = S.habits.find(x => x.id === a.dataset.id); if (!confirm(`Supprimer la quête « ${h.name} » ? Son historique ne comptera plus.`)) return; S.habits = S.habits.filter(x => x.id !== h.id); commit(); },
  editTracker: a => editTracker(a.dataset.id),
  delTracker: a => { const tr = S.trackers.find(x => x.id === a.dataset.id); if (!confirm(`Supprimer le suivi « ${tr.name} » ?`)) return; S.trackers = S.trackers.filter(x => x.id !== tr.id); commit(); },
  clearTrack: a => { const d = UI.trackerDate; if (S.trackerLog[d]) { delete S.trackerLog[d][a.dataset.id]; if (!Object.keys(S.trackerLog[d]).length) delete S.trackerLog[d]; } commit(); },
  delCat: a => {
    const c = S.categories.find(x => x.id === a.dataset.id);
    const n = S.expenses.filter(e => e.catId === c.id).length;
    if (S.categories.length <= 1) return alert('Il faut garder au moins une catégorie.');
    if (n) return alert(`Impossible : ${n} dépense(s) utilisent « ${c.name} ». Renomme-la plutôt, ou modifie ces dépenses depuis le Journal.`);
    if (!confirm(`Supprimer la catégorie « ${c.name} » ?`)) return;
    S.categories = S.categories.filter(x => x.id !== c.id);
    for (const k in S.budgets) delete S.budgets[k][c.id];
    commit();
  },
  sound: () => { S.sound = !S.sound; save(); render(); SFX.click(); },
  rules: () => openModal(rulesHTML()),
  export: () => download(`budget-quest-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'),
  csv: () => {
    const catOf = id => (S.categories.find(c => c.id === id) || {}).name || '';
    const q = s => `"${String(s).replace(/"/g, '""')}"`;
    const rows = [['date', 'montant_fcfa', 'categorie', 'note'].join(';'), ...[...S.expenses].sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, e.amount, q(catOf(e.catId)), q(e.note || '')].join(';'))];
    download(`depenses-${today()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  },
  import: () => $('#importFile').click(),
  reset: () => {
    if (!confirm('Effacer TOUTES les données (dépenses, quêtes, suivis, progression) ?')) return;
    if (!confirm('Vraiment ? Pense à exporter avant. Cette action est définitive.')) return;
    S = defaultState(); UI.game = null; save(); render(); welcome();
  },
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('form[data-form=add]')) {
    if (t.name === 'amount') { const n = parseAmt(t.value); t.value = n ? num(n) : ''; }
    UI.draft[t.name] = t.value;
  }
  if (t.name === 'amount' && t.closest('form[data-form=edit]')) { const n = parseAmt(t.value); t.value = n ? num(n) : ''; }
  if (t.dataset.chg === 'catBud') { const n = parseAmt(t.value); t.value = n || t.value === '' ? num(n) : ''; }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.chg; if (!k) return;
  const c = t.dataset.id ? S.categories.find(x => x.id === t.dataset.id) : null;
  if (k === 'heroName') { S.heroName = t.value.trim().slice(0, 20); commit(); }
  else if (k === 'catName' && c) { if (t.value.trim()) c.name = t.value.trim().slice(0, 24); commit(); }
  else if (k === 'catMon' && c) { c.monster = t.value; commit(); }
  else if (k === 'catCol' && c) { c.color = t.value; commit(); }
  else if (k === 'catBud' && c) { S.budgets[UI.viewYM] = S.budgets[UI.viewYM] || {}; S.budgets[UI.viewYM][c.id] = parseAmt(t.value); commit(); }
  else if (k === 'trackerDate') { UI.trackerDate = t.value && t.value <= today() ? t.value : today(); render(); }
});
document.addEventListener('submit', e => {
  const f = e.target, k = f.dataset.form; if (!k) return;
  e.preventDefault();
  const fd = new FormData(f), v = n => (fd.get(n) || '').toString();
  if (k === 'add') {
    const amount = parseAmt(v('amount')), date = v('date') || today();
    if (!amount) { floater('Montant ?', '#ef7d57'); f.amount.focus(); return; }
    if (!UI.pickCat) return;
    const {broke, after} = addExpense(amount, UI.pickCat, v('note'), date);
    UI.draft = {amount: '', note: '', date: ''};
    if (f.closest('dialog')) closeModal();
    commit(() => {
      if (broke) { worldFx('hurt', UI.pickCat); SFX.hit(); toast('☠ Monstre déchaîné !', `${monName(after)} a dépassé son budget.`); }
      else { worldFx('spend', UI.pickCat); SFX.spend(); }
      if (date !== today()) toast('✎ Dépense ajoutée', `${fmt(amount)} le ${dayLabel(date)}`);
    });
  } else if (k === 'edit') {
    const e2 = S.expenses.find(x => x.id === f.dataset.id); if (!e2) return;
    const amount = parseAmt(v('amount')); if (!amount) return;
    e2.amount = amount; if (v('catId')) e2.catId = v('catId'); e2.note = v('note').trim(); e2.date = v('date') || e2.date;
    delete S.checkins[e2.date];
    closeModal(); commit();
  } else if (k === 'habit') {
    S.habits.push({id: uid(), name: v('name').trim().slice(0, 50)}); commit(); SFX.coin();
  } else if (k === 'tracker') {
    S.trackers.push({id: uid(), name: v('name').trim(), unit: v('unit').trim(), goal: v('goal') === '' ? '' : +v('goal'), dir: v('dir') || 'min'}); commit(); SFX.coin();
  } else if (k === 'trackerEdit') {
    const tr = S.trackers.find(x => x.id === f.dataset.id); if (!tr) return;
    tr.name = v('name').trim() || tr.name; tr.unit = v('unit').trim(); tr.goal = v('goal') === '' ? '' : +v('goal'); tr.dir = v('dir') || 'min';
    closeModal(); commit();
  } else if (k === 'track') {
    const val = v('v'); if (val === '' || isNaN(+val)) return;
    const d = UI.trackerDate || today();
    S.trackerLog[d] = S.trackerLog[d] || {}; S.trackerLog[d][f.dataset.id] = +val;
    commit(() => SFX.coin());
  } else if (k === 'cat') {
    const id = uid();
    S.categories.push({id, name: v('name').trim().slice(0, 24), monster: v('monster') || 'slime', color: v('color') || 'vert', budget: 0});
    S.budgets[UI.viewYM] = S.budgets[UI.viewYM] || {}; S.budgets[UI.viewYM][id] = parseAmt(v('budget'));
    commit(); SFX.coin();
  } else if (k === 'welcome') {
    S.heroName = v('name').trim().slice(0, 20) || 'Roré'; closeModal(); commit(); SFX.lvl(); setTimeout(() => openPanel('look'), 200);
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.expenses) || !Array.isArray(data.categories)) throw new Error('format');
      if (!confirm(`Importer ${data.expenses.length} dépenses ? Les données actuelles seront remplacées.`)) return;
      S = migrate(data); UI.game = null; save(); render(); toast('⬆ Import réussi', `${S.expenses.length} dépenses chargées.`);
    } catch (err) { alert('Fichier invalide : ce n\'est pas une sauvegarde Budget Quest.'); }
  };
  r.readAsText(file); e.target.value = '';
});
$('#modal').addEventListener('cancel', e => { if (!S.heroName) e.preventDefault(); });
$('#modal').addEventListener('close', () => { UI.panel = null; if (UI.queued) { const q = UI.queued; UI.queued = null; setTimeout(() => openModal(q), 150); } });
function queueModal(html) { if ($('#modal').open) UI.queued = html; else openModal(html); }

/* ---- Contrôles du monde : toucher, croix directionnelle, clavier ---- */
document.addEventListener('pointerdown', e => {
  const d = e.target.closest('[data-dir]');
  if (d) { e.preventDefault(); UI.hold = d.dataset.dir; if (!HERO_S.tgt && !HERO_S.path.length) stepDir(UI.hold); return; }
  if (e.target.id === 'world' && WORLD.layer) {
    const cv = e.target, r = cv.getBoundingClientRect(), z = viewZ;
    const bx = (e.clientX - r.left) * cv.width / r.width, by = (e.clientY - r.top) * cv.height / r.height;
    const wx = bx / z + (UI.camX ?? camX()), wy = by / z + (UI.camY ?? camY());
    // un clic sur un grand décor (pavillon, échoppe, arbre) vise l'objet dont le dessin est touché
    let tx = Math.floor(wx / TS), ty = Math.floor(wy / TS);
    const hit = WORLD.objs.find(o => (o.type === 'building' || o.type === 'village' || (o.type === 'tree' && o.solid)) && wx >= o.x * TS - 2 && wx < (o.x + o.w) * TS + 2 && wy >= (o.y + o.h) * TS - (o.type === 'building' ? (o.kind === 'board' ? 26 : 46) : o.type === 'village' ? 44 : o.type === 'tree' ? 38 : o.h * TS) && wy < (o.y + o.h) * TS);
    if (hit) { tx = hit.x; ty = hit.y + hit.h - 1; }
    goTo(tx, ty);
  }
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { UI.hold = null; }));
const KEYS = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', z:'up', w:'up', s:'down', q:'left', a:'left', d:'right'};
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (UI.tab !== 'jeu' || $('#modal').open || /INPUT|SELECT|TEXTAREA/.test(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (k) { e.preventDefault(); UI.hold = k; if (!HERO_S.tgt && !HERO_S.path.length) stepDir(k); }
  else if ((e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'e') && tag !== 'BUTTON') { e.preventDefault(); ACT.A(); }
});
document.addEventListener('keyup', e => { const k = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (k && UI.hold === k) UI.hold = null; });

// Rafraîchit au changement de jour (app laissée ouverte)
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); UI.game = null; render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

S = load() || defaultState();
save();
render();
progress(UI.game, true);
if (!S.heroName) welcome();
</script>
